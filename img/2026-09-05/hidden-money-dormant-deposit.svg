<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<rect width="900" height="330" fill="#ffffff"/>
<text x="30" y="42" font-size="22" font-weight="700" fill="#202124">계좌 조회에서 안 보이는 돈이 있다</text>
<text x="30" y="68" font-size="14" fill="#80868b">거래가 오래 없으면 그 돈은 다른 곳으로 넘어간다</text>
<rect x="50" y="102" width="330" height="140" rx="14" fill="#f7f9fc" stroke="#e1e6ee" stroke-width="2"/>
<text x="215" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#5f6368">은행 앱 · 어카운트인포</text>
<text x="215" y="184" text-anchor="middle" font-size="16" fill="#3c4043">살아 있는 계좌는 보인다</text>
<text x="215" y="214" text-anchor="middle" font-size="16" font-weight="700" fill="#d93025">넘어간 돈은 안 보인다</text>
<text x="450" y="180" text-anchor="middle" font-size="30" fill="#bdc1c6">→</text>
<rect x="520" y="102" width="330" height="140" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/>
<text x="685" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#1a73e8">휴면예금 찾아줌</text>
<text x="685" y="184" text-anchor="middle" font-size="16" fill="#3c4043">서민금융진흥원이 운영</text>
<text x="685" y="214" text-anchor="middle" font-size="16" font-weight="700" fill="#1a73e8">은행 · 우체국 · 저축은행</text>
<text x="450" y="286" text-anchor="middle" font-size="17" font-weight="700" fill="#202124">1단계에서 아무것도 안 나와도 2단계를 건너뛰면 안 된다</text>
<text x="450" y="312" text-anchor="middle" font-size="14" fill="#80868b">서로 다른 것을 보는 창구다 — 휴면보험금도 여기서 같이 나온다</text>
</svg>
