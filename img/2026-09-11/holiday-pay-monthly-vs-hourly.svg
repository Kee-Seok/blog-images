<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<rect width="900" height="470" fill="#ffffff"/>
<text x="40" y="48" font-size="26" font-weight="700" fill="#202124">월급제와 시급제는 셈법이 다릅니다</text>
<text x="40" y="78" font-size="15" fill="#5f6368">유급휴일수당이 이미 월급에 들어 있느냐가 갈림길입니다</text>

<rect x="40" y="106" width="820" height="150" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2.5"/>
<text x="66" y="140" font-size="19" font-weight="700" fill="#1a73e8">월급제 · 추가 150%</text>
<text x="66" y="172" font-size="15" fill="#3c4043">유급휴일수당은 이미 월급에 포함 &#8594; 근로 100% + 가산 50%만 추가</text>
<text x="66" y="208" font-size="16" fill="#5f6368">월급 300만원 &#183; 통상시급 14,354원 (3,000,000 &#247; 209)</text>
<text x="66" y="238" font-size="20" font-weight="700" fill="#1a73e8">8시간 근무 &#8594; 172,248원 추가</text>

<rect x="40" y="276" width="820" height="178" rx="14" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2.5"/>
<text x="66" y="310" font-size="19" font-weight="700" fill="#137333">시급제 &#183; 250%</text>
<text x="66" y="344" font-size="15" fill="#3c4043">유급휴일수당 100%</text>
<text x="700" y="344" font-size="16" font-weight="700" fill="#3c4043" text-anchor="end">96,000원</text>
<text x="66" y="374" font-size="15" fill="#3c4043">휴일근로 임금 100%</text>
<text x="700" y="374" font-size="16" font-weight="700" fill="#3c4043" text-anchor="end">96,000원</text>
<text x="66" y="404" font-size="15" fill="#3c4043">휴일근로 가산 50%</text>
<text x="700" y="404" font-size="16" font-weight="700" fill="#3c4043" text-anchor="end">48,000원</text>
<line x1="66" y1="418" x2="834" y2="418" stroke="#a8d3b8" stroke-width="2"/>
<text x="66" y="442" font-size="17" font-weight="700" fill="#137333">시급 12,000원 &#183; 8시간 합계</text>
<text x="834" y="442" font-size="22" font-weight="700" fill="#137333" text-anchor="end">240,000원</text>
</svg>
