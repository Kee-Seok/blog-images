<svg viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
<rect width="1200" height="460" fill="#ffffff"/>
<text x="600" y="55" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">기타소득이 사업소득보다 나은 점</text>

<rect x="90" y="110" width="500" height="290" rx="16" fill="#eaf2ff" stroke="#1a73e8" stroke-width="2.5"/>
<text x="340" y="155" text-anchor="middle" font-size="22" font-weight="700" fill="#1a73e8">기타소득 (강연료·원고료)</text>
<text x="340" y="200" text-anchor="middle" font-size="19" fill="#202124">필요경비 60% 자동 인정</text>
<text x="340" y="235" text-anchor="middle" font-size="19" fill="#202124">기타소득금액 300만원 이하면</text>
<text x="340" y="265" text-anchor="middle" font-size="20" font-weight="700" fill="#1a73e8">분리과세 선택 가능</text>
<text x="340" y="305" text-anchor="middle" font-size="16" fill="#5f6368">원천징수만으로 끝낼 수 있음</text>
<text x="340" y="345" text-anchor="middle" font-size="16" fill="#5f6368">(총수입금액 기준 750만원까지)</text>

<rect x="610" y="110" width="500" height="290" rx="16" fill="#fff7f0" stroke="#e8710a" stroke-width="2"/>
<text x="860" y="155" text-anchor="middle" font-size="22" font-weight="700" fill="#e8710a">사업소득 (프리랜서 외주)</text>
<text x="860" y="200" text-anchor="middle" font-size="19" fill="#202124">필요경비 의제 없음</text>
<text x="860" y="235" text-anchor="middle" font-size="19" fill="#202124">금액과 무관하게</text>
<text x="860" y="265" text-anchor="middle" font-size="20" font-weight="700" fill="#e8710a">매년 종합소득세 신고 대상</text>
<text x="860" y="305" text-anchor="middle" font-size="16" fill="#9a7b3f">분리과세 선택권 자체가 없음</text>

<text x="600" y="435" text-anchor="middle" font-size="15" fill="#80868b">둘 다 원천징수는 예납일 뿐, 확정 세액이 아닙니다</text>
</svg>
