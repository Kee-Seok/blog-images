<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<rect width="900" height="400" fill="#ffffff"/>
<text x="40" y="48" font-size="26" font-weight="700" fill="#202124">8시간을 넘기면 배율이 한 번 더 올라갑니다</text>
<text x="40" y="78" font-size="15" fill="#5f6368">월급 300만원 · 통상시급 14,354원 기준</text>

<rect x="40" y="106" width="820" height="60" rx="10" fill="#f8f9fa" stroke="#dadce0"/>
<text x="66" y="143" font-size="17" fill="#3c4043">4시간 근무 &#183; 1.5배</text>
<text x="834" y="143" font-size="21" font-weight="700" fill="#3c4043" text-anchor="end">86,124원</text>

<rect x="40" y="178" width="820" height="60" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="66" y="215" font-size="17" font-weight="700" fill="#1a73e8">8시간 근무 &#183; 1.5배</text>
<text x="834" y="215" font-size="21" font-weight="700" fill="#1a73e8" text-anchor="end">172,248원</text>

<rect x="40" y="250" width="820" height="60" rx="10" fill="#fef3e6" stroke="#e8710a" stroke-width="2.5"/>
<text x="66" y="287" font-size="17" font-weight="700" fill="#b06000">10시간 근무 &#183; 8시간까지 1.5배 + 넘는 2시간은 2배</text>
<text x="834" y="287" font-size="21" font-weight="700" fill="#b06000" text-anchor="end">229,664원</text>

<rect x="40" y="324" width="820" height="60" rx="10" fill="#f8f9fa" stroke="#dadce0"/>
<text x="66" y="352" font-size="16" font-weight="700" fill="#202124">2시간 더 일했는데 57,416원이 붙습니다</text>
<text x="66" y="375" font-size="15" fill="#3c4043">8시간 초과분은 휴일근로 가산 50%에 연장근로 가산 50%가 더해져 100%가 됩니다.</text>
</svg>
