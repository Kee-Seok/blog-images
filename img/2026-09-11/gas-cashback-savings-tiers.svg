<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="600" y="55" text-anchor="middle" font-size="30" font-weight="700" fill="#202124">도시가스 절약캐시백 절감률 구간별 단가</text>
  <text x="600" y="88" text-anchor="middle" font-size="16" fill="#5f6368">전년 동기간(12~3월) 대비 절감률 기준 · 25년 동절기 지급 기준</text>

  <line x1="140" y1="520" x2="1080" y2="520" stroke="#dadce0" stroke-width="2"/>

  <!-- step 1: 3~10% -> 50원 -->
  <rect x="200" y="450" width="220" height="70" fill="#fce8b2" rx="6"/>
  <text x="310" y="433" text-anchor="middle" font-size="20" font-weight="700" fill="#b06000">50원/㎥</text>
  <text x="310" y="555" text-anchor="middle" font-size="16" fill="#202124">절감 3~10%</text>

  <!-- step 2: 10~15% -> 100원 -->
  <rect x="470" y="380" width="220" height="140" fill="#fad8a0" rx="6"/>
  <text x="580" y="363" text-anchor="middle" font-size="20" font-weight="700" fill="#b06000">100원/㎥</text>
  <text x="580" y="555" text-anchor="middle" font-size="16" fill="#202124">절감 10~15%</text>

  <!-- step 3: 15~30% -> 200원 -->
  <rect x="740" y="240" width="220" height="280" fill="#e8710a" rx="6"/>
  <text x="850" y="223" text-anchor="middle" font-size="20" font-weight="700" fill="#e8710a">200원/㎥</text>
  <text x="850" y="555" text-anchor="middle" font-size="16" fill="#202124">절감 15~30%</text>

  <text x="600" y="600" text-anchor="middle" font-size="14" fill="#80868b">자료: 한국에너지공단, K-GAS 캐시백(k-gascashback.or.kr) 지급기준 정리 · 다음 시즌 단가는 별도 공지 확인 필요</text>
</svg>
