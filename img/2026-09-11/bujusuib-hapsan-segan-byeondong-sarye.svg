<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
<rect width="1200" height="560" fill="#ffffff"/>
<text x="600" y="55" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">부수입을 합치자 세율 구간이 바뀐 경우</text>
<text x="600" y="88" text-anchor="middle" font-size="17" fill="#5f6368">본업 소득만으로 이미 24% 구간에 있던 경우 예시</text>

<rect x="100" y="140" width="440" height="150" rx="16" fill="#f7f9fc" stroke="#e1e6ee" stroke-width="2"/>
<text x="320" y="185" text-anchor="middle" font-size="20" font-weight="700" fill="#202124">본업 소득만 있을 때</text>
<text x="320" y="225" text-anchor="middle" font-size="19" fill="#5f6368">과세표준 5,000만~8,800만원 구간</text>
<text x="320" y="260" text-anchor="middle" font-size="22" font-weight="700" fill="#1a73e8">적용세율 24%</text>

<text x="600" y="220" text-anchor="middle" font-size="26" fill="#80868b">＋</text>
<text x="600" y="250" text-anchor="middle" font-size="16" fill="#80868b">기타소득</text>
<text x="600" y="272" text-anchor="middle" font-size="16" fill="#80868b">합산 신고</text>

<rect x="660" y="140" width="440" height="150" rx="16" fill="#fdf0f0" stroke="#c5221f" stroke-width="2.5"/>
<text x="880" y="185" text-anchor="middle" font-size="20" font-weight="700" fill="#202124">부수입을 합쳤을 때</text>
<text x="880" y="225" text-anchor="middle" font-size="19" fill="#5f6368">이미 낸 원천징수보다 세율이 높음</text>
<text x="880" y="260" text-anchor="middle" font-size="22" font-weight="700" fill="#c5221f">차액만큼 추가 납부</text>

<line x1="100" y1="340" x2="1100" y2="340" stroke="#e1e6ee" stroke-width="2"/>

<text x="600" y="390" text-anchor="middle" font-size="19" fill="#202124">기타소득금액에 적용된 원천징수 실효세율은 8.8%</text>
<text x="600" y="425" text-anchor="middle" font-size="19" fill="#202124">본업 과세표준 구간의 세율이 이보다 높으면 합산 시 그 차액을 더 냅니다</text>

<rect x="260" y="460" width="680" height="70" rx="12" fill="#fffaf0" stroke="#f5dfae" stroke-width="2"/>
<text x="600" y="503" text-anchor="middle" font-size="18" fill="#9a7b3f">원천징수 세율보다 낮은 구간이면 반대로 환급됩니다</text>
</svg>
