<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
<rect width="1200" height="500" fill="#ffffff"/>
<text x="600" y="55" text-anchor="middle" font-size="30" font-weight="700" fill="#202124">원천징수는 예납, 5월 신고가 확정</text>

<rect x="80" y="120" width="480" height="130" rx="16" fill="#f7f9fc" stroke="#e1e6ee" stroke-width="2"/>
<text x="320" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#5f6368">부수입 입금 시점</text>
<text x="320" y="205" text-anchor="middle" font-size="20" fill="#202124">3.3% 또는 8.8% 미리 징수</text>
<text x="320" y="232" text-anchor="middle" font-size="15" fill="#80868b">이게 최종 세액이 아닙니다</text>

<text x="620" y="195" text-anchor="middle" font-size="30" fill="#80868b">→</text>

<rect x="660" y="120" width="480" height="130" rx="16" fill="#eaf2ff" stroke="#1a73e8" stroke-width="2.5"/>
<text x="900" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#1a73e8">5월 종합소득세 신고</text>
<text x="900" y="205" text-anchor="middle" font-size="20" fill="#202124">다른 소득과 합산 재계산</text>
<text x="900" y="232" text-anchor="middle" font-size="15" fill="#5f6368">여기서 환급 또는 추가납부 확정</text>

<line x1="80" y1="300" x2="1140" y2="300" stroke="#e1e6ee" stroke-width="2"/>

<rect x="150" y="330" width="420" height="100" rx="14" fill="#f0f9f0" stroke="#1e8e3e" stroke-width="2"/>
<text x="360" y="370" text-anchor="middle" font-size="20" font-weight="700" fill="#1e8e3e">본업 과세표준이 낮은 구간</text>
<text x="360" y="400" text-anchor="middle" font-size="18" fill="#202124">→ 대체로 환급</text>

<rect x="630" y="330" width="420" height="100" rx="14" fill="#fdf0f0" stroke="#c5221f" stroke-width="2"/>
<text x="840" y="370" text-anchor="middle" font-size="20" font-weight="700" fill="#c5221f">본업 과세표준이 높은 구간</text>
<text x="840" y="400" text-anchor="middle" font-size="18" fill="#202124">→ 대체로 추가 납부</text>

<text x="600" y="475" text-anchor="middle" font-size="15" fill="#80868b">부수입을 합산했을 때 적용 세율이 원천징수 세율보다 높은지가 관건입니다</text>
</svg>
