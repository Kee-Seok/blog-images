<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="sans-serif">
<rect width="1200" height="700" fill="#ffffff"/>
<text x="600" y="70" text-anchor="middle" font-size="38" font-weight="700" fill="#202124">추계신고 할 수 있나? 30% 기준선 비교</text>
<text x="600" y="115" text-anchor="middle" font-size="24" fill="#5f6368">작년 낸 세금 300만원 · 상반기 소득금액 1,000만원 · 기본공제 150만원만 가정</text>
<g font-size="26" fill="#202124">
<rect x="100" y="160" width="1000" height="70" rx="12" fill="#f1f3f4"/>
<text x="130" y="205">① 과세표준  1,000만원 × 2 − 150만원 = 1,850만원</text>
<rect x="100" y="250" width="1000" height="70" rx="12" fill="#f1f3f4"/>
<text x="130" y="295">② 산출세액  1,850만원 × 15% − 126만원 = 151만5,000원</text>
<rect x="100" y="340" width="1000" height="70" rx="12" fill="#e8f0fe"/>
<text x="130" y="385" font-weight="700" fill="#1a73e8">③ 추계액  151만5,000원 ÷ 2 = 75만7,500원</text>
</g>
<text x="100" y="480" font-size="26" fill="#202124">기준선: 300만원 × 30% = 90만원</text>
<rect x="100" y="500" width="1000" height="44" fill="#f1f3f4" rx="8"/>
<rect x="100" y="500" width="841" height="44" fill="#1a73e8" rx="8"/>
<line x1="1100" y1="490" x2="1100" y2="555" stroke="#b06000" stroke-width="4" stroke-dasharray="8 6"/>
<text x="520" y="530" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">추계액 75만7,500원</text>
<text x="1100" y="580" text-anchor="end" font-size="22" fill="#b06000">기준선 90만원</text>
<text x="600" y="635" text-anchor="middle" font-size="30" font-weight="700" fill="#202124">기준선 미달 → 고지액 150만원 대신 75만7,500원 납부 가능</text>
<text x="600" y="680" text-anchor="middle" font-size="20" fill="#80868b">계산식: 국세청 중간예납추계액 신고 안내(2026년) · 실제 공제·원천징수세액에 따라 달라짐</text>
</svg>
