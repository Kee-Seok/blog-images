<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
<rect width="800" height="470" fill="#ffffff"/>
<text x="400" y="40" text-anchor="middle" font-size="23" font-weight="700" fill="#202124">CLAUDE.md 와 스킬 파일, 언제 읽히나</text>
<rect x="40" y="70" width="340" height="300" rx="14" fill="#f1f3f4" stroke="#dadce0"/>
<rect x="420" y="70" width="340" height="300" rx="14" fill="#e8f0fe" stroke="#8ab4f8"/>
<g font-size="17" fill="#202124">
<text x="210" y="108" text-anchor="middle" font-weight="700">CLAUDE.md</text>
<text x="64" y="150">· 새 창을 열 때마다 통째로 읽힘</text>
<text x="64" y="186">· 그래서 짧게: 이 계정은 782바이트</text>
<text x="64" y="222">· 모든 일에 공통인 말만</text>
