<text x="400" y="410" text-anchor="middle" font-size="16" fill="#202124">고친 내용이 '모든 일'에 해당하면 CLAUDE.md, '그 일 하나'면 스킬 파일</text>
<text x="400" y="448" text-anchor="middle" font-size="14" fill="#5f6368">크라우드의 코드리뷰 · 이 계정 파일 크기 2026-11-03 확인 (Claude Code 2.1.201)</text>
