<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="sans-serif"><rect width="800" height="460" fill="#fff"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">제왕절개 실비, 내 실손은 어디에?</text>
<text x="400" y="74" text-anchor="middle" font-size="16" fill="#5f6368">금융위원회 5세대 실손 보도자료 (2026년 5월 6일)</text>
<rect x="50" y="105" width="330" height="190" rx="14" fill="#f1f3f4"/>
<text x="215" y="150" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">1~4세대 실손</text>
<text x="215" y="200" text-anchor="middle" font-size="20" fill="#c5221f" font-weight="700">임신·출산 보장대상 아님</text>
<text x="215" y="240" text-anchor="middle" font-size="17" fill="#5f6368">분만 입원비 청구해도</text><text x="215" y="266" text-anchor="middle" font-size="17" fill="#5f6368">지급 안 됨</text>
<rect x="420" y="105" width="330" height="190" rx="14" fill="#e8f0fe"/>
<text x="585" y="150" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">5세대 실손 (2026.5.6~)</text>
<text x="585" y="200" text-anchor="middle" font-size="20" fill="#1a73e8" font-weight="700">임신·출산 급여 의료비 보장</text>
<text x="585" y="240" text-anchor="middle" font-size="17" fill="#5f6368">분만예정일 280일 전에</text><text x="585" y="266" text-anchor="middle" font-size="17" fill="#5f6368">가입했을 때만 · 입원 자기부담 20%</text>
<rect x="50" y="320" width="700" height="110" rx="14" fill="#fef7e0"/>
<text x="400" y="362" text-anchor="middle" font-size="19" fill="#202124" font-weight="700">예) 분만예정일 2027년 8월 1일</text>
<text x="400" y="400" text-anchor="middle" font-size="19" fill="#202124">→ 2026년 10월 25일 전에 가입했어야 보장</text></svg>
