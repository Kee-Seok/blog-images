<g stroke="#5f6368" stroke-width="2"><line x1="200" y1="155" x2="218" y2="155"/><line x1="390" y1="155" x2="408" y2="155"/><line x1="580" y1="155" x2="598" y2="155"/></g>
<text x="400" y="290" text-anchor="middle" font-size="17" fill="#202124">대화창에 "다음엔 이렇게 해"라고만 쓰면 그 창이 닫힐 때 같이 사라져요</text>
<text x="400" y="322" text-anchor="middle" font-size="17" fill="#202124">예약 작업은 매번 새 창으로 켜지니, 고친 말은 파일에 있어야 남습니다</text>
<text x="400" y="400" text-anchor="middle" font-size="14" fill="#5f6368">크라우드의 코드리뷰 · ~/.claude/scheduled-tasks 실제 파일 기준, 2026-11-03</text>
