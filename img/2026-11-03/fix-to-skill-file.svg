<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
<rect width="800" height="430" fill="#ffffff"/>
<text x="400" y="40" text-anchor="middle" font-size="23" font-weight="700" fill="#202124">고친 내용을 스킬 파일로 옮기는 순서</text>
<g font-size="16" fill="#202124">
<rect x="30" y="80" width="170" height="150" rx="12" fill="#fdecea"/>
<text x="115" y="115" text-anchor="middle" font-weight="700">1. 막힌 일</text>
