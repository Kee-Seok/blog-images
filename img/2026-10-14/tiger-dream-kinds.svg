<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="sans-serif">
<rect width="800" height="360" fill="#ffffff"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">호랑이 모습별 전통 해몽 풀이</text>
<g>
<rect x="30" y="80" width="235" height="250" rx="14" fill="#FFF3E6" stroke="#E8551F" stroke-width="2"/>
<text x="147" y="122" text-anchor="middle" font-size="23" font-weight="700" fill="#E8551F">새끼 호랑이</text>
<text x="147" y="170" text-anchor="middle" font-size="18" fill="#202124">귀엽고 순한 아이</text>
<text x="147" y="202" text-anchor="middle" font-size="18" fill="#202124">태몽 풀이가 흔함</text>
<text x="147" y="252" text-anchor="middle" font-size="16" fill="#5f6368">여러 마리면</text>
<text x="147" y="278" text-anchor="middle" font-size="16" fill="#5f6368">들어올 복이 여럿</text>
</g>
<g>
<rect x="282" y="80" width="235" height="250" rx="14" fill="#FFF7E0" stroke="#E0A800" stroke-width="2"/>
<text x="400" y="122" text-anchor="middle" font-size="23" font-weight="700" fill="#8a6100">큰 호랑이</text>
<text x="400" y="170" text-anchor="middle" font-size="18" fill="#202124">이름을 떨칠 인물</text>
<text x="400" y="202" text-anchor="middle" font-size="18" fill="#202124">권세·큰 자리</text>
<text x="400" y="252" text-anchor="middle" font-size="16" fill="#5f6368">점잖게 앉아 있으면</text>
<text x="400" y="278" text-anchor="middle" font-size="16" fill="#5f6368">귀인을 만나는 풀이</text>
</g>
<g>
<rect x="535" y="80" width="235" height="250" rx="14" fill="#F1F3F4" stroke="#5f6368" stroke-width="2"/>
<text x="652" y="122" text-anchor="middle" font-size="23" font-weight="700" fill="#202124">백호(흰 호랑이)</text>
<text x="652" y="170" text-anchor="middle" font-size="18" fill="#202124">드물고 귀한 기운</text>
<text x="652" y="202" text-anchor="middle" font-size="18" fill="#202124">특별한 아이·명예</text>
<text x="652" y="252" text-anchor="middle" font-size="16" fill="#5f6368">사납게 굴면</text>
<text x="652" y="278" text-anchor="middle" font-size="16" fill="#5f6368">부담 큰 일이 따름</text>
</g>
</svg>
