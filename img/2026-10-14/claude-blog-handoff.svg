<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="800" height="300" fill="#ffffff"/>
<text x="400" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#202124">인스타 게시물 하나가 넘어가는 길</text>
<rect x="30" y="80" width="220" height="130" rx="14" fill="#eaf2ff" stroke="#1a73e8" stroke-width="2"/>
<text x="140" y="120" text-anchor="middle" font-size="19" font-weight="700" fill="#1a73e8">오전 8시 클로드</text>
<text x="140" y="152" text-anchor="middle" font-size="16" fill="#202124">뉴스에서 주제 2개 골라</text>
<text x="140" y="178" text-anchor="middle" font-size="16" fill="#202124">카드·문구 만들기</text>
<path d="M250 145 L300 145" stroke="#5f6368" stroke-width="3" marker-end="url(#a)"/>
<rect x="305" y="80" width="190" height="130" rx="14" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/>
<text x="400" y="134" text-anchor="middle" font-size="19" font-weight="700" fill="#202124">대기열 파일</text>
<text x="400" y="166" text-anchor="middle" font-size="16" fill="#202124">완성본만 쌓아 둠</text>
<path d="M495 145 L545 145" stroke="#5f6368" stroke-width="3" marker-end="url(#a)"/>
<rect x="550" y="80" width="220" height="130" rx="14" fill="#f1f3f4" stroke="#5f6368" stroke-width="2"/>
<text x="660" y="120" text-anchor="middle" font-size="19" font-weight="700" fill="#3c4043">9:40·20:40 프로그램</text>
<text x="660" y="152" text-anchor="middle" font-size="16" fill="#202124">대기열에서 꺼내</text>
<text x="660" y="178" text-anchor="middle" font-size="16" fill="#202124">그대로 올리기</text>
<text x="400" y="262" text-anchor="middle" font-size="16" fill="#5f6368">올리는 순간엔 AI가 안 켜진다 — 사용량이 쓰는 데만 나간다</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#5f6368"/></marker></defs>
</svg>
