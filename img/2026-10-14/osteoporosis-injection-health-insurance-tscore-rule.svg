<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="40" y="54" font-size="30" font-weight="700" fill="#202124">골다공증 주사 의료보험, 골밀도 숫자로 정해져요</text>
<text x="40" y="88" font-size="18" fill="#5f6368">중심골 골밀도검사(DXA) T-점수 기준 · 2024년 5월 1일부터</text>
<line x1="80" y1="200" x2="880" y2="200" stroke="#5f6368" stroke-width="3"/>
<g font-size="18" fill="#202124" text-anchor="middle">
<line x1="300" y1="185" x2="300" y2="215" stroke="#202124" stroke-width="3"/><text x="300" y="245" font-weight="700">-2.5</text>
<line x1="560" y1="185" x2="560" y2="215" stroke="#202124" stroke-width="3"/><text x="560" y="245" font-weight="700">-2.0</text>
<text x="160" y="170" fill="#1a73e8" font-weight="700">-2.5 이하</text>
<text x="430" y="170" fill="#e8710a" font-weight="700">-2.5 초과 ~ -2.0 이하</text>
<text x="730" y="170" fill="#5f6368" font-weight="700">-2.0 초과</text>
</g>
<rect x="60" y="280" width="260" height="150" rx="12" fill="#e8f0fe"/>
<text x="80" y="318" font-size="20" font-weight="700" fill="#1a73e8">처음 시작</text>
<text x="80" y="350" font-size="17" fill="#202124">1년 급여</text>
<text x="80" y="378" font-size="17" fill="#202124">골절이 확인되면 3년</text>
<text x="80" y="406" font-size="17" fill="#202124">재검에서도 이하면 계속</text>
<rect x="340" y="280" width="270" height="150" rx="12" fill="#fef7e0"/>
<text x="360" y="318" font-size="20" font-weight="700" fill="#b06000">1년 맞고 좋아졌다면</text>
<text x="360" y="350" font-size="17" fill="#202124">2년 더 급여 (최대 3년)</text>
<text x="360" y="378" font-size="17" fill="#202124">2024년 5월 1일 확대</text>
<text x="360" y="406" font-size="17" fill="#202124">약 4만5천 명 대상 추산</text>
<rect x="630" y="280" width="270" height="150" rx="12" fill="#f1f3f4"/>
<text x="650" y="318" font-size="20" font-weight="700" fill="#5f6368">기준 밖</text>
<text x="650" y="350" font-size="17" fill="#202124">맞으면 약값 전부 내 몫</text>
<text x="650" y="378" font-size="17" fill="#202124">영수증 비급여 칸으로</text>
<text x="650" y="406" font-size="17" fill="#202124">→ 실손 특약 확인</text>
<text x="40" y="490" font-size="14" fill="#80868b">출처: 보건복지부 2024.4.29 보도자료, 심평원 골밀도검사 급여기준 · 2026년 10월 14일 확인</text>
</svg>
