<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<rect width="900" height="340" fill="#ffffff"/>
<text x="30" y="42" font-size="22" font-weight="700" fill="#202124">같은 이름인데 지역마다 이만큼 다르다</text>
<text x="30" y="68" font-size="14" fill="#80868b">각 지자체 발표 기준 · 예산 사정으로 바뀔 수 있음</text>
<text x="200" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#80868b">1인당 금액</text>
<text x="480" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#80868b">신청 기간</text>
<text x="740" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#80868b">지급 형태</text>
<line x1="30" y1="118" x2="870" y2="118" stroke="#e1e6ee" stroke-width="2"/>
<text x="40" y="158" font-size="17" font-weight="700" fill="#202124">전남 함평군</text>
<text x="200" y="158" text-anchor="middle" font-size="20" font-weight="800" fill="#1a73e8">50만원</text>
<text x="480" y="158" text-anchor="middle" font-size="16" fill="#3c4043">9월 7일 ~ 10월 8일</text>
<text x="740" y="158" text-anchor="middle" font-size="16" fill="#3c4043">선불카드</text>
<line x1="30" y1="176" x2="870" y2="176" stroke="#f1f3f4" stroke-width="1"/>
<text x="40" y="216" font-size="17" font-weight="700" fill="#202124">전북 완주군</text>
<text x="200" y="216" text-anchor="middle" font-size="20" font-weight="800" fill="#1a73e8">30만원</text>
<text x="480" y="216" text-anchor="middle" font-size="16" fill="#3c4043">9월 8일 접수 시작</text>
<text x="740" y="216" text-anchor="middle" font-size="16" fill="#3c4043">선불카드</text>
<text x="480" y="240" text-anchor="middle" font-size="14" fill="#d93025">군내에서만 · 12월 31일까지</text>
<line x1="30" y1="256" x2="870" y2="256" stroke="#f1f3f4" stroke-width="1"/>
<text x="40" y="296" font-size="17" font-weight="700" fill="#202124">충북 영동군</text>
<text x="200" y="296" text-anchor="middle" font-size="20" font-weight="800" fill="#1a73e8">30만원</text>
<text x="480" y="296" text-anchor="middle" font-size="16" fill="#3c4043">추석 전 지급 목표</text>
<text x="740" y="296" text-anchor="middle" font-size="16" fill="#3c4043">지자체 공고 확인</text>
<text x="30" y="330" font-size="14" fill="#80868b">금액 20만원 차이, 일정도 한 달 가까이 벌어진다 — 다른 지역 글로 내 일정을 짐작하면 안 된다</text>
</svg>
