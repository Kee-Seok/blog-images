<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<rect width="900" height="330" fill="#ffffff"/>
<text x="30" y="42" font-size="22" font-weight="700" fill="#202124">소득대체율은 낸 해마다 다르다 — 그래서 나이가 갈린다</text>
<text x="30" y="68" font-size="14" fill="#80868b">2026년 이전에 낸 기간에는 그해 기준이 그대로 남는다</text>
<line x1="90" y1="240" x2="850" y2="240" stroke="#e1e6ee" stroke-width="2"/>
<rect x="120" y="112" width="90" height="128" rx="5" fill="#8ab4f8"/>
<text x="165" y="100" text-anchor="middle" font-size="18" font-weight="800" fill="#202124">49.0%</text>
<text x="165" y="264" text-anchor="middle" font-size="15" fill="#5f6368">2010년</text>
<rect x="270" y="137" width="90" height="103" rx="5" fill="#8ab4f8"/>
<text x="315" y="125" text-anchor="middle" font-size="18" font-weight="800" fill="#202124">46.5%</text>
<text x="315" y="264" text-anchor="middle" font-size="15" fill="#5f6368">2015년</text>
<rect x="420" y="162" width="90" height="78" rx="5" fill="#8ab4f8"/>
<text x="465" y="150" text-anchor="middle" font-size="18" font-weight="800" fill="#202124">44.0%</text>
<text x="465" y="264" text-anchor="middle" font-size="15" fill="#5f6368">2020년</text>
<rect x="570" y="187" width="90" height="53" rx="5" fill="#d93025"/>
<text x="615" y="175" text-anchor="middle" font-size="18" font-weight="800" fill="#d93025">41.5%</text>
<text x="615" y="264" text-anchor="middle" font-size="15" fill="#5f6368">2025년</text>
<text x="615" y="288" text-anchor="middle" font-size="13" fill="#d93025">가장 낮았다</text>
<rect x="720" y="172" width="90" height="68" rx="5" fill="#1a73e8"/>
<text x="765" y="160" text-anchor="middle" font-size="18" font-weight="800" fill="#1a73e8">43.0%</text>
<text x="765" y="264" text-anchor="middle" font-size="15" fill="#5f6368">2026년~</text>
<text x="765" y="288" text-anchor="middle" font-size="13" fill="#1a73e8">개혁으로 반등</text>
<text x="30" y="320" font-size="15" font-weight="700" fill="#202124">2008년 50%에서 매년 0.5%p씩 내려오다 2026년 개혁으로 올랐다 — 일찍 낸 기간이 유리하다</text>
</svg>
