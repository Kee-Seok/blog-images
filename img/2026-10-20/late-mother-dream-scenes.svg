<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="sans-serif">
<rect width="900" height="470" fill="#ffffff"/>
<text x="450" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">꿈속 엄마의 얼굴, 세 갈래 풀이</text>
<g font-size="20" fill="#202124">
<rect x="30" y="95" width="265" height="320" rx="16" fill="#e6f4ea" stroke="#34a853" stroke-width="3"/>
<text x="162" y="145" text-anchor="middle" font-weight="700" font-size="24">웃으셨다</text>
<text x="162" y="200" text-anchor="middle">근심이 풀리고</text>
<text x="162" y="230" text-anchor="middle">반가운 소식이</text>
<text x="162" y="260" text-anchor="middle">오는 꿈으로 봄</text>
<text x="162" y="340" text-anchor="middle" font-size="18" fill="#137333">밥상·안아 줌도 같은 쪽</text>
<rect x="317" y="95" width="265" height="320" rx="16" fill="#fef7e0" stroke="#f9ab00" stroke-width="3"/>
<text x="450" y="145" text-anchor="middle" font-weight="700" font-size="24">화내셨다</text>
<text x="450" y="200" text-anchor="middle">벌이 아니라</text>
<text x="450" y="230" text-anchor="middle">"서두르지 마라"는</text>
<text x="450" y="260" text-anchor="middle">조심의 꿈으로 봄</text>
<text x="450" y="340" text-anchor="middle" font-size="18" fill="#b06000">미뤄 둔 일 돌아보기</text>
<rect x="604" y="95" width="265" height="320" rx="16" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/>
<text x="737" y="145" text-anchor="middle" font-weight="700" font-size="24">또 떠나셨다</text>
<text x="737" y="200" text-anchor="middle">묵은 슬픔과</text>
<text x="737" y="230" text-anchor="middle">걱정이 끝나 가는</text>
<text x="737" y="260" text-anchor="middle">꿈으로 봄</text>
<text x="737" y="340" text-anchor="middle" font-size="18" fill="#1967d2">크게 울었다면 더 그렇게</text>
</g>
<text x="450" y="452" text-anchor="middle" font-size="16" fill="#5f6368">전통 해몽에서 흔히 하는 풀이 · 앞일을 정해 주는 말은 아님</text>
</svg>
