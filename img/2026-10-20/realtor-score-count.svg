<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="sans-serif">
<rect width="1000" height="560" fill="#ffffff"/>
<text x="40" y="58" font-size="30" font-weight="700" fill="#202124">맞은 개수로 점수 세기 (한 과목 40문제)</text>
<text x="40" y="96" font-size="20" fill="#5f6368">100점 ÷ 40문제 = 1문제 2.5점 · 큐넷 합격기준 기준</text>
<g font-size="21" fill="#202124">
<rect x="60" y="130" width="880" height="62" rx="10" fill="#fce8e6"/>
<text x="90" y="170" font-weight="700">15문제 = 37.5점</text><text x="560" y="170" fill="#c5221f" font-weight="700">과락 (평균이 높아도 불합격)</text>
<rect x="60" y="206" width="880" height="62" rx="10" fill="#fef7e0"/>
<text x="90" y="246" font-weight="700">16문제 = 40점</text><text x="560" y="246" fill="#b06000" font-weight="700">과락은 면하는 선</text>
<rect x="60" y="282" width="880" height="62" rx="10" fill="#e6f4ea"/>
<text x="90" y="322" font-weight="700">24문제 = 60점</text><text x="560" y="322" fill="#188038" font-weight="700">이 과목만 보면 평균선</text>
</g>
<text x="60" y="400" font-size="23" font-weight="700" fill="#202124">합격선은 과목을 더해서 봅니다</text>
<rect x="60" y="420" width="420" height="100" rx="12" fill="#e8f0fe"/>
<text x="270" y="460" font-size="22" font-weight="700" text-anchor="middle" fill="#1a3d8f">1차 (2과목·80문제)</text>
<text x="270" y="498" font-size="22" text-anchor="middle" fill="#202124">합 48문제 이상</text>
<rect x="520" y="420" width="420" height="100" rx="12" fill="#e8f0fe"/>
<text x="730" y="460" font-size="22" font-weight="700" text-anchor="middle" fill="#1a3d8f">2차 (3과목·120문제)</text>
<text x="730" y="498" font-size="22" text-anchor="middle" fill="#202124">합 72문제 이상</text>
</svg>
