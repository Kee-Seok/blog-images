<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="800" height="330" fill="#ffffff"/>
<text x="400" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#202124">다음 검색등록 거절, 원인은 새 글이 아니었다</text>
<rect x="20" y="70" width="230" height="190" rx="14" fill="#fce8e6" stroke="#d93025" stroke-width="2"/>
<text x="135" y="106" text-anchor="middle" font-size="18" font-weight="700" fill="#d93025">거절 메일 (10/15)</text>
<text x="135" y="144" text-anchor="middle" font-size="16" fill="#202124">사유:</text>
<text x="135" y="170" text-anchor="middle" font-size="16" fill="#202124">홍보/스팸성</text>
<text x="135" y="196" text-anchor="middle" font-size="16" fill="#202124">콘텐츠 유형</text>
<text x="275" y="172" font-size="30" fill="#5f6368">→</text>
<rect x="305" y="70" width="230" height="190" rx="14" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/>
<text x="420" y="106" text-anchor="middle" font-size="18" font-weight="700" fill="#b06000">찾은 원인</text>
<text x="420" y="144" text-anchor="middle" font-size="16" fill="#202124">2024년 옛 글 20편</text>
<text x="420" y="170" text-anchor="middle" font-size="16" fill="#202124">250~580자 홍보 글</text>
<text x="420" y="196" text-anchor="middle" font-size="16" fill="#202124">쇼핑 링크 36개 글 포함</text>
<text x="560" y="172" font-size="30" fill="#5f6368">→</text>
<rect x="590" y="70" width="190" height="190" rx="14" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
<text x="685" y="106" text-anchor="middle" font-size="18" font-weight="700" fill="#188038">한 일</text>
<text x="685" y="144" text-anchor="middle" font-size="16" fill="#202124">20편 비공개</text>
<text x="685" y="170" text-anchor="middle" font-size="16" fill="#202124">(삭제 아님)</text>
<text x="685" y="196" text-anchor="middle" font-size="16" fill="#202124">같은 날 재신청</text>
<text x="400" y="300" text-anchor="middle" font-size="14" fill="#5f6368">재신청 결과는 10월 20일 현재 기다리는 중 · 크라우드 이슈 블로그 기록</text>
</svg>
