<text x="40" y="100" font-size="20" fill="#5f6368">도로교통법 제148조의2·제156조, 시행령 별표8 (2026-11-20 확인)</text>
<g font-size="24">
<rect x="40" y="130" width="920" height="80" rx="12" fill="#e8f0fe"/><text x="70" y="180" font-weight="700" fill="#202124">자동차·오토바이(원동기)</text><text x="460" y="180" fill="#202124">형사처벌 · 벌금 최대 2,000만원(처음)</text>
<rect x="40" y="225" width="920" height="80" rx="12" fill="#f1f3f4"/><text x="70" y="275" font-weight="700" fill="#202124">전동킥보드(개인형 이동장치)</text><text x="460" y="275" fill="#202124">범칙금 10만원 · 측정 거부 13만원</text>
<rect x="40" y="320" width="920" height="80" rx="12" fill="#f1f3f4"/><text x="70" y="370" font-weight="700" fill="#202124">자전거</text><text x="460" y="370" fill="#202124">범칙금 3만원 · 측정 거부 10만원</text>
