<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420"><rect width="900" height="420" fill="#ffffff"/><text x="450" y="46" font-size="26" font-weight="700" fill="#202124" text-anchor="middle" style="font-family:'Pretendard','Apple SD Gothic Neo',sans-serif">내 카드 사용액 조회 · 소득공제 확인서 받는 길</text><rect x="70" y="80" width="760" height="92" rx="14" fill="#f3f8ff" stroke="#1a73e8" stroke-width="2"/><text x="100" y="118" font-size="19" font-weight="700" fill="#1a73e8" text-anchor="start" style="font-family:'Pretendard','Apple SD Gothic Neo',sans-serif">지금(11~12월)</text><text x="100" y="152" font-size="24" font-weight="700" fill="#202124" text-anchor="start" style="font-family:'Pretendard','Apple SD Gothic Neo',sans-serif">홈택스 연말정산 미리보기</text><text x="800" y="152" font-size="18" font-weight="400" fill="#5f6368" text-anchor="end" style="font-family:'Pretendard','Apple SD Gothic Neo',sans-serif">1~9월 카드 사용액이 미리 들어와 있어요</text><rect x="70" y="190" width="760" height="92" rx="14" fill="#e6f4ea" stroke="#188038" stroke-width="2"/><text x="100" y="228" font-size="19" font-weight="700" fill="#188038" text-anchor="start" style="font-family:'Pretendard','Apple SD Gothic Neo',sans-serif">1월 중순 이후</text><text x="100" y="262" font-size="24" font-weight="700" fill="#202124" text-anchor="start" style="font-family:'Pretendard','Apple SD Gothic Neo',sans-serif">연말정산 간소화 서비스</text><text x="800" y="262" font-size="18" font-weight="400" fill="#5f6368" text-anchor="end" style="font-family:'Pretendard','Apple SD Gothic Neo',sans-serif">1~12월 사용액·확인서 내려받기</text><rect x="70" y="300" width="760" height="92" rx="14" fill="#fef7e0" stroke="#e37400" stroke-width="2"/><text x="100" y="338" font-size="19" font-weight="700" fill="#e37400" text-anchor="start" style="font-family:'Pretendard','Apple SD Gothic Neo',sans-serif">간소화에 빠졌을 때</text><text x="100" y="372" font-size="24" font-weight="700" fill="#202124" text-anchor="start" style="font-family:'Pretendard','Apple SD Gothic Neo',sans-serif">카드사 소득공제 확인서</text><text x="800" y="372" font-size="18" font-weight="400" fill="#5f6368" text-anchor="end" style="font-family:'Pretendard','Apple SD Gothic Neo',sans-serif">해당 카드사 홈페이지·고객센터</text></svg>