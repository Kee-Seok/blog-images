<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<rect width="720" height="420" fill="#ffffff"/>
<text x="360" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">외할머니 꿈 꾼 날, 해 볼 일 4가지</text>
<g font-size="18" fill="#202124">
<rect x="40" y="80" width="640" height="68" rx="14" fill="#fff8e1"/><circle cx="82" cy="114" r="20" fill="#fbc400"/><text x="82" y="121" text-anchor="middle" font-weight="700">1</text>
<text x="120" y="110" font-weight="700">꿈 장면 한 줄 적어 두기</text><text x="120" y="136" font-size="15" fill="#5f6368">누가 먼저 다가왔는지, 표정이 어땠는지 — 풀이는 이것으로 갈려요</text>
<rect x="40" y="160" width="640" height="68" rx="14" fill="#e8f0fe"/><circle cx="82" cy="194" r="20" fill="#8ab4f8"/><text x="82" y="201" text-anchor="middle" font-weight="700">2</text>
<text x="120" y="190" font-weight="700">엄마에게 외할머니 이야기 여쭤보기</text><text x="120" y="216" font-size="15" fill="#5f6368">같은 분을 그리워하는 사람과 나누면 마음이 금방 풀려요</text>
<rect x="40" y="240" width="640" height="68" rx="14" fill="#e6f4ea"/><circle cx="82" cy="274" r="20" fill="#81c995"/><text x="82" y="281" text-anchor="middle" font-weight="700">3</text>
<text x="120" y="270" font-weight="700">혼자 끌어안은 걱정 하나 털어놓기</text><text x="120" y="296" font-size="15" fill="#5f6368">도움이 닿는 꿈으로 보니, 먼저 말을 꺼내 보는 거예요</text>
<rect x="40" y="320" width="640" height="68" rx="14" fill="#f3e8fd"/><circle cx="82" cy="354" r="20" fill="#c58af9"/><text x="82" y="361" text-anchor="middle" font-weight="700">4</text>
<text x="120" y="350" font-weight="700">일정 하나 덜고 일찍 자기</text><text x="120" y="376" font-size="15" fill="#5f6368">우시거나 얼굴이 어두웠던 꿈이라면 특히 — 쉬어 가라는 신호</text>
</g>
</svg>
