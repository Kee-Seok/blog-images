<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480"><rect width="900" height="480" fill="#ffffff"/><text x="450" y="46" font-size="26" font-weight="700" fill="#202124" text-anchor="middle" style="font-family:'Pretendard','Apple SD Gothic Neo',sans-serif">총급여 5,000만원 · 카드 등 2,500만원을 썼다면</text><rect x="60" y="90" width="390" height="70" fill="#9aa0a6"/><text x="255.0" y="133" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-family:'Pretendard','Apple SD Gothic Neo',sans-serif">문턱 1,250만</text><rect x="450" y="90" width="172" height="70" fill="#1a73e8"/><text x="535.8" y="133" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-family:'Pretendard','Apple SD Gothic Neo',sans-serif">신용 550만</text><rect x="622" y="90" width="187" height="70" fill="#188038"/><text x="715.2" y="133" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-family:'Pretendard','Apple SD Gothic Neo',sans-serif">체크 600만</text><rect x="809" y="90" width="31" height="70" fill="#e37400"/><text x="824.4" y="133" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-family:'Pretendard','Apple SD Gothic Neo',sans-serif">교통</text><text x="450" y="200" font-size="21" font-weight="400" fill="#202124" text-anchor="middle" style="font-family:'Pretendard','Apple SD Gothic Neo',sans-serif">문턱을 넘은 1,250만원만 공제 계산에 들어가요</text><line x1="140" y1="254" x2="760" y2="254" stroke="#dadce0"/><text x="150" y="240" font-size="21" font-weight="400" fill="#202124" text-anchor="start" style="font-family:'Pretendard','Apple SD Gothic Neo',sans-serif">신용카드 550만원 × 15%</text><text x="750" y="240" font-size="21" font-weight="400" fill="#202124" text-anchor="end" style="font-family:'Pretendard','Apple SD Gothic Neo',sans-serif">82.5만원</text><line x1="140" y1="302" x2="760" y2="302" stroke="#dadce0"/><text x="150" y="288" font-size="21" font-weight="400" fill="#202124" text-anchor="s