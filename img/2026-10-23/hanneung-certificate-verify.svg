<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="sans-serif">
<rect width="1000" height="520" fill="#ffffff"/>
<text x="40" y="58" font-size="30" font-weight="700" fill="#202124">받는 쪽이 진짜인지 확인할 때 넣는 4칸</text>
<text x="40" y="96" font-size="20" fill="#5f6368">한능검 누리집 '인증서 진위확인' 화면 (2026년 10월 23일 확인)</text>
<rect x="40" y="130" width="440" height="110" rx="14" fill="#e8f0fe"/>
<text x="260" y="178" font-size="24" font-weight="700" text-anchor="middle" fill="#202124">평가등급</text>
<text x="260" y="215" font-size="19" text-anchor="middle" fill="#3c4043">인증서에 적힌 급수</text>
<rect x="520" y="130" width="440" height="110" rx="14" fill="#e8f0fe"/>
<text x="740" y="178" font-size="24" font-weight="700" text-anchor="middle" fill="#202124">성명</text>
<text x="740" y="215" font-size="19" text-anchor="middle" fill="#3c4043">개명했다면 개명신청 처리 뒤 이름</text>
<rect x="40" y="260" width="440" height="110" rx="14" fill="#e6f4ea"/>
<text x="260" y="308" font-size="24" font-weight="700" text-anchor="middle" fill="#202124">생년월일 8자리</text>
<text x="260" y="345" font-size="19" text-anchor="middle" fill="#3c4043">예: 19761011</text>
<rect x="520" y="260" width="440" height="110" rx="14" fill="#e6f4ea"/>
<text x="740" y="308" font-size="24" font-weight="700" text-anchor="middle" fill="#202124">인증서번호</text>
<text x="740" y="345" font-size="19" text-anchor="middle" fill="#3c4043">칸을 나눠 입력</text>
<rect x="40" y="395" width="920" height="95" rx="14" fill="#fce8e6"/>
<text x="500" y="435" font-size="21" font-weight="700" text-anchor="middle" fill="#202124">인증서 자체엔 유효기간이 없어요</text>
<text x="500" y="470" font-size="19" text-anchor="middle" fill="#3c4043">다만 내는 기관이 '몇 년 안 성적'처럼 따로 기한을 둘 수 있음</text>
</svg>
