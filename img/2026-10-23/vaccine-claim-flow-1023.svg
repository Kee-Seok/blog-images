<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
<rect width="800" height="400" fill="#ffffff"/>
<text x="400" y="44" font-size="26" font-weight="700" fill="#202124" text-anchor="middle">예방접종 피해보상 진료비, 신청부터 결과까지</text>
<g font-size="19" text-anchor="middle">
<rect x="20" y="90" width="170" height="120" rx="14" fill="#f1f3f4" stroke="#dadce0"/>
<text x="105" y="135" font-weight="700" fill="#202124">주소지 보건소</text>
<text x="105" y="165" fill="#202124">서류 내기</text>
<rect x="215" y="90" width="170" height="120" rx="14" fill="#f1f3f4" stroke="#dadce0"/>
<text x="300" y="135" font-weight="700" fill="#202124">시·도</text>
<text x="300" y="165" fill="#202124">기초조사</text>
<rect x="410" y="90" width="170" height="120" rx="14" fill="#f1f3f4" stroke="#dadce0"/>
<text x="495" y="135" font-weight="700" fill="#202124">심의</text>
<text x="495" y="165" fill="#202124">30만원 기준 갈림</text>
<rect x="605" y="90" width="175" height="120" rx="14" fill="#e8f0fe" stroke="#1a73e8"/>
<text x="692" y="135" font-weight="700" fill="#1a56c4">결과 통보</text>
<text x="692" y="165" fill="#202124">신청 뒤 120일 안</text>
</g>
<g stroke="#9aa0a6" stroke-width="3"><line x1="192" y1="150" x2="212" y2="150"/><line x1="387" y1="150" x2="407" y2="150"/><line x1="582" y1="150" x2="602" y2="150"/></g>
<rect x="20" y="245" width="760" height="110" rx="14" fill="#fef7e0" stroke="#f9ab00"/>
<text x="400" y="285" font-size="20" font-weight="700" fill="#202124" text-anchor="middle">신청 기한: 진료비·간병비는 피해가 생긴 날부터 5년</text>
<text x="400" y="320" font-size="18" fill="#202124" text-anchor="middle">본인부담금 30만원 미만 = 시·도 소액절차 · 30만원 이상 = 질병관리청 정규절차</text>
<text x="400" y="385" font-size="15" fill="#5f6368" text-anchor="middle">출처: 질병관리청 예방접종도우미 '예방접종피해 국가보상제도'</text>
</svg>
