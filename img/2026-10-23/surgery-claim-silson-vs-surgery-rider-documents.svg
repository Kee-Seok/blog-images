<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="sans-serif">
<rect width="800" height="470" fill="#ffffff"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">수술 한 번, 청구는 두 갈래</text>
<rect x="300" y="70" width="200" height="54" rx="12" fill="#0B7A75"/>
<text x="400" y="105" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">수술 · 퇴원</text>
<line x1="400" y1="124" x2="200" y2="170" stroke="#5f6368" stroke-width="3"/>
<line x1="400" y1="124" x2="600" y2="170" stroke="#5f6368" stroke-width="3"/>
<rect x="40" y="170" width="320" height="270" rx="14" fill="#f1f8f7" stroke="#0B7A75" stroke-width="2"/>
<text x="200" y="208" text-anchor="middle" font-size="21" font-weight="700" fill="#0B7A75">실손보험 (낸 돈 일부)</text>
<text x="64" y="250" font-size="17" fill="#202124">· 보험금 청구서 · 신분증 사본</text>
<text x="64" y="282" font-size="17" fill="#202124">· 진료비 계산서(영수증)</text>
<text x="64" y="314" font-size="17" fill="#202124">· 진료비 세부내역서</text>
<text x="64" y="346" font-size="17" fill="#202124">· 진단서</text>
<text x="64" y="388" font-size="15" fill="#b06000">입원 50만원 이하면 진단서 대신</text>
<text x="64" y="412" font-size="15" fill="#b06000">진단명 적힌 입퇴원확인서도 돼요</text>
<rect x="440" y="170" width="320" height="270" rx="14" fill="#f7f9fc" stroke="#1a73e8" stroke-width="2"/>
<text x="600" y="208" text-anchor="middle" font-size="21" font-weight="700" fill="#1a73e8">수술비 특약 (정해진 금액)</text>
<text x="464" y="250" font-size="17" fill="#202124">· 보험금 청구서 · 신분증 사본</text>
<text x="464" y="282" font-size="17" fill="#202124">· 진단서</text>
<text x="464" y="314" font-size="17" fill="#202124">· 수술확인서</text>
<text x="464" y="388" font-size="15" fill="#b06000">보험금 100만원까지는</text>
<text x="464" y="412" font-size="15" fill="#b06000">원본 대신 사본으로 청구 가능</text>
</svg>
