<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif">
<rect width="800" height="400" fill="#ffffff"/>
<text x="400" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#202124">클로드 홈페이지 배포 방법, 4칸</text>
<g font-size="18" fill="#202124" text-anchor="middle">
<rect x="20" y="80" width="175" height="200" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="107" y="120" font-weight="700" font-size="20">① 저장소</text><text x="107" y="160">GitHub에</text><text x="107" y="188">공개 저장소</text><text x="107" y="216">하나 만들기</text>
<rect x="215" y="80" width="175" height="200" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="302" y="120" font-weight="700" font-size="20">② 지시 한 단락</text><text x="302" y="160">클로드 코드가</text><text x="302" y="188">index.html</text><text x="302" y="216">한 장 만들기</text>
<rect x="410" y="80" width="175" height="200" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="497" y="120" font-weight="700" font-size="20">③ Pages 켜기</text><text x="497" y="160">Settings</text><text x="497" y="188">→ Pages</text><text x="497" y="216">→ main / root</text>
<rect x="605" y="80" width="175" height="200" rx="14" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2"/><text x="692" y="120" font-weight="700" font-size="20">④ 고칠 때</text><text x="692" y="160">"고치고</text><text x="692" y="188">커밋·푸시까지"</text><text x="692" y="216">한 줄이면 끝</text>
</g>
<text x="400" y="330" text-anchor="middle" font-size="18" fill="#d93025" font-weight="700">쇼핑몰·결제·비밀번호 받는 페이지는 GitHub Pages에 올리지 않기</text>
<text x="400" y="364" text-anchor="middle" font-size="15" fill="#5f6368">GitHub 문서 'GitHub Pages 제한' 2026-11-10 확인</text>
