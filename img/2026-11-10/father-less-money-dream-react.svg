<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660"><rect width="1000" height="660" fill="#ffffff"/><text x="500" y="70" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="38" font-weight="700" fill="#202124" text-anchor="middle">돈을 받은 뒤 내 반응</text><rect x="50" y="110" width="900" height="110" rx="18" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><rect x="50" y="110" width="300" height="110" rx="18" fill="#1a73e8"/><text x="200" y="176" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">서운해서 울었다</text><text x="380" y="176" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="29" fill="#202124">쌓인 서운함을 풀어 보라는 신호</text><rect x="50" y="240" width="900" height="110" rx="18" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><rect x="50" y="240" width="300" height="110" rx="18" fill="#1a73e8"/><text x="200" y="306" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">고맙게 받았다</text><text x="380" y="306" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="29" fill="#202124">작더라도 실속 있는 재물운</text><rect x="50" y="370" width="900" height="110" rx="18" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><rect x="50" y="370" width="300" height="110" rx="18" fill="#1a73e8"/><text x="200" y="436" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">돌려드렸다</text><text x="380" y="436" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="29" fill="#202124">받을 몫을 스스로 놓지 말라는 뜻</text><rect x="50" y="500" width="900" height="110" rx="18" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><rect x="50" y="500" width="300" height="110" rx="18" fill="#1a73e8"/><text x="200" y="566" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">받지 않고 깼다</text><text x="380" y="566" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="29" fill="#202124">미뤄 둔 대화를 꺼낼 때</text></svg>