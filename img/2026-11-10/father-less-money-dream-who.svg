<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660"><rect width="1000" height="660" fill="#ffffff"/><text x="500" y="70" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="38" font-weight="700" fill="#202124" text-anchor="middle">누가 얼마나 받았나</text><rect x="50" y="110" width="900" height="110" rx="18" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><rect x="50" y="110" width="300" height="110" rx="18" fill="#4C2A9E"/><text x="200" y="176" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">나만 조금 받음</text><text x="380" y="176" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="29" fill="#202124">인정받고 싶은 마음, 작은 이익이 먼저</text><rect x="50" y="240" width="900" height="110" rx="18" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><rect x="50" y="240" width="300" height="110" rx="18" fill="#4C2A9E"/><text x="200" y="306" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">형제가 더 받음</text><text x="380" y="306" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="29" fill="#202124">집안 일에서 내 몫을 다시 살피는 때</text><rect x="50" y="370" width="900" height="110" rx="18" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><rect x="50" y="370" width="300" height="110" rx="18" fill="#4C2A9E"/><text x="200" y="436" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">나만 많이 받음</text><text x="380" y="436" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="29" fill="#202124">도움·책임이 함께 나에게 오는 때</text><rect x="50" y="500" width="900" height="110" rx="18" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><rect x="50" y="500" width="300" height="110" rx="18" fill="#4C2A9E"/><text x="200" y="566" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">모두 똑같이 받음</text><text x="380" y="566" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="29" fill="#202124">집안이 고르게 편안해지는 꿈</text></svg>