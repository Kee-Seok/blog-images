<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="1000" height="520" fill="#fffdf7"/>
<text x="40" y="60" font-size="30" font-weight="700" fill="#202124">기한을 놓치면 비용보다 큰 돈이 걸려요</text>
<line x1="80" y1="220" x2="920" y2="220" stroke="#9aa0a6" stroke-width="4"/>
<g font-size="20" fill="#202124">
<circle cx="120" cy="220" r="14" fill="#1a73e8"/><text x="70" y="180" font-weight="700">돌아가신 걸 안 날</text>
<circle cx="440" cy="220" r="14" fill="#ea4335"/><text x="370" y="180" font-weight="700">3개월 안에 신고</text><text x="370" y="270">민법 제1019조 ①</text>
<circle cx="640" cy="220" r="14" fill="#fbbc04"/><text x="590" y="180" font-weight="700">수리 후 5일 안 공고</text><text x="590" y="270">민법 제1032조</text>
<circle cx="880" cy="220" r="14" fill="#34a853"/><text x="790" y="180" font-weight="700">2개월 이상 신고 받기</text><text x="800" y="270">그 뒤 비율대로 변제</text>
</g>
<rect x="40" y="330" width="920" height="120" rx="14" fill="#fce8e6"/>
<text x="64" y="372" font-size="21" font-weight="700" fill="#c5221f">3개월이 지났다면 — 특별한정승인</text>
<text x="64" y="412" font-size="19" fill="#202124">빚이 더 많은 걸 중대한 과실 없이 몰랐다면, 안 날부터 3개월 안에 (민법 제1019조 ③)</text>
<text x="40" y="495" font-size="16" fill="#80868b">민법 제1019조·제1030조·제1032조·제1034조 (law.go.kr, 2026년 11월 10일 확인)</text>
</svg>
