<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Pretendard,Apple SD Gothic Neo,sans-serif"><rect width="1200" height="700" rx="28" fill="#ffffff"/><text x="600" y="70" font-size="40" font-weight="700" fill="#202124" text-anchor="middle">물에 빠진 사람을 보고 내가 한 일</text>
<rect x="50" y="115" width="1100" height="100" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="115" width="14" height="100" rx="7" fill="#1e8e3e"/><text x="85" y="177" font-size="31" font-weight="700" fill="#202124">손을 뻗어 건져 냄</text><text x="520" y="177" font-size="28" fill="#202124">도운 일로 평판·고마움이 돌아옴</text>
<rect x="50" y="230" width="1100" height="100" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="230" width="14" height="100" rx="7" fill="#1e8e3e"/><text x="85" y="292" font-size="31" font-weight="700" fill="#202124">누군가를 불러 구하게 함</text><text x="520" y="292" font-size="28" fill="#202124">주변 힘을 빌려 일을 푸는 때</text>
<rect x="50" y="345" width="1100" height="100" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="345" width="14" height="100" rx="7" fill="#f29900"/><text x="85" y="407" font-size="31" font-weight="700" fill="#202124">바라보기만 함</text><text x="520" y="407" font-size="28" fill="#202124">남의 고민을 곁에서 지켜보게 됨</text>
<rect x="50" y="460" width="1100" height="100" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="460" width="14" height="100" rx="7" fill="#f29900"/><text x="85" y="522" font-size="31" font-weight="700" fill="#202124">구하다 나도 빠질 뻔함</text><text x="520" y="522" font-size="28" fill="#202124">남의 일에 너무 깊이 엮이지 말라</text>
<rect x="50" y="575" width="1100" height="100" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="575" width="14" height="100" rx="7" fill="#d93025"/><text x="85" y="637" font-size="31" font-weight="700" fill="#202124">끝내 놓침</text><text x="520" y="637" font-size="28" fill="#202124">아쉬움, 미뤄 둔 연락을 챙기라</text>
</svg>
