<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Pretendard,Apple SD Gothic Neo,sans-serif"><rect width="1200" height="560" rx="28" fill="#ffffff"/><text x="600" y="70" font-size="40" font-weight="700" fill="#202124" text-anchor="middle">빠진 사람이 누구였나</text>
<rect x="50" y="115" width="1100" height="100" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="115" width="14" height="100" rx="7" fill="#1a73e8"/><text x="85" y="177" font-size="31" font-weight="700" fill="#202124">친구·동료</text><text x="520" y="177" font-size="28" fill="#202124">그 사람과 얽힌 일, 도움 요청 신호</text>
<rect x="50" y="230" width="1100" height="100" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="230" width="14" height="100" rx="7" fill="#1a73e8"/><text x="85" y="292" font-size="31" font-weight="700" fill="#202124">가족</text><text x="520" y="292" font-size="28" fill="#202124">집안 걱정거리, 함께 풀 일</text>
<rect x="50" y="345" width="1100" height="100" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="345" width="14" height="100" rx="7" fill="#1a73e8"/><text x="85" y="407" font-size="31" font-weight="700" fill="#202124">모르는 사람</text><text x="520" y="407" font-size="28" fill="#202124">내 안의 걱정·지친 마음이 비친 꿈</text>
<text x="600" y="515" font-size="24" fill="#5f6368" text-anchor="middle">전통 해몽에서 흔히 보는 풀이 · 오늘의 꿈 해몽</text></svg>
