<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Pretendard,Apple SD Gothic Neo,sans-serif"><rect width="1200" height="700" rx="28" fill="#ffffff"/><text x="600" y="70" font-size="40" font-weight="700" fill="#202124" text-anchor="middle">검은 뱀이 무엇을 했나, 흔히 보는 풀이</text>
<rect x="50" y="120" width="1100" height="110" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="120" width="14" height="110" rx="7" fill="#1e8e3e"/><text x="85" y="187" font-size="32" font-weight="700" fill="#202124">집 안으로 들어옴</text><text x="470" y="187" font-size="29" fill="#202124">재물·좋은 사람이 들어오는 꿈</text>
<rect x="50" y="250" width="1100" height="110" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="250" width="14" height="110" rx="7" fill="#1e8e3e"/><text x="85" y="317" font-size="32" font-weight="700" fill="#202124">나를 물었음</text><text x="470" y="317" font-size="29" fill="#202124">큰 재물·기회가 붙는 길몽</text>
<rect x="50" y="380" width="1100" height="110" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="380" width="14" height="110" rx="7" fill="#f29900"/><text x="85" y="447" font-size="32" font-weight="700" fill="#202124">몸을 휘감음</text><text x="470" y="447" font-size="29" fill="#202124">인연·재물이 묶이는 꿈</text>
<rect x="50" y="510" width="1100" height="110" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="510" width="14" height="110" rx="7" fill="#d93025"/><text x="85" y="577" font-size="32" font-weight="700" fill="#202124">놓쳐 도망감</text><text x="470" y="577" font-size="29" fill="#202124">들어올 몫이 빠져나가는 아쉬움</text>
</svg>
