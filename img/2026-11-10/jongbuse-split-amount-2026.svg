<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
<rect width="800" height="470" fill="#ffffff"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">고지서 금액(농어촌특별세 포함)별 나눠 낼 수 있는 돈</text>
<g font-size="20" fill="#202124">
<rect x="40" y="80" width="720" height="100" rx="14" fill="#f1f3f4"/>
<text x="70" y="122" font-weight="700">300만원 이하</text>
<text x="70" y="156">분납 안 됨 · 12월 15일까지 한 번에</text>
<rect x="40" y="200" width="720" height="110" rx="14" fill="#e8f0fe"/>
<text x="70" y="242" font-weight="700">300만원 넘고 600만원 이하</text>
<text x="70" y="276">300만원을 뺀 나머지 · 예) 500만원이면 200만원을 6월로</text>
<rect x="40" y="330" width="720" height="110" rx="14" fill="#fff4d6"/>
<text x="70" y="372" font-weight="700">600만원 넘으면</text>
<text x="70" y="406">절반까지 · 예) 1,000만원이면 최대 500만원을 6월로</text>
</g>
</svg>
