<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Pretendard,Apple SD Gothic Neo,sans-serif"><rect width="1200" height="560" rx="28" fill="#ffffff"/><text x="600" y="70" font-size="40" font-weight="700" fill="#202124" text-anchor="middle">뱀 색깔로 갈리는 전통 풀이</text>
<rect x="60" y="120" width="340" height="380" rx="20" fill="#f8f9fa" stroke="#e1e6ee"/><circle cx="230" cy="215" r="55" fill="#202124" stroke="#9aa0a6"/><text x="230" y="330" font-size="36" font-weight="700" fill="#202124" text-anchor="middle">검은 뱀</text><text x="230" y="390" font-size="29" fill="#202124" text-anchor="middle">재물·권세</text><text x="230" y="440" font-size="25" fill="#5f6368" text-anchor="middle">큰 구렁이면 큰 몫</text>
<rect x="430" y="120" width="340" height="380" rx="20" fill="#f8f9fa" stroke="#e1e6ee"/><circle cx="600" cy="215" r="55" fill="#f2b705" stroke="#9aa0a6"/><text x="600" y="330" font-size="36" font-weight="700" fill="#202124" text-anchor="middle">노란 뱀</text><text x="600" y="390" font-size="29" fill="#202124" text-anchor="middle">금전·명예</text><text x="600" y="440" font-size="25" fill="#5f6368" text-anchor="middle">황금빛이면 재물운</text>
<rect x="800" y="120" width="340" height="380" rx="20" fill="#f8f9fa" stroke="#e1e6ee"/><circle cx="970" cy="215" r="55" fill="#dadce0" stroke="#9aa0a6"/><text x="970" y="330" font-size="36" font-weight="700" fill="#202124" text-anchor="middle">흰 뱀</text><text x="970" y="390" font-size="29" fill="#202124" text-anchor="middle">귀인·좋은 소식</text><text x="970" y="440" font-size="25" fill="#5f6368" text-anchor="middle">맑은 기운으로 봄</text>
</svg>
