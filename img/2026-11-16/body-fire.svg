<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="478" viewBox="0 0 1000 478" font-family="sans-serif"><rect width="1000" height="478" fill="#ffffff"/><text x="500" y="62" text-anchor="middle" font-size="34" font-weight="700" fill="#202124">내 몸 어디에 불이 붙었나요</text><rect x="40" y="100" width="920" height="76" rx="14" fill="#2f9e44" opacity="0.13"/><rect x="40" y="100" width="12" height="76" rx="6" fill="#2f9e44"/><text x="76" y="148" font-size="28" font-weight="700" fill="#202124">손</text><text x="440" y="148" font-size="27" fill="#3c4043">하는 일·재주가 살아남</text><rect x="40" y="192" width="920" height="76" rx="14" fill="#1c7ed6" opacity="0.13"/><rect x="40" y="192" width="12" height="76" rx="6" fill="#1c7ed6"/><text x="76" y="240" font-size="28" font-weight="700" fill="#202124">머리·머리카락</text><text x="440" y="240" font-size="27" fill="#3c4043">생각·이름이 드러남</text><rect x="40" y="284" width="920" height="76" rx="14" fill="#2f9e44" opacity="0.13"/><rect x="40" y="284" width="12" height="76" rx="6" fill="#2f9e44"/><text x="76" y="332" font-size="28" font-weight="700" fill="#202124">온몸</text><text x="440" y="332" font-size="27" fill="#3c4043">크게 일어나는 기운</text><rect x="40" y="376" width="920" height="76" rx="14" fill="#f59f00" opacity="0.13"/><rect x="40" y="376" width="12" height="76" rx="6" fill="#f59f00"/><text x="76" y="424" font-size="28" font-weight="700" fill="#202124">옷·신발</text><text x="440" y="424" font-size="27" fill="#3c4043">자리·처지가 바뀜</text></svg>