<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="800" height="420" fill="#ffffff"/>
<text x="400" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">유류분 반환 청구, 두 개의 시계</text>
<text x="400" y="74" text-anchor="middle" font-size="17" fill="#5f6368">민법 제1117조 · 둘 중 먼저 끝나는 쪽에서 권리가 사라져요</text>
<line x1="60" y1="170" x2="740" y2="170" stroke="#dadce0" stroke-width="4"/>
<circle cx="80" cy="170" r="12" fill="#1a73e8"/>
<text x="80" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#202124">돌아가신 날</text>
<rect x="80" y="190" width="640" height="40" rx="8" fill="#e8f0fe"/>
<text x="400" y="217" text-anchor="middle" font-size="19" font-weight="700" fill="#1a73e8">상속이 시작된 때부터 10년</text>
<line x1="60" y1="300" x2="740" y2="300" stroke="#dadce0" stroke-width="4"/>
<circle cx="260" cy="300" r="12" fill="#d93025"/>
<text x="260" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#202124">증여·유증 사실을 안 날</text>
<rect x="260" y="318" width="190" height="40" rx="8" fill="#fce8e6"/>
<text x="355" y="345" text-anchor="middle" font-size="19" font-weight="700" fill="#d93025">1년</text>
<text x="400" y="400" text-anchor="middle" font-size="16" fill="#5f6368">돌아가신 사실과 증여·유증이 있었다는 사실을 둘 다 안 날부터 1년</text>
</svg>
