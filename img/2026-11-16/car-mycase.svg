<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="800" height="440" fill="#ffffff"/>
<text x="400" y="44" font-size="26" font-weight="700" text-anchor="middle" fill="#202124">내 보험료면 얼마 더? (요율 인상분만)</text>
<g font-size="20" fill="#202124">
<rect x="60" y="70" width="680" height="50" fill="#f1f3f4"/>
<text x="90" y="103" font-weight="700">지금 1년 보험료</text><text x="420" y="103" font-weight="700">1.2% 오르면</text><text x="600" y="103" font-weight="700">1.4% 오르면</text>
<text x="90" y="160">50만원</text><text x="420" y="160">+6,000원</text><text x="600" y="160">+7,000원</text>
<text x="90" y="215">69만 2천원(평균)</text><text x="420" y="215">+8,304원</text><text x="600" y="215">+9,688원</text>
