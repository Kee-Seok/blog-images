<text x="90" y="325">150만원</text><text x="420" y="325">+18,000원</text><text x="600" y="325">+21,000원</text>
<line x1="60" y1="130" x2="740" y2="130" stroke="#dadce0"/><line x1="60" y1="185" x2="740" y2="185" stroke="#dadce0"/><line x1="60" y1="240" x2="740" y2="240" stroke="#dadce0"/><line x1="60" y1="295" x2="740" y2="295" stroke="#dadce0"/>
</g>
<rect x="60" y="350" width="680" height="62" rx="10" fill="#fff8e1" stroke="#fbc400"/>
<text x="400" y="388" font-size="18" text-anchor="middle" fill="#202124">이보다 훨씬 많이 올랐다면 사고 점수·할인 중단을 먼저 보세요</text>
