<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="800" height="460" fill="#ffffff"/>
<text x="400" y="44" font-size="26" font-weight="700" text-anchor="middle" fill="#202124">아버지가 건넨 것별 풀이</text>
<g font-size="20" fill="#202124">
<rect x="60" y="80" width="680" height="56" rx="10" fill="#fff8e1"/><text x="90" y="116" font-weight="700">돈·통장</text><text x="300" y="116">재물·기회가 생기는 꿈</text>
<rect x="60" y="146" width="680" height="56" rx="10" fill="#f8f9fa"/><text x="90" y="182" font-weight="700">옷</text><text x="300" y="182">새 자리·새 역할을 맡음</text>
<rect x="60" y="212" width="680" height="56" rx="10" fill="#fff8e1"/><text x="90" y="248" font-weight="700">음식·밥상</text><text x="300" y="248">집안 화목, 뜻밖의 도움</text>
<rect x="60" y="278" width="680" height="56" rx="10" fill="#f8f9fa"/><text x="90" y="314" font-weight="700">열쇠·문서</text><text x="300" y="314">막힌 일이 열리는 꿈</text>
<rect x="60" y="344" width="680" height="56" rx="10" fill="#fff8e1"/><text x="90" y="380" font-weight="700">담배·불</text><text x="300" y="380">일에 기운이 붙음</text>
</g>
<text x="400" y="440" font-size="15" text-anchor="middle" fill="#5f6368">내가 아버지께 드린 꿈은 반대로 '살피는 쪽'으로 읽어요</text>
</svg>
