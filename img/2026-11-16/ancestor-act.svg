<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="478" viewBox="0 0 1000 478" font-family="sans-serif"><rect width="1000" height="478" fill="#ffffff"/><text x="500" y="62" text-anchor="middle" font-size="34" font-weight="700" fill="#202124">조상이 불붙은 손으로 한 일</text><rect x="40" y="100" width="920" height="76" rx="14" fill="#2f9e44" opacity="0.13"/><rect x="40" y="100" width="12" height="76" rx="6" fill="#2f9e44"/><text x="76" y="148" font-size="28" font-weight="700" fill="#202124">불을 내게 건넸다</text><text x="440" y="148" font-size="27" fill="#3c4043">맡길 일·기회의 신호</text><rect x="40" y="192" width="920" height="76" rx="14" fill="#1c7ed6" opacity="0.13"/><rect x="40" y="192" width="12" height="76" rx="6" fill="#1c7ed6"/><text x="76" y="240" font-size="28" font-weight="700" fill="#202124">내 손을 잡았다</text><text x="440" y="240" font-size="27" fill="#3c4043">곁에서 지켜 준다는 뜻</text><rect x="40" y="284" width="920" height="76" rx="14" fill="#f59f00" opacity="0.13"/><rect x="40" y="284" width="12" height="76" rx="6" fill="#f59f00"/><text x="76" y="332" font-size="28" font-weight="700" fill="#202124">어딘가를 가리켰다</text><text x="440" y="332" font-size="27" fill="#3c4043">살펴볼 일이 있다는 쪽</text><rect x="40" y="376" width="920" height="76" rx="14" fill="#e03131" opacity="0.13"/><rect x="40" y="376" width="12" height="76" rx="6" fill="#e03131"/><text x="76" y="424" font-size="28" font-weight="700" fill="#202124">불을 끄라고 했다</text><text x="440" y="424" font-size="27" fill="#3c4043">무리한 일을 멈추라는 쪽</text></svg>