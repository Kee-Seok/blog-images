<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="800" height="460" fill="#ffffff"/>
<text x="400" y="44" font-size="26" font-weight="700" text-anchor="middle" fill="#202124">어디에 불이 났나요? 장소별 풀이</text>
<g font-size="19" fill="#202124">
<rect x="40" y="80" width="350" height="80" rx="12" fill="#e6f4ea" stroke="#188038" stroke-width="2"/><text x="60" y="115" font-weight="700">우리 집</text><text x="60" y="145">집안 살림·가족운이 피어남</text>
<rect x="410" y="80" width="350" height="80" rx="12" fill="#f3f8ff" stroke="#1a73e8" stroke-width="2"/><text x="430" y="115" font-weight="700">남의 집·옆집</text><text x="430" y="145">주변 소식, 내가 뭘 했는지가 관건</text>
<rect x="40" y="180" width="350" height="80" rx="12" fill="#e6f4ea" stroke="#188038" stroke-width="2"/><text x="60" y="215" font-weight="700">회사·가게</text><text x="60" y="245">일터가 바빠지고 일이 늘어남</text>
<rect x="410" y="180" width="350" height="80" rx="12" fill="#f3f8ff" stroke="#1a73e8" stroke-width="2"/><text x="430" y="215" font-weight="700">아파트·큰 건물</text><text x="430" y="245">여러 사람이 얽힌 큰일</text>
<rect x="40" y="280" width="350" height="80" rx="12" fill="#fff8e1" stroke="#fbc400" stroke-width="2"/><text x="60" y="315" font-weight="700">자동차</text><text x="60" y="345">이동·일의 속도가 붙음</text>
<rect x="410" y="280" width="350" height="80" rx="12" fill="#fff8e1" stroke="#fbc400" stroke-width="2"/><text x="430" y="315" font-weight="700">산·들판</text><text x="430" y="345">넓게 퍼지는 기운, 큰 변화</text>
</g>
<text x="400" y="410" font-size="17" text-anchor="middle" fill="#5f6368">장소를 고른 다음, 내가 한 행동(구경·끄기·도망)으로 한 번 더 갈라요</text>
</svg>
