<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" width="1200" height="710" font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
<rect width="1200" height="710" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="110" fill="#b06000"/>
<text x="600" y="72" font-size="44" font-weight="700" fill="#ffffff" text-anchor="middle">백발 노인이 나타난 꿈</text>
<rect x="60" y="150" width="1080" height="105" rx="18" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/>
<rect x="60" y="150" width="380" height="105" rx="18" fill="#b06000" opacity="0.14"/>
<text x="250" y="215" font-size="36" font-weight="700" fill="#202124" text-anchor="middle">웃으며 말을 걸었다</text>
<text x="470" y="215" font-size="34" fill="#202124">→ 귀인·좋은 조언</text>
<rect x="60" y="280" width="1080" height="105" rx="18" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/>
<rect x="60" y="280" width="380" height="105" rx="18" fill="#b06000" opacity="0.14"/>
<text x="250" y="345" font-size="36" font-weight="700" fill="#202124" text-anchor="middle">무언가를 건넸다</text>
<text x="470" y="345" font-size="34" fill="#202124">→ 도움이나 재물이 들어옴</text>
<rect x="60" y="410" width="1080" height="105" rx="18" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/>
<rect x="60" y="410" width="380" height="105" rx="18" fill="#b06000" opacity="0.14"/>
<text x="250" y="475" font-size="36" font-weight="700" fill="#202124" text-anchor="middle">말없이 사라졌다</text>
<text x="470" y="475" font-size="34" fill="#202124">→ 마음을 정리할 때</text>
<rect x="60" y="540" width="1080" height="105" rx="18" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/>
<rect x="60" y="540" width="380" height="105" rx="18" fill="#b06000" opacity="0.14"/>
<text x="250" y="605" font-size="36" font-weight="700" fill="#202124" text-anchor="middle">화를 냈다</text>
<text x="470" y="605" font-size="34" fill="#202124">→ 미뤄 둔 일을 챙기라는 뜻</text>
</svg>