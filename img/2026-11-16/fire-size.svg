<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="800" height="430" fill="#ffffff"/>
<text x="400" y="44" font-size="26" font-weight="700" text-anchor="middle" fill="#202124">불나는 꿈, 불길 크기로 먼저 가르기</text>
<text x="400" y="76" font-size="17" text-anchor="middle" fill="#5f6368">전통 해몽에서 많이 쓰는 기준</text>
<g font-size="19" fill="#202124">
<rect x="40" y="105" width="230" height="270" rx="14" fill="#fff4e5" stroke="#f29900" stroke-width="2"/>
<text x="155" y="150" text-anchor="middle" font-weight="700" font-size="22">활활 큰불</text>
<text x="155" y="200" text-anchor="middle">일이 크게 일어남</text>
<text x="155" y="235" text-anchor="middle">재물·명예가 늘어남</text>
<text x="155" y="300" text-anchor="middle" font-weight="700" fill="#188038">좋은 쪽</text>
<rect x="285" y="105" width="230" height="270" rx="14" fill="#fff8e1" stroke="#fbc400" stroke-width="2"/>
<text x="400" y="150" text-anchor="middle" font-weight="700" font-size="22">작은 불·불씨</text>
<text x="400" y="200" text-anchor="middle">시작은 됐지만</text>
<text x="400" y="235" text-anchor="middle">아직 키우는 단계</text>
<text x="400" y="300" text-anchor="middle" font-weight="700" fill="#f29900">기다리는 쪽</text>
<rect x="530" y="105" width="230" height="270" rx="14" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="2"/>
<text x="645" y="150" text-anchor="middle" font-weight="700" font-size="22">연기만 자욱</text>
<text x="645" y="200" text-anchor="middle">불은 안 보이고</text>
<text x="645" y="235" text-anchor="middle">답답한 일이 남음</text>
<text x="645" y="300" text-anchor="middle" font-weight="700" fill="#5f6368">살펴보는 쪽</text>
</g>
<text x="400" y="410" font-size="16" text-anchor="middle" fill="#5f6368">불이 밝고 깨끗할수록, 연기가 적을수록 좋게 풀이해요</text>
</svg>
