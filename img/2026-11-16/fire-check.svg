<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="800" height="380" fill="#ffffff"/>
<text x="400" y="44" font-size="26" font-weight="700" text-anchor="middle" fill="#202124">좋은 꿈 쪽으로 보는 신호 3가지</text>
<g font-size="21" fill="#202124">
<rect x="60" y="80" width="680" height="72" rx="12" fill="#e6f4ea" stroke="#188038" stroke-width="2"/><text x="90" y="125">✔ 불길이 밝고 크게 타올랐다</text>
<rect x="60" y="167" width="680" height="72" rx="12" fill="#e6f4ea" stroke="#188038" stroke-width="2"/><text x="90" y="212">✔ 다친 사람 없이 나는 무사했다</text>
<rect x="60" y="254" width="680" height="72" rx="12" fill="#e6f4ea" stroke="#188038" stroke-width="2"/><text x="90" y="299">✔ 연기보다 불빛이 더 기억난다</text>
</g>
<text x="400" y="360" font-size="16" text-anchor="middle" fill="#5f6368">셋 중 둘 이상이면 전통 해몽에서는 길몽 쪽으로 풀이해요</text>
</svg>
