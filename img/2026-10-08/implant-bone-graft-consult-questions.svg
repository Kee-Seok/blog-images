<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" font-family="sans-serif"><rect width="1000" height="460" fill="#fff"/><text x="500" y="50" font-size="30" font-weight="700" fill="#202124" text-anchor="middle">상담 때 물어볼 네 가지</text><rect x="100" y="95" width="800" height="62" rx="14" fill="#f7f9fc" stroke="#dadce0"/><text x="130" y="135" font-size="22" font-weight="400" fill="#202124" text-anchor="start">1. 뼈이식이 꼭 필요한가요? (CT로 보여 주세요)</text><rect x="100" y="175" width="800" height="62" rx="14" fill="#f7f9fc" stroke="#dadce0"/><text x="130" y="215" font-size="22" font-weight="400" fill="#202124" text-anchor="start">2. 어떤 재료를, 얼마나 쓰나요?</text><rect x="100" y="255" width="800" height="62" rx="14" fill="#f7f9fc" stroke="#dadce0"/><text x="130" y="295" font-size="22" font-weight="400" fill="#202124" text-anchor="start">3. 뼈이식 비용은 임플란트와 따로 얼마인가요?</text><rect x="100" y="335" width="800" height="62" rx="14" fill="#f7f9fc" stroke="#dadce0"/><text x="130" y="375" font-size="22" font-weight="400" fill="#202124" text-anchor="start">4. 시술 시작일이 만 65세 이후인가요?</text><text x="500" y="440" font-size="17" font-weight="400" fill="#80868b" text-anchor="middle">정리: 국민건강보험공단 안내 기준 (연령은 시술 시작일 기준)</text></svg>