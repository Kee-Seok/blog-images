<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" font-family="sans-serif"><rect width="1000" height="410" fill="#fff"/><text x="500" y="50" font-size="30" font-weight="700" fill="#202124" text-anchor="middle">실손 입원 인정, 무엇으로 갈리나</text><rect x="60" y="100" width="420" height="250" rx="14" fill="#e6f4ea" stroke="#a8dab5"/><text x="270" y="150" font-size="26" font-weight="700" fill="#137333" text-anchor="middle">입원으로 인정</text><text x="270" y="200" font-size="21" font-weight="400" fill="#202124" text-anchor="middle">입원 필요성이 기록에 남음</text><text x="270" y="240" font-size="21" font-weight="400" fill="#202124" text-anchor="middle">6시간 이상 체류 + 관찰·처치</text><text x="270" y="280" font-size="21" font-weight="400" fill="#202124" text-anchor="middle">입원의료비로 보상</text><rect x="520" y="100" width="420" height="250" rx="14" fill="#fce8e6" stroke="#f6aea9"/><text x="730" y="150" font-size="26" font-weight="700" fill="#c5221f" text-anchor="middle">통원으로 처리</text><text x="730" y="200" font-size="21" font-weight="400" fill="#202124" text-anchor="middle">입원확인서만 있음</text><text x="730" y="240" font-size="21" font-weight="400" fill="#202124" text-anchor="middle">6시간 미만·처치 기록 없음</text><text x="730" y="280" font-size="21" font-weight="400" fill="#202124" text-anchor="middle">통원 한도 안에서만</text><text x="500" y="390" font-size="17" font-weight="400" fill="#80868b" text-anchor="middle">자료: 금융감독원 안내(2025.3), 대법원 판결 보도 정리</text></svg>