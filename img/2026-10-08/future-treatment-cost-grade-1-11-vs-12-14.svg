<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="sans-serif"><rect width="1000" height="420" fill="#fff"/><text x="500" y="50" font-size="30" font-weight="700" fill="#202124" text-anchor="middle">향후치료비, 누가 받나</text><rect x="60" y="100" width="420" height="260" rx="14" fill="#e6f4ea" stroke="#a8dab5"/><text x="270" y="150" font-size="26" font-weight="700" fill="#137333" text-anchor="middle">중상환자 1~11급</text><text x="270" y="200" font-size="21" font-weight="400" fill="#202124" text-anchor="middle">골절·장기 손상 등</text><text x="270" y="245" font-size="21" font-weight="400" fill="#202124" text-anchor="middle">향후치료비 지급 가능</text><text x="270" y="290" font-size="21" font-weight="400" fill="#202124" text-anchor="middle">치료 기간 제한 없음</text><rect x="520" y="100" width="420" height="260" rx="14" fill="#fce8e6" stroke="#f6aea9"/><text x="730" y="150" font-size="26" font-weight="700" fill="#c5221f" text-anchor="middle">경상환자 12~14급</text><text x="730" y="200" font-size="21" font-weight="400" fill="#202124" text-anchor="middle">염좌·단순 타박상</text><text x="730" y="245" font-size="21" font-weight="400" fill="#202124" text-anchor="middle">향후치료비 대신 실제 치료비</text><text x="730" y="290" font-size="21" font-weight="400" fill="#202124" text-anchor="middle">8주 넘으면 심사</text><text x="500" y="400" font-size="17" font-weight="400" fill="#80868b" text-anchor="middle">자료: 국토교통부·금융위원회·금융감독원 (2025.2.26), 금감원 발표 (2026.9.2)</text></svg>