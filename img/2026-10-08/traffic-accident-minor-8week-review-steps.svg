<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="sans-serif"><rect width="1000" height="440" fill="#fff"/><text x="500" y="50" font-size="30" font-weight="700" fill="#202124" text-anchor="middle">경상환자 8주 넘게 치료받으려면</text><rect x="40" y="100" width="210" height="150" rx="14" fill="#e8f0fe" stroke="#aecbfa"/><text x="145" y="160" font-size="26" font-weight="700" fill="#1a73e8" text-anchor="middle">사고 발생</text><text x="145" y="205" font-size="19" font-weight="400" fill="#202124" text-anchor="middle">9월 10일 이후</text><text x="265" y="185" font-size="30" fill="#5f6368" text-anchor="middle">›</text><rect x="280" y="100" width="210" height="150" rx="14" fill="#e8f0fe" stroke="#aecbfa"/><text x="385" y="160" font-size="26" font-weight="700" fill="#1a73e8" text-anchor="middle">7주 안</text><text x="385" y="205" font-size="19" font-weight="400" fill="#202124" text-anchor="middle">진단서·진료기록 제출</text><text x="505" y="185" font-size="30" fill="#5f6368" text-anchor="middle">›</text><rect x="520" y="100" width="210" height="150" rx="14" fill="#e8f0fe" stroke="#aecbfa"/><text x="625" y="160" font-size="26" font-weight="700" fill="#1a73e8" text-anchor="middle">7일 안</text><text x="625" y="205" font-size="19" font-weight="400" fill="#202124" text-anchor="middle">진흥원 전문의 검토</text><text x="745" y="185" font-size="30" fill="#5f6368" text-anchor="middle">›</text><rect x="760" y="100" width="210" height="150" rx="14" fill="#e8f0fe" stroke="#aecbfa"/><text x="865" y="160" font-size="26" font-weight="700" fill="#1a73e8" text-anchor="middle">결과</text><text x="865" y="205" font-size="19" font-weight="400" fill="#202124" text-anchor="middle">8주 넘는 치료 여부</text><rect x="140" y="290" width="720" height="90" rx="14" fill="#fff4e5" stroke="#f5c27a"/><text x="500" y="330" font-size="20" font-weight="400" fill="#202124" text-anchor="middle">이의가 있으면 통보받은 날부터 7일 안에 공제분쟁조정분과위원회</text><text x="500" y="362" font-size="20" font-weight="400" fill="#202124" text-anchor="middle">심사 지연 중 치료비·서류 발급비는 보험사 부담</text><text x="500" y="420" font-size="17" font-weight="400" fill="#80868b" text-anchor="middle">자료: 금융감독원 2026년 9월 2일 발표 보도 정리</text></svg>