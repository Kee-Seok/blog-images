<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="sans-serif"><rect width="1000" height="420" fill="#fff"/><text x="500" y="50" font-size="30" font-weight="700" fill="#202124" text-anchor="middle">65세 임플란트, 건강보험 범위</text><rect x="60" y="100" width="420" height="260" rx="14" fill="#e6f4ea" stroke="#a8dab5"/><text x="270" y="150" font-size="26" font-weight="700" fill="#137333" text-anchor="middle">건강보험 되는 것</text><text x="270" y="200" font-size="21" font-weight="400" fill="#202124" text-anchor="middle">만 65세 이상 임플란트</text><text x="270" y="240" font-size="21" font-weight="400" fill="#202124" text-anchor="middle">평생 1인당 2개</text><text x="270" y="280" font-size="21" font-weight="400" fill="#202124" text-anchor="middle">본인부담 30%</text><text x="270" y="320" font-size="19" font-weight="400" fill="#202124" text-anchor="middle">(부분무치악만)</text><rect x="520" y="100" width="420" height="260" rx="14" fill="#fce8e6" stroke="#f6aea9"/><text x="730" y="150" font-size="26" font-weight="700" fill="#c5221f" text-anchor="middle">전액 내 돈</text><text x="730" y="200" font-size="21" font-weight="400" fill="#202124" text-anchor="middle">골이식술(뼈이식)</text><text x="730" y="240" font-size="21" font-weight="400" fill="#202124" text-anchor="middle">상악동 거상술</text><text x="730" y="280" font-size="21" font-weight="400" fill="#202124" text-anchor="middle">브릿지 가운데 크라운</text><text x="500" y="400" font-size="17" font-weight="400" fill="#80868b" text-anchor="middle">자료: 국민건강보험공단 치과임플란트 급여안내·질의응답</text></svg>