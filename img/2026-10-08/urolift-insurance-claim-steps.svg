<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" font-family="sans-serif"><rect width="1000" height="320" fill="#fff"/><text x="500" y="50" font-size="30" font-weight="700" fill="#202124" text-anchor="middle">유로리프트 실비, 순서대로</text><rect x="40" y="100" width="210" height="160" rx="14" fill="#f7f9fc" stroke="#dadce0"/><text x="145" y="145" font-size="30" font-weight="700" fill="#1a73e8" text-anchor="middle">1</text><text x="145" y="190" font-size="22" font-weight="700" fill="#202124" text-anchor="middle">가입 시기 확인</text><text x="145" y="230" font-size="17" font-weight="400" fill="#202124" text-anchor="middle">내보험찾아줌</text><rect x="280" y="100" width="210" height="160" rx="14" fill="#f7f9fc" stroke="#dadce0"/><text x="385" y="145" font-size="30" font-weight="700" fill="#1a73e8" text-anchor="middle">2</text><text x="385" y="190" font-size="22" font-weight="700" fill="#202124" text-anchor="middle">수술 전 확인</text><text x="385" y="230" font-size="17" font-weight="400" fill="#202124" text-anchor="middle">입원 필요성 소견</text><rect x="520" y="100" width="210" height="160" rx="14" fill="#f7f9fc" stroke="#dadce0"/><text x="625" y="145" font-size="30" font-weight="700" fill="#1a73e8" text-anchor="middle">3</text><text x="625" y="190" font-size="22" font-weight="700" fill="#202124" text-anchor="middle">서류</text><text x="625" y="230" font-size="17" font-weight="400" fill="#202124" text-anchor="middle">진단서·세부내역서·수술확인서</text><rect x="760" y="100" width="210" height="160" rx="14" fill="#f7f9fc" stroke="#dadce0"/><text x="865" y="145" font-size="30" font-weight="700" fill="#1a73e8" text-anchor="middle">4</text><text x="865" y="190" font-size="22" font-weight="700" fill="#202124" text-anchor="middle">거절되면</text><text x="865" y="230" font-size="17" font-weight="400" fill="#202124" text-anchor="middle">금감원 분쟁조정</text><text x="500" y="300" font-size="17" font-weight="400" fill="#80868b" text-anchor="middle">정리: 금융감독원·법원 판단 보도 기준</text></svg>