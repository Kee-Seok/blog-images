<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="sans-serif">
<rect width="800" height="560" fill="#ffffff"/>
<text x="400" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">돼지 색깔로 보는 돼지꿈</text>
<rect x="40" y="85" width="350" height="190" rx="16" fill="#e8f5e9"/>
<text x="215" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1e7e34">흰 돼지·금돼지</text>
<text x="215" y="180" text-anchor="middle" font-size="19" fill="#202124">밝게 빛남</text>
<text x="215" y="210" text-anchor="middle" font-size="19" fill="#202124">재물·좋은 소식 크게</text>
<rect x="410" y="85" width="350" height="190" rx="16" fill="#e8f0fe"/>
<text x="585" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1a56db">분홍 돼지</text>
<text x="585" y="180" text-anchor="middle" font-size="19" fill="#202124">살이 오르고 순함</text>
<text x="585" y="210" text-anchor="middle" font-size="19" fill="#202124">집안의 웃음·소소한 복</text>
<rect x="40" y="295" width="350" height="190" rx="16" fill="#fff8e1"/>
<text x="215" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#b06000">검은 돼지</text>
<text x="215" y="390" text-anchor="middle" font-size="19" fill="#202124">힘이 셈</text>
<text x="215" y="420" text-anchor="middle" font-size="19" fill="#202124">재물 따르나 바쁨</text>
<rect x="410" y="295" width="350" height="190" rx="16" fill="#fce8e6"/>
<text x="585" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#c5221f">야윈·병든 돼지</text>
<text x="585" y="390" text-anchor="middle" font-size="19" fill="#202124">힘없이 누움</text>
<text x="585" y="420" text-anchor="middle" font-size="19" fill="#202124">기대보다 작은 몫</text>
<text x="400" y="520" text-anchor="middle" font-size="16" fill="#5f6368">전통 해몽 풀이 · 오늘의 꿈 해몽</text></svg>