<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="sans-serif">
<rect width="800" height="560" fill="#ffffff"/>
<text x="400" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">돼지꿈 태몽, 흔히 보는 풀이</text>
<rect x="40" y="85" width="350" height="190" rx="16" fill="#e8f5e9"/>
<text x="215" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1e7e34">새끼 돼지 안음</text>
<text x="215" y="180" text-anchor="middle" font-size="19" fill="#202124">품에 쏙</text>
<text x="215" y="210" text-anchor="middle" font-size="19" fill="#202124">복 많은 아이</text>
<rect x="410" y="85" width="350" height="190" rx="16" fill="#e8f0fe"/>
<text x="585" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1a56db">흰 돼지·금돼지</text>
<text x="585" y="180" text-anchor="middle" font-size="19" fill="#202124">빛나는 돼지</text>
<text x="585" y="210" text-anchor="middle" font-size="19" fill="#202124">넉넉한 살림 아이</text>
<rect x="40" y="295" width="350" height="190" rx="16" fill="#fff8e1"/>
<text x="215" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#b06000">여러 마리</text>
<text x="215" y="390" text-anchor="middle" font-size="19" fill="#202124">줄줄이 따라옴</text>
<text x="215" y="420" text-anchor="middle" font-size="19" fill="#202124">식구·재물 늘어남</text>
<rect x="410" y="295" width="350" height="190" rx="16" fill="#fce8e6"/>
<text x="585" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#c5221f">성별은?</text>
<text x="585" y="390" text-anchor="middle" font-size="19" fill="#202124">꿈으로 못 정함</text>
<text x="585" y="420" text-anchor="middle" font-size="19" fill="#202124">재미로만 보세요</text>
<text x="400" y="520" text-anchor="middle" font-size="16" fill="#5f6368">전통 해몽 풀이 · 오늘의 꿈 해몽</text></svg>