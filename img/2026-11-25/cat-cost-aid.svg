<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><rect width="1200" height="360" fill="#ffffff"/><text x="600" y="48" font-size="30" fill="#202124" font-weight="700" text-anchor="middle">저소득 어르신 개안수술 지원, 순서가 중요</text><rect x="40" y="85" width="360" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="220" cy="132" r="26" fill="#1a73e8"/><text x="220" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">1</text><text x="220" y="205" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">보건소에 먼저 신청</text><text x="220" y="248" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">60세 이상 수급자·차상위</text><text x="220" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">안과 진단서 들고 방문</text><rect x="420" y="85" width="360" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="600" cy="132" r="26" fill="#1a73e8"/><text x="600" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">2</text><text x="600" y="205" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">한국실명예방재단 심의</text><text x="600" y="248" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">선정되면 통보</text><text x="600" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">예산 끝나면 조기 마감</text><rect x="800" y="85" width="360" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="980" cy="132" r="26" fill="#1a73e8"/><text x="980" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">3</text><text x="980" y="205" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">선정 뒤 수술</text><text x="980" y="248" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">재단이 병원에 수술비 지급</text><text x="980" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">수술 후 신청은 안 됨</text></svg>