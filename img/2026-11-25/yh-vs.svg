<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><rect width="1200" height="360" fill="#ffffff"/><text x="600" y="48" font-size="30" fill="#202124" font-weight="700" text-anchor="middle">요양병원 vs 요양원, 이것부터 달라요</text><rect x="40" y="85" width="360" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="220" cy="132" r="26" fill="#1a73e8"/><text x="220" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">1</text><text x="220" y="205" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">요양병원</text><text x="220" y="248" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">의사·간호사 상주 의료기관</text><text x="220" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">건강보험 · 등급 없어도 입원</text><rect x="420" y="85" width="360" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="600" cy="132" r="26" fill="#1a73e8"/><text x="600" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">2</text><text x="600" y="205" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">요양원</text><text x="600" y="248" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">장기요양 시설</text><text x="600" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">등급 필요 · 본인부담 20%</text><rect x="800" y="85" width="360" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="980" cy="132" r="26" fill="#1a73e8"/><text x="980" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">3</text><text x="980" y="205" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">2027년 간병비</text><text x="980" y="248" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">중증 환자부터 시범</text><text x="980" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">간병비 100% → 30% 안팎</text></svg>