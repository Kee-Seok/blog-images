<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><rect width="1200" height="360" fill="#ffffff"/><text x="600" y="48" font-size="30" fill="#202124" font-weight="700" text-anchor="middle">백내장 수술 영수증은 세 덩어리</text><rect x="40" y="85" width="360" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="220" cy="132" r="26" fill="#1a73e8"/><text x="220" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">1</text><text x="220" y="205" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">수술·입원·기본 렌즈</text><text x="220" y="248" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">포괄수가로 묶임</text><text x="220" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">보통 진료비의 20%</text><rect x="420" y="85" width="360" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="600" cy="132" r="26" fill="#1a73e8"/><text x="600" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">2</text><text x="600" y="205" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">다초점·특수 렌즈</text><text x="600" y="248" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">건강보험 밖(비급여)</text><text x="600" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">병원이 정한 값 전액</text><rect x="800" y="85" width="360" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="980" cy="132" r="26" fill="#1a73e8"/><text x="980" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">3</text><text x="980" y="205" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">일부 검사·레이저</text><text x="980" y="248" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">비급여 항목</text><text x="980" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">병원마다 값이 다름</text></svg>