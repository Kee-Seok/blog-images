<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><rect width="1200" height="450" fill="#ffffff"/><text x="600" y="50" font-size="30" fill="#202124" font-weight="700" text-anchor="middle">내 월세면 얼마? (총급여 5,500만원 이하, 17%)</text><text x="260" y="121" font-size="21" fill="#202124" font-weight="700" text-anchor="end">월 40만원</text><rect x="285" y="90" width="244.79999999999998" height="46" rx="8" fill="#8ab4f8"/><text x="543.8" y="121" font-size="21" fill="#202124" font-weight="700" text-anchor="start">연 480만원 → 81만6천원</text><text x="260" y="191" font-size="21" fill="#202124" font-weight="700" text-anchor="end">월 50만원</text><rect x="285" y="160" width="306.0" height="46" rx="8" fill="#8ab4f8"/><text x="605.0" y="191" font-size="21" fill="#202124" font-weight="700" text-anchor="start">연 600만원 → 102만원</text><text x="260" y="261" font-size="21" fill="#202124" font-weight="700" text-anchor="end">월 70만원</text><rect x="285" y="230" width="428.40000000000003" height="46" rx="8" fill="#1a73e8"/><text x="727.4000000000001" y="261" font-size="21" fill="#202124" font-weight="700" text-anchor="start">연 840만원 → 142만8천원</text><text x="260" y="331" font-size="21" fill="#202124" font-weight="700" text-anchor="end">월 90만원</text><rect x="285" y="300" width="510.0" height="46" rx="8" fill="#c5221f"/><text x="809.0" y="331" font-size="21" fill="#202124" font-weight="700" text-anchor="start">연 1,080만원 → 170만원(한도)</text><text x="600" y="425" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">낸 세금(결정세액)보다 많이 돌려받지는 못합니다</text></svg>