<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="sans-serif">
<rect width="800" height="560" fill="#ffffff"/>
<text x="400" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">이빨 빠지는 꿈 네 갈래</text>
<rect x="40" y="85" width="350" height="190" rx="16" fill="#e8f5e9"/>
<text x="215" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1e7e34">피가 났다</text>
<text x="215" y="180" text-anchor="middle" font-size="19" fill="#202124">빠지며 피가 남</text>
<text x="215" y="210" text-anchor="middle" font-size="19" fill="#202124">근심이 빠지는 쪽</text>
<rect x="410" y="85" width="350" height="190" rx="16" fill="#e8f0fe"/>
<text x="585" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1a56db">안 아프게 쏙</text>
<text x="585" y="180" text-anchor="middle" font-size="19" fill="#202124">피·통증 없음</text>
<text x="585" y="210" text-anchor="middle" font-size="19" fill="#202124">가볍게 지나가는 쪽</text>
<rect x="40" y="295" width="350" height="190" rx="16" fill="#fff8e1"/>
<text x="215" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#b06000">썩은 이가 빠짐</text>
<text x="215" y="390" text-anchor="middle" font-size="19" fill="#202124">골치 아픈 이가 감</text>
<text x="215" y="420" text-anchor="middle" font-size="19" fill="#202124">골칫거리가 풀리는 쪽</text>
<rect x="410" y="295" width="350" height="190" rx="16" fill="#fce8e6"/>
<text x="585" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#c5221f">멀쩡한 이가 빠짐</text>
<text x="585" y="390" text-anchor="middle" font-size="19" fill="#202124">튼튼한 이를 잃음</text>
<text x="585" y="420" text-anchor="middle" font-size="19" fill="#202124">가까운 이를 챙길 때</text>
<text x="400" y="520" text-anchor="middle" font-size="16" fill="#5f6368">전통 해몽 풀이 · 오늘의 꿈 해몽</text></svg>