<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><rect width="1200" height="360" fill="#ffffff"/><text x="600" y="48" font-size="30" fill="#202124" font-weight="700" text-anchor="middle">월세 세액공제 조건 4가지</text><rect x="40" y="85" width="265" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="172" cy="132" r="26" fill="#1a73e8"/><text x="172" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">1</text><text x="172" y="205" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">무주택 세대주</text><text x="172" y="248" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">12월 31일 기준</text><text x="172" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">세대원도 받는 경우 있음</text><rect x="325" y="85" width="265" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="457" cy="132" r="26" fill="#1a73e8"/><text x="457" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">2</text><text x="457" y="205" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">총급여 8천만원 이하</text><text x="457" y="248" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">종합소득 7천만원 이하</text><text x="457" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">공제받는 본인 소득 기준</text><rect x="610" y="85" width="265" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="742" cy="132" r="26" fill="#1a73e8"/><text x="742" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">3</text><text x="742" y="205" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">85㎡ 이하·4억 이하</text><text x="742" y="248" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">기준시가 기준</text><text x="742" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">오피스텔·고시원 포함</text><rect x="895" y="85" width="265" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="1027" cy="132" r="26" fill="#1a73e8"/><text x="1027" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">4</text><text x="1027" y="205" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">주소 = 계약서 주소</text><text x="1027" y="248" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">전입신고 필수</text><text x="1027" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">확정일자는 없어도 됨</text></svg>