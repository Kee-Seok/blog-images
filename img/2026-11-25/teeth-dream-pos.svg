<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="sans-serif">
<rect width="800" height="560" fill="#ffffff"/>
<text x="400" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">어느 이가 빠졌나</text>
<rect x="40" y="85" width="350" height="190" rx="16" fill="#e8f5e9"/>
<text x="215" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1e7e34">윗니</text>
<text x="215" y="180" text-anchor="middle" font-size="19" fill="#202124">위쪽 이</text>
<text x="215" y="210" text-anchor="middle" font-size="19" fill="#202124">윗사람·어른 쪽</text>
<rect x="410" y="85" width="350" height="190" rx="16" fill="#e8f0fe"/>
<text x="585" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1a56db">아랫니</text>
<text x="585" y="180" text-anchor="middle" font-size="19" fill="#202124">아래쪽 이</text>
<text x="585" y="210" text-anchor="middle" font-size="19" fill="#202124">아랫사람·자녀 쪽</text>
<rect x="40" y="295" width="350" height="190" rx="16" fill="#fff8e1"/>
<text x="215" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#b06000">앞니</text>
<text x="215" y="390" text-anchor="middle" font-size="19" fill="#202124">웃을 때 보이는 이</text>
<text x="215" y="420" text-anchor="middle" font-size="19" fill="#202124">가까운 식구 쪽</text>
<rect x="410" y="295" width="350" height="190" rx="16" fill="#fce8e6"/>
<text x="585" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#c5221f">어금니</text>
<text x="585" y="390" text-anchor="middle" font-size="19" fill="#202124">안쪽 큰 이</text>
<text x="585" y="420" text-anchor="middle" font-size="19" fill="#202124">의지하는 사람 쪽</text>
<text x="400" y="520" text-anchor="middle" font-size="16" fill="#5f6368">전통 해몽 풀이 · 오늘의 꿈 해몽</text></svg>