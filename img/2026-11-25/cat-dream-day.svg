<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="sans-serif">
<rect width="800" height="560" fill="#ffffff"/>
<text x="400" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">고양이 꿈 꾼 날 해 볼 일</text>
<rect x="40" y="85" width="350" height="190" rx="16" fill="#e8f5e9"/>
<text x="215" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1e7e34">떠오른 사람</text>
<text x="215" y="180" text-anchor="middle" font-size="19" fill="#202124">꿈속 고양이 닮은 이</text>
<text x="215" y="210" text-anchor="middle" font-size="19" fill="#202124">연락 한 번</text>
<rect x="410" y="85" width="350" height="190" rx="16" fill="#e8f0fe"/>
<text x="585" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1a56db">말 아끼기</text>
<text x="585" y="180" text-anchor="middle" font-size="19" fill="#202124">물린 꿈이었다면</text>
<text x="585" y="210" text-anchor="middle" font-size="19" fill="#202124">오늘은 한 박자 쉬고</text>
<rect x="40" y="295" width="350" height="190" rx="16" fill="#fff8e1"/>
<text x="215" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#b06000">집 정리</text>
<text x="215" y="390" text-anchor="middle" font-size="19" fill="#202124">오줌·똥 꿈이었다면</text>
<text x="215" y="420" text-anchor="middle" font-size="19" fill="#202124">미룬 청소 한 곳</text>
<rect x="410" y="295" width="350" height="190" rx="16" fill="#fce8e6"/>
<text x="585" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#c5221f">반가운 꿈</text>
<text x="585" y="390" text-anchor="middle" font-size="19" fill="#202124">안긴 꿈이었다면</text>
<text x="585" y="420" text-anchor="middle" font-size="19" fill="#202124">약속 하나 잡기</text>
<text x="400" y="520" text-anchor="middle" font-size="16" fill="#5f6368">전통 해몽 풀이 · 오늘의 꿈 해몽</text></svg>