<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><rect width="1200" height="360" fill="#ffffff"/><text x="600" y="48" font-size="30" fill="#202124" font-weight="700" text-anchor="middle">2027년부터 바뀌는 정부안(국회 심의)</text><rect x="40" y="85" width="360" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="220" cy="132" r="26" fill="#1a73e8"/><text x="220" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">1</text><text x="220" y="205" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">한도</text><text x="220" y="248" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">연 1,000만원</text><text x="220" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">→ 연 1,200만원</text><rect x="420" y="85" width="360" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="600" cy="132" r="26" fill="#1a73e8"/><text x="600" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">2</text><text x="600" y="205" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">청년 15~34세</text><text x="600" y="248" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">총급여 8천만원 이하면</text><text x="600" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">구간 없이 17%</text><rect x="800" y="85" width="360" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="980" cy="132" r="26" fill="#1a73e8"/><text x="980" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">3</text><text x="980" y="205" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">적용</text><text x="980" y="248" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">2027년 낸 월세부터</text><text x="980" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">2028년 1월 연말정산</text></svg>