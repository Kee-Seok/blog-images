<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="sans-serif">
<rect width="960" height="540" fill="#ffffff"/>
<text x="40" y="58" font-size="29" font-weight="700" fill="#202124">사망진단서 발급 서류, 쓰이는 곳마다 한 통씩</text>
<text x="40" y="94" font-size="18" fill="#5f6368">병원을 떠나기 전부터 한 달 안에 거치는 순서</text>
<g font-size="21" fill="#202124">
<rect x="40" y="130" width="270" height="170" rx="14" fill="#e8f0fe"/>
<text x="62" y="172" font-weight="700">① 원무과</text><text x="62" y="210" font-size="18" fill="#5f6368">쓸 곳 세어 통수 정하기</text><text x="62" y="240" font-size="18" fill="#5f6368">둘째 통부터 값 묻기</text>
<rect x="345" y="130" width="270" height="170" rx="14" fill="#e8f0fe"/>
<text x="367" y="172" font-weight="700">② 사망신고</text><text x="367" y="210" font-size="18" fill="#5f6368">안 날부터 1개월 안</text><text x="367" y="240" font-size="18" fill="#5f6368">진단서·검안서 첨부</text>
<rect x="650" y="130" width="270" height="170" rx="14" fill="#e8f0fe"/>
<text x="672" y="172" font-weight="700">③ 보험·상속</text><text x="672" y="210" font-size="18" fill="#5f6368">사망보험금 청구</text><text x="672" y="240" font-size="18" fill="#5f6368">보험사마다 원본·사본 확인</text>
</g>
<rect x="40" y="335" width="880" height="140" rx="14" fill="#fef7e0"/>
<text x="64" y="378" font-size="20" fill="#202124">사망신고를 늦게 하면 5만원 이하 과태료(가족관계등록법 제122조)</text>
<text x="64" y="414" font-size="20" fill="#202124">안심상속은 사망신고 때 같이 신청 가능, 기한은 사망한 달 말일부터 1년</text>
<text x="64" y="450" font-size="20" fill="#202124">보험사가 원본을 달라고 하는지 먼저 물으면 헛걸음이 줄어요</text>
<text x="920" y="522" font-size="16" fill="#5f6368" text-anchor="end">출처: 국가법령정보센터·정부24(2026-10-29 확인)</text>
</svg>
