<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="sans-serif">
<rect width="1200" height="640" fill="#ffffff"/>
<text x="600" y="70" text-anchor="middle" font-size="40" font-weight="700" fill="#202124">보험사 두 곳에 낼 때 진단서값</text>
<text x="600" y="115" text-anchor="middle" font-size="24" fill="#5f6368">보험금이 회사마다 100만원 이하면 사본 청구 가능 (금융감독원)</text>
<g font-size="28">
<text x="80" y="215" font-weight="700" fill="#202124">원본 2장</text>
<rect x="80" y="235" width="1000" height="80" rx="10" fill="#f28b82"/><text x="110" y="287" fill="#202124" font-weight="700">20,000원 + 20,000원 = 최대 40,000원</text>
<text x="80" y="395" font-weight="700" fill="#202124">원본 1장 + 같은 날 사본 1장</text>
<rect x="80" y="415" width="500" height="80" rx="10" fill="#81c995"/><rect x="580" y="415" width="25" height="80" fill="#34a853"/>
<text x="640" y="467" fill="#202124" font-weight="700">20,000원 + 1,000원 = 최대 21,000원</text>
</g>
<text x="600" y="590" text-anchor="middle" font-size="22" fill="#80868b">상한금액 기준 · 보건복지부 고시 제2021-34호 (같은 서류 여러 통이면 둘째 통부터 사본 1,000원)</text>
</svg>
