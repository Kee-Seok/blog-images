<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
<rect width="960" height="560" fill="#ffffff"/>
<text x="480" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#202124">로그인은 브라우저마다 따로 남습니다</text>
<g>
<rect x="40" y="100" width="280" height="380" rx="18" fill="#eef4ff" stroke="#1a73e8" stroke-width="3"/>
<text x="180" y="150" text-anchor="middle" font-size="26" font-weight="700" fill="#1a73e8">앱 안 브라우저</text>
<text x="180" y="196" text-anchor="middle" font-size="20" fill="#202124">클로드 데스크톱 앱 속 창</text>
<text x="180" y="262" text-anchor="middle" font-size="21" fill="#202124">티스토리 카카오 로그인</text>
<text x="180" y="294" text-anchor="middle" font-size="21" fill="#202124">여기에 남아 있음</text>
<text x="180" y="360" text-anchor="middle" font-size="19" fill="#5f6368">예약 작업 13개가 사용</text>
<text x="180" y="440" text-anchor="middle" font-size="22" font-weight="700" fill="#188038">평소 발행</text>
</g>
<g>
<rect x="340" y="100" width="280" height="380" rx="18" fill="#fff8e1" stroke="#f9ab00" stroke-width="3"/>
<text x="480" y="150" text-anchor="middle" font-size="26" font-weight="700" fill="#b06000">크롬 + 확장</text>
<text x="480" y="196" text-anchor="middle" font-size="20" fill="#202124">claude --chrome</text>
<text x="480" y="262" text-anchor="middle" font-size="21" fill="#202124">내 크롬 로그인을 같이 씀</text>
<text x="480" y="294" text-anchor="middle" font-size="21" fill="#202124">카카오는 비밀번호 화면만</text>
<text x="480" y="360" text-anchor="middle" font-size="19" fill="#5f6368">10월 12일 확인</text>
<text x="480" y="440" text-anchor="middle" font-size="22" font-weight="700" fill="#b06000">발행엔 안 씀</text>
</g>
<g>
<rect x="640" y="100" width="280" height="380" rx="18" fill="#fce8e6" stroke="#d93025" stroke-width="3"/>
<text x="780" y="150" text-anchor="middle" font-size="26" font-weight="700" fill="#d93025">비상 프로필</text>
<text x="780" y="196" text-anchor="middle" font-size="20" fill="#202124">창 없이 도는 별도 크롬</text>
<text x="780" y="262" text-anchor="middle" font-size="21" fill="#202124">미리 한 번 로그인해 둠</text>
<text x="780" y="294" text-anchor="middle" font-size="21" fill="#202124">비밀번호는 안 넣음</text>
<text x="780" y="360" text-anchor="middle" font-size="19" fill="#5f6368">10월 29일 시험 발행 통과</text>
<text x="780" y="440" text-anchor="middle" font-size="22" font-weight="700" fill="#d93025">앱 쪽 풀릴 때만</text>
</g>
<text x="480" y="530" text-anchor="middle" font-size="19" fill="#5f6368">셋 다 풀리면 멈추고 텔레그램으로 알린다</text>
</svg>
