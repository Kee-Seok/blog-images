<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="sans-serif">
<rect width="900" height="380" fill="#ffffff"/>
<text x="450" y="44" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">결혼식 분위기로 보는 갈림길</text>
<g font-size="19" fill="#202124" text-anchor="middle">
<rect x="30" y="76" width="260" height="240" rx="14" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
<text x="160" y="118" font-weight="700" font-size="22">밝고 축하받음</text>
<text x="160" y="164">일이 순조롭게</text>
<text x="160" y="194">맺어지는 쪽</text>
<rect x="320" y="76" width="260" height="240" rx="14" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/>
<text x="450" y="118" font-weight="700" font-size="22">하기 싫은 결혼</text>
<text x="450" y="164">떠밀려 맡은 일이</text>
<text x="450" y="194">부담스러운 때</text>
<rect x="610" y="76" width="260" height="240" rx="14" fill="#fdecea" stroke="#ea4335" stroke-width="2"/>
<text x="740" y="118" font-weight="700" font-size="22">식이 엉망·중단</text>
<text x="740" y="164">계획이 틀어질 수</text>
<text x="740" y="194">있으니 다시 점검</text>
</g>
<text x="450" y="356" text-anchor="middle" font-size="15" fill="#5f6368">전통 해몽에서 흔히 보는 풀이 · 오늘의 꿈 해몽</text>
</svg>
