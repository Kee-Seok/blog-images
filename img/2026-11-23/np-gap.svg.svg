<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><rect width="1200" height="350" fill="#ffffff"/><text x="600" y="48" font-size="30" fill="#202124" font-weight="700" text-anchor="middle">1969년생 이후, 정년 60세와 연금 65세 사이</text><rect x="80" y="120" width="1040" height="14" rx="7" fill="#dadce0"/><rect x="230" y="120" width="740" height="14" fill="#fbc400"/><circle cx="230" cy="127" r="16" fill="#1a73e8"/><text x="230" y="95" font-size="26" fill="#202124" font-weight="800" text-anchor="middle">60세</text><text x="230" y="175" font-size="19" fill="#3c4043" font-weight="400" text-anchor="middle">정년 퇴직</text><circle cx="970" cy="127" r="16" fill="#1a73e8"/><text x="970" y="95" font-size="26" fill="#202124" font-weight="800" text-anchor="middle">65세</text><text x="970" y="175" font-size="19" fill="#3c4043" font-weight="400" text-anchor="middle">국민연금·기초연금</text><text x="600" y="105" font-size="24" fill="#b06000" font-weight="800" text-anchor="middle">소득 공백 5년</text><rect x="70" y="215" width="340" height="110" rx="12" fill="#f3f8ff" stroke="#8ab4f8"/><text x="240" y="258" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">조기수령</text><text x="240" y="295" font-size="18" fill="#3c4043" font-weight="400" text-anchor="middle">60세부터, 대신 30% 감액</text><rect x="430" y="215" width="340" height="110" rx="12" fill="#f3f8ff" stroke="#8ab4f8"/><text x="600" y="258" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">임의계속가입</text><text x="600" y="295" font-size="18" fill="#3c4043" font-weight="400" text-anchor="middle">10년 채우고 금액 늘리기</text><rect x="790" y="215" width="340" height="110" rx="12" fill="#f3f8ff" stroke="#8ab4f8"/><text x="960" y="258" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">계속 일하기</text><text x="960" y="295" font-size="18" fill="#3c4043" font-weight="400" text-anchor="middle">519만원 미만이면 감액 없음</text></svg>