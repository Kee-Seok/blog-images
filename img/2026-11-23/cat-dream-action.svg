<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="sans-serif">
<rect width="800" height="560" fill="#ffffff"/>
<text x="400" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">고양이를 어떻게 했나</text>
<rect x="40" y="85" width="350" height="190" rx="16" fill="#e8f5e9"/>
<text x="215" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1e7e34">안고 쓰다듬음</text>
<text x="215" y="180" text-anchor="middle" font-size="19" fill="#202124">품에 얌전히</text>
<text x="215" y="210" text-anchor="middle" font-size="19" fill="#202124">사랑받을 일</text>
<rect x="410" y="85" width="350" height="190" rx="16" fill="#e8f0fe"/>
<text x="585" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1a56db">밥을 줌</text>
<text x="585" y="180" text-anchor="middle" font-size="19" fill="#202124">먹이를 챙김</text>
<text x="585" y="210" text-anchor="middle" font-size="19" fill="#202124">베푼 만큼 돌아옴</text>
<rect x="40" y="295" width="350" height="190" rx="16" fill="#fff8e1"/>
<text x="215" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#b06000">쫓아냄</text>
<text x="215" y="390" text-anchor="middle" font-size="19" fill="#202124">문밖으로 내보냄</text>
<text x="215" y="420" text-anchor="middle" font-size="19" fill="#202124">거슬리던 일 정리</text>
<rect x="410" y="295" width="350" height="190" rx="16" fill="#fce8e6"/>
<text x="585" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#c5221f">죽은 고양이를 봄</text>
<text x="585" y="390" text-anchor="middle" font-size="19" fill="#202124">이미 죽어 있음</text>
<text x="585" y="420" text-anchor="middle" font-size="19" fill="#202124">걱정이 끝나는 쪽</text>
<text x="400" y="520" text-anchor="middle" font-size="16" fill="#5f6368">전통 해몽 풀이 · 오늘의 꿈 해몽</text></svg>