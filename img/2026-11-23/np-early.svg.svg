<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><rect width="1200" height="520" fill="#ffffff"/><text x="600" y="50" font-size="30" fill="#202124" font-weight="700" text-anchor="middle">정상 100만원인 사람, 언제 받느냐에 따라</text><rect x="150" y="236.0" width="240" height="154.0" rx="10" fill="#f28b82"/><text x="270" y="226.0" font-size="30" fill="#202124" font-weight="800" text-anchor="middle">월 70만원</text><text x="270" y="425" font-size="24" fill="#202124" font-weight="700" text-anchor="middle">5년 당김</text><text x="270" y="458" font-size="18" fill="#3c4043" font-weight="400" text-anchor="middle">1년에 6%씩 깎임</text><rect x="480" y="169.99999999999997" width="240" height="220.00000000000003" rx="10" fill="#8ab4f8"/><text x="600" y="159.99999999999997" font-size="30" fill="#202124" font-weight="800" text-anchor="middle">월 100만원</text><text x="600" y="425" font-size="24" fill="#202124" font-weight="700" text-anchor="middle">정상 나이</text><text x="600" y="458" font-size="18" fill="#3c4043" font-weight="400" text-anchor="middle">가입기간대로</text><rect x="810" y="90.79999999999995" width="240" height="299.20000000000005" rx="10" fill="#81c995"/><text x="930" y="80.79999999999995" font-size="30" fill="#202124" font-weight="800" text-anchor="middle">월 136만원</text><text x="930" y="425" font-size="24" fill="#202124" font-weight="700" text-anchor="middle">5년 미룸</text><text x="930" y="458" font-size="18" fill="#3c4043" font-weight="400" text-anchor="middle">1년에 7.2%씩 늘어남</text><text x="600" y="500" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">깎이거나 늘어난 비율은 평생 그대로 · 국민연금공단 안내 기준</text></svg>