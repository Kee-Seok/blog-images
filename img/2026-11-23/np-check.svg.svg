<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><rect width="1200" height="360" fill="#ffffff"/><text x="600" y="48" font-size="30" fill="#202124" font-weight="700" text-anchor="middle">국민연금 받기 전, 이 네 가지만 확인</text><rect x="40" y="85" width="260" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="170" cy="132" r="26" fill="#1a73e8"/><text x="170" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">1</text><text x="170" y="205" font-size="23" fill="#202124" font-weight="700" text-anchor="middle">가입 10년</text><text x="170" y="248" font-size="18" fill="#3c4043" font-weight="400" text-anchor="middle">120개월 이상</text><text x="170" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">모자라면 임의계속가입</text><rect x="325" y="85" width="260" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="455" cy="132" r="26" fill="#1a73e8"/><text x="455" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">2</text><text x="455" y="205" font-size="23" fill="#202124" font-weight="700" text-anchor="middle">내 수령나이</text><text x="455" y="248" font-size="18" fill="#3c4043" font-weight="400" text-anchor="middle">출생연도 표 확인</text><text x="455" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">조기는 5년 전부터</text><rect x="610" y="85" width="260" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="740" cy="132" r="26" fill="#1a73e8"/><text x="740" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">3</text><text x="740" y="205" font-size="23" fill="#202124" font-weight="700" text-anchor="middle">일하는 소득</text><text x="740" y="248" font-size="18" fill="#3c4043" font-weight="400" text-anchor="middle">월 519만원 미만</text><text x="740" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">이면 안 깎임(26.6~)</text><rect x="895" y="85" width="260" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="1025" cy="132" r="26" fill="#1a73e8"/><text x="1025" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">4</text><text x="1025" y="205" font-size="23" fill="#202124" font-weight="700" text-anchor="middle">부부는 각각</text><text x="1025" y="248" font-size="18" fill="#3c4043" font-weight="400" text-anchor="middle">남편·아내 따로</text><text x="1025" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">나이도 각자 계산</text></svg>