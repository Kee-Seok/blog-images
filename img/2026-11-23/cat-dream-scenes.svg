<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="sans-serif">
<rect width="800" height="560" fill="#ffffff"/>
<text x="400" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">고양이 꿈 장면 네 묶음</text>
<rect x="40" y="85" width="350" height="190" rx="16" fill="#e8f5e9"/>
<text x="215" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1e7e34">나에게 왔다</text>
<text x="215" y="180" text-anchor="middle" font-size="19" fill="#202124">안김·따라옴·집에 들어옴</text>
<text x="215" y="210" text-anchor="middle" font-size="19" fill="#202124">사람·재물이 붙는 쪽</text>
<rect x="410" y="85" width="350" height="190" rx="16" fill="#e8f0fe"/>
<text x="585" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1a56db">나를 공격했다</text>
<text x="585" y="180" text-anchor="middle" font-size="19" fill="#202124">물림·할큄·쫓아옴</text>
<text x="585" y="210" text-anchor="middle" font-size="19" fill="#202124">가까운 사이를 살피는 쪽</text>
<rect x="40" y="295" width="350" height="190" rx="16" fill="#fff8e1"/>
<text x="215" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#b06000">떠나갔다</text>
<text x="215" y="390" text-anchor="middle" font-size="19" fill="#202124">도망감·사라짐·찾아다님</text>
<text x="215" y="420" text-anchor="middle" font-size="19" fill="#202124">놓칠 일을 챙기는 쪽</text>
<rect x="410" y="295" width="350" height="190" rx="16" fill="#fce8e6"/>
<text x="585" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#c5221f">새끼·여럿</text>
<text x="585" y="390" text-anchor="middle" font-size="19" fill="#202124">새끼·새끼 낳음·떼</text>
<text x="585" y="420" text-anchor="middle" font-size="19" fill="#202124">작은 기쁨이 느는 쪽</text>
<text x="400" y="520" text-anchor="middle" font-size="16" fill="#5f6368">전통 해몽 풀이 · 오늘의 꿈 해몽</text></svg>