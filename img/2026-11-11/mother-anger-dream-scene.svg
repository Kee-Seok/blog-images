<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="1000" height="560" fill="#fffaf3"/>
<text x="40" y="60" font-size="30" font-weight="700" fill="#202124">화를 낸 뒤, 엄마는 어떻게 하셨나요</text>
<text x="40" y="96" font-size="18" fill="#5f6368">전통 해몽에서 흔히 보는 풀이 · 단정이 아닌 해석</text>
<g font-size="21" fill="#202124">
<rect x="40" y="125" width="920" height="90" rx="14" fill="#e6f4ea"/>
<text x="66" y="162" font-size="23" font-weight="700">가만히 들어 주셨다</text>
<text x="66" y="198">쌓인 응어리가 풀리는 꿈 · 가장 반가운 쪽</text>
<rect x="40" y="230" width="920" height="90" rx="14" fill="#e8f0fe"/>
<text x="66" y="267" font-size="23" font-weight="700">안아 주시거나 웃으셨다</text>
<text x="66" y="303">서운함을 받아 주신 꿈 · 마음이 한결 가벼워짐</text>
<rect x="40" y="335" width="920" height="90" rx="14" fill="#fef7e0"/>
<text x="66" y="372" font-size="23" font-weight="700">같이 언성을 높이셨다</text>
<text x="66" y="408">집안 결정·가족 사이 말이 엇갈릴 때 · 대화가 먼저</text>
<rect x="40" y="440" width="920" height="90" rx="14" fill="#fce8e6"/>
<text x="66" y="477" font-size="23" font-weight="700">말없이 등을 돌리셨다</text>
<text x="66" y="513">못다 한 말이 남은 꿈 · 기일·추모로 마음 정리</text>
</g></svg>
