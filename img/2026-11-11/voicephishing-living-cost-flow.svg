<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="800" height="420" fill="#ffffff"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">보이스피싱 피해 생계비, 두 번에 나눠 받아요</text>
<rect x="40" y="90" width="220" height="150" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="150" y="130" text-anchor="middle" font-size="20" font-weight="700" fill="#1a73e8">1차 긴급 생계비</text>
<text x="150" y="175" text-anchor="middle" font-size="30" font-weight="800" fill="#202124">최대 100만원</text>
<text x="150" y="212" text-anchor="middle" font-size="16" fill="#5f6368">선정되면 먼저 지급</text>
<path d="M268 165 L322 165" stroke="#5f6368" stroke-width="3" marker-end="url(#a)"/>
<rect x="330" y="90" width="160" height="150" rx="14" fill="#fff8e1" stroke="#fbc400" stroke-width="2"/>
<text x="410" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#202124">심리상담</text>
<text x="410" y="182" text-anchor="middle" font-size="30" font-weight="800" fill="#202124">6회</text>
<text x="410" y="215" text-anchor="middle" font-size="16" fill="#5f6368">전국 연계기관</text>
<path d="M498 165 L552 165" stroke="#5f6368" stroke-width="3" marker-end="url(#a)"/>
<rect x="560" y="90" width="200" height="150" rx="14" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
<text x="660" y="130" text-anchor="middle" font-size="20" font-weight="700" fill="#188038">추가 생계비</text>
<text x="660" y="175" text-anchor="middle" font-size="30" font-weight="800" fill="#202124">최대 100만원</text>
<text x="660" y="212" text-anchor="middle" font-size="16" fill="#5f6368">6회 마치면 지급</text>
<rect x="40" y="275" width="720" height="110" rx="12" fill="#f8f9fa" stroke="#dadce0"/>
<text x="400" y="315" text-anchor="middle" font-size="19" fill="#202124">생계비 합계는 1인당 최대 200만원, 내 피해금액을 넘지 않아요</text>
<text x="400" y="355" text-anchor="middle" font-size="19" fill="#202124">상담·트라우마 치료비는 생계비와 따로 최대 200만원</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs>
</svg>
