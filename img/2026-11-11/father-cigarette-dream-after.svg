<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="1000" height="470" fill="#fbfbf8"/>
<text x="40" y="60" font-size="30" font-weight="700" fill="#202124">받은 담배를 내가 어떻게 했나</text>
<g font-size="22" fill="#202124">
<rect x="40" y="95" width="920" height="72" rx="12" fill="#e6f4ea"/><text x="66" y="140" font-weight="700">함께 피웠다</text><text x="330" y="140">속을 터놓는 사이, 걱정이 덜어짐</text>
<rect x="40" y="182" width="920" height="72" rx="12" fill="#e8f0fe"/><text x="66" y="227" font-weight="700">주머니에 넣어 뒀다</text><text x="330" y="227">받은 도움을 나중에 쓰게 됨</text>
<rect x="40" y="269" width="920" height="72" rx="12" fill="#fef7e0"/><text x="66" y="314" font-weight="700">연기가 위로 곧게</text><text x="330" y="314">바라던 일이 순하게 이어짐</text>
<rect x="40" y="356" width="920" height="72" rx="12" fill="#fce8e6"/><text x="66" y="401" font-weight="700">손사래 치며 거절</text><text x="330" y="401">들어온 기회를 스스로 미루는지 살핌</text>
</g></svg>
