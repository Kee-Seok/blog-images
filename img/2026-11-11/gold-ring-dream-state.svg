<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Pretendard,Apple SD Gothic Neo,sans-serif"><rect width="1200" height="700" rx="28" fill="#ffffff"/><text x="600" y="70" font-size="40" font-weight="700" fill="#202124" text-anchor="middle">반지 상태에 따라 달라지는 풀이</text>
<rect x="50" y="120" width="1100" height="110" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="120" width="14" height="110" rx="7" fill="#1e8e3e"/><text x="85" y="187" font-size="32" font-weight="700" fill="#202124">번쩍이고 묵직함</text><text x="470" y="187" font-size="29" fill="#202124">실속 있는 재물·좋은 소식</text>
<rect x="50" y="250" width="1100" height="110" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="250" width="14" height="110" rx="7" fill="#1a73e8"/><text x="85" y="317" font-size="32" font-weight="700" fill="#202124">보석 박힌 금반지</text><text x="470" y="317" font-size="29" fill="#202124">명예·인정받는 일과 연결</text>
<rect x="50" y="380" width="1100" height="110" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="380" width="14" height="110" rx="7" fill="#f29900"/><text x="85" y="447" font-size="32" font-weight="700" fill="#202124">손가락에 꽉 낌</text><text x="470" y="447" font-size="29" fill="#202124">부담스러운 약속·책임</text>
<rect x="50" y="510" width="1100" height="110" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="510" width="14" height="110" rx="7" fill="#d93025"/><text x="85" y="577" font-size="32" font-weight="700" fill="#202124">깨지거나 녹슮</text><text x="470" y="577" font-size="29" fill="#202124">기대한 일이 늦어질 수 있음</text>
<text x="600" y="668" font-size="22" fill="#5f6368" text-anchor="middle">전통 해몽에서 흔히 보는 풀이 · 오늘의 꿈 해몽</text></svg>
