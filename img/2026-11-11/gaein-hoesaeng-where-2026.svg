<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="1000" height="600" fill="#ffffff"/>
<text x="40" y="58" font-size="30" font-weight="700" fill="#202124">개인회생 서류, 어디서 떼나요</text>
<text x="40" y="94" font-size="18" fill="#5f6368">많이 요구되는 서류와 인터넷 발급처 · 최종 목록은 관할 법원 안내 기준</text>
<g font-size="21" fill="#202124">
<rect x="40" y="120" width="920" height="62" rx="10" fill="#e8f0fe"/><text x="64" y="160" font-weight="700">주민등록등본·초본</text><text x="520" y="160">정부24</text>
<rect x="40" y="194" width="920" height="62" rx="10" fill="#f8f9fa"/><text x="64" y="234" font-weight="700">가족관계·혼인관계증명서(상세)</text><text x="520" y="234">전자가족관계등록시스템</text>
<rect x="40" y="268" width="920" height="62" rx="10" fill="#e8f0fe"/><text x="64" y="308" font-weight="700">소득금액증명·원천징수영수증</text><text x="520" y="308">홈택스</text>
<rect x="40" y="342" width="920" height="62" rx="10" fill="#f8f9fa"/><text x="64" y="382" font-weight="700">건강보험 자격득실확인서</text><text x="520" y="382">국민건강보험공단</text>
<rect x="40" y="416" width="920" height="62" rx="10" fill="#e8f0fe"/><text x="64" y="456" font-weight="700">내 계좌 목록</text><text x="520" y="456">어카운트인포(금융결제원)</text>
<rect x="40" y="490" width="920" height="62" rx="10" fill="#f8f9fa"/><text x="64" y="530" font-weight="700">부채증명서</text><text x="520" y="530">돈 빌린 금융회사마다 따로</text>
</g>
<text x="40" y="584" font-size="15" fill="#80868b">각 기관 발급 화면 기준 정리(2026년 11월 11일)</text>
</svg>
