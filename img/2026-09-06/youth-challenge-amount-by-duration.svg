<text x="770" y="150" font-size="15" font-weight="700" fill="#e8710a">+ 인센티브 100만원</text>
<text x="770" y="176" font-size="20" font-weight="800" fill="#e8710a">= 350만원</text>
<text x="30" y="382" font-size="14" fill="#80868b">홍보 문구의 '최대 350만원'은 장기 25주를 다 채우고 취업까지 했을 때의 금액이다</text>
