<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="sans-serif">
<rect width="800" height="400" fill="#ffffff"/>
<text x="400" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#202124">우대율은 환율이 아니라 '수수료'를 깎아줘요</text>
<g font-size="17" fill="#202124" text-anchor="middle">
<rect x="60" y="100" width="200" height="90" rx="10" fill="#f1f3f4" stroke="#dadce0"/>
<text x="160" y="138" font-weight="700">매매기준율</text><text x="160" y="166">863.90원</text>
<text x="300" y="152" font-size="30">+</text>
<rect x="340" y="100" width="200" height="90" rx="10" fill="#fce8e6" stroke="#f4c7c3"/>
<text x="440" y="138" font-weight="700">환전수수료</text><text x="440" y="166">15.11원 (1.75%)</text>
<text x="580" y="152" font-size="30">=</text>
<rect x="610" y="100" width="150" height="90" rx="10" fill="#f1f3f4" stroke="#dadce0"/>
<text x="685" y="138" font-weight="700">현찰 살 때</text><text x="685" y="166">879.01원</text>
<path d="M440 200 L440 250" stroke="#1a73e8" stroke-width="3"/>
<rect x="240" y="255" width="400" height="90" rx="10" fill="#e8f0fe" stroke="#aecbfa"/>
<text x="440" y="292" font-weight="700">우대 80% → 수수료 15.11원 중 12.09원을 빼줌</text>
<text x="440" y="322">적용 환율 약 866.92원 (100엔당)</text>
</g>
<text x="400" y="380" text-anchor="middle" font-size="14" fill="#5f6368">자료: 은행연합회 외환길잡이 계산식 · 하나은행 2026.9.29 고시 환율</text>
