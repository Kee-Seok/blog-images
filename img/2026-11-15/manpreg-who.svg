<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="sans-serif">
<rect width="800" height="420" fill="#ffffff"/>
<text x="400" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">꿈속에서 임신한 남자는 누구였나요</text>
<rect x="40" y="80" width="720" height="70" rx="14" fill="#e8f0fe"/>
<text x="70" y="124" font-size="21" font-weight="700" fill="#1a56db">나 자신</text><text x="250" y="124" font-size="20" fill="#202124">내가 품은 계획·일이 커지는 쪽</text>
<rect x="40" y="166" width="720" height="70" rx="14" fill="#e8f5e9"/>
<text x="70" y="210" font-size="21" font-weight="700" fill="#1e7e34">남편·남자친구</text><text x="250" y="210" font-size="20" fill="#202124">그 사람 일이나 집안에 새 일이 생기는 쪽</text>
<rect x="40" y="252" width="720" height="70" rx="14" fill="#fff8e1"/>
<text x="70" y="296" font-size="21" font-weight="700" fill="#b06000">아빠·아들·친구</text><text x="250" y="296" font-size="20" fill="#202124">그 사람 소식이 내게 전해지는 쪽</text>
<text x="400" y="378" text-anchor="middle" font-size="17" fill="#5f6368">임신한 사람 = 일이 생기는 사람으로 읽는 풀이가 많아요</text>
</svg>
