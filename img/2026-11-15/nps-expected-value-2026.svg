<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
<rect width="800" height="420" fill="#ffffff"/>
<text x="400" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#202124">같은 연금, 두 가지 숫자</text>
<text x="400" y="76" text-anchor="middle" font-size="17" fill="#5f6368">1995년생 · 월급 300만원 · 65세부터 받는 경우(개혁 전 가정)</text>
<rect x="140" y="110" width="520" height="70" rx="10" fill="#fce8e6"/>
<rect x="140" y="110" width="520" height="70" rx="10" fill="none" stroke="#c5221f" stroke-width="2"/>
<text x="160" y="153" font-size="20" font-weight="700" fill="#c5221f">미래가치 · 받을 때 돈으로</text>
<text x="640" y="153" text-anchor="end" font-size="26" font-weight="700" fill="#c5221f">월 304만원</text>
<rect x="140" y="210" width="520" height="70" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
<text x="160" y="253" font-size="20" font-weight="700" fill="#188038">현재가치 · 지금 돈으로 쳐서</text>
<text x="640" y="253" text-anchor="end" font-size="26" font-weight="700" fill="#188038">월 80만2천원</text>
<text x="400" y="330" text-anchor="middle" font-size="19" fill="#202124">노후 생활비 계획은 아래 초록 숫자로 세우는 게 안전해요</text>
<text x="400" y="380" text-anchor="middle" font-size="15" fill="#5f6368">출처: SBS Biz 2025년 보도(보건복지부 계산, 임금상승률 3.77% 가정)</text>
</svg>
