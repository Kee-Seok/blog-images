<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="800" height="420" fill="#ffffff"/>
<text x="400" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">상속 취득세 신고 기한 세는 법 (예시)</text>
<line x1="80" y1="160" x2="720" y2="160" stroke="#bdc1c6" stroke-width="6"/>
<circle cx="110" cy="160" r="16" fill="#5f6368"/><text x="110" y="118" text-anchor="middle" font-size="19" fill="#202124">돌아가신 날</text><text x="110" y="208" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">11월 15일</text>
<circle cx="300" cy="160" r="16" fill="#1a73e8"/><text x="300" y="118" text-anchor="middle" font-size="19" fill="#202124">그 달 말일</text><text x="300" y="208" text-anchor="middle" font-size="22" font-weight="700" fill="#1a73e8">11월 30일</text>
<circle cx="650" cy="160" r="16" fill="#d93025"/><text x="650" y="118" text-anchor="middle" font-size="19" fill="#202124">6개월 뒤 마감</text><text x="650" y="208" text-anchor="middle" font-size="22" font-weight="700" fill="#d93025">다음 해 5월 31일</text>
<text x="475" y="150" text-anchor="middle" font-size="18" fill="#5f6368">+6개월</text>
<rect x="60" y="260" width="680" height="120" rx="14" fill="#fce8e6"/>
<text x="400" y="300" text-anchor="middle" font-size="21" font-weight="700" fill="#202124">마감을 넘기면</text>
<text x="400" y="336" text-anchor="middle" font-size="20" fill="#202124">신고 안 함: 세액의 20% (무신고 가산세)</text>
<text x="400" y="366" text-anchor="middle" font-size="20" fill="#202124">못 낸 세금: 하루 0.022%씩 (납부지연 가산세)</text>
</svg>
