<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="sans-serif">
<rect width="800" height="460" fill="#ffffff"/>
<text x="400" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">엄마가 지금 어떠신가요</text>
<rect x="40" y="85" width="340" height="270" rx="16" fill="#e8f5e9"/>
<text x="210" y="135" text-anchor="middle" font-size="24" font-weight="700" fill="#1e7e34">살아 계신 엄마</text>
<text x="210" y="195" text-anchor="middle" font-size="19" fill="#202124">꿈속 죽음은 반대로 읽어</text>
<text x="210" y="228" text-anchor="middle" font-size="19" fill="#202124">오래 사시고 걱정이</text>
<text x="210" y="261" text-anchor="middle" font-size="19" fill="#202124">덜어지는 쪽</text>
<text x="210" y="320" text-anchor="middle" font-size="18" fill="#5f6368">이 글이 맞아요</text>
<rect x="420" y="85" width="340" height="270" rx="16" fill="#f3e8fd"/>
<text x="590" y="135" text-anchor="middle" font-size="24" font-weight="700" fill="#7b1fa2">이미 돌아가신 엄마</text>
<text x="590" y="195" text-anchor="middle" font-size="19" fill="#202124">장례를 또 치르는 꿈은</text>
<text x="590" y="228" text-anchor="middle" font-size="19" fill="#202124">남은 그리움과 마음 정리로</text>
<text x="590" y="261" text-anchor="middle" font-size="19" fill="#202124">따로 풀이해요</text>
<text x="590" y="320" text-anchor="middle" font-size="18" fill="#5f6368">아래 링크 글이 맞아요</text>
<text x="400" y="410" text-anchor="middle" font-size="18" fill="#5f6368">같은 장례 꿈이어도 풀이 줄기가 달라요</text>
</svg>
