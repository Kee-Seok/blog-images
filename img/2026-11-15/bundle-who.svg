<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="sans-serif">
<rect width="800" height="420" fill="#ffffff"/>
<text x="400" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">낯선 여자의 얼굴이 어땠나요</text>
<rect x="60" y="85" width="320" height="250" rx="18" fill="#e8f5e9" stroke="#1e7e34" stroke-width="2"/>
<text x="220" y="140" text-anchor="middle" font-size="25" font-weight="700" fill="#1e7e34">웃거나 차분했다</text>
<text x="220" y="200" text-anchor="middle" font-size="20" fill="#202124">도와줄 사람이 나타나</text>
<text x="220" y="232" text-anchor="middle" font-size="20" fill="#202124">동생 일을 거드는 쪽</text>
<rect x="420" y="85" width="320" height="250" rx="18" fill="#fff8e1" stroke="#b06000" stroke-width="2"/>
<text x="580" y="140" text-anchor="middle" font-size="25" font-weight="700" fill="#b06000">무섭거나 서둘렀다</text>
<text x="580" y="200" text-anchor="middle" font-size="20" fill="#202124">동생 주변 일에</text>
<text x="580" y="232" text-anchor="middle" font-size="20" fill="#202124">신경이 쓰인다는 쪽</text>
<text x="400" y="385" text-anchor="middle" font-size="17" fill="#5f6368">같은 보따리 꿈도 여자의 표정에 따라 결이 달라져요</text>
</svg>
