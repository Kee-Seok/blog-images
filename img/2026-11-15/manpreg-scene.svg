<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="sans-serif">
<rect width="800" height="470" fill="#ffffff"/>
<text x="400" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">꿈속 배는 어땠나요</text>
<rect x="30" y="76" width="235" height="300" rx="16" fill="#e8f5e9"/>
<text x="147" y="124" text-anchor="middle" font-size="23" font-weight="700" fill="#1e7e34">둥글게 불렀다</text>
<text x="147" y="182" text-anchor="middle" font-size="19" fill="#202124">준비한 일이</text>
<text x="147" y="212" text-anchor="middle" font-size="19" fill="#202124">무르익는 쪽</text>
<text x="147" y="300" text-anchor="middle" font-size="20" font-weight="700" fill="#1e7e34">반가운 풀이</text>
<rect x="282" y="76" width="235" height="300" rx="16" fill="#e8f0fe"/>
<text x="400" y="124" text-anchor="middle" font-size="23" font-weight="700" fill="#1a56db">아기를 낳았다</text>
<text x="400" y="182" text-anchor="middle" font-size="19" fill="#202124">애쓴 일이</text>
<text x="400" y="212" text-anchor="middle" font-size="19" fill="#202124">결실을 맺는 쪽</text>
<text x="400" y="300" text-anchor="middle" font-size="20" font-weight="700" fill="#1a56db">마무리 풀이</text>
<rect x="535" y="76" width="235" height="300" rx="16" fill="#fff8e1"/>
<text x="652" y="124" text-anchor="middle" font-size="23" font-weight="700" fill="#b06000">배가 아팠다</text>
<text x="652" y="182" text-anchor="middle" font-size="19" fill="#202124">맡은 짐이</text>
<text x="652" y="212" text-anchor="middle" font-size="19" fill="#202124">버거운 쪽</text>
<text x="652" y="300" text-anchor="middle" font-size="20" font-weight="700" fill="#b06000">살펴볼 풀이</text>
<text x="400" y="430" text-anchor="middle" font-size="17" fill="#5f6368">전통 해몽에서 흔히 보는 풀이 · 앞일을 정하는 말은 아니에요</text>
</svg>
