<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="800" height="440" fill="#ffffff"/>
<text x="400" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#202124">상속 취득세율, 세 가지 물음으로 갈려요</text>
<rect x="40" y="70" width="330" height="70" rx="12" fill="#e8f0fe"/><text x="205" y="112" text-anchor="middle" font-size="20" fill="#202124">주택인가요? (땅·상가 아님)</text>
<rect x="40" y="170" width="330" height="70" rx="12" fill="#e8f0fe"/><text x="205" y="212" text-anchor="middle" font-size="20" fill="#202124">우리 세대에 다른 집이 없나요?</text>
<rect x="40" y="270" width="330" height="70" rx="12" fill="#e8f0fe"/><text x="205" y="312" text-anchor="middle" font-size="20" fill="#202124">받는 집이 한 채뿐인가요?</text>
<text x="400" y="112" font-size="18" fill="#d93025">아니요 → 2.8%부터 (농지 2.3%)</text>
<text x="400" y="212" font-size="18" fill="#d93025">아니요 → 2.96% (85㎡ 초과 3.16%)</text>
<text x="400" y="312" font-size="18" fill="#d93025">아니요 → 2.96% (85㎡ 초과 3.16%)</text>
<rect x="40" y="365" width="720" height="58" rx="12" fill="#e6f4ea"/>
<text x="400" y="402" text-anchor="middle" font-size="22" font-weight="700" fill="#1e8e3e">셋 다 예 → 합계 0.96% (취득세 0.8% + 지방교육세 0.16%)</text>
</svg>
