<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="sans-serif">
<rect width="800" height="560" fill="#ffffff"/>
<text x="400" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">큰 구렁이 꿈, 어디에 있었나요</text>
<rect x="40" y="85" width="350" height="190" rx="16" fill="#e8f5e9"/>
<text x="215" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1e7e34">집 안으로 들어왔다</text>
<text x="215" y="180" text-anchor="middle" font-size="19" fill="#202124">재물·좋은 일이</text>
<text x="215" y="210" text-anchor="middle" font-size="19" fill="#202124">들어오는 쪽</text>
<rect x="410" y="85" width="350" height="190" rx="16" fill="#e8f0fe"/>
<text x="585" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1a56db">내 몸을 감았다</text>
<text x="585" y="180" text-anchor="middle" font-size="19" fill="#202124">든든한 도움·인연이</text>
<text x="585" y="210" text-anchor="middle" font-size="19" fill="#202124">붙는 쪽</text>
<rect x="40" y="295" width="350" height="190" rx="16" fill="#fff8e1"/>
<text x="215" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#b06000">멀리서 보기만 했다</text>
<text x="215" y="390" text-anchor="middle" font-size="19" fill="#202124">기회가 보이니</text>
<text x="215" y="420" text-anchor="middle" font-size="19" fill="#202124">손을 내밀라는 쪽</text>
<rect x="410" y="295" width="350" height="190" rx="16" fill="#fce8e6"/>
<text x="585" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#c5221f">집 밖으로 나갔다</text>
<text x="585" y="390" text-anchor="middle" font-size="19" fill="#202124">들어온 복을</text>
<text x="585" y="420" text-anchor="middle" font-size="19" fill="#202124">잘 지키라는 쪽</text>
<text x="400" y="525" text-anchor="middle" font-size="17" fill="#5f6368">전통 해몽 풀이 기준 · 오늘의 꿈 해몽</text>
</svg>
