<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
<rect width="800" height="470" fill="#ffffff"/>
<text x="40" y="56" font-size="29" font-weight="700" fill="#202124">치루 수술 영수증, 세 칸으로 나눠 보세요</text>
<text x="40" y="90" font-size="18" fill="#5f6368">항문 질환(K60~K62·K64)은 실손에서 급여 본인부담만 (금감원 안내)</text>
<rect x="40" y="116" width="720" height="92" rx="14" fill="#e8f0fe"/>
<text x="64" y="154" font-size="23" font-weight="700" fill="#202124">① 급여 본인부담 칸</text>
<text x="64" y="188" font-size="19" fill="#202124">실손이 돌려줌 · 4세대는 80% (자기부담 20%)</text>
<text x="736" y="170" font-size="26" font-weight="700" fill="#1a56db" text-anchor="end">청구 O</text>
<rect x="40" y="222" width="720" height="92" rx="14" fill="#fce8e6"/>
<text x="64" y="260" font-size="23" font-weight="700" fill="#202124">② 비급여 칸 (병실 차액 등)</text>
<text x="64" y="294" font-size="19" fill="#202124">항문 질환이라 실손에서 0원</text>
<text x="736" y="276" font-size="26" font-weight="700" fill="#d93025" text-anchor="end">0원</text>
<rect x="40" y="328" width="720" height="92" rx="14" fill="#fff8e1"/>
<text x="64" y="366" font-size="23" font-weight="700" fill="#202124">③ 질병수술비 특약 (정액형)</text>
<text x="64" y="400" font-size="19" fill="#202124">실손과 별개 · 약관 수술분류표에 있으면 따로</text>
<text x="736" y="382" font-size="26" font-weight="700" fill="#b06000" text-anchor="end">따로 청구</text>
<text x="40" y="452" font-size="16" fill="#5f6368">출처: 금융감독원 금융꿀팁(2017.6), 금융위원회 4세대 실손 안내 · 2026-11-15 정리</text>
</svg>
