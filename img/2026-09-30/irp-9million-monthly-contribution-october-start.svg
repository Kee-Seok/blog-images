<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="sans-serif">
<rect width="800" height="400" fill="#ffffff"/>
<text x="400" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#202124">900만원 한도, 언제 시작하느냐에 따라 한 달 부담</text>
<g font-size="18" fill="#202124" text-anchor="middle">
<rect x="70" y="100" width="300" height="190" rx="12" fill="#e8f0fe" stroke="#aecbfa"/>
<text x="220" y="145" font-weight="700">1월부터 매달</text>
<text x="220" y="215" font-size="36" font-weight="700" fill="#1a73e8">월 75만원</text>
<text x="220" y="260" fill="#5f6368" font-size="15">900만원 ÷ 12</text>
<rect x="430" y="100" width="300" height="190" rx="12" fill="#fef7e0" stroke="#f5dfae"/>
<text x="580" y="145" font-weight="700">10월부터 석 달</text>
<text x="580" y="215" font-size="36" font-weight="700" fill="#b06000">월 300만원</text>
<text x="580" y="260" fill="#5f6368" font-size="15">900만원 ÷ 3</text>
</g>
<text x="400" y="340" text-anchor="middle" font-size="17" fill="#202124">올해 공제는 <tspan font-weight="700">12월 31일까지 납입한 금액</tspan>만 들어가요</text>
<text x="400" y="370" text-anchor="middle" font-size="14" fill="#5f6368">한 번에 넣어도 공제액은 같아요 — 월별 금액은 부담을 나눠 본 계산</text>
</svg>
