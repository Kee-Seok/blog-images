<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="Pretendard,Apple SD Gothic Neo,sans-serif"><rect width="1200" height="540" rx="28" fill="#ffffff"/><text x="600" y="70" font-size="38" font-weight="700" fill="#202124" text-anchor="middle">조회 다음은 차단, 안심차단 세 가지</text><text x="60" y="130" font-size="24" font-weight="700" fill="#5f6368">서비스</text><text x="470" y="130" font-size="24" font-weight="700" fill="#5f6368">막는 것</text><text x="900" y="130" font-size="24" font-weight="700" fill="#5f6368">신청하는 곳</text><rect x="40" y="170" width="1120" height="80" rx="16" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><text x="60" y="220" font-size="27" font-weight="700" fill="#1a73e8">여신거래 안심차단</text><text x="470" y="220" font-size="25" fill="#202124">새 대출·카드론·카드 발급</text><text x="900" y="220" font-size="25" fill="#202124">영업점 방문</text><rect x="40" y="265" width="1120" height="80" rx="16" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><text x="60" y="315" font-size="27" font-weight="700" fill="#1a73e8">비대면 계좌개설 안심차단</text><text x="470" y="315" font-size="25" fill="#202124">내 명의 새 계좌 개설</text><text x="900" y="315" font-size="25" fill="#202124">은행 앱·어카운트인포</text><rect x="40" y="360" width="1120" height="80" rx="16" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><text x="60" y="410" font-size="27" font-weight="700" fill="#1a73e8">오픈뱅킹 안심차단</text><text x="470" y="410" font-size="25" fill="#202124">다른 앱의 내 계좌 조회·출금</text><text x="900" y="410" font-size="25" fill="#202124">대면·비대면</text><text x="600" y="500" font-size="22" fill="#5f6368" text-anchor="middle">해제는 모두 영업점에서 본인이 직접 (대면 해제만 허용)</text></svg>