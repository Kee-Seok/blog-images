<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Pretendard,Apple SD Gothic Neo,sans-serif"><rect width="1200" height="640" rx="28" fill="#ffffff"/><text x="600" y="72" font-size="40" font-weight="700" fill="#202124" text-anchor="middle">돼지꿈 꾸고 복권 산다면, 숫자 세 개</text><rect x="50" y="130" width="350" height="440" rx="20" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="130" width="350" height="16" rx="8" fill="#1a73e8"/><text x="225" y="230" font-size="34" font-weight="700" fill="#202124" text-anchor="middle">1등 확률</text><text x="225" y="330" font-size="32" font-weight="700" fill="#1a73e8" text-anchor="middle">8,145,060분의 1</text><text x="225" y="500" font-size="24" fill="#5f6368" text-anchor="middle">꿈 번호든 자동이든 같아요</text><rect x="425" y="130" width="350" height="440" rx="20" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="425" y="130" width="350" height="16" rx="8" fill="#f29900"/><text x="600" y="230" font-size="34" font-weight="700" fill="#202124" text-anchor="middle">세금</text><text x="600" y="330" font-size="32" font-weight="700" fill="#f29900" text-anchor="middle">3억까지 22%</text><text x="600" y="380" font-size="32" font-weight="700" fill="#f29900" text-anchor="middle">넘는 몫 33%</text><text x="600" y="500" font-size="24" fill="#5f6368" text-anchor="middle">공시 금액 그대로 안 들어와요</text><rect x="800" y="130" width="350" height="440" rx="20" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="800" y="130" width="350" height="16" rx="8" fill="#d93025"/><text x="975" y="230" font-size="34" font-weight="700" fill="#202124" text-anchor="middle">받는 기한</text><text x="975" y="330" font-size="32" font-weight="700" fill="#d93025" text-anchor="middle">지급 시작일부터 1년</text><text x="975" y="500" font-size="24" fill="#5f6368" text-anchor="middle">지나면 복권기금으로 넘어가요</text></svg>