<rect x="40" y="336" width="720" height="62" rx="10" fill="#f7f9fc"/><text x="64" y="376">6천만원 초과 ~ 7.5천만원 이하</text><text x="736" y="376" text-anchor="end" font-weight="700" fill="#1a56db">연 3.3%</text>
