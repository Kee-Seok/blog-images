<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="800" height="420" fill="#ffffff"/>
<text x="400" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">11월 건보료 인상 이유: 소득이 1년 늦게 따라와요</text>
<line x1="70" y1="170" x2="730" y2="170" stroke="#dadce0" stroke-width="6" stroke-linecap="round"/>
<circle cx="140" cy="170" r="14" fill="#9aa0a6"/><circle cx="400" cy="170" r="16" fill="#1a73e8"/><circle cx="660" cy="170" r="14" fill="#f9ab00"/>
<text x="140" y="120" text-anchor="middle" font-size="21" font-weight="700" fill="#5f6368">10월분까지</text>
<text x="140" y="218" text-anchor="middle" font-size="19" fill="#202124">2024년 소득 기준</text>
<text x="400" y="120" text-anchor="middle" font-size="21" font-weight="700" fill="#1a56db">11월분부터 1년</text>
<text x="400" y="218" text-anchor="middle" font-size="19" fill="#202124">2025년 소득 +</text>
<text x="400" y="244" text-anchor="middle" font-size="19" fill="#202124">2026년 6월 1일 재산</text>
<text x="660" y="120" text-anchor="middle" font-size="21" font-weight="700" fill="#b06000">12월 10일</text>
<text x="660" y="218" text-anchor="middle" font-size="19" fill="#202124">11월분 납부 기한</text>
<rect x="90" y="292" width="620" height="96" rx="14" fill="#fff8e1" stroke="#fbc400" stroke-width="2"/>
<text x="400" y="330" text-anchor="middle" font-size="20" font-weight="700" fill="#202124">올해 폐업·휴업·퇴직으로 소득이 줄었다면</text>
<text x="400" y="364" text-anchor="middle" font-size="19" fill="#202124">조정 신청 → 낮춘 보험료 납부 → 국세청 확정 소득으로 나중에 정산</text>
</svg>
