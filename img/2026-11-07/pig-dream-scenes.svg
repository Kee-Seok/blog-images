<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Pretendard,Apple SD Gothic Neo,sans-serif"><rect width="1200" height="760" rx="28" fill="#ffffff"/><text x="600" y="72" font-size="40" font-weight="700" fill="#202124" text-anchor="middle">돼지꿈 해몽, 장면별로 흔히 보는 풀이</text><text x="80" y="140" font-size="26" font-weight="700" fill="#5f6368">꿈 장면</text><text x="520" y="140" font-size="26" font-weight="700" fill="#5f6368">전통 해몽 풀이</text><rect x="50" y="165" width="1100" height="92" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="165" width="14" height="92" rx="7" fill="#1a73e8"/><text x="80" y="223" font-size="30" font-weight="700" fill="#202124">흰 돼지·금돼지</text><text x="520" y="223" font-size="28" fill="#202124">재물·좋은 소식을 크게 봄</text><rect x="50" y="275" width="1100" height="92" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="275" width="14" height="92" rx="7" fill="#5f6368"/><text x="80" y="333" font-size="30" font-weight="700" fill="#202124">검은 돼지</text><text x="520" y="333" font-size="28" fill="#202124">재물 꿈이지만 바쁜 일 따라옴</text><rect x="50" y="385" width="1100" height="92" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="385" width="14" height="92" rx="7" fill="#1e8e3e"/><text x="80" y="443" font-size="30" font-weight="700" fill="#202124">돼지가 집에 들어옴</text><text x="520" y="443" font-size="28" fill="#202124">들어오는 돈·식구 늘어남</text><rect x="50" y="495" width="1100" height="92" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="495" width="14" height="92" rx="7" fill="#f29900"/><text x="80" y="553" font-size="30" font-weight="700" fill="#202124">돼지를 안거나 업음</text><text x="520" y="553" font-size="28" fill="#202124">손에 쥐는 재물</text><rect x="50" y="605" width="1100" height="92" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="605" width="14" height="92" rx="7" fill="#d93025"/><text x="80" y="663" font-size="30" font-weight="700" fill="#202124">돼지가 도망감</text><text x="520" y="663" font-size="28" fill="#202124">놓친 기회 걱정</text></svg>