<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="900" height="330" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#202124">깎아주는 것이 제도마다 다릅니다</text>
  <text x="450" y="74" text-anchor="middle" font-size="15" fill="#5f6368">원금이 줄어드는 건 개인워크아웃부터입니다</text>
  <g font-size="16">
    <text x="330" y="112" text-anchor="middle" font-weight="700" fill="#5f6368">연체이자</text>
    <text x="500" y="112" text-anchor="middle" font-weight="700" fill="#5f6368">이자</text>
    <text x="670" y="112" text-anchor="middle" font-weight="700" fill="#5f6368">원금</text>
    <text x="820" y="112" text-anchor="middle" font-weight="700" fill="#5f6368">상환기간</text>

    <rect x="60" y="128" width="800" height="56" rx="8" fill="#E6F4EA"/>
    <text x="80" y="162" font-weight="700" fill="#137333">신속채무조정</text>
    <text x="330" y="162" text-anchor="middle" font-weight="700" fill="#137333">면제</text>
    <text x="500" y="162" text-anchor="middle" fill="#9AA0A6">조건부</text>
    <text x="670" y="162" text-anchor="middle" fill="#9AA0A6">그대로</text>
    <text x="820" y="162" text-anchor="middle" fill="#202124">최장 10년</text>

    <rect x="60" y="192" width="800" height="56" rx="8" fill="#FEF7E0"/>
    <text x="80" y="226" font-weight="700" fill="#b06000">프리워크아웃</text>
    <text x="330" y="226" text-anchor="middle" font-weight="700" fill="#b06000">면제</text>
    <text x="500" y="226" text-anchor="middle" font-weight="700" fill="#b06000">30~70% 감면</text>
    <text x="670" y="226" text-anchor="middle" fill="#9AA0A6">그대로</text>
    <text x="820" y="226" text-anchor="middle" fill="#202124">최장 10년</text>

    <rect x="60" y="256" width="800" height="56" rx="8" fill="#FCE8E6"/>
    <text x="80" y="290" font-weight="700" fill="#c5221f">개인워크아웃</text>
    <text x="330" y="290" text-anchor="middle" font-weight="700" fill="#c5221f">전액 감면</text>
    <text x="500" y="290" text-anchor="middle" font-weight="700" fill="#c5221f">전액 감면</text>
    <text x="670" y="290" text-anchor="middle" font-weight="700" fill="#c5221f">일부 감면</text>
    <text x="820" y="290" text-anchor="middle" fill="#202124">최장 8년</text>
  </g>
</svg>
