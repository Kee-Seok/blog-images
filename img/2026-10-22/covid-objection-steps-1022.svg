<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="800" height="300" fill="#ffffff"/>
<text x="400" y="40" text-anchor="middle" font-size="23" font-weight="700" fill="#202124">보건소에 낸 뒤 서류가 가는 길</text>
<g font-size="16" fill="#202124" text-anchor="middle">
<rect x="20" y="80" width="170" height="130" rx="12" fill="#fff4e5" stroke="#e8710a" stroke-width="2"/>
<text x="105" y="118" font-weight="700" fill="#b06000">① 신청자</text>
<text x="105" y="150">이의신청서</text>
<text x="105" y="176">간편수신 동의서</text>
<rect x="215" y="80" width="170" height="130" rx="12" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="2"/>
<text x="300" y="118" font-weight="700">② 보건소</text>
<text x="300" y="150">주소지 관할</text>
<text x="300" y="176">서류 받아 넘김</text>
<rect x="410" y="80" width="170" height="130" rx="12" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="2"/>
<text x="495" y="118" font-weight="700">③ 시·도</text>
<text x="495" y="150">기초조사</text>
<text x="495" y="176">의견서 작성</text>
<rect x="605" y="80" width="175" height="130" rx="12" fill="#eaf2ff" stroke="#1a73e8" stroke-width="2"/>
<text x="692" y="118" font-weight="700" fill="#1a73e8">④ 질병관리청</text>
<text x="692" y="150">재심위원회 심의</text>
<text x="692" y="176">보상 여부 통보</text>
</g>
<g stroke="#5f6368" stroke-width="2.5" fill="#5f6368">
<line x1="192" y1="145" x2="208" y2="145"/><polygon points="208,139 214,145 208,151"/>
<line x1="387" y1="145" x2="403" y2="145"/><polygon points="403,139 409,145 403,151"/>
<line x1="582" y1="145" x2="598" y2="145"/><polygon points="598,139 604,145 598,151"/>
</g>
<text x="400" y="250" text-anchor="middle" font-size="15" fill="#202124">신청자가 할 일은 ①번, 보건소 방문 한 번이 전부입니다</text>
<text x="400" y="282" text-anchor="middle" font-size="13" fill="#80868b">자료: 부산시 '코로나19 예방접종 피해보상 특례 이의신청 신청기한 도래 안내'(2026.10.2)</text>
</svg>
