<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="sans-serif">
<rect width="800" height="360" fill="#ffffff"/>
<text x="400" y="48" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">품의 느낌으로 한 번 더 보기</text>
<g font-size="20">
<circle cx="140" cy="170" r="78" fill="#fff3e0"/><text x="140" y="162" text-anchor="middle" font-weight="700" fill="#b06000">따뜻했다</text><text x="140" y="192" text-anchor="middle" fill="#202124">힘이 붙는 꿈</text>
<circle cx="400" cy="170" r="78" fill="#e8f0fe"/><text x="400" y="162" text-anchor="middle" font-weight="700" fill="#1a56db">꽉 안겼다</text><text x="400" y="192" text-anchor="middle" fill="#202124">든든한 꿈</text>
<circle cx="660" cy="170" r="78" fill="#f1f3f4"/><text x="660" y="162" text-anchor="middle" font-weight="700" fill="#5f6368">차가웠다</text><text x="660" y="192" text-anchor="middle" fill="#202124">쉬라는 신호</text>
</g>
<text x="400" y="300" text-anchor="middle" font-size="17" fill="#5f6368">어느 쪽도 나쁜 일을 예고하는 꿈으로 보지 않아요</text>
</svg>
