<line x1="70" y1="170" x2="730" y2="170" stroke="#9aa0a6" stroke-width="4"/>
<g font-size="18" fill="#202124" text-anchor="middle">
<circle cx="110" cy="170" r="16" fill="#1a73e8"/><text x="110" y="120" font-weight="700" fill="#1a73e8">11월 19일(목)</text><text x="110" y="220">시험 · 정답 공개</text><text x="110" y="248">이의신청 시작</text>
<circle cx="300" cy="170" r="16" fill="#c5221f"/><text x="300" y="120" font-weight="700" fill="#c5221f">11월 23일(월)</text><text x="300" y="220">이의신청 마감</text><text x="300" y="248">(5일간)</text>
