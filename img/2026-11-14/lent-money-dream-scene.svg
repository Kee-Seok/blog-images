<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="sans-serif">
<rect width="800" height="560" fill="#ffffff"/>
<text x="400" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">빌려준 돈 받는 꿈, 네 갈래</text>
<rect x="40" y="85" width="350" height="190" rx="16" fill="#e8f5e9"/>
<text x="215" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1e7e34">한 번에 다 받았다</text>
<text x="215" y="180" text-anchor="middle" font-size="19" fill="#202124">막혔던 돈·일이</text>
<text x="215" y="210" text-anchor="middle" font-size="19" fill="#202124">풀리는 쪽</text>
<rect x="410" y="85" width="350" height="190" rx="16" fill="#e8f0fe"/>
<text x="585" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1a56db">이자까지 얹어 받았다</text>
<text x="585" y="180" text-anchor="middle" font-size="19" fill="#202124">들인 노력보다</text>
<text x="585" y="210" text-anchor="middle" font-size="19" fill="#202124">더 돌아오는 쪽</text>
<rect x="40" y="295" width="350" height="190" rx="16" fill="#fff8e1"/>
<text x="215" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#b06000">일부만 받았다</text>
<text x="215" y="390" text-anchor="middle" font-size="19" fill="#202124">조금씩 나아지니</text>
<text x="215" y="420" text-anchor="middle" font-size="19" fill="#202124">서두르지 말라는 쪽</text>
<rect x="410" y="295" width="350" height="190" rx="16" fill="#fce8e6"/>
<text x="585" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#c5221f">끝내 못 받았다</text>
<text x="585" y="390" text-anchor="middle" font-size="19" fill="#202124">돈 관리·약속을</text>
<text x="585" y="420" text-anchor="middle" font-size="19" fill="#202124">한 번 살피라는 쪽</text>
<text x="400" y="525" text-anchor="middle" font-size="17" fill="#5f6368">전통 해몽 풀이 기준 · 오늘의 꿈 해몽</text>
</svg>
