<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="sans-serif">
<rect width="800" height="520" fill="#ffffff"/>
<text x="400" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">아버지 장례 꿈, 무엇이 보였나요</text>
<rect x="40" y="80" width="230" height="170" rx="16" fill="#e8f0fe"/>
<text x="155" y="130" text-anchor="middle" font-size="22" font-weight="700" fill="#1a56db">내가 상주</text>
<text x="155" y="172" text-anchor="middle" font-size="18" fill="#202124">집안일을 맡아</text>
<text x="155" y="200" text-anchor="middle" font-size="18" fill="#202124">정리하는 쪽</text>
<rect x="285" y="80" width="230" height="170" rx="16" fill="#e8f5e9"/>
<text x="400" y="130" text-anchor="middle" font-size="22" font-weight="700" fill="#1e7e34">크게 울었다</text>
<text x="400" y="172" text-anchor="middle" font-size="18" fill="#202124">맺힌 근심이</text>
<text x="400" y="200" text-anchor="middle" font-size="18" fill="#202124">풀리는 쪽</text>
<rect x="530" y="80" width="230" height="170" rx="16" fill="#fff8e1"/>
<text x="645" y="130" text-anchor="middle" font-size="22" font-weight="700" fill="#b06000">관을 봤다</text>
<text x="645" y="172" text-anchor="middle" font-size="18" fill="#202124">재물·일의</text>
<text x="645" y="200" text-anchor="middle" font-size="18" fill="#202124">마무리로 보는 쪽</text>
<rect x="160" y="275" width="230" height="170" rx="16" fill="#f3e8fd"/>
<text x="275" y="325" text-anchor="middle" font-size="22" font-weight="700" fill="#7b1fa2">아버지가 지켜봤다</text>
<text x="275" y="367" text-anchor="middle" font-size="18" fill="#202124">걱정 내려놓으라는</text>
<text x="275" y="395" text-anchor="middle" font-size="18" fill="#202124">뜻으로 보는 쪽</text>
<rect x="410" y="275" width="230" height="170" rx="16" fill="#fce8e6"/>
<text x="525" y="325" text-anchor="middle" font-size="22" font-weight="700" fill="#c5221f">장례가 끊겼다</text>
<text x="525" y="367" text-anchor="middle" font-size="18" fill="#202124">덜 끝낸 일을</text>
<text x="525" y="395" text-anchor="middle" font-size="18" fill="#202124">챙기라는 신호</text>
<text x="400" y="495" text-anchor="middle" font-size="17" fill="#5f6368">전통 해몽에서 흔히 보는 풀이 · 오늘의 꿈 해몽</text>
</svg>
