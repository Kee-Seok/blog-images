<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="sans-serif">
<rect width="800" height="560" fill="#ffffff"/>
<text x="400" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">외할머니가 안아 준 꿈, 네 갈래</text>
<rect x="40" y="85" width="350" height="190" rx="16" fill="#e8f5e9"/>
<text x="215" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1e7e34">할머니가 먼저 안았다</text>
<text x="215" y="180" text-anchor="middle" font-size="19" fill="#202124">감싸 주고 지켜 준다는</text>
<text x="215" y="210" text-anchor="middle" font-size="19" fill="#202124">든든한 쪽</text>
<rect x="410" y="85" width="350" height="190" rx="16" fill="#e8f0fe"/>
<text x="585" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1a56db">내가 달려가 안겼다</text>
<text x="585" y="180" text-anchor="middle" font-size="19" fill="#202124">기댈 곳을 찾는 마음,</text>
<text x="585" y="210" text-anchor="middle" font-size="19" fill="#202124">도움이 닿는 쪽</text>
<rect x="40" y="295" width="350" height="190" rx="16" fill="#fff8e1"/>
<text x="215" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#b06000">안고 함께 울었다</text>
<text x="215" y="390" text-anchor="middle" font-size="19" fill="#202124">맺힌 근심이 풀리는</text>
<text x="215" y="420" text-anchor="middle" font-size="19" fill="#202124">시원한 쪽</text>
<rect x="410" y="295" width="350" height="190" rx="16" fill="#fce8e6"/>
<text x="585" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#c5221f">안다가 놓고 떠나셨다</text>
<text x="585" y="390" text-anchor="middle" font-size="19" fill="#202124">이제 스스로 서라는</text>
<text x="585" y="420" text-anchor="middle" font-size="19" fill="#202124">응원으로 보는 쪽</text>
<text x="400" y="530" text-anchor="middle" font-size="17" fill="#5f6368">전통 해몽에서 흔히 보는 풀이 · 오늘의 꿈 해몽</text>
</svg>
