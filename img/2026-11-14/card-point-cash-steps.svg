<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="800" height="300" fill="#ffffff"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">지금 카드포인트를 계좌로 받는 순서</text>
<g font-size="19" text-anchor="middle">
<rect x="20" y="90" width="170" height="130" rx="14" fill="#e8f0fe"/><text x="105" y="140" font-weight="700" fill="#1a56db">1. 접속</text><text x="105" y="172" fill="#202124">통합조회 누리집</text><text x="105" y="198" fill="#202124">또는 어카운트인포</text>
<rect x="215" y="90" width="170" height="130" rx="14" fill="#e8f0fe"/><text x="300" y="140" font-weight="700" fill="#1a56db">2. 본인 인증</text><text x="300" y="172" fill="#202124">휴대폰 인증 후</text><text x="300" y="198" fill="#202124">카드사 모두 선택</text>
<rect x="410" y="90" width="170" height="130" rx="14" fill="#e8f0fe"/><text x="495" y="140" font-weight="700" fill="#1a56db">3. 포인트 확인</text><text x="495" y="172" fill="#202124">대표 포인트만</text><text x="495" y="198" fill="#202124">입금 가능</text>
<rect x="605" y="90" width="175" height="130" rx="14" fill="#fff8e1"/><text x="692" y="140" font-weight="700" fill="#b06000">4. 계좌입금</text><text x="692" y="172" fill="#202124">보통 바로 처리</text><text x="692" y="198" fill="#202124">8시 뒤면 다음 영업일</text>
</g>
<text x="400" y="270" text-anchor="middle" font-size="17" fill="#5f6368">개인 신용·체크카드 회원만 · 법인카드 제외 · 카드사별 하루 1번 신청</text>
</svg>
