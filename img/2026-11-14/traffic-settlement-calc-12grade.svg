<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
<rect width="800" height="460" fill="#ffffff"/>
<text x="40" y="58" font-size="30" font-weight="700" fill="#202124">2주 진단 직장인 합의금, 이렇게 쌓여요</text>
<text x="40" y="92" font-size="18" fill="#5f6368">12급 · 월 실수령 300만원 · 10일 쉼 · 통원 8일 (예시)</text>
<rect x="40" y="120" width="720" height="70" rx="12" fill="#e8f0fe"/>
<text x="64" y="164" font-size="22" fill="#202124">휴업손해  10만원 × 10일 × 85%</text><text x="736" y="164" font-size="26" font-weight="700" fill="#1a56db" text-anchor="end">85만원</text>
<rect x="40" y="204" width="720" height="70" rx="12" fill="#fff8e1"/>
<text x="64" y="248" font-size="22" fill="#202124">위자료  12급 정액</text><text x="736" y="248" font-size="26" font-weight="700" fill="#b06000" text-anchor="end">15만원</text>
<rect x="40" y="288" width="720" height="70" rx="12" fill="#f1f3f4"/>
<text x="64" y="332" font-size="22" fill="#202124">통원 교통비  8일 × 8,000원</text><text x="736" y="332" font-size="26" font-weight="700" fill="#202124" text-anchor="end">6만4천원</text>
<line x1="40" y1="378" x2="760" y2="378" stroke="#202124" stroke-width="2"/>
<text x="64" y="424" font-size="24" font-weight="700" fill="#202124">합계 (치료비는 보험사가 병원에 따로)</text><text x="736" y="424" font-size="30" font-weight="700" fill="#d93025" text-anchor="end">106만4천원</text>
</svg>
