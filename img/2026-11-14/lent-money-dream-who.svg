<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="sans-serif">
<rect width="800" height="360" fill="#ffffff"/>
<text x="400" y="48" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">누구한테 받았는지로 한 번 더 보기</text>
<g font-size="20">
<circle cx="140" cy="175" r="82" fill="#e8f0fe"/><text x="140" y="167" text-anchor="middle" font-weight="700" fill="#1a56db">친구·지인</text><text x="140" y="197" text-anchor="middle" fill="#202124">관계가 풀림</text>
<circle cx="400" cy="175" r="82" fill="#e8f5e9"/><text x="400" y="167" text-anchor="middle" font-weight="700" fill="#1e7e34">가족</text><text x="400" y="197" text-anchor="middle" fill="#202124">집안 걱정 덜기</text>
<circle cx="660" cy="175" r="82" fill="#fff8e1"/><text x="660" y="167" text-anchor="middle" font-weight="700" fill="#b06000">모르는 사람</text><text x="660" y="197" text-anchor="middle" fill="#202124">뜻밖의 도움</text>
