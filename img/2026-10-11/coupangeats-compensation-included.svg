<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
<rect width="800" height="440" fill="#ffffff"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">내 주문은 보상에 들어갈까</text>
<g font-size="20">
<rect x="40" y="80" width="345" height="320" rx="14" fill="#e6f4ea"/>
<text x="212" y="120" text-anchor="middle" font-weight="700" fill="#188038" font-size="22">들어가요</text>
<text x="64" y="170" fill="#202124">· 장애 시간에 수락했는데</text><text x="84" y="198" fill="#202124">시스템 오류로 취소된 주문</text>
<text x="64" y="248" fill="#202124">· 조리까지 했는데</text><text x="84" y="276" fill="#202124">배달 못 한 주문</text>
<text x="64" y="326" fill="#202124">· 그 취소 건의 광고비</text><text x="84" y="354" fill="#202124">(부과하지 않음)</text>
<rect x="415" y="80" width="345" height="320" rx="14" fill="#fce8e6"/>
<text x="587" y="120" text-anchor="middle" font-weight="700" fill="#d93025" font-size="22">안 들어가요</text>
<text x="439" y="170" fill="#202124">· 앱이 멈춰 아예</text><text x="459" y="198" fill="#202124">못 받은 주문(놓친 매출)</text>
<text x="439" y="248" fill="#202124">· 장애 시간 밖에</text><text x="459" y="276" fill="#202124">취소된 주문</text>

</g>
<text x="400" y="428" text-anchor="middle" font-size="15" fill="#5f6368">2026년 10월 11일 쿠팡이츠 발표 보도 기준(디지털데일리·파이낸셜뉴스)</text>
</svg>
