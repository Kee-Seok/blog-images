<text x="40" y="312">차상위 희귀난치성질환자</text><rect x="330" y="290" width="75" height="32" rx="6" fill="#fbb08f"/><text x="420" y="313" font-weight="700">5%</text>
<text x="40" y="372">의료급여 1종</text><rect x="330" y="350" width="75" height="32" rx="6" fill="#fbb08f"/><text x="420" y="373" font-weight="700">5%</text>
</g>
</svg>
