<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="sans-serif">
<rect width="900" height="400" fill="#ffffff"/>
<text x="450" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">신발 잃어버리는 꿈, 끝이 어땠나</text>
<g font-size="20" fill="#202124">
<rect x="30" y="90" width="260" height="270" rx="16" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
<text x="160" y="135" text-anchor="middle" font-weight="700" font-size="23">끝내 못 찾음</text>
<text x="160" y="185" text-anchor="middle">지금 자리·관계가</text>
<text x="160" y="215" text-anchor="middle">흔들릴까 하는 걱정</text>
<text x="160" y="275" text-anchor="middle" fill="#5f6368" font-size="18">맨발로 돌아오면</text>
<text x="160" y="303" text-anchor="middle" fill="#5f6368" font-size="18">기댈 곳이 아쉬운 때</text>
<rect x="320" y="90" width="260" height="270" rx="16" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="450" y="135" text-anchor="middle" font-weight="700" font-size="23">다시 찾음</text>
<text x="450" y="185" text-anchor="middle">잃을 뻔한 것이</text>
<text x="450" y="215" text-anchor="middle">제자리로 돌아옴</text>
<text x="450" y="275" text-anchor="middle" fill="#5f6368" font-size="18">고비를 넘긴다는</text>
<text x="450" y="303" text-anchor="middle" fill="#5f6368" font-size="18">좋은 쪽 풀이</text>
<rect x="610" y="90" width="260" height="270" rx="16" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2"/>
<text x="740" y="135" text-anchor="middle" font-weight="700" font-size="23">새 신발로 바꿔 신음</text>
<text x="740" y="185" text-anchor="middle">새 일터·새 인연이</text>
<text x="740" y="215" text-anchor="middle">들어온다는 풀이</text>
<text x="740" y="275" text-anchor="middle" fill="#5f6368" font-size="18">발에 잘 맞을수록</text>
<text x="740" y="303" text-anchor="middle" fill="#5f6368" font-size="18">더 좋게 읽음</text>
</g>
</svg>
