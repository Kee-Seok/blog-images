<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="40" y="60" font-size="32" font-weight="700" fill="#202124" text-anchor="start">대상포진 예방접종 가격, 백신별로 끝까지 내는 돈</text><text x="40" y="98" font-size="22" font-weight="400" fill="#5f6368" text-anchor="start">심평원 비급여 공개 평균(2024년 9월 공개분) · 싱그릭스는 2번 맞아야 끝</text><text x="40" y="198" font-size="24" font-weight="700" fill="#202124" text-anchor="start">스카이조스터 (생백신 1회)</text><rect x="420" y="170" width="181" height="42" rx="8" fill="#34a853"/><text x="611" y="200" font-size="24" font-weight="700" fill="#202124" text-anchor="start">146,000원</text><text x="40" y="288" font-size="24" font-weight="700" fill="#202124" text-anchor="start">싱그릭스 1회</text><rect x="420" y="260" width="310" height="42" rx="8" fill="#1a73e8"/><text x="740" y="290" font-size="24" font-weight="700" fill="#202124" text-anchor="start">250,000원</text><text x="40" y="378" font-size="24" font-weight="700" fill="#202124" text-anchor="start">싱그릭스 2회 합계</text><rect x="420" y="350" width="620" height="42" rx="8" fill="#d93025"/><text x="1050" y="380" font-size="24" font-weight="700" fill="#202124" text-anchor="start">500,000원</text><text x="40" y="480" font-size="22" font-weight="400" fill="#5f6368" text-anchor="start">같은 50만원이면 생백신을 3번 넘게 맞을 값 → 차이는 '효과·대상'에서 갈립니다(본문 표)</text></svg>