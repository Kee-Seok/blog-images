<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="40" y="60" font-size="32" font-weight="700" fill="#202124" text-anchor="start">대상포진 예방접종 가격 비교, 4단계로 찾기</text><text x="40" y="98" font-size="22" font-weight="400" fill="#5f6368" text-anchor="start">건강보험심사평가원 '비급여 진료비 정보' (휴대폰은 건강e음 앱)</text><rect x="40" y="150" width="260" height="200" rx="14" fill="#f3f8ff" stroke="#1a73e8" stroke-width="2"/><text x="170" y="205" font-size="40" font-weight="800" fill="#1a73e8" text-anchor="middle">1</text><text x="170" y="260" font-size="21" font-weight="700" fill="#202124" text-anchor="middle">심평원 누리집</text><text x="170" y="292" font-size="21" font-weight="700" fill="#202124" text-anchor="middle">비급여 진료비 정보</text><rect x="325" y="150" width="260" height="200" rx="14" fill="#f3f8ff" stroke="#1a73e8" stroke-width="2"/><text x="455" y="205" font-size="40" font-weight="800" fill="#1a73e8" text-anchor="middle">2</text><text x="455" y="260" font-size="21" font-weight="700" fill="#202124" text-anchor="middle">항목: 예방접종료</text><text x="455" y="292" font-size="21" font-weight="700" fill="#202124" text-anchor="middle">대상포진</text><rect x="610" y="150" width="260" height="200" rx="14" fill="#f3f8ff" stroke="#1a73e8" stroke-width="2"/><text x="740" y="205" font-size="40" font-weight="800" fill="#1a73e8" text-anchor="middle">3</text><text x="740" y="260" font-size="21" font-weight="700" fill="#202124" text-anchor="middle">지역(시·군·구) </text><text x="740" y="292" font-size="21" font-weight="700" fill="#202124" text-anchor="middle">고르기</text><rect x="895" y="150" width="260" height="200" rx="14" fill="#f3f8ff" stroke="#1a73e8" stroke-width="2"/><text x="1025" y="205" font-size="40" font-weight="800" fill="#1a73e8" text-anchor="middle">4</text><text x="1025" y="260" font-size="21" font-weight="700" fill="#202124" text-anchor="middle">병원별 값 보고 전</text><text x="1025" y="292" font-size="21" font-weight="700" fill="#202124" text-anchor="middle">화로 재고·값 확인</text><text x="40" y="400" font-size="22" font-weight="400" fill="#5f6368" text-anchor="start">공개 가격은 병원이 신고한 값 — 백신 제품·재고가 바뀌면 실제 값이 다를 수 있어요</text></svg>