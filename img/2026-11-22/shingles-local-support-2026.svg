<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 578" font-family="sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="40" y="60" font-size="32" font-weight="700" fill="#202124" text-anchor="start">지자체 대상포진 지원, 이런 식으로 갈립니다 (예시 2곳)</text><text x="40" y="98" font-size="22" font-weight="400" fill="#5f6368" text-anchor="start">인천 연수구·경기 구리시 보건소 2026 공고 · 사는 곳마다 다름</text><rect x="40" y="140" width="1120" height="76" rx="12" fill="#e6f4ea"/><text x="70" y="188" font-size="26" font-weight="700" fill="#202124" text-anchor="start">연수구 65세+ 수급자·차상위</text><text x="1130" y="188" font-size="26" font-weight="700" fill="#202124" text-anchor="end">생백신 무료</text><rect x="40" y="232" width="1120" height="76" rx="12" fill="#e8f0fe"/><text x="70" y="280" font-size="26" font-weight="700" fill="#202124" text-anchor="start">연수구 65세+ 일반 주민</text><text x="1130" y="280" font-size="26" font-weight="700" fill="#202124" text-anchor="end">생백신: 시행비 19,610원만</text><rect x="40" y="324" width="1120" height="76" rx="12" fill="#fef7e0"/><text x="70" y="372" font-size="26" font-weight="700" fill="#202124" text-anchor="start">연수구 65세+ 싱그릭스</text><text x="1130" y="372" font-size="26" font-weight="700" fill="#202124" text-anchor="end">먼저 내고 9만원 한도 돌려받기</text><rect x="40" y="416" width="1120" height="76" rx="12" fill="#fce8e6"/><text x="70" y="464" font-size="26" font-weight="700" fill="#202124" text-anchor="start">구리시 65세+ (1년 거주)</text><text x="1130" y="464" font-size="26" font-weight="700" fill="#202124" text-anchor="end">보건소 무료 · 위탁병원 19,610원</text><text x="40" y="538" font-size="22" font-weight="400" fill="#5f6368" text-anchor="start">공통: 1961.12.31 이전 출생 · 예전에 맞은 사람 제외 · 평생 1번 · 백신 떨어지면 끝</text></svg>