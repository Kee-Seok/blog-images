<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="sans-serif">
<rect width="800" height="560" fill="#ffffff"/>
<text x="400" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">색깔로 보는 뱀꿈</text>
<rect x="40" y="85" width="350" height="190" rx="16" fill="#e8f5e9"/>
<text x="215" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1e7e34">흰뱀</text>
<text x="215" y="180" text-anchor="middle" font-size="19" fill="#202124">맑은 흰빛</text>
<text x="215" y="210" text-anchor="middle" font-size="19" fill="#202124">귀인·큰 복·태몽</text>
<rect x="410" y="85" width="350" height="190" rx="16" fill="#e8f0fe"/>
<text x="585" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1a56db">검은뱀</text>
<text x="585" y="180" text-anchor="middle" font-size="19" fill="#202124">굵고 검은 뱀</text>
<text x="585" y="210" text-anchor="middle" font-size="19" fill="#202124">힘·자리·재물</text>
<rect x="40" y="295" width="350" height="190" rx="16" fill="#fff8e1"/>
<text x="215" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#b06000">노란뱀·누런뱀</text>
<text x="215" y="390" text-anchor="middle" font-size="19" fill="#202124">금빛이 돌면</text>
<text x="215" y="420" text-anchor="middle" font-size="19" fill="#202124">돈 들어오는 쪽</text>
<rect x="410" y="295" width="350" height="190" rx="16" fill="#fce8e6"/>
<text x="585" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#c5221f">초록뱀·푸른뱀</text>
<text x="585" y="390" text-anchor="middle" font-size="19" fill="#202124">풀빛·푸른빛</text>
<text x="585" y="420" text-anchor="middle" font-size="19" fill="#202124">새 일이 자라는 쪽</text>
<text x="400" y="520" text-anchor="middle" font-size="16" fill="#5f6368">전통 해몽 풀이 · 오늘의 꿈 해몽</text></svg>