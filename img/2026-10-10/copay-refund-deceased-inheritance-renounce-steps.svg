<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="1000" height="560" fill="#ffffff"/>
<text x="40" y="60" font-family="sans-serif" font-size="30" font-weight="700" fill="#202124">상속포기를 생각 중이라면 이 순서로</text>
<circle cx="85" cy="145" r="36" fill="#b06000"/><text x="85" y="157" font-family="sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#fff">1</text>
<text x="145" y="138" font-family="sans-serif" font-size="27" font-weight="700" fill="#202124">안내문을 받고 바로 서명하지 않기</text><text x="145" y="172" font-family="sans-serif" font-size="21" fill="#5f6368">신청하면 상속인 권리를 행사한 것으로 봐요</text>
<circle cx="85" cy="253" r="36" fill="#b06000"/><text x="85" y="265" font-family="sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#fff">2</text>
<text x="145" y="246" font-family="sans-serif" font-size="27" font-weight="700" fill="#202124">빚이 더 많을 것 같은지 먼저 따져 보기</text><text x="145" y="280" font-family="sans-serif" font-size="21" fill="#5f6368">상속포기·한정승인을 생각 중이라면</text>
<circle cx="85" cy="361" r="36" fill="#b06000"/><text x="85" y="373" font-family="sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#fff">3</text>
<text x="145" y="354" font-family="sans-serif" font-size="27" font-weight="700" fill="#202124">상속 포기를 할 거면 법률 상담 먼저</text><text x="145" y="388" font-family="sans-serif" font-size="21" fill="#5f6368">대한법률구조공단 132</text>
<circle cx="85" cy="469" r="36" fill="#b06000"/><text x="85" y="481" font-family="sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#fff">4</text>
<text x="145" y="462" font-family="sans-serif" font-size="27" font-weight="700" fill="#202124">그다음에 환급금 신청</text><text x="145" y="496" font-family="sans-serif" font-size="21" fill="#5f6368">3년이 지나면 받을 권리가 사라져요</text>
<text x="40" y="545" font-family="sans-serif" font-size="17" fill="#80868b">자료: 국민건강보험공단 안내, 국민건강보험법 제91조 · 크라우드의 Money 정리</text></svg>