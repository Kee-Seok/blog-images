<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="sans-serif">
<rect width="900" height="470" fill="#ffffff"/>
<text x="450" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">빠진 이가 어땠나 — 상태로 갈리는 풀이</text>
<g font-size="20">
<rect x="40" y="90" width="260" height="300" rx="16" fill="#e6f4ea"/>
<text x="170" y="135" text-anchor="middle" font-weight="700" font-size="23" fill="#137333">썩은 이가 빠짐</text>
<text x="170" y="200" text-anchor="middle" fill="#202124">오래 끌던 걱정이</text>
<text x="170" y="232" text-anchor="middle" fill="#202124">떨어져 나간다</text>
<text x="170" y="300" text-anchor="middle" fill="#5f6368" font-size="18">좋은 쪽으로 보는</text>
<text x="170" y="326" text-anchor="middle" fill="#5f6368" font-size="18">풀이가 많아요</text>
<rect x="320" y="90" width="260" height="300" rx="16" fill="#e8f0fe"/>
<text x="450" y="135" text-anchor="middle" font-weight="700" font-size="23" fill="#1a73e8">다시 끼워 넣음</text>
<text x="450" y="200" text-anchor="middle" fill="#202124">멀어진 사이·잃은 것을</text>
<text x="450" y="232" text-anchor="middle" fill="#202124">되찾는다</text>
<text x="450" y="300" text-anchor="middle" fill="#5f6368" font-size="18">회복의 뜻으로</text>
<text x="450" y="326" text-anchor="middle" fill="#5f6368" font-size="18">풀이해요</text>
<rect x="600" y="90" width="260" height="300" rx="16" fill="#fef7e0"/>
<text x="730" y="135" text-anchor="middle" font-weight="700" font-size="23" fill="#b06000">멀쩡한 이가 빠짐</text>
<text x="730" y="200" text-anchor="middle" fill="#202124">가까운 사람 일로</text>
<text x="730" y="232" text-anchor="middle" fill="#202124">마음 쓸 일이 생긴다</text>
<text x="730" y="300" text-anchor="middle" fill="#5f6368" font-size="18">미리 연락 한 번</text>
<text x="730" y="326" text-anchor="middle" fill="#5f6368" font-size="18">하라는 뜻으로 읽어요</text>
</g>
<text x="450" y="440" text-anchor="middle" font-size="16" fill="#5f6368">전통 해몽에서 흔히 쓰는 풀이 · 오늘의 꿈 해몽 정리</text>
</svg>
