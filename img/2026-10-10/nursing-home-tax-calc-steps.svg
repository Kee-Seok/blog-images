<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="sans-serif">
<rect width="1000" height="560" fill="#ffffff"/>
<text x="500" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#202124">요양원 비용 연말정산 계산 순서 (4등급·연봉 5천만원 예)</text>
<g font-size="24" fill="#202124">
<rect x="60" y="90" width="880" height="80" rx="14" fill="#f1f3f4"/>
<text x="90" y="140">① 하루 본인부담금 16,308원 × 365일</text><text x="910" y="140" text-anchor="end" font-weight="700">5,952,420원</text>
<rect x="60" y="190" width="880" height="80" rx="14" fill="#fdecea"/>
<text x="90" y="240">② 식재료비·상급침실료·이미용비는 빼고 시작</text><text x="910" y="240" text-anchor="end" font-weight="700" fill="#c5221f">공제 대상 아님</text>
<rect x="60" y="290" width="880" height="80" rx="14" fill="#f1f3f4"/>
<text x="90" y="340">③ 총급여 5,000만원의 3% 문턱 빼기</text><text x="910" y="340" text-anchor="end" font-weight="700">− 1,500,000원</text>
<rect x="60" y="390" width="880" height="80" rx="14" fill="#f1f3f4"/>
<text x="90" y="440">④ 남은 4,452,420원 × 15%</text><text x="910" y="440" text-anchor="end" font-weight="700">667,863원</text>
</g>
<text x="500" y="520" text-anchor="middle" font-size="20" fill="#5f6368">수가: 보건복지부 2026년 노인요양시설 3~5등급 하루 81,540원, 본인부담 20% · 1년 내내 입소 가정</text>
</svg>
