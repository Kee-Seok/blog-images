<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="sans-serif">
<rect width="1000" height="470" fill="#ffffff"/>
<text x="40" y="58" font-size="30" font-weight="700" fill="#202124">4세대 실손, 큰 병원에서 주사 한 번 맞으면</text>
<text x="40" y="96" font-size="20" fill="#5f6368">아일리아 2mg · 산정특례 10% · 상급종합/종합병원 통원 공제 2만원</text>
<rect x="40" y="150" width="280" height="190" rx="16" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
