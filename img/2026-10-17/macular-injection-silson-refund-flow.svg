<text x="500" y="285" font-size="38" font-weight="700" text-anchor="middle" fill="#d93025">20,000원</text>
<text x="660" y="258" font-size="34" text-anchor="middle" fill="#5f6368">=</text>
<rect x="680" y="150" width="280" height="190" rx="16" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
<text x="820" y="215" font-size="23" text-anchor="middle" fill="#202124">돌려받는 돈</text>
<text x="820" y="285" font-size="38" font-weight="700" text-anchor="middle" fill="#188038">29,354원</text>
<text x="40" y="395" font-size="20" fill="#3c4043">공제는 급여 본인부담의 20%(9,871원)와 2만원 중 큰 쪽 → 2만원</text>
<text x="40" y="450" font-size="17" fill="#80868b">자료: 금융위원회 4세대 실손(2021.6.29) · 의약품안전나라 보험약가 · 시술료·진찰료 별도</text>
