<text x="180" y="285" font-size="38" font-weight="700" text-anchor="middle" fill="#1a73e8">49,354원</text>
<text x="340" y="258" font-size="34" text-anchor="middle" fill="#5f6368">−</text>
<rect x="360" y="150" width="280" height="190" rx="16" fill="#fce8e6" stroke="#d93025" stroke-width="2"/>
