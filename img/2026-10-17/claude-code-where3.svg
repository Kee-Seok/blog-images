<text x="400" y="312" text-anchor="middle" font-size="15" fill="#5f6368">셋 다 같은 유료 계정(Pro·Max·Team·Enterprise)으로 로그인 · 출처 code.claude.com 문서, 2026-10-17 확인</text>
