<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="sans-serif">
<rect width="1000" height="560" fill="#ffffff"/>
<text x="500" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#202124">일반 보일러 vs 친환경(콘덴싱) 보일러</text>
<rect x="60" y="90" width="420" height="380" rx="18" fill="#f1f3f4"/>
<rect x="520" y="90" width="420" height="380" rx="18" fill="#e6f4ea"/>
<text x="270" y="140" text-anchor="middle" font-size="26" font-weight="700" fill="#5f6368">일반 보일러</text>
<text x="730" y="140" text-anchor="middle" font-size="26" font-weight="700" fill="#137333">친환경 보일러</text>
<g font-size="22" fill="#202124" text-anchor="middle">
<text x="270" y="205">열효율 80% 내외</text><text x="730" y="205" font-weight="700">열효율 최대 97%</text>
<text x="270" y="270">배기가스 120도 이상</text><text x="730" y="270">배기가스 45도 내외</text>
<text x="270" y="335">질소산화물 평균 173ppm</text><text x="730" y="335">질소산화물 평균 20ppm</text>
<text x="270" y="400">가스비 연 100만원이면</text><text x="730" y="400" font-weight="700">약 13만원 절감</text>
<text x="270" y="440">그대로</text><text x="730" y="440">(구리시 안내 기준)</text>
</g>
<text x="500" y="520" text-anchor="middle" font-size="17" fill="#80868b">자료: 구리시청 가정용 친환경 보일러 설치 지원 안내 (2026년 9월 21일 수정)</text>
</svg>
