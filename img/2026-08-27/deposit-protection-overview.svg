<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%"
  style="font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif">
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="45" font-size="22" font-weight="bold" fill="#1a1a1a" text-anchor="middle">예금자보호 한도 1억원 — 금융회사별로 각각 보호</text>
<text x="400" y="72" font-size="14" font-weight="normal" fill="#666" text-anchor="middle">2025년 9월 1일부터 5천만원 → 1억원, 원금+이자 기준</text>
<rect x="30" y="100" width="180" height="120" fill="#f0f7ff" stroke="#5b9bd5" stroke-width="2" rx="8"/>
<text x="120" y="140" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">A은행</text>
<text x="120" y="168" font-size="14" font-weight="normal" fill="#555" text-anchor="middle">정기예금</text>
<text x="120" y="195" font-size="22" font-weight="bold" fill="#2e7d32" text-anchor="middle">1억 원</text>
<circle cx="120" cy="250" r="15.0" fill="#2e7d32"/><path d="M109.5,250 L117,260.5 L130.5,239.5 Z" fill="#fff"/>
<text x="120" y="295" font-size="15" font-weight="bold" fill="#2e7d32" text-anchor="middle">전액 보호</text>
<rect x="220" y="100" width="180" height="120" fill="#f0f7ff" stroke="#5b9bd5" stroke-width="2" rx="8"/>
<text x="310" y="140" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">B은행</text>
<text x="310" y="168" font-size="14" font-weight="normal" fill="#555" text-anchor="middle">정기예금</text>
<text x="310" y="195" font-size="22" font-weight="bold" fill="#2e7d32" text-anchor="middle">1억 원</text>
<circle cx="310" cy="250" r="15.0" fill="#2e7d32"/><path d="M299.5,250 L307,260.5 L320.5,239.5 Z" fill="#fff"/>
<text x="310" y="295" font-size="15" font-weight="bold" fill="#2e7d32" text-anchor="middle">전액 보호</text>
<rect x="410" y="100" width="180" height="120" fill="#f0f7ff" stroke="#5b9bd5" stroke-width="2" rx="8"/>
<text x="500" y="140" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">C은행</text>
<text x="500" y="168" font-size="14" font-weight="normal" fill="#555" text-anchor="middle">정기예금</text>
<text x="500" y="195" font-size="22" font-weight="bold" fill="#2e7d32" text-anchor="middle">1억 원</text>
<circle cx="500" cy="250" r="15.0" fill="#2e7d32"/><path d="M489.5,250 L497,260.5 L510.5,239.5 Z" fill="#fff"/>
<text x="500" y="295" font-size="15" font-weight="bold" fill="#2e7d32" text-anchor="middle">전액 보호</text>
<line x1="200" y1="270" x2="600" y2="270" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
<text x="400" y="300" font-size="14" font-weight="normal" fill="#555" text-anchor="middle">금융회사(지급주체)마다 각각 1억원 한도</text>
<rect x="100" y="330" width="600" height="70" fill="#f5f9fc" stroke="#5b9bd5" stroke-width="1.5" rx="8"/>
<text x="400" y="355" font-size="14" font-weight="normal" fill="#333" text-anchor="middle">같은 계열이라도 A은행·B은행·C은행은 서로 다른 지급주체</text>
<text x="400" y="380" font-size="14" font-weight="normal" fill="#333" text-anchor="middle">각각 1억원 보호 → 3개 은행에 1억씩 넣으면 총 3억 원까지 보호</text></svg>