<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Noto Sans KR, sans-serif">
  <rect width="1200" height="600" fill="#fff8f0"/>

  <!-- 제목 -->
  <text x="60" y="65" font-size="34" font-weight="700" fill="#202124">정기예금 가입할 때 꼭 봐야 할 4가지</text>
  <text x="60" y="103" font-size="18" fill="#5f6368">금리 숫자만 보고 1년 묶으면 생각보다 덜 받을 수 있습니다</text>

  <!-- 1단계 -->
  <rect x="60" y="160" width="260" height="110" rx="12" fill="#ffffff" stroke="#ffd9b3" stroke-width="2"/>
  <text x="80" y="190" font-size="20" font-weight="700" fill="#ff7a18">1단계</text>
  <text x="80" y="220" font-size="17" fill="#202124">표면 금리 확인</text>
  <text x="80" y="250" font-size="14" fill="#5f6368">우대 조건 붙은</text>
  <text x="80" y="270" font-size="14" fill="#5f6368">최고 금리인지 확인</text>

  <!-- 화살표 -->
  <path d="M 345 215 L 420 215" stroke="#ff7a18" stroke-width="3" marker-end="url(#arrow1)"/>

  <!-- 2단계 -->
  <rect x="425" y="160" width="260" height="110" rx="12" fill="#ffffff" stroke="#ffd9b3" stroke-width="2"/>
  <text x="445" y="190" font-size="20" font-weight="700" fill="#ff7a18">2단계</text>
  <text x="445" y="220" font-size="17" fill="#202124">실제 이자 계산</text>
  <text x="445" y="250" font-size="14" fill="#5f6368">세전 이자에서</text>
  <text x="445" y="270" font-size="14" fill="#5f6368">15.4% 세금 차감</text>

  <!-- 화살표 -->
  <path d="M 710 215 L 780 215" stroke="#ff7a18" stroke-width="3" marker-end="url(#arrow1)"/>
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#ff7a18"/>
    </marker>
  </defs>

  <!-- 3단계 -->
  <rect x="785" y="160" width="350" height="110" rx="12" fill="#ffffff" stroke="#ffd9b3" stroke-width="2"/>
  <text x="805" y="190" font-size="20" font-weight="700" fill="#ff7a18">3단계</text>
  <text x="805" y="220" font-size="17" fill="#202124">중도해지 조건 확인</text>
  <text x="805" y="250" font-size="14" fill="#5f6368">만기 전 해지 시</text>
  <text x="805" y="270" font-size="14" fill="#5f6368">이율 얼마나 낮아지는지</text>

  <!-- 세로 화살표 -->
  <path d="M 60 295 L 60 355" stroke="#ff7a18" stroke-width="3" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="3" refY="8" orient="auto">
      <path d="M 0 0 L 3 8 L 6 0 Z" fill="#ff7a18"/>
    </marker>
  </defs>

  <!-- 4단계 -->
  <rect x="60" y="355" width="1075" height="110" rx="12" fill="#ffffff" stroke="#1A73E8" stroke-width="2"/>
  <text x="80" y="385" font-size="20" font-weight="700" fill="#1A73E8">4단계</text>
  <text x="80" y="415" font-size="17" fill="#202124">가입 채널·만기 관리</text>
  <text x="80" y="445" font-size="15" fill="#5f6368">만기 알림 · 자동 재예치 · 앱 관리 · 예치 금액 구간 체크</text>

  <!-- 하단 요약 -->
  <rect x="60" y="500" width="1075" height="70" rx="8" fill="#f6f7f8"/>
  <text x="80" y="530" font-size="16" font-weight="700" fill="#202124">순서: 표면 금리 → 실제 이자 → 중도해지 → 가입 채널·만기 관리</text>
  <text x="80" y="555" font-size="14" fill="#5f6368">2026년 8월 기준 · 은행연합회 소비자포털 및 각 은행 정기예금 안내 참고</text>
</svg>
