<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%"
  style="font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif">
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="38" font-size="22" font-weight="bold" fill="#1a1a1a" text-anchor="middle">이자 때문에 한도를 넘기는 경우 — 원금+이자 기준</text>
<text x="400" y="62" font-size="14" font-weight="normal" fill="#666" text-anchor="middle">예시: 정기예금 1년, 연 2.5% 가정 (상품마다 금리 다름)</text>
<rect x="130" y="95" width="180" height="65" fill="#f0f7ff" stroke="#5b9bd5" stroke-width="2" rx="8"/>
<text x="220" y="122" font-size="14" font-weight="normal" fill="#555" text-anchor="middle">원금 (가입 시)</text>
<text x="220" y="150" font-size="22" font-weight="bold" fill="#1a1a1a" text-anchor="middle">9,800만 원</text>
<rect x="350" y="95" width="180" height="65" fill="#fff8e1" stroke="#f5a623" stroke-width="2" rx="8"/>
<text x="440" y="122" font-size="14" font-weight="normal" fill="#555" text-anchor="middle">만기 예상 이자 (연 2.5%)</text>
<text x="440" y="150" font-size="22" font-weight="bold" fill="#e67e22" text-anchor="middle">약 69만 원</text>
<line x1="305" y1="130" x2="395" y2="130" stroke="#999" stroke-width="2"/><polygon points="395,130 387,125 387,135" fill="#999"/>
<rect x="130" y="175" width="400" height="55" fill="#e8f4fd" stroke="#5b9bd5" stroke-width="2" rx="8"/>
<text x="330" y="198" font-size="14" font-weight="normal" fill="#555" text-anchor="middle">만기 예상 원리금 (원금+이자)</text>
<text x="330" y="226" font-size="20" font-weight="bold" fill="#1a1a1a" text-anchor="middle">약 1억 69만 원</text>
<line x1="535" y1="202" x2="575" y2="202" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6,4"/><polygon points="575,202 567,197 567,207" fill="#2e7d32"/>
<rect x="590" y="175" width="180" height="35" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="8"/>
<text x="680" y="195" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">1억 원까지 보호</text>
<circle cx="630" cy="202" r="8.0" fill="#2e7d32"/><path d="M624.4,202 L627,207.6 L635.6,196.4 Z" fill="#fff"/>
<rect x="590" y="218" width="180" height="35" fill="#ffebee" stroke="#c0392b" stroke-width="2" rx="8"/>
<text x="680" y="238" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">1억 초과분: 미보호</text>
<circle cx="630" cy="245" r="8.0" fill="#c0392b"/><text x="630" y="252" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">!</text>
<rect x="130" y="250" width="640" height="55" fill="#fff5f5" stroke="#c0392b" stroke-width="2" rx="8"/>
<text x="280" y="275" font-size="14" font-weight="normal" fill="#555" text-anchor="middle">실제 결과</text>
<text x="280" y="300" font-size="18" font-weight="bold" fill="#c0392b" text-anchor="middle">1억 원까지만 보호, 약 69만 원 손실</text></svg>