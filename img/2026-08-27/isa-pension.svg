<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect width="1200" height="560" fill="#ffffff"/>
  <style>
    text { font-family: sans-serif; fill: #1a1a1a; }
    .small { font-size: 20px; }
    .lg { font-size: 32px; font-weight: 700; }
    .highlight { fill: #2b6cb0; font-weight: 700; }
    .step { fill: #4a5568; }
  </style>

  <!-- 타이틀 -->
  <text x="600" y="50" text-anchor="middle" class="lg">연금계좌 이체: 세금을 미루고 낮추는 두 단계</text>
  <text x="600" y="80" text-anchor="middle" class="small" fill="#4a5568">ISA 만기 자금을 연금계좌로 옮기면 적용되는 두 가지 세금 효과</text>

  <!-- 단계 1: 과세이연 -->
  <rect x="60" y="120" width="520" height="220" rx="12" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="3"/>
  <text x="320" y="160" text-anchor="middle" class="lg" fill="#2b6cb0">1단계: 과세이연</text>
  <text x="320" y="200" text-anchor="middle" class="step">ISA 만기 때 세금을 바로 내지 않고</text>
  <text x="320" y="230" text-anchor="middle" class="step">연금으로 받을 때까지 미루는 효과</text>
  <line x1="120" y1="262" x2="520" y2="262" stroke="#2b6cb0" stroke-width="3"/>
  <text x="320" y="292" text-anchor="middle" class="step">만기 시 과세 대상에서 빠져나감 → 현금 흐름을 유연하게</text>
  <text x="320" y="322" text-anchor="middle" class="small" fill="#718096">시간이 흐르면서 자산이 더 불어날 여지가 생김</text>

  <!-- 단계 2: 낮은 세율 -->
  <rect x="620" y="120" width="520" height="220" rx="12" fill="#f0fff4" stroke="#276749" stroke-width="3"/>
  <text x="880" y="160" text-anchor="middle" class="lg" fill="#276749">2단계: 낮은 연금소득세율</text>
  <line x1="680" y1="192" x2="1080" y2="192" stroke="#c53030" stroke-width="3"/>
  <text x="880" y="216" text-anchor="middle" class="highlight" fill="#c53030">일반 종합소득세율: 6~45%</text>
  <text x="880" y="248" text-anchor="middle" class="step" fill="#718096">↓</text>
  <line x1="680" y1="280" x2="1080" y2="280" stroke="#276749" stroke-width="3"/>
  <text x="880" y="304" text-anchor="middle" class="highlight" fill="#276749">연금소득세율: 3~5% 수준</text>
  <text x="880" y="334" text-anchor="middle" class="small" fill="#718096">연금 수령 구간에서 적용</text>

  <!-- 실제 예시 -->
  <rect x="60" y="370" width="1080" height="160" rx="12" fill="#fffff0" stroke="#d69e2e" stroke-width="3"/>
  <text x="600" y="410" text-anchor="middle" class="lg" fill="#975a16">이자소득 3백만원으로 비교하면</text>
  <text x="200" y="450" class="small">ISA 만기 때 일반 과세: 3백만원 × 15.4% = 약 46만2천원</text>
  <text x="200" y="486" class="small" fill="#718096">→ 연금 수령 시: 3백만원 × 3~5% = 약 9만~15만원</text>
  <text x="600" y="450" text-anchor="middle" class="small" fill="#718096">← 여기 표시된 숫자는 ISA 원금 3천만원·수익 3백만원·세율 15.4% 기준이며,</text>
  <text x="600" y="486" text-anchor="middle" class="small" fill="#718096">실제 세율과 금액은 상품·수령 시점에 따라 달라질 수 있습니다</text>
</svg>
