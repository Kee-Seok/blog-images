<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Pretendard,Apple SD Gothic Neo,sans-serif"><rect width="1200" height="700" rx="28" fill="#ffffff"/><text x="600" y="80" font-size="46" font-weight="700" fill="#202124" text-anchor="middle">꿈속 엄마 표정별 풀이</text><rect x="60" y="130" width="1080" height="110" rx="18" fill="#f8f9fa" stroke="#1a73e8" stroke-width="3"/><circle cx="120" cy="185" r="30" fill="#1a73e8"/><text x="120" y="197" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="175" y="198" font-size="36" font-weight="700" fill="#202124">환하게 웃으심</text><text x="1110" y="198" font-size="32" fill="#1a73e8" text-anchor="end">근심이 풀리는 반가운 꿈</text><rect x="60" y="265" width="1080" height="110" rx="18" fill="#f8f9fa" stroke="#1e8e3e" stroke-width="3"/><circle cx="120" cy="320" r="30" fill="#1e8e3e"/><text x="120" y="332" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="175" y="333" font-size="36" font-weight="700" fill="#202124">말없이 지켜보심</text><text x="1110" y="333" font-size="32" fill="#1e8e3e" text-anchor="end">곁에서 살핀다는 뜻</text><rect x="60" y="400" width="1080" height="110" rx="18" fill="#f8f9fa" stroke="#e37400" stroke-width="3"/><circle cx="120" cy="455" r="30" fill="#e37400"/><text x="120" y="467" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="175" y="468" font-size="36" font-weight="700" fill="#202124">눈물을 흘리심</text><text x="1110" y="468" font-size="32" fill="#e37400" text-anchor="end">미룬 집안일을 챙기라는 꿈</text><rect x="60" y="535" width="1080" height="110" rx="18" fill="#f8f9fa" stroke="#9334e6" stroke-width="3"/><circle cx="120" cy="590" r="30" fill="#9334e6"/><text x="120" y="602" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="175" y="603" font-size="36" font-weight="700" fill="#202124">화를 내심</text><text x="1110" y="603" font-size="32" fill="#9334e6" text-anchor="end">서두르지 말고 살피라는 꿈</text><text x="600" y="680" font-size="24" fill="#5f6368" text-anchor="middle">전통 해몽 풀이 · 오늘의 꿈 해몽</text></svg>