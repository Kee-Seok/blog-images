<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="40" y="60" font-size="32" font-weight="700" fill="#202124">통원 실비 청구 서류, 금액에 따라 이렇게 늘어요</text>
<rect x="40" y="420" width="340" height="150" rx="14" fill="#e8f0fe"/><text x="210" y="470" font-size="28" font-weight="700" fill="#1a73e8" text-anchor="middle">3만원 미만</text><text x="210" y="515" font-size="24" fill="#202124" text-anchor="middle">진료비 영수증</text><text x="210" y="550" font-size="22" fill="#5f6368" text-anchor="middle">(+비급여면 세부내역서)</text>
<rect x="430" y="300" width="340" height="270" rx="14" fill="#d2e3fc"/><text x="600" y="350" font-size="28" font-weight="700" fill="#1a73e8" text-anchor="middle">3만~10만원</text><text x="600" y="400" font-size="24" fill="#202124" text-anchor="middle">영수증</text><text x="600" y="440" font-size="24" fill="#202124" text-anchor="middle">+ 질병코드 적힌 처방전</text><text x="600" y="490" font-size="22" fill="#5f6368" text-anchor="middle">진단서 필요 없음</text>
<rect x="820" y="170" width="340" height="400" rx="14" fill="#aecbfa"/><text x="990" y="220" font-size="28" font-weight="700" fill="#174ea6" text-anchor="middle">10만원 넘으면</text><text x="990" y="270" font-size="24" fill="#202124" text-anchor="middle">영수증 + 세부내역서</text><text x="990" y="310" font-size="24" fill="#202124" text-anchor="middle">+ 진단명 적힌 서류 1장</text><text x="990" y="360" font-size="22" fill="#5f6368" text-anchor="middle">진단서 또는</text><text x="990" y="392" font-size="22" fill="#5f6368" text-anchor="middle">질병코드 있는 확인서</text>
<text x="40" y="615" font-size="20" fill="#5f6368">출처: 금융감독원·생명보험협회·손해보험협회 실손의료보험 길라잡이(2015) · 2026-11-19 확인</text></svg>
