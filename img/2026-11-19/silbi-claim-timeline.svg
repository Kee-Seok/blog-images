<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="40" y="60" font-size="32" font-weight="700" fill="#202124">실비 청구 기간과 돈 들어오는 날</text>
<line x1="80" y1="250" x2="1120" y2="250" stroke="#dadce0" stroke-width="8"/>
<circle cx="120" cy="250" r="26" fill="#1a73e8"/><text x="120" y="320" font-size="24" font-weight="700" fill="#202124" text-anchor="middle">서류 접수</text>
<circle cx="420" cy="250" r="26" fill="#188038"/><text x="420" y="200" font-size="24" font-weight="700" fill="#188038" text-anchor="middle">3영업일 안</text><text x="420" y="320" font-size="22" fill="#202124" text-anchor="middle">보험금 지급 원칙</text>
<circle cx="700" cy="250" r="26" fill="#ea8600"/><text x="700" y="200" font-size="24" font-weight="700" fill="#ea8600" text-anchor="middle">10영업일 안</text><text x="700" y="320" font-size="22" fill="#202124" text-anchor="middle">조사가 필요할 때</text>
<circle cx="1060" cy="250" r="26" fill="#d93025"/><text x="1060" y="200" font-size="24" font-weight="700" fill="#d93025" text-anchor="middle">진료일부터 3년</text><text x="1060" y="320" font-size="22" fill="#202124" text-anchor="middle">지나면 청구권 사라짐</text>
<text x="40" y="420" font-size="22" fill="#202124">주말·공휴일은 영업일에서 빠져요 · 3년은 상법 제662조 소멸시효</text>
<text x="40" y="480" font-size="20" fill="#5f6368">출처: 금융감독원 보험금 청구 안내·상법 제662조 · 2026-11-19 확인</text></svg>
