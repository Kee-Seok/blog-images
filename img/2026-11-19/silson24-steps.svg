<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="40" y="60" font-size="32" font-weight="700" fill="#202124">실손24로 서류 없이 청구하는 순서</text>
<circle cx="90" cy="150" r="36" fill="#1a73e8"/><text x="90" y="162" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="150" y="145" font-size="27" font-weight="700" fill="#202124">다녀온 병원·약국이 연결됐는지 찾기</text><text x="150" y="182" font-size="22" fill="#5f6368">실손24 누리집 참여 요양기관 찾기</text>
<circle cx="90" cy="270" r="36" fill="#1a73e8"/><text x="90" y="282" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="150" y="265" font-size="27" font-weight="700" fill="#202124">실손24 앱에서 본인 인증</text><text x="150" y="302" font-size="22" fill="#5f6368">가입한 보험사 실손 계약이 불러와져요</text>
<circle cx="90" cy="390" r="36" fill="#1a73e8"/><text x="90" y="402" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="150" y="385" font-size="27" font-weight="700" fill="#202124">진료 내역 고르고 청구</text><text x="150" y="422" font-size="22" fill="#5f6368">병원이 서류를 보험사로 바로 보냄</text>
<circle cx="90" cy="510" r="36" fill="#188038"/><text x="90" y="522" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="150" y="505" font-size="27" font-weight="700" fill="#202124">연결 안 된 곳은 보험사 앱에 사진</text><text x="150" y="542" font-size="22" fill="#5f6368">2025-10-25부터 동네 의원·약국까지 확대 · 2026-11-19 확인</text></svg>
