<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#202124">신청 자격 — 두 가지를 모두 충족해야 합니다</text>
  <text x="450" y="74" text-anchor="middle" font-size="15" fill="#5f6368">하나만 해당돼서는 안 됩니다</text>

  <rect x="55" y="105" width="360" height="215" rx="12" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2"/>
  <text x="235" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#1a73e8">첫째 · 소득 기준</text>
  <line x1="85" y1="160" x2="385" y2="160" stroke="#1A73E8" stroke-width="1" opacity="0.4"/>
  <text x="235" y="192" text-anchor="middle" font-size="15" fill="#5f6368">아래 중 하나라도 받고 있으면 충족</text>
  <text x="235" y="228" text-anchor="middle" font-size="17" font-weight="700" fill="#202124">생계급여 · 의료급여</text>
  <text x="235" y="260" text-anchor="middle" font-size="17" font-weight="700" fill="#202124">주거급여 · 교육급여</text>
  <text x="235" y="296" text-anchor="middle" font-size="14" fill="#5f6368">수급자 본인 기준입니다</text>

  <text x="450" y="222" text-anchor="middle" font-size="30" font-weight="700" fill="#5f6368">+</text>

  <rect x="485" y="105" width="360" height="215" rx="12" fill="#FEF7E0" stroke="#F9AB00" stroke-width="2"/>
  <text x="665" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#b06000">둘째 · 세대원 특성 기준</text>
  <line x1="515" y1="160" x2="815" y2="160" stroke="#F9AB00" stroke-width="1" opacity="0.5"/>
  <text x="530" y="190" font-size="15" fill="#202124">노인 · 영유아 · 장애인</text>
  <text x="530" y="220" font-size="15" fill="#202124">임산부 · 중증질환자</text>
  <text x="530" y="250" font-size="15" fill="#202124">한부모가족 · 소년소녀가정</text>
  <text x="530" y="280" font-size="15" font-weight="700" fill="#b06000">다자녀세대</text>
  <text x="665" y="306" text-anchor="middle" font-size="14" fill="#5f6368">본인 또는 세대원에 해당자가 있으면 충족</text>

  <text x="450" y="358" text-anchor="middle" font-size="15" fill="#5f6368">애매하면 상담센터 1600-3190 으로 먼저 확인하세요</text>
</svg>
