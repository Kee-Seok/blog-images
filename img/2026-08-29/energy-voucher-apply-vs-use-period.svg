<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="900" height="330" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#202124">신청 기간과 사용 기간은 다릅니다</text>
  <text x="450" y="74" text-anchor="middle" font-size="15" fill="#5f6368">신청은 12월까지 받지만, 하절기분은 9월 30일이 지나면 못 씁니다</text>

  <rect x="70" y="105" width="760" height="52" rx="8" fill="#E6F4EA" stroke="#188038" stroke-width="2"/>
  <text x="95" y="138" font-size="16" font-weight="700" fill="#137333">신청 기간</text>
  <text x="805" y="138" text-anchor="end" font-size="18" font-weight="700" fill="#202124">2026년 6월 15일 ~ 12월 31일</text>

  <rect x="70" y="175" width="760" height="52" rx="8" fill="#FCE8E6" stroke="#D93025" stroke-width="2"/>
  <text x="95" y="208" font-size="16" font-weight="700" fill="#c5221f">하절기 사용</text>
  <text x="805" y="208" text-anchor="end" font-size="18" font-weight="700" fill="#202124">2026년 7월 1일 ~ 9월 30일</text>

  <rect x="70" y="245" width="760" height="52" rx="8" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2"/>
  <text x="95" y="278" font-size="16" font-weight="700" fill="#1a73e8">동절기 사용</text>
  <text x="805" y="278" text-anchor="end" font-size="18" font-weight="700" fill="#202124">2026년 10월 1일 ~ 2027년 5월 31일</text>
</svg>
