<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="Pretendard,Apple SD Gothic Neo,sans-serif"><rect width="1200" height="540" rx="28" fill="#ffffff"/><text x="600" y="70" font-size="38" font-weight="700" fill="#202124" text-anchor="middle">반대매매 담보비율, 오늘 할 일 세 가지</text><rect x="40" y="120" width="353" height="300" rx="20" fill="#f8f9fa" stroke="#1a73e8" stroke-width="3"/><circle cx="216" cy="175" r="30" fill="#1a73e8"/><text x="216" y="186" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="216" y="255" font-size="28" font-weight="700" fill="#202124" text-anchor="middle">내 비율 보기</text><text x="216" y="305" font-size="22" fill="#3c4043" text-anchor="middle">증권 앱</text><text x="216" y="343" font-size="22" fill="#3c4043" text-anchor="middle">신용 잔고 화면</text><rect x="423" y="120" width="353" height="300" rx="20" fill="#f8f9fa" stroke="#1a73e8" stroke-width="3"/><circle cx="599" cy="175" r="30" fill="#1a73e8"/><text x="599" y="186" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="599" y="255" font-size="28" font-weight="700" fill="#202124" text-anchor="middle">증권사 공지</text><text x="599" y="305" font-size="22" fill="#3c4043" text-anchor="middle">9일 전후</text><text x="599" y="343" font-size="22" fill="#3c4043" text-anchor="middle">담보비율 변경 공지</text><rect x="806" y="120" width="353" height="300" rx="20" fill="#f8f9fa" stroke="#1a73e8" stroke-width="3"/><circle cx="982" cy="175" r="30" fill="#1a73e8"/><text x="982" y="186" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="982" y="255" font-size="28" font-weight="700" fill="#202124" text-anchor="middle">부족분 대비</text><text x="982" y="305" font-size="22" fill="#3c4043" text-anchor="middle">추가 담보·상환</text><text x="982" y="343" font-size="22" fill="#3c4043" text-anchor="middle">가능 금액 확인</text><text x="600" y="490" font-size="22" fill="#5f6368" text-anchor="middle">담보비율 = 담보 평가금액 ÷ 신용융자금 × 100 (증권사마다 넣는 항목이 조금 다름)</text></svg>