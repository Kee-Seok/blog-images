<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="sans-serif">
<rect width="800" height="460" fill="#ffffff"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">수능 수험표 재발급, 시험장에서 이렇게</text>
<g font-size="19" fill="#202124">
<rect x="40" y="80" width="230" height="250" rx="14" fill="#f3f8ff" stroke="#1a73e8"/>
<text x="155" y="126" text-anchor="middle" font-size="34" font-weight="700" fill="#1a73e8">1</text>
<text x="155" y="176" text-anchor="middle" font-weight="700">챙긴다</text>
<text x="155" y="222" text-anchor="middle" font-size="17">원서와 같은 사진 1장</text>
<text x="155" y="250" text-anchor="middle" font-size="17">+ 실물 신분증</text>
<rect x="285" y="80" width="230" height="250" rx="14" fill="#f3f8ff" stroke="#1a73e8"/>
<text x="400" y="126" text-anchor="middle" font-size="34" font-weight="700" fill="#1a73e8">2</text>
<text x="400" y="176" text-anchor="middle" font-weight="700">찾아간다</text>
<text x="400" y="222" text-anchor="middle" font-size="17">배정된 시험장 안</text>
<text x="400" y="250" text-anchor="middle" font-size="17">시험관리본부</text>
<rect x="530" y="80" width="230" height="250" rx="14" fill="#fff8e1" stroke="#fbc400"/>
<text x="645" y="126" text-anchor="middle" font-size="34" font-weight="700" fill="#e37400">3</text>
<text x="645" y="176" text-anchor="middle" font-weight="700">시간 안에</text>
<text x="645" y="222" text-anchor="middle" font-size="17">오전 8시까지 본부</text>
<text x="645" y="250" text-anchor="middle" font-size="17">8시 10분 입실</text>
</g>
<text x="400" y="380" text-anchor="middle" font-size="17" fill="#202124">사진이 없으면 본부에 바로 알리고 안내를 따른다</text>
<text x="400" y="420" text-anchor="middle" font-size="15" fill="#5f6368">2026학년도 교육부 수험생 유의사항 보도 기준 · 2027학년도 유의사항 발표 후 다시 확인</text>
</svg>
