<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Pretendard,Apple SD Gothic Neo,sans-serif"><rect width="1200" height="800" rx="28" fill="#ffffff"/><text x="600" y="72" font-size="40" font-weight="700" fill="#202124" text-anchor="middle">로또 당첨 꿈해몽, 장면별로 흔히 보는 풀이</text><text x="70" y="140" font-size="26" font-weight="700" fill="#5f6368">꿈 장면</text><text x="430" y="140" font-size="26" font-weight="700" fill="#5f6368">흔한 풀이</text><rect x="50" y="165" width="1100" height="92" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="165" width="14" height="92" rx="7" fill="#1a73e8"/><text x="80" y="223" font-size="30" font-weight="700" fill="#202124">1등에 당첨됐다</text><text x="430" y="223" font-size="28" font-weight="400" fill="#202124">기대·바람이 커진 때</text><rect x="50" y="275" width="1100" height="92" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="275" width="14" height="92" rx="7" fill="#1e8e3e"/><text x="80" y="333" font-size="30" font-weight="700" fill="#202124">번호가 또렷이 보였다</text><text x="430" y="333" font-size="28" font-weight="400" fill="#202124">결정할 일을 앞둔 때</text><rect x="50" y="385" width="1100" height="92" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="385" width="14" height="92" rx="7" fill="#f29900"/><text x="80" y="443" font-size="30" font-weight="700" fill="#202124">당첨금을 받았다</text><text x="430" y="443" font-size="28" font-weight="400" fill="#202124">노력의 보상·인정</text><rect x="50" y="495" width="1100" height="92" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="495" width="14" height="92" rx="7" fill="#d93025"/><text x="80" y="553" font-size="30" font-weight="700" fill="#202124">남이 당첨됐다</text><text x="430" y="553" font-size="28" font-weight="400" fill="#202124">비교·조급함</text><rect x="50" y="605" width="1100" height="92" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="605" width="14" height="92" rx="7" fill="#5f6368"/><text x="80" y="663" font-size="30" font-weight="700" fill="#202124">당첨 용지를 잃었다</text><text x="430" y="663" font-size="28" font-weight="400" fill="#202124">놓칠까 하는 걱정</text><text x="600" y="770" font-size="22" fill="#5f6368" text-anchor="middle">전통 해몽과 흔한 풀이를 모은 것으로, 실제 당첨을 예고하지 않습니다</text></svg>