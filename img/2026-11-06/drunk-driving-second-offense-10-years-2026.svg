<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Pretendard,Apple SD Gothic Neo,sans-serif"><rect width="1200" height="560" rx="28" fill="#ffffff"/><text x="600" y="70" font-size="38" font-weight="700" fill="#202124" text-anchor="middle">음주운전 2회 벌금, 10년 시계가 핵심</text><rect x="40" y="130" width="260" height="300" rx="20" fill="#f8f9fa" stroke="#1a73e8" stroke-width="3"/><text x="170" y="200" font-size="30" font-weight="700" fill="#1a73e8" text-anchor="middle">처음</text><text x="170" y="270" font-size="22" fill="#202124" text-anchor="middle">수치별 표대로</text><text x="315" y="290" font-size="34" fill="#9aa0a6" text-anchor="middle">→</text><rect x="330" y="130" width="260" height="300" rx="20" fill="#f8f9fa" stroke="#5f6368" stroke-width="3"/><text x="460" y="200" font-size="30" font-weight="700" fill="#5f6368" text-anchor="middle">벌금 이상 확정</text><text x="460" y="270" font-size="22" fill="#202124" text-anchor="middle">그날부터 10년 시계</text><text x="605" y="290" font-size="34" fill="#9aa0a6" text-anchor="middle">→</text><rect x="620" y="130" width="260" height="300" rx="20" fill="#f8f9fa" stroke="#d93025" stroke-width="3"/><text x="750" y="200" font-size="30" font-weight="700" fill="#d93025" text-anchor="middle">10년 안 두 번째</text><text x="750" y="270" font-size="22" fill="#202124" text-anchor="middle">0.03~0.2%: 500만~2,000만원</text><text x="750" y="314" font-size="22" fill="#202124" text-anchor="middle">0.2%↑: 1,000만~3,000만원</text><text x="895" y="290" font-size="34" fill="#9aa0a6" text-anchor="middle">→</text><rect x="910" y="130" width="260" height="300" rx="20" fill="#f8f9fa" stroke="#d93025" stroke-width="3"/><text x="1040" y="200" font-size="30" font-weight="700" fill="#d93025" text-anchor="middle">면허</text><text x="1040" y="270" font-size="22" fill="#202124" text-anchor="middle">취소 + 2년 결격</text><text x="600" y="500" font-size="24" fill="#5f6368" text-anchor="middle">측정 거부 두 번째는 1~6년·500만~3,000만원 · 도로교통법 제148조의2 제1항, 제82조 제2항</text></svg>