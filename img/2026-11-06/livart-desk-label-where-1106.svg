<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="sans-serif">
<rect width="900" height="520" fill="#ffffff"/>
<text x="450" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">어디를 보면 되나 — 책상 상판 아래</text>
<rect x="120" y="110" width="520" height="34" rx="6" fill="#c8a97e" stroke="#8a6d45" stroke-width="2"/>
<text x="380" y="134" text-anchor="middle" font-size="18" fill="#3b2a14">책상 상판</text>
<rect x="160" y="150" width="300" height="90" rx="4" fill="#f3e6d3" stroke="#8a6d45" stroke-width="2"/>
<text x="310" y="190" text-anchor="middle" font-size="18" fill="#3b2a14">대 서랍</text>
<rect x="160" y="232" width="300" height="12" fill="#e53935"/>
<rect x="490" y="156" width="130" height="62" rx="4" fill="#fff8e1" stroke="#fbc400" stroke-width="3"/>
<text x="555" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#202124">표시 라벨</text>
<text x="555" y="204" text-anchor="middle" font-size="13" fill="#202124">모델코드·제조일</text>
<rect x="130" y="144" width="12" height="300" fill="#c8a97e"/><rect x="618" y="144" width="12" height="300" fill="#c8a97e"/>
<line x1="310" y1="250" x2="250" y2="330" stroke="#e53935" stroke-width="2"/>
<text x="60" y="355" font-size="19" font-weight="700" fill="#e53935">① 문제 부위: 대 서랍의 바닥판 일부</text>
<text x="60" y="382" font-size="16" fill="#202124">어린이제품 공통안전기준보다 납이 많이 나온 곳 → 이 부품을 무상교체</text>
<line x1="555" y1="222" x2="640" y2="410" stroke="#fbc400" stroke-width="2"/>
<text x="60" y="440" font-size="19" font-weight="700" fill="#b8860b">② 확인할 곳: '어린이제품안전특별법에 의한 표시' 라벨</text>
<text x="60" y="467" font-size="16" fill="#202124">모델코드(L7로 시작) + 제조일 두 칸을 아래 표와 맞춰 봅니다</text>
<text x="880" y="505" text-anchor="end" font-size="12" fill="#5f6368">출처: 제품안전정보센터 리콜 공지(현대리바트, 2026-10-30)</text>
</svg>
