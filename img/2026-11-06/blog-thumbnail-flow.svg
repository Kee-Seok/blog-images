<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="sans-serif">
<rect width="1000" height="560" fill="#ffffff"/>
<text x="500" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#202124">썸네일 한 장이 글에 붙기까지</text>
<g font-size="21" fill="#202124">
<rect x="40" y="100" width="280" height="150" rx="16" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="180" y="145" text-anchor="middle" font-weight="700">① 문구 파일</text>
<text x="180" y="182" text-anchor="middle">위 꼬리표·두 줄 제목</text>
<text x="180" y="212" text-anchor="middle">숫자 하나·블로그 이름</text>
<rect x="360" y="100" width="280" height="150" rx="16" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="500" y="145" text-anchor="middle" font-weight="700">② 글자 판(HTML)</text>
<text x="500" y="182" text-anchor="middle">정해 둔 색·글꼴·자리에</text>
<text x="500" y="212" text-anchor="middle">문구만 바꿔 끼움</text>
<rect x="680" y="100" width="280" height="150" rx="16" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="820" y="145" text-anchor="middle" font-weight="700">③ 크롬으로 찍기</text>
<text x="820" y="182" text-anchor="middle">화면 없는 크롬이</text>
<text x="820" y="212" text-anchor="middle">1200×1200 사진으로</text>
<rect x="680" y="330" width="280" height="150" rx="16" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
<text x="820" y="375" text-anchor="middle" font-weight="700">④ 내 저장소에 올림</text>
<text x="820" y="412" text-anchor="middle">무료 이미지 호스팅 대신</text>
<text x="820" y="442" text-anchor="middle">깃허브 + jsDelivr 주소</text>
<rect x="360" y="330" width="280" height="150" rx="16" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
<text x="500" y="375" text-anchor="middle" font-weight="700">⑤ 대표이미지 칸</text>
<text x="500" y="412" text-anchor="middle">본문에 넣는 것과 별개로</text>
<text x="500" y="442" text-anchor="middle">발행 창에 따로 올림</text>
<rect x="40" y="330" width="280" height="150" rx="16" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2"/>
<text x="180" y="375" text-anchor="middle" font-weight="700">⑥ 공개 주소 확인</text>
<text x="180" y="412" text-anchor="middle">og:image 가 kakaocdn</text>
<text x="180" y="442" text-anchor="middle">이면 통과, 기본 그림이면 실패</text>
</g>
<g stroke="#5f6368" stroke-width="3" fill="none"><path d="M322 175h34"/><path d="M642 175h34"/><path d="M820 252v74"/><path d="M678 405h-34"/><path d="M358 405h-34"/></g>
<g fill="#5f6368"><path d="M356 168l12 7-12 7z"/><path d="M676 168l12 7-12 7z"/><path d="M813 324l7 12 7-12z"/><path d="M646 398l-12 7 12 7z"/><path d="M326 398l-12 7 12 7z"/></g>
<text x="500" y="530" text-anchor="middle" font-size="18" fill="#5f6368">크라우드의 코드리뷰 · 이 계정이 매일 쓰는 순서 (2026년 11월 기준)</text>
</svg>
