<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="sans-serif">
<rect width="1000" height="600" fill="#ffffff"/>
<text x="500" y="54" text-anchor="middle" font-size="30" font-weight="700" fill="#202124">건강검진 대장내시경 비용 0원, 네 칸 다 맞나요?</text>
<g font-size="23" fill="#202124">
<rect x="70" y="100" width="860" height="100" rx="14" fill="#f3f8ff" stroke="#1a73e8" stroke-width="2"/>
<text x="110" y="160" font-weight="700" fill="#1a73e8">1</text><text x="160" y="145">50세 이상 건강보험 가입자인가요?</text><text x="160" y="178" font-size="18" fill="#5f6368">대장암 검진은 50세부터 1년마다</text>
<rect x="70" y="220" width="860" height="100" rx="14" fill="#f3f8ff" stroke="#1a73e8" stroke-width="2"/>
<text x="110" y="280" font-weight="700" fill="#1a73e8">2</text><text x="160" y="265">최근 5년 안에 건강보험 대장내시경을 안 받았나요?</text><text x="160" y="298" font-size="18" fill="#5f6368">받았다면 올해는 '유예', 원하면 등록 가능</text>
<rect x="70" y="340" width="860" height="100" rx="14" fill="#f3f8ff" stroke="#1a73e8" stroke-width="2"/>
<text x="110" y="400" font-weight="700" fill="#1a73e8">3</text><text x="160" y="385">대변검사(분변잠혈검사)를 먼저 받았나요?</text><text x="160" y="418" font-size="18" fill="#5f6368">건너뛰고 내시경부터면 검사비 전액 본인 부담</text>
<rect x="70" y="460" width="860" height="100" rx="14" fill="#f3f8ff" stroke="#1a73e8" stroke-width="2"/>
<text x="110" y="520" font-weight="700" fill="#1a73e8">4</text><text x="160" y="505">비수면으로, 용종 없이 끝났나요?</text><text x="160" y="538" font-size="18" fill="#5f6368">수면·용종 제거 추가 비용은 본인 부담</text>
</g>
<text x="500" y="588" text-anchor="middle" font-size="15" fill="#80868b">출처: 국민건강보험공단 암검진 실시안내 (2026년 11월 6일 확인)</text>
</svg>
