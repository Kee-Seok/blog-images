<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="sans-serif">
<rect width="1000" height="560" fill="#ffffff"/>
<text x="500" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#202124">대장내시경 날 영수증, 누가 내나요</text>
<text x="500" y="88" text-anchor="middle" font-size="19" fill="#5f6368">대변검사 양성 → 국가검진 2단계로 받은 경우</text>
<rect x="60" y="120" width="420" height="380" rx="18" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
<text x="270" y="170" text-anchor="middle" font-size="26" font-weight="700" fill="#188038">공단이 내는 돈</text>
<text x="100" y="235" font-size="22" fill="#202124">✔ 대변검사(분변잠혈검사)</text>
<text x="100" y="290" font-size="22" fill="#202124">✔ 대장내시경 검사비</text>
<text x="100" y="345" font-size="22" fill="#202124">✔ 필요할 때 하는 조직검사</text>
<text x="128" y="378" font-size="17" fill="#5f6368">(전부 또는 일부 지원)</text>
<text x="270" y="455" text-anchor="middle" font-size="19" fill="#202124">대장암 검진은 보험료와 상관없이</text>
<text x="270" y="482" text-anchor="middle" font-size="19" fill="#202124">공단 전액 부담</text>
<rect x="520" y="120" width="420" height="380" rx="18" fill="#fff8e1" stroke="#e8710a" stroke-width="2"/>
<text x="730" y="170" text-anchor="middle" font-size="26" font-weight="700" fill="#b06000">내가 내는 돈</text>
<text x="560" y="235" font-size="22" fill="#202124">● 수면 내시경 추가 비용</text>
<text x="560" y="290" font-size="22" fill="#202124">● 용종 제거 추가 비용</text>
<text x="730" y="370" text-anchor="middle" font-size="19" fill="#202124">금액은 병원·개수·방법마다 달라</text>
<text x="730" y="397" text-anchor="middle" font-size="19" fill="#202124">공식 기준 금액이 없어요</text>
<text x="730" y="455" text-anchor="middle" font-size="19" font-weight="700" fill="#b06000">예약할 때 미리 물어보기</text>
<text x="500" y="540" text-anchor="middle" font-size="15" fill="#80868b">출처: 국민건강보험공단 암검진 실시안내 · 국가암정보센터 국가암검진 사업 (2026년 11월 6일 확인)</text>
</svg>
