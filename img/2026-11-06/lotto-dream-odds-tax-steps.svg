<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="Pretendard,Apple SD Gothic Neo,sans-serif"><rect width="1200" height="540" rx="28" fill="#ffffff"/><text x="600" y="70" font-size="38" font-weight="700" fill="#202124" text-anchor="middle">꿈 꾸고 로또를 샀다면</text><rect x="40" y="120" width="353" height="300" rx="20" fill="#f8f9fa" stroke="#1a73e8" stroke-width="3"/><circle cx="216" cy="175" r="30" fill="#1a73e8"/><text x="216" y="186" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="216" y="255" font-size="28" font-weight="700" fill="#202124" text-anchor="middle">확률</text><text x="216" y="305" font-size="22" fill="#3c4043" text-anchor="middle">1등</text><text x="216" y="343" font-size="22" fill="#3c4043" text-anchor="middle">8,145,060분의 1</text><rect x="423" y="120" width="353" height="300" rx="20" fill="#f8f9fa" stroke="#1a73e8" stroke-width="3"/><circle cx="599" cy="175" r="30" fill="#1a73e8"/><text x="599" y="186" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="599" y="255" font-size="28" font-weight="700" fill="#202124" text-anchor="middle">세금</text><text x="599" y="305" font-size="22" fill="#3c4043" text-anchor="middle">3억까지 22%</text><text x="599" y="343" font-size="22" fill="#3c4043" text-anchor="middle">넘는 부분 33%</text><rect x="806" y="120" width="353" height="300" rx="20" fill="#f8f9fa" stroke="#1a73e8" stroke-width="3"/><circle cx="982" cy="175" r="30" fill="#1a73e8"/><text x="982" y="186" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="982" y="255" font-size="28" font-weight="700" fill="#202124" text-anchor="middle">계산</text><text x="982" y="305" font-size="22" fill="#3c4043" text-anchor="middle">당첨금 넣고</text><text x="982" y="343" font-size="22" fill="#3c4043" text-anchor="middle">실수령액 확인</text><text x="600" y="490" font-size="22" fill="#5f6368" text-anchor="middle">1등 확률은 45개 중 6개를 고르는 경우의 수(8,145,060) · 세율은 동행복권 안내 기준</text></svg>