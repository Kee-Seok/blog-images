<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="sans-serif">
<rect width="1000" height="620" fill="#ffffff"/>
<text x="500" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#202124">국가검진 대장내시경, 순서가 비용을 정해요</text>
<text x="500" y="88" text-anchor="middle" font-size="19" fill="#5f6368">50세 이상 · 1년마다 · 2026년 검진기간 1월 1일~12월 31일</text>
<rect x="60" y="130" width="400" height="110" rx="16" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="260" y="175" text-anchor="middle" font-size="24" font-weight="700" fill="#202124">1단계 대변검사</text>
<text x="260" y="210" text-anchor="middle" font-size="19" fill="#202124">분변잠혈검사 · 공단 전액 부담</text>
<line x1="260" y1="240" x2="260" y2="290" stroke="#5f6368" stroke-width="3"/>
<polygon points="250,285 270,285 260,300" fill="#5f6368"/>
<rect x="60" y="300" width="400" height="90" rx="16" fill="#fff8e1" stroke="#fbc400" stroke-width="2"/>
<text x="260" y="337" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">결과통보 15일 안</text>
<text x="260" y="369" text-anchor="middle" font-size="19" fill="#202124">'잠혈반응 있음'이면 다음 단계</text>
<line x1="260" y1="390" x2="260" y2="440" stroke="#5f6368" stroke-width="3"/>
<polygon points="250,435 270,435 260,450" fill="#5f6368"/>
<rect x="60" y="450" width="400" height="120" rx="16" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
<text x="260" y="492" text-anchor="middle" font-size="24" font-weight="700" fill="#202124">2단계 대장내시경</text>
<text x="260" y="526" text-anchor="middle" font-size="19" fill="#202124">검사비 0원 · 다음 해 1월 31일까지</text>
<text x="260" y="554" text-anchor="middle" font-size="17" fill="#5f6368">수면·용종 제거는 본인 부담</text>
<rect x="540" y="130" width="400" height="200" rx="16" fill="#fce8e6" stroke="#d93025" stroke-width="2"/>
<text x="740" y="180" text-anchor="middle" font-size="24" font-weight="700" fill="#202124">대변검사 없이</text>
<text x="740" y="214" text-anchor="middle" font-size="24" font-weight="700" fill="#202124">바로 대장내시경</text>
<text x="740" y="262" text-anchor="middle" font-size="26" font-weight="700" fill="#d93025">검사비 전액 본인 부담</text>
<text x="740" y="300" text-anchor="middle" font-size="17" fill="#5f6368">같은 검사라도 순서가 깨지면 지원 없음</text>
<rect x="540" y="370" width="400" height="200" rx="16" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="2"/>
<text x="740" y="415" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">이번 해 대상에서 '유예'</text>
<text x="740" y="455" text-anchor="middle" font-size="18" fill="#202124">최근 5년 안 건강보험 대장내시경</text>
<text x="740" y="485" text-anchor="middle" font-size="18" fill="#202124">대장암 산정특례 적용 중</text>
<text x="740" y="530" text-anchor="middle" font-size="17" fill="#5f6368">원하면 공단에 대상자 등록 가능</text>
<text x="500" y="605" text-anchor="middle" font-size="15" fill="#80868b">출처: 국민건강보험공단 암검진 실시안내 (2026년 11월 6일 확인)</text>
</svg>
