<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="Pretendard,Apple SD Gothic Neo,sans-serif"><rect width="1200" height="580" rx="28" fill="#ffffff"/><text x="600" y="72" font-size="40" font-weight="700" fill="#202124" text-anchor="middle">신용융자 담보비율 면제, 바뀌는 것과 그대로인 것</text><text x="70" y="140" font-size="26" font-weight="700" fill="#5f6368">항목</text><text x="430" y="140" font-size="26" font-weight="700" fill="#5f6368">11월 8일까지</text><text x="760" y="140" font-size="26" font-weight="700" fill="#5f6368">11월 9일부터 3개월</text><rect x="50" y="165" width="1100" height="92" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="165" width="14" height="92" rx="7" fill="#1a73e8"/><text x="80" y="223" font-size="30" font-weight="700" fill="#202124">법정 담보비율</text><text x="430" y="223" font-size="28" font-weight="400" fill="#202124">140% 이상 유지</text><text x="760" y="223" font-size="28" font-weight="400" fill="#202124">유지 의무 면제</text><rect x="50" y="275" width="1100" height="92" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="275" width="14" height="92" rx="7" fill="#1e8e3e"/><text x="80" y="333" font-size="30" font-weight="700" fill="#202124">증권사 내규 비율</text><text x="430" y="333" font-size="28" font-weight="400" fill="#202124">증권사마다 따로</text><text x="760" y="333" font-size="28" font-weight="400" fill="#202124">증권사가 조정 가능</text><rect x="50" y="385" width="1100" height="92" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="385" width="14" height="92" rx="7" fill="#f29900"/><text x="80" y="443" font-size="30" font-weight="700" fill="#202124">반대매매</text><text x="430" y="443" font-size="28" font-weight="400" fill="#202124">비율 미달 시 진행</text><text x="760" y="443" font-size="28" font-weight="400" fill="#202124">증권사 공지 기준</text><text x="600" y="550" font-size="22" fill="#5f6368" text-anchor="middle">출처: 정책브리핑 '증권사 신용융자 담보비율 의무 3개월 면제' (2026-11-06)</text></svg>