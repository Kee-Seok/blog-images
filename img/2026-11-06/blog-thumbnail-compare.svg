<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="sans-serif">
<rect width="1000" height="520" fill="#ffffff"/>
<text x="500" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#202124">그림을 그리게 할까, 글자 판을 찍게 할까</text>
<rect x="40" y="90" width="440" height="370" rx="18" fill="#fce8e6" stroke="#d93025" stroke-width="2"/>
<rect x="520" y="90" width="440" height="370" rx="18" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2"/>
<g font-size="22" fill="#202124">
<text x="260" y="138" text-anchor="middle" font-weight="700" font-size="25">AI 이미지 생성</text>
<text x="70" y="195">· 매번 비슷한 그림체로 수렴</text>
<text x="70" y="245">· 그림 속 한글이 깨지기 쉬움</text>
<text x="70" y="295">· 글에 없는 장면이 끼어듦</text>
<text x="70" y="345">· 같은 지시도 결과가 매번 다름</text>
<text x="70" y="395">· 임시 주소면 몇 시간 뒤 끊김</text>
<text x="740" y="138" text-anchor="middle" font-weight="700" font-size="25">글자 판 찍기</text>
<text x="550" y="195">· 문구가 글마다 달라 겹치지 않음</text>
<text x="550" y="245">· 글꼴이 그대로 찍혀 안 깨짐</text>
<text x="550" y="295">· 본문 숫자만 넣게 검사 가능</text>
<text x="550" y="345">· 같은 문구면 같은 결과</text>
<text x="550" y="395">· 내 저장소 주소라 안 끊김</text>
</g>
<text x="500" y="495" text-anchor="middle" font-size="18" fill="#5f6368">크라우드의 코드리뷰 · 이 계정 썸네일 도구 기준 정리</text>
</svg>
