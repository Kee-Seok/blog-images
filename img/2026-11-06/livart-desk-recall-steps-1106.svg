<g fill="#1a73e8"><polygon points="224,165 244,155 244,175"/><polygon points="444,165 464,155 464,175"/><polygon points="664,165 684,155 684,175"/></g>
<text x="450" y="290" text-anchor="middle" font-size="16" fill="#202124">회사가 11월 2일부터 구매자에게 전화·문자로 따로 알리고 있지만, 연락이 없어도 먼저 신청할 수 있어요</text>
<text x="880" y="340" text-anchor="end" font-size="12" fill="#5f6368">출처: 제품안전정보센터 리콜 공지 · 뉴스핌·메가경제 2026-11-05 보도</text>
