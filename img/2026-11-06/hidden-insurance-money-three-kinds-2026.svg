<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="Pretendard,Apple SD Gothic Neo,sans-serif"><rect width="1200" height="580" rx="28" fill="#ffffff"/><text x="600" y="72" font-size="40" font-weight="700" fill="#202124" text-anchor="middle">숨은 보험금 세 가지 (금융위원회 2025년 발표)</text><text x="70" y="140" font-size="26" font-weight="700" fill="#5f6368">종류</text><text x="430" y="140" font-size="26" font-weight="700" fill="#5f6368">언제 생기나</text><text x="760" y="140" font-size="26" font-weight="700" fill="#5f6368">규모</text><rect x="50" y="165" width="1100" height="92" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="165" width="14" height="92" rx="7" fill="#1a73e8"/><text x="80" y="223" font-size="30" font-weight="700" fill="#202124">중도보험금</text><text x="430" y="223" font-size="28" font-weight="400" fill="#202124">계약 유지 중 지급 조건 충족</text><text x="760" y="223" font-size="28" font-weight="400" fill="#202124">8조 4,083억원</text><rect x="50" y="275" width="1100" height="92" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="275" width="14" height="92" rx="7" fill="#1e8e3e"/><text x="80" y="333" font-size="30" font-weight="700" fill="#202124">만기보험금</text><text x="430" y="333" font-size="28" font-weight="400" fill="#202124">만기 뒤 아직 안 찾음</text><text x="760" y="333" font-size="28" font-weight="400" fill="#202124">2조 1,691억원</text><rect x="50" y="385" width="1100" height="92" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="385" width="14" height="92" rx="7" fill="#f29900"/><text x="80" y="443" font-size="30" font-weight="700" fill="#202124">휴면보험금</text><text x="430" y="443" font-size="28" font-weight="400" fill="#202124">소멸시효 지나 보관 중</text><text x="760" y="443" font-size="28" font-weight="400" fill="#202124">6,196억원</text><text x="600" y="550" font-size="22" fill="#5f6368" text-anchor="middle">출처: 정책브리핑 '내보험찾아줌에서 숨은보험금 11조 2천억원 찾아가세요' (금융위원회, 2025-06-30)</text></svg>