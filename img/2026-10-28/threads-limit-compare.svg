<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="800" height="420" fill="#ffffff"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">스레드 계정 정지 이유는 한도 초과가 아닐 때가 많다</text>
<text x="60" y="100" font-size="19" font-weight="700" fill="#202124">글 (24시간)</text>
<rect x="60" y="114" width="680" height="40" rx="8" fill="#dadce0"/>
<text x="730" y="141" text-anchor="end" font-size="18" fill="#202124">공식 API 한도 250개</text>
<rect x="60" y="164" width="11" height="40" rx="4" fill="#1a73e8"/>
<text x="84" y="191" font-size="18" fill="#1a73e8" font-weight="700">이 계정 최대 4개</text>
<text x="60" y="256" font-size="19" font-weight="700" fill="#202124">답글 (24시간)</text>
<rect x="60" y="270" width="680" height="40" rx="8" fill="#dadce0"/>
<text x="730" y="297" text-anchor="end" font-size="18" fill="#202124">공식 API 한도 1,000개</text>
<rect x="60" y="320" width="7" height="40" rx="3" fill="#1a73e8"/>
<text x="80" y="347" font-size="18" fill="#1a73e8" font-weight="700">큰 글 답글 하루 10건(5건×2회)</text>
<text x="400" y="400" text-anchor="middle" font-size="14" fill="#5f6368">한도: 메타 스레드 API 문서 · 이 계정: 실제 예약 작업 설정 (2026년 10월 28일)</text>
</svg>
