<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="sans-serif">
<rect width="960" height="540" fill="#ffffff"/>
<text x="40" y="58" font-size="29" font-weight="700" fill="#202124">요양병원 한 달 영수증, 실손에서 돌아오는 돈</text>
<text x="40" y="94" font-size="18" fill="#5f6368">4세대 실손 표준약관 보상 비율로 계산한 예시 (금융감독원 표준약관)</text>
<text x="40" y="160" font-size="22" font-weight="700" fill="#202124">급여 본인부담 60만원 → 80%</text>
<rect x="40" y="176" width="600" height="52" rx="10" fill="#dadce0"/>
<rect x="40" y="176" width="480" height="52" rx="10" fill="#1a73e8"/>
<text x="660" y="212" font-size="24" font-weight="700" fill="#1a73e8">48만원</text>
<text x="40" y="290" font-size="22" font-weight="700" fill="#202124">비급여 40만원 → 70% (비급여 특약)</text>
<rect x="40" y="306" width="400" height="52" rx="10" fill="#dadce0"/>
<rect x="40" y="306" width="280" height="52" rx="10" fill="#1a73e8"/>
<text x="460" y="342" font-size="24" font-weight="700" fill="#1a73e8">28만원</text>
<text x="40" y="420" font-size="22" font-weight="700" fill="#202124">간병인 비용 → 실손 보상 안 함</text>
<rect x="40" y="436" width="600" height="52" rx="10" fill="#fce8e6"/>
<text x="660" y="472" font-size="24" font-weight="700" fill="#d93025">0원</text>
<text x="920" y="520" font-size="16" fill="#5f6368" text-anchor="end">합계 76만원 · 가입 시기·특약에 따라 다름</text>
</svg>
