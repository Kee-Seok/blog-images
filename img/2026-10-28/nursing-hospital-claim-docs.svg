<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="sans-serif">
<rect width="960" height="540" fill="#ffffff"/>
<text x="40" y="58" font-size="29" font-weight="700" fill="#202124">요양병원 실비 청구 서류, 표준약관에 적힌 것</text>
<text x="40" y="94" font-size="18" fill="#5f6368">금융감독원 실손의료보험 표준약관 제7조(보험금의 청구)</text>
<g font-size="22" fill="#202124">
<rect x="40" y="130" width="420" height="160" rx="14" fill="#e8f0fe"/>
<text x="64" y="180" font-weight="700">① 보험금 청구서</text><text x="64" y="220" font-size="18" fill="#5f6368">보험사 양식 · 앱에서 작성</text>
<rect x="500" y="130" width="420" height="160" rx="14" fill="#e8f0fe"/>
<text x="524" y="180" font-weight="700">② 진료비 계산서(영수증)</text><text x="524" y="220" font-size="18" fill="#5f6368">원무과 · 퇴원 때 받는 것</text>
<rect x="40" y="320" width="420" height="160" rx="14" fill="#e8f0fe"/>
<text x="64" y="370" font-weight="700">③ 진료비 세부내역서</text><text x="64" y="410" font-size="18" fill="#5f6368">비급여 항목 이름이 보이는 서류</text>
<rect x="500" y="320" width="420" height="160" rx="14" fill="#e8f0fe"/>
<text x="524" y="370" font-weight="700">④ 입원치료확인서</text><text x="524" y="410" font-size="18" fill="#5f6368">입원 기간이 적힌 서류</text>
</g>
<text x="920" y="520" font-size="16" fill="#5f6368" text-anchor="end">대리 청구는 신분증과 인감증명서(또는 본인서명사실확인서)를 더 냄</text>
</svg>
