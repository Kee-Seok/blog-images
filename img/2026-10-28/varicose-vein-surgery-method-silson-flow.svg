<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="sans-serif">
<rect width="1200" height="760" fill="#ffffff"/>
<text x="600" y="70" text-anchor="middle" font-size="40" font-weight="700" fill="#202124">하지정맥류 수술 방법에 따라 실비 칸이 달라져요</text>
<rect x="430" y="110" width="340" height="80" rx="16" fill="#f1f3f4" stroke="#5f6368" stroke-width="2"/>
<text x="600" y="162" text-anchor="middle" font-size="30" font-weight="700" fill="#202124">하지정맥류 수술</text>
<path d="M600 190 L600 225 L300 225 L300 260 M600 225 L900 225 L900 260" stroke="#5f6368" stroke-width="4" fill="none"/>
<rect x="80" y="260" width="440" height="200" rx="18" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/>
<text x="300" y="315" text-anchor="middle" font-size="32" font-weight="700" fill="#1a73e8">정맥류 발거술</text>
<text x="300" y="365" text-anchor="middle" font-size="26" fill="#202124">건강보험 적용(급여)</text>
<text x="300" y="410" text-anchor="middle" font-size="26" fill="#202124">공단이 먼저 내고</text>
<text x="300" y="445" text-anchor="middle" font-size="26" fill="#202124">남은 본인부담을 실손 청구</text>
<rect x="680" y="260" width="440" height="200" rx="18" fill="#fef7e0" stroke="#e8710a" stroke-width="3"/>
<text x="900" y="315" text-anchor="middle" font-size="30" font-weight="700" fill="#b06000">고주파·레이저·베나실</text>
<text x="900" y="365" text-anchor="middle" font-size="26" fill="#202124">건강보험 미적용(비급여)</text>
<text x="900" y="410" text-anchor="middle" font-size="26" fill="#202124">수술비 전부를 실손에 청구</text>
<text x="900" y="445" text-anchor="middle" font-size="26" fill="#202124">치료 목적인지 심사</text>
<path d="M900 460 L900 520" stroke="#e8710a" stroke-width="4"/>
<rect x="560" y="520" width="580" height="190" rx="18" fill="#ffffff" stroke="#e8710a" stroke-width="3" stroke-dasharray="10 6"/>
<text x="850" y="572" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">두 조건을 모두 채워야 보상</text>
<text x="850" y="620" text-anchor="middle" font-size="24" fill="#202124">① 그 부위에 증상(또는 합병증 예방 목적)</text>
<text x="850" y="662" text-anchor="middle" font-size="24" fill="#202124">② 혈류 초음파에서 역류 0.5초 이상</text>
<text x="850" y="695" text-anchor="middle" font-size="20" fill="#5f6368">(대퇴정맥·슬와정맥은 1초 이상)</text>
<text x="80" y="600" font-size="22" fill="#5f6368">자료: 국민건강보험공단 건강보험 웹진,</text>
<text x="80" y="632" font-size="22" fill="#5f6368">금융감독원 치료 목적 판단 기준(2017년 1월 적용)</text>
</svg>
