<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="800" height="470" fill="#ffffff"/>
<text x="400" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">클로드 예약 작업 만드는 순서 (터미널 없이)</text>
<text x="400" y="76" text-anchor="middle" font-size="15" fill="#5f6368">Claude Code 공식 문서 '데스크톱 반복 작업 예약' (2026년 10월 확인)</text>
<g font-size="18" fill="#202124">
<rect x="40" y="100" width="340" height="70" rx="12" fill="#e8f0fe"/><text x="60" y="142" font-weight="700">① 데스크톱 앱 → Code 탭</text>
<rect x="420" y="100" width="340" height="70" rx="12" fill="#e8f0fe"/><text x="440" y="142" font-weight="700">② 사이드바 Routines</text>
<rect x="40" y="190" width="340" height="70" rx="12" fill="#e8f0fe"/><text x="60" y="232" font-weight="700">③ New routine → Local</text>
<rect x="420" y="190" width="340" height="90" rx="12" fill="#fef7e0"/><text x="440" y="224" font-weight="700">④ 이름·설명·지시·일정</text><text x="440" y="254" font-size="16">Manual·Hourly·Daily·Weekdays·Weekly</text>
<rect x="40" y="280" width="340" height="70" rx="12" fill="#e8f0fe"/><text x="60" y="322" font-weight="700">⑤ 작업 폴더 고르고 저장</text>
<rect x="420" y="300" width="340" height="90" rx="12" fill="#e6f4ea"/><text x="440" y="334" font-weight="700">⑥ Run now 한 번</text><text x="440" y="364" font-size="16">권한 묻는 창마다 always allow</text>
</g>
<text x="400" y="440" text-anchor="middle" font-size="16" fill="#5f6368">Claude Desktop 1.1.5368 이전 버전에는 로컬 예약 작업이 없습니다</text>
</svg>
