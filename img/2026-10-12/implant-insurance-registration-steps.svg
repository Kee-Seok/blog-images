<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="800" height="420" fill="#ffffff"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#202124">건강보험 임플란트, 등록이 먼저입니다</text>
<g font-size="17" fill="#202124">
<rect x="40" y="90" width="160" height="110" rx="12" fill="#e8f0fe"/><text x="120" y="130" text-anchor="middle" font-weight="700">① 치과 진료</text><text x="120" y="160" text-anchor="middle">대상자인지</text><text x="120" y="182" text-anchor="middle">판정</text>
<rect x="225" y="90" width="160" height="110" rx="12" fill="#e8f0fe"/><text x="305" y="130" text-anchor="middle" font-weight="700">② 등록 신청</text><text x="305" y="160" text-anchor="middle">치과가 공단에</text><text x="305" y="182" text-anchor="middle">대신 접수</text>
<rect x="410" y="90" width="160" height="110" rx="12" fill="#e8f0fe"/><text x="490" y="130" text-anchor="middle" font-weight="700">③ 등록 확인</text><text x="490" y="160" text-anchor="middle">공단이 결과</text><text x="490" y="182" text-anchor="middle">통보</text>
<rect x="595" y="90" width="165" height="110" rx="12" fill="#fef7e0"/><text x="677" y="130" text-anchor="middle" font-weight="700">④ 시술 시작</text><text x="677" y="160" text-anchor="middle">진단→식립→</text><text x="677" y="182" text-anchor="middle">보철 3단계</text>
</g>
<text x="40" y="260" font-size="17" fill="#202124">• 평생 2개까지 (위·아래 구분 없음)</text>
<text x="40" y="295" font-size="17" fill="#202124">• 1단계를 시작한 치과에서 끝까지 — 중간에 옮기기 어렵습니다</text>
<text x="40" y="330" font-size="17" fill="#202124">• 일체형 재료·관골 식립·PFM 외 보철이면 전체가 비급여</text>
<text x="40" y="365" font-size="17" fill="#202124">• 본인부담상한제 계산에서 빠지는 항목</text>
<text x="40" y="400" font-size="14" fill="#5f6368">출처: 국민건강보험공단 치과임플란트 급여안내·Q&amp;A (2026년 10월 12일 확인)</text>
</svg>
