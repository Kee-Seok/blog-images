<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="sans-serif">
<rect width="900" height="520" fill="#ffffff"/>
<text x="450" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">고양이 새끼 낳는 꿈 — 누가 꿨나로 갈리는 풀이</text>
<rect x="60" y="100" width="370" height="170" rx="18" fill="#fef7e0" stroke="#fbbc04" stroke-width="3"/>
<text x="245" y="150" text-anchor="middle" font-size="24" font-weight="700" fill="#202124">아이를 기다리는 사람</text>
<text x="245" y="195" text-anchor="middle" font-size="21" fill="#202124">태몽으로 보는 풀이가 많음</text>
<text x="245" y="232" text-anchor="middle" font-size="18" fill="#5f6368">본인·배우자·가족이 꾼 경우</text>
<rect x="470" y="100" width="370" height="170" rx="18" fill="#e6f4ea" stroke="#34a853" stroke-width="3"/>
<text x="655" y="150" text-anchor="middle" font-size="24" font-weight="700" fill="#202124">그 밖의 사람</text>
<text x="655" y="195" text-anchor="middle" font-size="21" fill="#202124">재물·일이 늘어나는 뜻</text>
<text x="655" y="232" text-anchor="middle" font-size="18" fill="#5f6368">새 일·작은 수입이 생김</text>
<rect x="160" y="310" width="580" height="120" rx="18" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/>
<text x="450" y="355" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">새끼가 건강하고 무사했나요?</text>
<text x="450" y="395" text-anchor="middle" font-size="20" fill="#202124">건강하면 좋게, 다치거나 사라지면 잠시 미뤄짐으로 풀이</text>
<text x="450" y="490" text-anchor="middle" font-size="16" fill="#5f6368">흔히 전해지는 해몽일 뿐, 실제 일을 예언하지 않아요</text>
</svg>
