<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="sans-serif">
<rect width="900" height="520" fill="#ffffff"/>
<text x="450" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">고양이 밥주는 꿈 — 고양이 반응으로 보는 풀이</text>
<rect x="60" y="100" width="240" height="250" rx="18" fill="#e6f4ea"/>
<text x="180" y="150" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">잘 받아먹음</text>
<text x="180" y="200" text-anchor="middle" font-size="19" fill="#202124">베푼 만큼</text>
<text x="180" y="230" text-anchor="middle" font-size="19" fill="#202124">돌아오는 일</text>
<rect x="330" y="100" width="240" height="250" rx="18" fill="#fef7e0"/>
<text x="450" y="150" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">여러 마리가 몰려옴</text>
<text x="450" y="200" text-anchor="middle" font-size="19" fill="#202124">챙길 사람이 늘어남</text>
<text x="450" y="230" text-anchor="middle" font-size="19" fill="#202124">지출도 같이 늘어남</text>
<rect x="600" y="100" width="240" height="250" rx="18" fill="#fce8e6"/>
<text x="720" y="150" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">안 먹고 할큄</text>
<text x="720" y="200" text-anchor="middle" font-size="19" fill="#202124">호의가 오해로</text>
<text x="720" y="230" text-anchor="middle" font-size="19" fill="#202124">돌아올 수 있음</text>
<text x="450" y="410" text-anchor="middle" font-size="21" fill="#202124">새끼 고양이에게 줬다면 → 돌볼 대상(아이·후배·새 일)이 생김</text>
<text x="450" y="490" text-anchor="middle" font-size="16" fill="#5f6368">흔히 전해지는 해몽일 뿐, 실제 일을 예언하지 않아요</text>
</svg>
