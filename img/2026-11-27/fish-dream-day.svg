<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="sans-serif">
<rect width="800" height="560" fill="#ffffff"/>
<text x="400" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">물고기 꿈 꾼 날 해 볼 일</text>
<rect x="40" y="85" width="350" height="190" rx="16" fill="#e8f5e9"/>
<text x="215" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1e7e34">잡은 꿈이라면</text>
<text x="215" y="180" text-anchor="middle" font-size="19" fill="#202124">미뤄 둔 신청·연락</text>
<text x="215" y="210" text-anchor="middle" font-size="19" fill="#202124">오늘 하나 해 보기</text>
<rect x="410" y="85" width="350" height="190" rx="16" fill="#e8f0fe"/>
<text x="585" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1a56db">놓친 꿈이라면</text>
<text x="585" y="180" text-anchor="middle" font-size="19" fill="#202124">놓친 연락 있는지</text>
<text x="585" y="210" text-anchor="middle" font-size="19" fill="#202124">메시지함 한 번 보기</text>
<rect x="40" y="295" width="350" height="190" rx="16" fill="#fff8e1"/>
<text x="215" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#b06000">태몽 같다면</text>
<text x="215" y="390" text-anchor="middle" font-size="19" fill="#202124">꿈 날짜 적어 두기</text>
<text x="215" y="420" text-anchor="middle" font-size="19" fill="#202124">성별은 꿈으로 몰라요</text>
<rect x="410" y="295" width="350" height="190" rx="16" fill="#fce8e6"/>
<text x="585" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#c5221f">로또가 떠오르면</text>
<text x="585" y="390" text-anchor="middle" font-size="19" fill="#202124">재미로 정한 만큼만</text>
<text x="585" y="420" text-anchor="middle" font-size="19" fill="#202124">꿈 때문에 더 쓰지 않기</text>
<text x="400" y="520" text-anchor="middle" font-size="16" fill="#5f6368">전통 해몽 풀이 · 오늘의 꿈 해몽</text></svg>