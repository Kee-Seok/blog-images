<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="sans-serif">
<rect width="800" height="560" fill="#ffffff"/>
<text x="400" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">물고기 꿈 네 갈래</text>
<rect x="40" y="85" width="350" height="190" rx="16" fill="#e8f5e9"/>
<text x="215" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1e7e34">잡거나 받음</text>
<text x="215" y="180" text-anchor="middle" font-size="19" fill="#202124">내 손에 들어옴</text>
<text x="215" y="210" text-anchor="middle" font-size="19" fill="#202124">재물·기회가 오는 쪽</text>
<rect x="410" y="85" width="350" height="190" rx="16" fill="#e8f0fe"/>
<text x="585" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1a56db">보기만 함</text>
<text x="585" y="180" text-anchor="middle" font-size="19" fill="#202124">헤엄치는 걸 구경</text>
<text x="585" y="210" text-anchor="middle" font-size="19" fill="#202124">기회가 곁을 지나감</text>
<rect x="40" y="295" width="350" height="190" rx="16" fill="#fff8e1"/>
<text x="215" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#b06000">놓치거나 도망</text>
<text x="215" y="390" text-anchor="middle" font-size="19" fill="#202124">손에서 빠져나감</text>
<text x="215" y="420" text-anchor="middle" font-size="19" fill="#202124">아쉬움·때를 놓침</text>
<rect x="410" y="295" width="350" height="190" rx="16" fill="#fce8e6"/>
<text x="585" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#c5221f">죽어 있음</text>
<text x="585" y="390" text-anchor="middle" font-size="19" fill="#202124">배를 뒤집고 뜸</text>
<text x="585" y="420" text-anchor="middle" font-size="19" fill="#202124">일이 막히는 쪽</text>
<text x="400" y="520" text-anchor="middle" font-size="16" fill="#5f6368">전통 해몽 풀이 · 오늘의 꿈 해몽</text></svg>