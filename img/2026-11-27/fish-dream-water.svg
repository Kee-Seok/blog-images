<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="sans-serif">
<rect width="800" height="560" fill="#ffffff"/>
<text x="400" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">물이 맑았나 흐렸나</text>
<rect x="40" y="85" width="350" height="190" rx="16" fill="#e8f5e9"/>
<text x="215" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1e7e34">맑은 물</text>
<text x="215" y="180" text-anchor="middle" font-size="19" fill="#202124">바닥이 보임</text>
<text x="215" y="210" text-anchor="middle" font-size="19" fill="#202124">일이 술술 풀림</text>
<rect x="410" y="85" width="350" height="190" rx="16" fill="#e8f0fe"/>
<text x="585" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1a56db">흙탕물</text>
<text x="585" y="180" text-anchor="middle" font-size="19" fill="#202124">앞이 안 보임</text>
<text x="585" y="210" text-anchor="middle" font-size="19" fill="#202124">판단을 미룰 때</text>
<rect x="40" y="295" width="350" height="190" rx="16" fill="#fff8e1"/>
<text x="215" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#b06000">어항</text>
<text x="215" y="390" text-anchor="middle" font-size="19" fill="#202124">좁은 곳에 가둠</text>
<text x="215" y="420" text-anchor="middle" font-size="19" fill="#202124">가진 것을 지킴</text>
<rect x="410" y="295" width="350" height="190" rx="16" fill="#fce8e6"/>
<text x="585" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#c5221f">바다·강</text>
<text x="585" y="390" text-anchor="middle" font-size="19" fill="#202124">넓은 물에서 놂</text>
<text x="585" y="420" text-anchor="middle" font-size="19" fill="#202124">큰 판·먼 길</text>
<text x="400" y="520" text-anchor="middle" font-size="16" fill="#5f6368">전통 해몽 풀이 · 오늘의 꿈 해몽</text></svg>