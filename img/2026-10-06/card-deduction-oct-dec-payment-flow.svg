<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="sans-serif">
<rect width="900" height="560" fill="#ffffff"/>
<text x="450" y="48" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">10~12월 결제수단 고르는 순서</text>
<rect x="250" y="80" width="400" height="70" rx="12" fill="#f1f3f4" stroke="#dadce0"/>
<text x="450" y="112" text-anchor="middle" font-size="21" font-weight="700" fill="#202124">① 1~9월 카드·현금영수증 합계 확인</text>
<text x="450" y="138" text-anchor="middle" font-size="16" fill="#5f6368">카드사 앱 · 홈택스</text>
<line x1="450" y1="150" x2="450" y2="190" stroke="#5f6368" stroke-width="3"/>
<rect x="200" y="190" width="500" height="80" rx="12" fill="#fffaf0" stroke="#f5dfae"/>
<text x="450" y="225" text-anchor="middle" font-size="21" font-weight="700" fill="#202124">② 연말까지 합계가 총급여의 25%를 넘나?</text>
<text x="450" y="253" text-anchor="middle" font-size="16" fill="#5f6368">총급여 4,000만원이면 1,000만원</text>
<line x1="330" y1="270" x2="230" y2="330" stroke="#5f6368" stroke-width="3"/>
<line x1="570" y1="270" x2="670" y2="330" stroke="#5f6368" stroke-width="3"/>
<text x="250" y="305" text-anchor="middle" font-size="18" font-weight="700" fill="#5f6368">못 넘음</text>
<text x="650" y="305" text-anchor="middle" font-size="18" font-weight="700" fill="#1a73e8">넘음</text>
<rect x="40" y="330" width="380" height="180" rx="12" fill="#f1f3f4" stroke="#dadce0"/>
<text x="230" y="375" text-anchor="middle" font-size="20" font-weight="700" fill="#202124">어떤 수단이든 공제 0원</text>
<text x="230" y="412" text-anchor="middle" font-size="17" fill="#202124">공제보다 카드 할인·포인트가</text>
<text x="230" y="438" text-anchor="middle" font-size="17" fill="#202124">더 큰 쪽으로 결제</text>
<rect x="480" y="330" width="380" height="180" rx="12" fill="#e8f0fe" stroke="#aecbfa"/>
<text x="670" y="375" text-anchor="middle" font-size="20" font-weight="700" fill="#202124">넘는 몫은 30·40% 쪽으로</text>
<text x="670" y="412" text-anchor="middle" font-size="17" fill="#202124">체크카드·현금영수증 30%</text>
<text x="670" y="438" text-anchor="middle" font-size="17" fill="#202124">전통시장·대중교통 40%</text>
<text x="670" y="464" text-anchor="middle" font-size="17" fill="#202124">신용카드는 15%</text>
<text x="450" y="545" text-anchor="middle" font-size="15" fill="#80868b">조세특례제한법 제126조의2 (2026년 10월 확인) 기준</text>
</svg>
