<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="40" y="60" font-size="32" font-weight="700" fill="#202124">65세 건강보험 임플란트, 시술 전에 이 순서</text><circle cx="90" cy="150" r="38" fill="#1a73e8"/><text x="90" y="162" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="150" y="140" font-size="27" font-weight="700" fill="#202124">치과 진료</text><text x="150" y="180" font-size="23" fill="#202124">치과에서 건강보험 임플란트 대상인지 판정</text><circle cx="90" cy="275" r="38" fill="#1a73e8"/><text x="90" y="287" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="150" y="265" font-size="27" font-weight="700" fill="#202124">등록 신청</text><text x="150" y="305" font-size="23" fill="#202124">치과가 공단에 대상자 등록을 대신 신청</text><circle cx="90" cy="400" r="38" fill="#1a73e8"/><text x="90" y="412" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="150" y="390" font-size="27" font-weight="700" fill="#202124">등록 확인</text><text x="150" y="430" font-size="23" fill="#202124">공단이 등록 결과를 알려 주고 치과가 조회</text><circle cx="90" cy="525" r="38" fill="#1a73e8"/><text x="90" y="537" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="150" y="515" font-size="27" font-weight="700" fill="#202124">시술</text><text x="150" y="555" font-size="23" fill="#202124">등록된 치과에서 진단→식립→보철 3단계</text><text x="40" y="600" font-size="20" fill="#5f6368">출처: 국민건강보험공단 치과임플란트 급여안내 (2026-11-18 확인)</text></svg>