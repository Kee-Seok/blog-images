<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="40" y="60" font-size="32" font-weight="700" fill="#202124">65세 건강보험 임플란트, 2027년 1월부터 넓어져요</text><rect x="40" y="100" width="540" height="380" rx="16" fill="#f1f3f4"/><text x="70" y="150" font-size="28" font-weight="700" fill="#202124">지금 (2026년)</text><text x="70" y="205" font-size="23" fill="#202124">치아가 일부 남은 사람만</text><text x="70" y="245" font-size="23" fill="#202124">(부분 무치악)</text><text x="70" y="305" font-size="23" fill="#202124">한 턱에 치아가 하나도 없으면</text><text x="70" y="345" font-size="23" fill="#202124">시술 전체 비급여</text><text x="70" y="420" font-size="23" fill="#202124">평생 2개 · 본인부담 30%</text><text x="600" y="300" font-size="44" fill="#1a73e8" text-anchor="middle">→</text><rect x="620" y="100" width="540" height="380" rx="16" fill="#e8f0fe" stroke="#1a73e8" stroke-width="4"/><text x="650" y="150" font-size="28" font-weight="700" fill="#202124">2027년 1월 1일부터</text><text x="650" y="205" font-size="23" fill="#202124">위턱이나 아래턱에 치아가</text><text x="650" y="245" font-size="23" fill="#202124">하나도 없는 65세 이상도</text><text x="650" y="305" font-size="23" fill="#202124">임플란트 2개 건강보험</text><text x="650" y="345" font-size="23" fill="#202124">(완전 무치악 확대)</text><text x="650" y="420" font-size="23" fill="#202124">세부 기준은 고시 확인 필요</text><text x="40" y="530" font-size="20" fill="#5f6368">근거: 2026-09-08 건강보험정책심의위원회 의결 보도(치과신문 등)</text></svg>