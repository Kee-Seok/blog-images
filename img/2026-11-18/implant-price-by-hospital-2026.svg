<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="40" y="60" font-size="32" font-weight="700" fill="#202124">임플란트 1개 평균 가격, 어디서 하느냐에 따라</text><text x="40" y="100" font-size="22" fill="#5f6368">2026년 비급여 진료비 공개(복지부·심평원, 2026-09-03) · 전체 평균 118만1천원</text><text x="40" y="192" font-size="26" fill="#202124">치과의원</text><rect x="230" y="150" width="377" height="62" rx="8" fill="#1a73e8"/><text x="617" y="192" font-size="26" font-weight="700" fill="#202124">114만원</text><text x="40" y="302" font-size="26" fill="#202124">치과병원</text><rect x="230" y="260" width="579" height="62" rx="8" fill="#34a853"/><text x="819" y="302" font-size="26" font-weight="700" fill="#202124">174.8만원</text><text x="40" y="412" font-size="26" fill="#202124">병원급</text><rect x="230" y="370" width="589" height="62" rx="8" fill="#fbbc04"/><text x="829" y="412" font-size="26" font-weight="700" fill="#202124">177.8만원</text><text x="40" y="522" font-size="26" fill="#202124">상급종합병원</text><rect x="230" y="480" width="760" height="62" rx="8" fill="#ea4335"/><text x="1000" y="522" font-size="26" font-weight="700" fill="#202124">229.4만원</text><text x="40" y="610" font-size="20" fill="#5f6368">건강보험 적용 전 비급여 가격 평균. 뼈이식 등 추가 수술은 따로입니다.</text></svg>