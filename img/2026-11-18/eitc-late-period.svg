<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="sans-serif"><rect width="100%" height="100%" fill="#fff"/>
<text x="40" y="60" font-size="34" font-weight="700" fill="#202124">2025년 소득분 근로장려금, 언제 내면 얼마?</text>
<rect x="40" y="110" width="300" height="150" rx="16" fill="#e6f4ea" stroke="#34a853" stroke-width="4"/>
<text x="190" y="160" font-size="26" font-weight="700" fill="#202124" text-anchor="middle">정기신청</text>
<text x="190" y="200" font-size="22" fill="#202124" text-anchor="middle">5월 1일 ~ 6월 1일</text>
<text x="190" y="240" font-size="30" font-weight="700" fill="#188038" text-anchor="middle">100%</text>
<rect x="370" y="110" width="520" height="150" rx="16" fill="#fff8e1" stroke="#fbbc04" stroke-width="4"/>
<text x="630" y="160" font-size="26" font-weight="700" fill="#202124" text-anchor="middle">기한후신청 (지금)</text>
<text x="630" y="200" font-size="22" fill="#202124" text-anchor="middle">6월 2일 ~ 12월 1일(화)</text>
<text x="630" y="240" font-size="30" font-weight="700" fill="#b06000" text-anchor="middle">95% (5% 감액)</text>
<rect x="920" y="110" width="240" height="150" rx="16" fill="#fce8e6" stroke="#d93025" stroke-width="4"/>
<text x="1040" y="160" font-size="26" font-weight="700" fill="#202124" text-anchor="middle">12월 2일부터</text>
<text x="1040" y="200" font-size="22" fill="#202124" text-anchor="middle">신청 창 닫힘</text>
<text x="1040" y="240" font-size="30" font-weight="700" fill="#d93025" text-anchor="middle">0원</text>
<text x="40" y="330" font-size="26" fill="#202124">오늘(11월 18일)부터 마감일까지 오늘 포함 14일</text>
<text x="40" y="380" font-size="26" fill="#202124">신청한 날부터 4개월 안에 지급 (국세청 '심사 및 지급' 안내)</text>
<text x="40" y="430" font-size="26" fill="#202124">안내문 못 받았어도 요건만 맞으면 홈택스에서 직접 신청</text>
<text x="40" y="510" font-size="20" fill="#5f6368">출처: 국세청·정책브리핑 2026.11.3 안내, 2026.11.18 확인</text>
</svg>
