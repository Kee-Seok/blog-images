<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="sans-serif"><rect width="100%" height="100%" fill="#fff"/>
<text x="40" y="60" font-size="34" font-weight="700" fill="#202124">안내문을 받았나요? 길이 둘로 갈려요</text>
<rect x="40" y="100" width="540" height="420" rx="16" fill="#fff" stroke="#1a73e8" stroke-width="4"/>
<text x="310" y="150" font-size="28" font-weight="700" fill="#1a73e8" text-anchor="middle">안내문 받음</text>
<text x="70" y="210" font-size="24" fill="#202124">① 안내문 QR코드 찍기</text>
<text x="70" y="260" font-size="24" fill="#202124">② 카카오톡·문자 모바일 안내문</text>
<text x="70" y="310" font-size="24" fill="#202124">③ ARS 1544-9944</text>
<text x="100" y="350" font-size="21" fill="#5f6368">근로·자녀장려금 → 주민번호</text>
<text x="100" y="385" font-size="21" fill="#5f6368">→ 안내문의 개별인증번호</text>
<text x="70" y="440" font-size="24" fill="#202124">④ 홈택스·손택스도 가능</text>
<text x="70" y="490" font-size="22" fill="#188038">증빙서류 보통 필요 없음</text>
<rect x="620" y="100" width="540" height="420" rx="16" fill="#fff" stroke="#fbbc04" stroke-width="4"/>
<text x="890" y="150" font-size="28" font-weight="700" fill="#b06000" text-anchor="middle">안내문 못 받음</text>
<text x="650" y="210" font-size="24" fill="#202124">① 홈택스(PC) 또는 손택스 로그인</text>
<text x="650" y="260" font-size="24" fill="#202124">② 장려금·연말정산·기부금</text>
<text x="650" y="310" font-size="24" fill="#202124">③ 근로·자녀장려금 → 신청</text>
<text x="650" y="360" font-size="24" fill="#202124">④ 소득 증빙서류 첨부</text>
<text x="650" y="410" font-size="24" fill="#202124">⑤ 지급받을 계좌 입력·제출</text>
<text x="650" y="490" font-size="22" fill="#d93025">ARS로는 신청 안 돼요</text>
<text x="40" y="590" font-size="20" fill="#5f6368">출처: 국세청·정책브리핑 2026.11.3 안내, 2026.11.18 확인</text>
</svg>
