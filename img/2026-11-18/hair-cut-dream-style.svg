<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Pretendard,Apple SD Gothic Neo,sans-serif"><rect width="1200" height="760" rx="28" fill="#f8f9fa"/><text x="600" y="80" font-size="46" font-weight="700" fill="#202124" text-anchor="middle">머리 모양별 자르는 꿈 풀이</text><rect x="60" y="130" width="520" height="280" rx="20" fill="#ffffff" stroke="#1a73e8" stroke-width="4"/><text x="320.0" y="192" font-size="40" font-weight="700" fill="#1a73e8" text-anchor="middle">긴머리 → 단발</text><text x="320.0" y="252" font-size="32" fill="#202124" text-anchor="middle">미련을 내려놓는 정리</text><text x="320.0" y="298" font-size="32" fill="#202124" text-anchor="middle">시원했다면 새 출발</text><rect x="620" y="130" width="520" height="280" rx="20" fill="#ffffff" stroke="#1e8e3e" stroke-width="4"/><text x="880.0" y="192" font-size="40" font-weight="700" fill="#1e8e3e" text-anchor="middle">앞머리만 자름</text><text x="880.0" y="252" font-size="32" fill="#202124" text-anchor="middle">겉모습·첫인상을</text><text x="880.0" y="298" font-size="32" fill="#202124" text-anchor="middle">바꾸고 싶은 때</text><rect x="60" y="440" width="520" height="280" rx="20" fill="#ffffff" stroke="#e37400" stroke-width="4"/><text x="320.0" y="502" font-size="40" font-weight="700" fill="#e37400" text-anchor="middle">삭발·다 밀어 버림</text><text x="320.0" y="562" font-size="32" fill="#202124" text-anchor="middle">큰 결심, 지금까지와</text><text x="320.0" y="608" font-size="32" fill="#202124" text-anchor="middle">선을 긋는 결단</text><rect x="620" y="440" width="520" height="280" rx="20" fill="#ffffff" stroke="#9334e6" stroke-width="4"/><text x="880.0" y="502" font-size="40" font-weight="700" fill="#9334e6" text-anchor="middle">아주 짧게 자름</text><text x="880.0" y="562" font-size="32" fill="#202124" text-anchor="middle">짐을 덜어 내는 꿈</text><text x="880.0" y="608" font-size="32" fill="#202124" text-anchor="middle">후회했다면 한 번 더 생각</text><text x="600" y="745" font-size="24" fill="#5f6368" text-anchor="middle">전통 해몽 풀이 · 오늘의 꿈 해몽</text></svg>