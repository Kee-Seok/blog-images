<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="40" y="60" font-size="32" font-weight="700" fill="#202124">임플란트 1개, 내가 내는 돈은 자격에서 갈려요</text><text x="40" y="100" font-size="22" fill="#5f6368">건강보험 금액은 공단 Q&amp;A 치과의원 총진료비 119만6천~130만원 예시 기준</text><rect x="40" y="140" width="1120" height="104" rx="14" fill="#fff" stroke="#ea4335" stroke-width="4"/><text x="70" y="184" font-size="25" font-weight="700" fill="#202124">비급여(65세 미만·3개째부터)</text><text x="70" y="224" font-size="23" fill="#202124">내는 비율 100% · 치과의원 평균 114만원</text><rect x="40" y="264" width="1120" height="104" rx="14" fill="#fff" stroke="#1a73e8" stroke-width="4"/><text x="70" y="308" font-size="25" font-weight="700" fill="#202124">65세 이상 건강보험 가입자</text><text x="70" y="348" font-size="23" fill="#202124">내는 비율 30% · 약 35만9천~39만원</text><rect x="40" y="388" width="1120" height="104" rx="14" fill="#fff" stroke="#34a853" stroke-width="4"/><text x="70" y="432" font-size="25" font-weight="700" fill="#202124">차상위 만성질환·의료급여 2종</text><text x="70" y="472" font-size="23" fill="#202124">내는 비율 20% · 약 23만9천~26만원</text><rect x="40" y="512" width="1120" height="104" rx="14" fill="#fff" stroke="#fbbc04" stroke-width="4"/><text x="70" y="556" font-size="25" font-weight="700" fill="#202124">차상위 희귀난치·의료급여 1종</text><text x="70" y="596" font-size="23" fill="#202124">내는 비율 10% · 약 12만~13만원</text></svg>