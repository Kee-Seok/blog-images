<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="sans-serif"><rect width="100%" height="100%" fill="#fff"/>
<text x="40" y="60" font-size="34" font-weight="700" fill="#202124">신청한 날 + 4개월 = 늦어도 이때까지</text>
<g font-size="26" fill="#202124">
<rect x="40" y="100" width="1120" height="80" rx="12" fill="#f1f3f4"/><text x="70" y="150">11월 18일 신청</text><text x="600" y="150" font-weight="700">→ 2027년 3월 18일 무렵까지</text>
<rect x="40" y="195" width="1120" height="80" rx="12" fill="#f1f3f4"/><text x="70" y="245">11월 25일 신청</text><text x="600" y="245" font-weight="700">→ 2027년 3월 25일 무렵까지</text>
<rect x="40" y="290" width="1120" height="80" rx="12" fill="#fff8e1"/><text x="70" y="340">12월 1일(마감일) 신청</text><text x="600" y="340" font-weight="700">→ 2027년 4월 1일 무렵까지</text>
</g>
<text x="40" y="430" font-size="24" fill="#202124">심사가 빨리 끝나면 더 일찍 들어오기도 해요. 날짜 확정은 홈택스 '심사진행 상황'에서.</text>
<text x="40" y="510" font-size="20" fill="#5f6368">계산: 국세청 '기한 후 신청분 신청일로부터 4개월 이내 지급' 기준, 2026.11.18 확인</text>
</svg>
