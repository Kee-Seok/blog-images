<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="900" height="300" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#202124">오늘 할 수 있는 순서</text>
  <text x="450" y="74" text-anchor="middle" font-size="15" fill="#5f6368">1·2단계는 오늘 안에 끝납니다</text>
  <g font-size="16">
    <circle cx="110" cy="130" r="24" fill="#1A73E8"/><text x="110" y="137" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">1</text>
    <text x="152" y="126" font-weight="700" fill="#202124">내 점수 확인</text>
    <text x="152" y="150" fill="#5f6368">올크레딧·나이스지키미 둘 다 무료</text>

    <circle cx="110" cy="200" r="24" fill="#1A73E8"/><text x="110" y="207" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">2</text>
    <text x="152" y="196" font-weight="700" fill="#202124">통신비·건강보험·국민연금 등록</text>
    <text x="152" y="220" fill="#5f6368">마이데이터 메뉴에서 간편 등록</text>

    <circle cx="540" cy="130" r="24" fill="#9AA0A6"/><text x="540" y="137" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">3</text>
    <text x="582" y="126" font-weight="700" fill="#202124">공과금 자동이체 전환</text>
    <text x="582" y="150" fill="#5f6368">연체를 원천 차단</text>

    <circle cx="540" cy="200" r="24" fill="#9AA0A6"/><text x="540" y="207" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">4</text>
    <text x="582" y="196" font-weight="700" fill="#202124">연체는 오래된 것부터</text>
    <text x="582" y="220" fill="#5f6368">금액 순서가 아닙니다</text>
  </g>
  <text x="450" y="275" text-anchor="middle" font-size="15" fill="#5f6368">본인이 자기 점수를 조회하는 것은 점수에 영향을 주지 않습니다</text>
</svg>
