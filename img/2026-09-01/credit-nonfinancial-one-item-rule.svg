<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="900" height="340" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#202124">통신비는 여러 건 내도 1건으로만 반영됩니다</text>
  <text x="450" y="74" text-anchor="middle" font-size="15" fill="#5f6368">같은 종류를 채우지 말고 종류를 다르게 등록하세요</text>

  <rect x="55" y="105" width="380" height="200" rx="12" fill="#FCE8E6" stroke="#D93025" stroke-width="2"/>
  <text x="245" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#c5221f">이렇게 하면 손해</text>
  <line x1="85" y1="158" x2="405" y2="158" stroke="#D93025" stroke-width="1" opacity="0.4"/>
  <text x="100" y="192" font-size="16" fill="#202124">휴대폰 요금</text>
  <text x="100" y="224" font-size="16" fill="#202124">인터넷 요금</text>
  <text x="100" y="256" font-size="16" fill="#202124">TV 요금</text>
  <text x="245" y="290" text-anchor="middle" font-size="16" font-weight="700" fill="#c5221f">전부 통신비 = 1건</text>

  <rect x="465" y="105" width="380" height="200" rx="12" fill="#E6F4EA" stroke="#188038" stroke-width="2"/>
  <text x="655" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#137333">이렇게 하세요</text>
  <line x1="495" y1="158" x2="815" y2="158" stroke="#188038" stroke-width="1" opacity="0.4"/>
  <text x="510" y="192" font-size="16" fill="#202124">통신비</text>
  <text x="510" y="224" font-size="16" fill="#202124">건강보험</text>
  <text x="510" y="256" font-size="16" fill="#202124">국민연금</text>
  <text x="655" y="290" text-anchor="middle" font-size="16" font-weight="700" fill="#137333">종류가 달라 각각 반영</text>
</svg>
