<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="sans-serif">
<rect width="800" height="560" fill="#ffffff"/>
<text x="400" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">강아지에게 해 준 일</text>
<rect x="40" y="85" width="350" height="190" rx="16" fill="#e8f5e9"/>
<text x="215" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1e7e34">밥을 줌</text>
<text x="215" y="180" text-anchor="middle" font-size="19" fill="#202124">배불리 먹임</text>
<text x="215" y="210" text-anchor="middle" font-size="19" fill="#202124">챙긴 만큼 돌아옴</text>
<rect x="410" y="85" width="350" height="190" rx="16" fill="#e8f0fe"/>
<text x="585" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1a56db">목욕시킴</text>
<text x="585" y="180" text-anchor="middle" font-size="19" fill="#202124">깨끗이 씻김</text>
<text x="585" y="210" text-anchor="middle" font-size="19" fill="#202124">묵은 근심을 씻음</text>
<rect x="40" y="295" width="350" height="190" rx="16" fill="#fff8e1"/>
<text x="215" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#b06000">안아 줌</text>
<text x="215" y="390" text-anchor="middle" font-size="19" fill="#202124">내가 먼저 안음</text>
<text x="215" y="420" text-anchor="middle" font-size="19" fill="#202124">내 사람을 지킴</text>
<rect x="410" y="295" width="350" height="190" rx="16" fill="#fce8e6"/>
<text x="585" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#c5221f">내쫓음</text>
<text x="585" y="390" text-anchor="middle" font-size="19" fill="#202124">때리거나 쫓아냄</text>
<text x="585" y="420" text-anchor="middle" font-size="19" fill="#202124">관계를 끊는 쪽</text>
<text x="400" y="520" text-anchor="middle" font-size="16" fill="#5f6368">전통 해몽 풀이 · 오늘의 꿈 해몽</text></svg>