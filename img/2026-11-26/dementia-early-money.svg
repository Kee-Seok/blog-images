<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
<rect width="800" height="420" fill="#ffffff"/>
<text x="400" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">치매 초기증상 검사·약값, 나라가 대신 내 주는 돈</text>
<g font-size="22" fill="#202124">
<rect x="40" y="80" width="720" height="62" rx="10" fill="#f1f3f4"/><text x="64" y="120">선별검사 (치매안심센터)</text><text x="736" y="120" text-anchor="end" font-weight="700" fill="#1a73e8">0원</text>
<rect x="40" y="152" width="720" height="62" rx="10" fill="#f1f3f4"/><text x="64" y="192">진단검사 본인부담 지원</text><text x="736" y="192" text-anchor="end" font-weight="700" fill="#1a73e8">최대 15만원</text>
<rect x="40" y="224" width="720" height="62" rx="10" fill="#f1f3f4"/><text x="64" y="264">감별검사 (의원·병원·종합 / 상급종합)</text><text x="736" y="264" text-anchor="end" font-weight="700" fill="#1a73e8">8만 / 11만원</text>
<rect x="40" y="296" width="720" height="62" rx="10" fill="#f1f3f4"/><text x="64" y="336">치매 진단 뒤 약값 (치매치료관리비)</text><text x="736" y="336" text-anchor="end" font-weight="700" fill="#1a73e8">월 3만원</text>
</g>
<text x="400" y="398" text-anchor="middle" font-size="16" fill="#5f6368">보건복지부·시군구 보건소 안내 기준 상한 · 소득 기준은 주소지 센터마다 달라요</text>
