<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="sans-serif">
<rect width="800" height="560" fill="#ffffff"/>
<text x="400" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">강아지 꿈 꾼 날 해 볼 일</text>
<rect x="40" y="85" width="350" height="190" rx="16" fill="#e8f5e9"/>
<text x="215" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1e7e34">고마운 사람</text>
<text x="215" y="180" text-anchor="middle" font-size="19" fill="#202124">요즘 도와준 이</text>
<text x="215" y="210" text-anchor="middle" font-size="19" fill="#202124">안부 한 번</text>
<rect x="410" y="85" width="350" height="190" rx="16" fill="#e8f0fe"/>
<text x="585" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1a56db">말 한마디</text>
<text x="585" y="180" text-anchor="middle" font-size="19" fill="#202124">짖는 꿈이었다면</text>
<text x="585" y="210" text-anchor="middle" font-size="19" fill="#202124">오늘은 말 아끼기</text>
<rect x="40" y="295" width="350" height="190" rx="16" fill="#fff8e1"/>
<text x="215" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#b06000">떠난 반려견</text>
<text x="215" y="390" text-anchor="middle" font-size="19" fill="#202124">보고 싶었다면</text>
<text x="215" y="420" text-anchor="middle" font-size="19" fill="#202124">사진 한 장 꺼내 보기</text>
<rect x="410" y="295" width="350" height="190" rx="16" fill="#fce8e6"/>
<text x="585" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#c5221f">태몽이라면</text>
<text x="585" y="390" text-anchor="middle" font-size="19" fill="#202124">날짜 적어 두기</text>
<text x="585" y="420" text-anchor="middle" font-size="19" fill="#202124">성별은 꿈으로 몰라요</text>
<text x="400" y="520" text-anchor="middle" font-size="16" fill="#5f6368">전통 해몽 풀이 · 오늘의 꿈 해몽</text></svg>