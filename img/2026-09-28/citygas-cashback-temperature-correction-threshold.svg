<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="sans-serif">
<rect width="800" height="420" fill="#ffffff"/>
<text x="400" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#202124">기온이 1℃ 오르면 기준선이 5%p 밀려요</text>
<g font-size="16" fill="#202124">
<text x="60" y="110" font-weight="700">보정 없음</text>
<rect x="200" y="90" width="42" height="34" fill="#e8eaed"/><rect x="242" y="90" width="98" height="34" fill="#c6dafc"/><rect x="340" y="90" width="140" height="34" fill="#8ab4f8"/><rect x="480" y="90" width="140" height="34" fill="#4285f4"/>
<text x="221" y="148" text-anchor="middle" font-size="14">0~3%</text><text x="291" y="148" text-anchor="middle" font-size="14">3%~ 50원</text><text x="410" y="148" text-anchor="middle" font-size="14">10%~ 100원</text><text x="550" y="148" text-anchor="middle" font-size="14">20%~ 200원</text>
<text x="60" y="220" font-weight="700">1℃ 상승</text>
<rect x="200" y="200" width="112" height="34" fill="#e8eaed"/><rect x="312" y="200" width="98" height="34" fill="#c6dafc"/><rect x="410" y="200" width="140" height="34" fill="#8ab4f8"/><rect x="550" y="200" width="70" height="34" fill="#4285f4"/>
<text x="256" y="258" text-anchor="middle" font-size="14">0~8%</text><text x="361" y="258" text-anchor="middle" font-size="14">8%~ 50원</text><text x="480" y="258" text-anchor="middle" font-size="14">15%~ 100원</text><text x="585" y="258" text-anchor="middle" font-size="14">25%~</text>
<line x1="368" y1="70" x2="368" y2="300" stroke="#d93025" stroke-width="2" stroke-dasharray="6 5"/>
<text x="368" y="322" text-anchor="middle" fill="#d93025" font-weight="700">12% 줄인 집</text>
<text x="400" y="360" text-anchor="middle">보정 없음 48㎥ × 100원 = 4,800원  →  1℃ 상승 시 48㎥ × 50원 = 2,400원</text>
</g>
<text x="400" y="400" text-anchor="middle" font-size="13" fill="#80868b">출처: K-가스캐시백 제도 안내 온도 보정 예시(2026년 9월 기준) · 400㎥ 가정 계산</text>
</svg>
