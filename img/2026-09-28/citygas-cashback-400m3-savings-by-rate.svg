<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family="sans-serif">
<rect width="800" height="440" fill="#ffffff"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">도시가스 캐시백, 400㎥ 쓰던 집이 줄이면</text>
<text x="400" y="74" text-anchor="middle" font-size="16" fill="#5f6368">비교기간 4개월 400㎥ 기준 · 온도 보정 없는 경우 · 절감률별 단가 적용</text>
<g font-size="17" fill="#202124">
<rect x="80" y="330" width="120" height="20" fill="#9fc3f5"/>
<text x="140" y="320" text-anchor="middle" font-weight="700">1,000원</text>
<text x="140" y="378" text-anchor="middle">5% 절감</text><text x="140" y="400" text-anchor="middle" fill="#5f6368" font-size="14">20㎥ × 50원</text>
<rect x="250" y="230" width="120" height="120" fill="#6ea6f0"/>
<text x="310" y="220" text-anchor="middle" font-weight="700">6,000원</text>
<text x="310" y="378" text-anchor="middle">15% 절감</text><text x="310" y="400" text-anchor="middle" fill="#5f6368" font-size="14">60㎥ × 100원</text>
<rect x="420" y="150" width="120" height="200" fill="#3d86e6"/>
<text x="480" y="140" text-anchor="middle" font-weight="700">20,000원</text>
<text x="480" y="378" text-anchor="middle">25% 절감</text><text x="480" y="400" text-anchor="middle" fill="#5f6368" font-size="14">100㎥ × 200원</text>
<rect x="590" y="110" width="120" height="240" fill="#1a73e8"/>
<text x="650" y="100" text-anchor="middle" font-weight="700">24,000원</text>
<text x="650" y="378" text-anchor="middle">30% 절감</text><text x="650" y="400" text-anchor="middle" fill="#5f6368" font-size="14">120㎥ × 200원</text>
</g>
<line x1="60" y1="350" x2="740" y2="350" stroke="#9aa0a6"/>
<text x="400" y="430" text-anchor="middle" font-size="13" fill="#80868b">출처: K-가스캐시백 제도 안내(2026년 9월 기준) 단가로 계산</text>
</svg>
