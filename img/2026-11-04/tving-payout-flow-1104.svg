<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
<rect width="720" height="300" fill="#ffffff"/>
<text x="360" y="40" text-anchor="middle" font-size="23" font-weight="700" fill="#202124">티빙 보상 지급 확인, 세 칸이면 끝</text>
<g font-size="17" fill="#202124" text-anchor="middle">
<rect x="30" y="72" width="200" height="130" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="130" y="108" font-weight="700" fill="#1a73e8" font-size="20">①</text><text x="130" y="138" font-weight="700">신청한 계정으로</text><text x="130" y="162">로그인</text><text x="130" y="186" font-size="14" fill="#5f6368">다른 계정엔 안 들어와요</text>
<rect x="260" y="72" width="200" height="130" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="360" y="108" font-weight="700" fill="#1a73e8" font-size="20">②</text><text x="360" y="138" font-weight="700">MY › 보상 신청</text><text x="360" y="162">등록번호 확인</text><text x="360" y="186" font-size="14" fill="#5f6368">11/4 오전 10시부터 순차</text>
<rect x="490" y="72" width="200" height="130" rx="14" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
<text x="590" y="108" font-weight="700" fill="#188038" font-size="20">③</text><text x="590" y="138" font-weight="700">웨이브 쿠폰은</text><text x="590" y="162">웨이브에서 등록</text><text x="590" y="186" font-size="14" fill="#5f6368">포인트는 티빙에서 바로</text>
</g>
<path d="M232 137 L256 137" stroke="#5f6368" stroke-width="3" marker-end="url(#a)"/><path d="M462 137 L486 137" stroke="#5f6368" stroke-width="3" marker-end="url(#a)"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5f6368"/></marker></defs>
<text x="360" y="244" text-anchor="middle" font-size="16" fill="#202124">안 보이면 → 계정 확인 → 시간 두고 다시 → 그래도 없으면 고객센터</text>
<text x="360" y="276" text-anchor="middle" font-size="13" fill="#5f6368">출처: 티빙 보상 안내 페이지, 노컷뉴스 보도 (2026-11-04 확인)</text>
</svg>
