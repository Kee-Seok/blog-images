<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Pretendard,Apple SD Gothic Neo,sans-serif"><rect width="1200" height="700" rx="28" fill="#ffffff"/><text x="600" y="70" font-size="40" font-weight="700" fill="#202124" text-anchor="middle">밟은 뒤에 어떻게 했나, 흔히 보는 풀이</text>
<rect x="50" y="120" width="1100" height="110" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="120" width="14" height="110" rx="7" fill="#1e8e3e"/><text x="85" y="187" font-size="32" font-weight="700" fill="#202124">그냥 걸어감</text><text x="520" y="187" font-size="29" fill="#202124">들어온 재물이 붙어 있는 꿈</text>
<rect x="50" y="250" width="1100" height="110" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="250" width="14" height="110" rx="7" fill="#f29900"/><text x="85" y="317" font-size="32" font-weight="700" fill="#202124">급히 닦아 냄</text><text x="520" y="317" font-size="29" fill="#202124">들어올 몫이 새어 나가는 아쉬움</text>
<rect x="50" y="380" width="1100" height="110" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="380" width="14" height="110" rx="7" fill="#d93025"/><text x="85" y="447" font-size="32" font-weight="700" fill="#202124">미끄러져 넘어짐</text><text x="520" y="447" font-size="29" fill="#202124">구설·망신을 조심하라는 신호</text>
<rect x="50" y="510" width="1100" height="110" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="510" width="14" height="110" rx="7" fill="#1a73e8"/><text x="85" y="577" font-size="32" font-weight="700" fill="#202124">남이 밟는 걸 봄</text><text x="520" y="577" font-size="29" fill="#202124">주변 사람에게 생기는 좋은 일</text>
<text x="600" y="668" font-size="22" fill="#5f6368" text-anchor="middle">전통 해몽에서 흔히 보는 풀이이며, 실제 일을 예언하지 않습니다</text></svg>
