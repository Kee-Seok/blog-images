<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Pretendard,Apple SD Gothic Neo,sans-serif"><rect width="1200" height="560" rx="28" fill="#ffffff"/><text x="600" y="70" font-size="40" font-weight="700" fill="#202124" text-anchor="middle">맨발이었나, 신발이었나</text>
<rect x="70" y="120" width="500" height="360" rx="22" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="3"/><text x="320" y="200" font-size="38" font-weight="700" fill="#1e8e3e" text-anchor="middle">맨발로 밟음</text><text x="320" y="275" font-size="29" fill="#202124" text-anchor="middle">재물이 몸에 직접 닿는 꿈</text><text x="320" y="325" font-size="29" fill="#202124" text-anchor="middle">더 좋은 쪽으로 읽음</text><text x="320" y="420" font-size="25" fill="#5f6368" text-anchor="middle">발이 푹 빠질수록 크게 봄</text>
<rect x="630" y="120" width="500" height="360" rx="22" fill="#fef7e0" stroke="#f29900" stroke-width="3"/><text x="880" y="200" font-size="38" font-weight="700" fill="#b06000" text-anchor="middle">신발로 밟음</text><text x="880" y="275" font-size="29" fill="#202124" text-anchor="middle">재물운은 같지만</text><text x="880" y="325" font-size="29" fill="#202124" text-anchor="middle">한 다리 건너 오는 몫</text><text x="880" y="420" font-size="25" fill="#5f6368" text-anchor="middle">신발을 버렸다면 아쉬운 쪽</text>
<text x="600" y="530" font-size="22" fill="#5f6368" text-anchor="middle">전통 해몽에서 흔히 보는 풀이</text></svg>
