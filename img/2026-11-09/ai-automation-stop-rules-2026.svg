<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="sans-serif">
<rect width="800" height="440" fill="#ffffff"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">오류가 났을 때 멈춤 규칙 3개</text>
<rect x="300" y="72" width="200" height="56" rx="12" fill="#fce8e6" stroke="#d93025" stroke-width="2"/><text x="400" y="108" text-anchor="middle" font-size="21" font-weight="700" fill="#202124">검사 경고·오류</text>
<path d="M400 130 v24" stroke="#5f6368" stroke-width="3"/>
<g font-size="20" fill="#202124">
<rect x="30" y="160" width="230" height="150" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="145" y="200" text-anchor="middle" font-weight="700">① 한 번만 고친다</text><text x="145" y="236" text-anchor="middle" font-size="17">고친 뒤 다시 검사</text><text x="145" y="264" text-anchor="middle" font-size="17">남으면 그대로 진행</text><text x="145" y="292" text-anchor="middle" font-size="17">+ 보고에 한 줄</text>
<rect x="285" y="160" width="230" height="150" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="400" y="200" text-anchor="middle" font-weight="700">② 실패한 칸만 다시</text><text x="400" y="236" text-anchor="middle" font-size="17">원고·사진은 그대로</text><text x="400" y="264" text-anchor="middle" font-size="17">처음부터 다시 돌리지</text><text x="400" y="292" text-anchor="middle" font-size="17">않는다</text>
<rect x="540" y="160" width="230" height="150" rx="14" fill="#fff8e1" stroke="#fbc400" stroke-width="2"/><text x="655" y="200" text-anchor="middle" font-weight="700">③ 막히면 알리고 멈춤</text><text x="655" y="236" text-anchor="middle" font-size="17">로그인·한도는</text><text x="655" y="264" text-anchor="middle" font-size="17">사람 몫이라</text><text x="655" y="292" text-anchor="middle" font-size="17">텔레그램 한 줄</text>
</g>
<path d="M400 154 H145 v6 M400 154 H655 v6 M400 154 v6" stroke="#5f6368" stroke-width="3" fill="none"/>
<text x="400" y="372" text-anchor="middle" font-size="19" fill="#202124">같은 오류를 두 번째 고치려는 순간이 멈출 때예요</text>
<text x="400" y="412" text-anchor="middle" font-size="15" fill="#5f6368">크라우드의 코드리뷰 · 이 계정 발행 규칙 정리 (2026-11)</text>
</svg>
