<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="900" height="380" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#202124">최대 지급액 기준, 선지급과 정산 얼마씩 받나</text>

  <!-- legend -->
  <rect x="620" y="52" width="14" height="14" fill="#1a73e8"/>
  <text x="640" y="64" font-size="13" fill="#202124">12월 선지급 (35%)</text>
  <rect x="620" y="72" width="14" height="14" fill="#c7ccd6"/>
  <text x="640" y="84" font-size="13" fill="#202124">이듬해 6월 정산 (65%)</text>

  <!-- bar group scale: 1만원 = 0.5px, base y=330, max height ~165 for 330만원 -->
  <!-- 단독가구 165만원: 선지급 57.75, 정산 107.25 -->
  <text x="150" y="345" text-anchor="middle" font-size="14" fill="#202124">단독가구</text>
  <text x="150" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="#202124">165만원</text>
  <rect x="110" y="301.1" width="80" height="28.9" fill="#1a73e8"/>
  <rect x="110" y="247.5" width="80" height="53.6" fill="#c7ccd6"/>
  <text x="150" y="278" text-anchor="middle" font-size="11" fill="#202124">정산 107.3만</text>
  <text x="150" y="319" text-anchor="middle" font-size="11" fill="#ffffff">선지급 57.8만</text>

  <!-- 홑벌이가구 285만원: 선지급 99.75, 정산 185.25 -->
  <text x="450" y="345" text-anchor="middle" font-size="14" fill="#202124">홑벌이가구</text>
  <text x="450" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#202124">285만원</text>
  <rect x="410" y="280" width="80" height="49.9" fill="#1a73e8"/>
  <rect x="410" y="187.5" width="80" height="92.6" fill="#c7ccd6"/>
  <text x="450" y="238" text-anchor="middle" font-size="11" fill="#202124">정산 185.3만</text>
  <text x="450" y="308" text-anchor="middle" font-size="11" fill="#ffffff">선지급 99.8만</text>

  <!-- 맞벌이가구 330만원: 선지급 115.5, 정산 214.5 -->
  <text x="750" y="345" text-anchor="middle" font-size="14" fill="#202124">맞벌이가구</text>
  <text x="750" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#202124">330만원</text>
  <rect x="710" y="272.3" width="80" height="57.7" fill="#1a73e8"/>
  <rect x="710" y="165" width="80" height="107.3" fill="#c7ccd6"/>
  <text x="750" y="220" text-anchor="middle" font-size="11" fill="#202124">정산 214.5만</text>
  <text x="750" y="304" text-anchor="middle" font-size="11" fill="#ffffff">선지급 115.5만</text>

  <line x1="60" y1="359" x2="840" y2="359" stroke="#dadce0" stroke-width="1.5"/>
  <text x="450" y="376" text-anchor="middle" font-size="12" fill="#9aa0a6">단위: 만원 · 가구 유형별 연간 최대 산정액 기준, 실제 지급액은 소득 구간에 따라 다름</text>
</svg>
