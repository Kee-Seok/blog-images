<svg viewBox="0 0 1100 640" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="1100" height="640" fill="#ffffff"/>
  <text x="550" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">근로장려금 반기신청 자격, 배우자 소득까지 확인하세요</text>

  <!-- start box -->
  <rect x="400" y="80" width="300" height="60" rx="12" fill="#1a73e8"/>
  <text x="550" y="118" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">본인 소득이 근로소득만 있나요?</text>

  <line x1="550" y1="140" x2="550" y2="180" stroke="#c7cdd6" stroke-width="3"/>

  <!-- 아니오 branch left -->
  <line x1="550" y1="160" x2="250" y2="160" stroke="#c7cdd6" stroke-width="3"/>
  <line x1="250" y1="160" x2="250" y2="210" stroke="#c7cdd6" stroke-width="3"/>
  <text x="400" y="152" text-anchor="middle" font-size="14" fill="#9aa0a6">사업·종교인소득 있음</text>
  <rect x="100" y="210" width="300" height="70" rx="12" fill="#f1f3f4" stroke="#c7cdd6"/>
  <text x="250" y="240" text-anchor="middle" font-size="16" font-weight="700" fill="#5f6368">반기신청 불가</text>
  <text x="250" y="264" text-anchor="middle" font-size="13" fill="#5f6368">2027년 5월 정기신청으로</text>

  <!-- 예 branch continue -->
  <rect x="400" y="180" width="300" height="60" rx="12" fill="#1a73e8"/>
  <text x="550" y="216" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">배우자도 근로소득만 있나요?</text>
  <text x="700" y="212" text-anchor="middle" font-size="14" fill="#9aa0a6">본인 예</text>

  <line x1="550" y1="240" x2="550" y2="280" stroke="#c7cdd6" stroke-width="3"/>
  <line x1="550" y1="260" x2="800" y2="260" stroke="#c7cdd6" stroke-width="3"/>
  <line x1="800" y1="260" x2="800" y2="210" stroke="#c7cdd6" stroke-width="3"/>
  <text x="700" y="252" text-anchor="middle" font-size="14" fill="#9aa0a6">배우자 사업·종교인소득 있음</text>
  <rect x="650" y="210" width="300" height="70" rx="12" fill="#f1f3f4" stroke="#c7cdd6"/>
  <text x="800" y="240" text-anchor="middle" font-size="16" font-weight="700" fill="#5f6368">반기신청 불가</text>
  <text x="800" y="264" text-anchor="middle" font-size="13" fill="#5f6368">2027년 5월 정기신청으로</text>

  <!-- 예 continue -->
  <rect x="400" y="280" width="300" height="60" rx="12" fill="#1a73e8"/>
  <text x="550" y="316" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">소득·재산 기준을 충족하나요?</text>
  <text x="700" y="312" text-anchor="middle" font-size="14" fill="#9aa0a6">배우자도 예</text>

  <line x1="550" y1="340" x2="550" y2="380" stroke="#c7cdd6" stroke-width="3"/>

  <rect x="325" y="380" width="450" height="150" rx="14" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="550" y="416" text-anchor="middle" font-size="18" font-weight="700" fill="#1e7e34">9월 1~15일 반기신청 대상</text>
  <text x="550" y="446" text-anchor="middle" font-size="14" fill="#2d6a3e">단독 2,200만원 · 홑벌이 3,200만원 · 맞벌이 4,400만원 미만</text>
  <text x="550" y="470" text-anchor="middle" font-size="14" fill="#2d6a3e">가구 재산 합계 2억 4천만원 미만</text>
  <text x="550" y="500" text-anchor="middle" font-size="13" fill="#4c8a5e">재산 1억 7천만~2억 4천만원 구간은 산정액 50% 감액</text>

  <text x="550" y="580" text-anchor="middle" font-size="13" fill="#9aa0a6">국세청 근로·자녀장려금 반기신청 요건 기준, 2026년 8월 확인</text>
</svg>
