<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="sans-serif">
<rect width="1200" height="630" fill="#ffffff"/>
<text x="600" y="85" text-anchor="middle" font-size="44" font-weight="700" fill="#202124">노인 기준 변경, 확정된 게 아니에요</text>
<text x="600" y="140" text-anchor="middle" font-size="26" fill="#5f6368">2026년 10월 5일 기준</text>
<rect x="80" y="190" width="480" height="300" rx="20" fill="#e8f0fe"/>
<text x="320" y="255" text-anchor="middle" font-size="30" font-weight="700" fill="#1a73e8">지금 법적 기준</text>
<text x="320" y="360" text-anchor="middle" font-size="84" font-weight="700" fill="#202124">만 65세</text>
<text x="320" y="440" text-anchor="middle" font-size="24" fill="#202124">기초연금·지하철 무료 그대로</text>
<rect x="640" y="190" width="480" height="300" rx="20" fill="#fffaf0" stroke="#f5dfae"/>
<text x="880" y="255" text-anchor="middle" font-size="30" font-weight="700" fill="#b06000">10월 4일 대한노인회 제안</text>
<text x="880" y="345" text-anchor="middle" font-size="40" font-weight="700" fill="#202124">매년 1살씩 → 75세</text>
<text x="880" y="400" text-anchor="middle" font-size="24" fill="#202124">이 속도면 10년 걸림</text>
<text x="880" y="440" text-anchor="middle" font-size="24" fill="#b06000">시작 시점·기존 수급자 대책 없음</text>
<text x="600" y="560" text-anchor="middle" font-size="26" fill="#202124">바뀌려면 혜택마다 근거 법령을 고쳐야 해요</text>
<text x="600" y="605" text-anchor="middle" font-size="20" fill="#80868b">대한노인회 제안 보도(2026.10.4) 정리</text>
</svg>
