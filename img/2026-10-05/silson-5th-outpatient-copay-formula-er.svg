<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="sans-serif">
<rect width="800" height="430" fill="#ffffff"/>
<text x="400" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#202124">5세대 실손 외래 급여: 셋 중 가장 큰 금액이 내 몫</text>
<text x="400" y="72" text-anchor="middle" font-size="15" fill="#5f6368">본인부담 22만원(권역센터 경증, 건강보험 본인부담률 90%)에 넣어 보면</text>
<rect x="40" y="100" width="225" height="150" rx="12" fill="#fef7e0" stroke="#e8710a" stroke-width="3"/>
<text x="152" y="135" text-anchor="middle" font-size="16" fill="#202124">① 건강보험 본인부담률</text>
<text x="152" y="170" text-anchor="middle" font-size="16" fill="#202124">22만원 × 90%</text>
<text x="152" y="215" text-anchor="middle" font-size="24" font-weight="700" fill="#b06000">198,000원</text>
<rect x="288" y="100" width="225" height="150" rx="12" fill="#f1f3f4" stroke="#dadce0"/>
<text x="400" y="135" text-anchor="middle" font-size="16" fill="#202124">② 최저 비율 20%</text>
<text x="400" y="170" text-anchor="middle" font-size="16" fill="#202124">22만원 × 20%</text>
<text x="400" y="215" text-anchor="middle" font-size="24" font-weight="700" fill="#5f6368">44,000원</text>
<rect x="536" y="100" width="225" height="150" rx="12" fill="#f1f3f4" stroke="#dadce0"/>
<text x="648" y="135" text-anchor="middle" font-size="16" fill="#202124">③ 최소 공제금액</text>
<text x="648" y="170" text-anchor="middle" font-size="16" fill="#202124">상급·종합병원</text>
<text x="648" y="215" text-anchor="middle" font-size="24" font-weight="700" fill="#5f6368">20,000원</text>
<text x="400" y="300" text-anchor="middle" font-size="19" fill="#202124">가장 큰 ① 198,000원을 내가 부담</text>
<text x="400" y="345" text-anchor="middle" font-size="24" font-weight="700" fill="#202124">보험금 = 220,000 − 198,000 = 22,000원</text>
<text x="400" y="395" text-anchor="middle" font-size="14" fill="#80868b">4세대는 ①이 없어서 ②·③ 중 큰 44,000원만 부담 → 보험금 176,000원</text>
</svg>
