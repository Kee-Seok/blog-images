<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">경증으로 권역응급의료센터 본인부담 22만원 냈다면</text>
<text x="400" y="82" text-anchor="middle" font-size="18" fill="#5f6368">실손보험에서 돌려받는 돈 (급여 본인부담 기준 계산)</text>
<text x="60" y="160" font-size="22" font-weight="700" fill="#202124">4세대 실손</text>
<text x="60" y="186" font-size="15" fill="#5f6368">2021.7 ~ 2026.5.5 가입</text>
<rect x="250" y="138" width="440" height="50" rx="6" fill="#1a73e8"/>
<rect x="690" y="138" width="60" height="50" rx="6" fill="#dadce0"/>
<text x="470" y="171" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">보험금 176,000원</text>
<text x="250" y="215" font-size="15" fill="#5f6368">내 부담 44,000원 (22만원의 20%)</text>
<text x="60" y="290" font-size="22" font-weight="700" fill="#202124">5세대 실손</text>
<text x="60" y="316" font-size="15" fill="#5f6368">2026.5.6 이후 가입</text>
<rect x="250" y="268" width="55" height="50" rx="6" fill="#e8710a"/>
<rect x="305" y="268" width="445" height="50" rx="6" fill="#dadce0"/>
<text x="320" y="301" font-size="22" font-weight="700" fill="#202124">보험금 22,000원</text>
<text x="250" y="345" font-size="15" fill="#5f6368">내 부담 198,000원 (22만원의 90%)</text>
<text x="400" y="400" text-anchor="middle" font-size="17" font-weight="700" fill="#b06000">같은 응급실 영수증인데 154,000원 차이</text>
<text x="400" y="430" text-anchor="middle" font-size="13" fill="#80868b">22만원: 보건복지부 2024년 9월 브리핑 평균치 · 계산식: 금융위원회 5세대 실손 보도자료(2026.5)</text>
</svg>
