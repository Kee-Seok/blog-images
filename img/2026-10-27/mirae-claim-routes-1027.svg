<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
<rect width="800" height="520" fill="#ffffff"/>
<text x="400" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">미래에셋생명 보험금 청구, 지금 되는 길</text>
<text x="400" y="84" text-anchor="middle" font-size="18" fill="#5f6368">10월 27일 기준 · M-LIFE·온라인보험·디지털 ARS는 '조치시까지' 중단</text>
<g font-size="20">
<rect x="40" y="115" width="345" height="160" rx="16" fill="#fdecea" stroke="#d93025"/>
<text x="212" y="155" text-anchor="middle" font-weight="700" fill="#b3261e">막힘</text>
<text x="212" y="195" text-anchor="middle" fill="#202124">M-LIFE 앱·PC 청구</text>
<text x="212" y="228" text-anchor="middle" fill="#202124">온라인보험</text>
<text x="212" y="261" text-anchor="middle" fill="#202124">디지털 ARS</text>
<rect x="415" y="115" width="345" height="160" rx="16" fill="#e6f4ea" stroke="#188038"/>
<text x="587" y="155" text-anchor="middle" font-weight="700" fill="#137333">공지에 없음 → 전화로 확인</text>
<text x="587" y="195" text-anchor="middle" fill="#202124">고객센터 1588-0220</text>
<text x="587" y="228" text-anchor="middle" fill="#202124">팩스(가상번호, 500만원 이하)</text>
<text x="587" y="261" text-anchor="middle" fill="#202124">우편 · 지점 방문</text>
</g>
<rect x="40" y="305" width="720" height="180" rx="16" fill="#f7f9fc" stroke="#e1e6ee"/>
<text x="70" y="347" font-size="21" font-weight="700" fill="#202124">급하지 않으면 서류만 모아 두기</text>
<text x="70" y="387" font-size="19" fill="#202124">· 보험금 청구 기한: 사고일부터 3년 (상법 제662조)</text>
<text x="70" y="422" font-size="19" fill="#202124">· 서류 접수 뒤 3영업일 안 지급 (조사 필요하면 10영업일)</text>
<text x="70" y="457" font-size="19" fill="#202124">· 고객센터는 회사 이름으로 오는 링크 문자를 보내지 않는지 확인</text>
</svg>
