<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="sans-serif">
<rect width="1200" height="760" fill="#ffffff"/>
<text x="60" y="80" font-size="40" font-weight="700" fill="#202124">건강보험료 조정신청, 언제 내면 몇 월분부터?</text>
<text x="60" y="125" font-size="24" fill="#5f6368">국민건강보험공단 '소득 정산제도' 조정기간 예시 정리</text>
<line x1="120" y1="190" x2="120" y2="690" stroke="#0B7A75" stroke-width="6"/>
<g font-size="28" fill="#202124">
<circle cx="120" cy="210" r="18" fill="#0B7A75"/><text x="170" y="205" font-weight="700">10월 1일 ~ 10월 31일에 신청</text><text x="170" y="245" fill="#0B7A75">→ 10월 보험료부터 조정</text>
<circle cx="120" cy="330" r="18" fill="#0B7A75"/><text x="170" y="325" font-weight="700">11월 1일 ~ 12월 10일에 신청</text><text x="170" y="365" fill="#0B7A75">→ 11월 보험료부터, 신청하면 다음 해 12월분까지</text>
<circle cx="120" cy="450" r="18" fill="#0B7A75"/><text x="170" y="445" font-weight="700">12월 11일 ~ 다음 해 1월 10일에 신청</text><text x="170" y="485" fill="#0B7A75">→ 12월 보험료부터</text>
<circle cx="120" cy="570" r="18" fill="#E8551F"/><text x="170" y="565" font-weight="700">다음 해 11월 = 정산</text><text x="170" y="605">국세청 확인 소득으로 다시 계산해 차액 부과 또는 환급</text>
</g>
<text x="60" y="720" font-size="22" fill="#80868b">11월분 보험료 납부기한 12월 10일 · '소득금액증명' 사유는 7~10월에만 신청 가능</text>
</svg>
