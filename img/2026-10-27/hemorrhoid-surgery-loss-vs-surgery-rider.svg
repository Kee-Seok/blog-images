<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="sans-serif">
<rect width="1000" height="520" fill="#ffffff"/>
<text x="500" y="56" text-anchor="middle" font-size="30" font-weight="700" fill="#202124">치질 수술 뒤 확인할 보험은 두 갈래</text>
<rect x="400" y="90" width="200" height="64" rx="14" fill="#1a73e8"/>
<text x="500" y="131" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">치핵 수술</text>
<line x1="450" y1="154" x2="270" y2="210" stroke="#5f6368" stroke-width="3"/>
<line x1="550" y1="154" x2="730" y2="210" stroke="#5f6368" stroke-width="3"/>
<rect x="60" y="210" width="420" height="250" rx="18" fill="#f7f9fc" stroke="#1a73e8" stroke-width="3"/>
<text x="270" y="258" text-anchor="middle" font-size="25" font-weight="700" fill="#1a73e8">실손보험</text>
<text x="270" y="305" text-anchor="middle" font-size="19" fill="#202124">쓴 돈을 비율대로 돌려줌</text>
<text x="270" y="340" text-anchor="middle" font-size="19" fill="#202124">급여 본인부담만, 비급여 제외</text>
<text x="270" y="375" text-anchor="middle" font-size="19" fill="#202124">4세대는 급여의 80% 지급</text>
<text x="270" y="425" text-anchor="middle" font-size="18" fill="#5f6368">서류: 영수증 · 세부내역서 · 진단서</text>
<rect x="520" y="210" width="420" height="250" rx="18" fill="#fffaf0" stroke="#e8710a" stroke-width="3"/>
<text x="730" y="258" text-anchor="middle" font-size="25" font-weight="700" fill="#b06000">질병수술비 특약</text>
<text x="730" y="305" text-anchor="middle" font-size="19" fill="#202124">약관 수술이면 정해진 금액</text>
<text x="730" y="340" text-anchor="middle" font-size="19" fill="#202124">실손의 비급여 제외와 별개</text>
<text x="730" y="375" text-anchor="middle" font-size="19" fill="#202124">몇 종인지는 수술분류표 확인</text>
<text x="730" y="425" text-anchor="middle" font-size="18" fill="#5f6368">서류: 진단서 · 수술확인서</text>
<text x="500" y="495" text-anchor="middle" font-size="17" fill="#80868b">자료: 금융감독원 금융꿀팁(2017.6.22), 금융위원회 4세대 실손 발표(2021.6)</text>
</svg>
