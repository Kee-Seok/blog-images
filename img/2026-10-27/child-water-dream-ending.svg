<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="sans-serif">
<rect width="900" height="400" fill="#ffffff"/>
<text x="450" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">자식이 물에 빠지는 꿈, 꿈이 어떻게 끝났나</text>
<g font-size="20" fill="#202124">
<rect x="30" y="90" width="260" height="270" rx="16" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="160" y="135" text-anchor="middle" font-weight="700" font-size="23">내가 건져 냄</text>
<text x="160" y="185" text-anchor="middle">아이 앞의 고비를</text>
<text x="160" y="215" text-anchor="middle">함께 넘기는 길몽</text>
<text x="160" y="275" text-anchor="middle" fill="#5f6368" font-size="18">손을 잡아 끌어올렸다면</text>
<text x="160" y="303" text-anchor="middle" fill="#5f6368" font-size="18">도움이 닿는다는 풀이</text>
<rect x="320" y="90" width="260" height="270" rx="16" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
<text x="450" y="135" text-anchor="middle" font-weight="700" font-size="23">혼자 헤엄쳐 나옴</text>
<text x="450" y="185" text-anchor="middle">아이가 제 힘으로</text>
<text x="450" y="215" text-anchor="middle">일어서는 때</text>
<text x="450" y="275" text-anchor="middle" fill="#5f6368" font-size="18">지켜보기만 했다면</text>
<text x="450" y="303" text-anchor="middle" fill="#5f6368" font-size="18">믿고 맡기라는 뜻</text>
<rect x="610" y="90" width="260" height="270" rx="16" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
<text x="740" y="135" text-anchor="middle" font-weight="700" font-size="23">못 구하고 깸</text>
<text x="740" y="185" text-anchor="middle">부모 마음의 걱정이</text>
<text x="740" y="215" text-anchor="middle">그대로 비친 꿈</text>
<text x="740" y="275" text-anchor="middle" fill="#5f6368" font-size="18">아이와 이야기 나눌</text>
<text x="740" y="303" text-anchor="middle" fill="#5f6368" font-size="18">때라는 쪽으로 읽어요</text>
</g>
<text x="450" y="390" text-anchor="middle" font-size="15" fill="#80868b">전통 해몽에서 흔히 쓰는 풀이를 정리한 그림 · 오늘의 꿈 해몽</text>
</svg>
