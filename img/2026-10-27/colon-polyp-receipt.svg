<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="sans-serif">
<rect width="960" height="560" fill="#ffffff"/>
<text x="40" y="58" font-size="29" font-weight="700" fill="#202124">검진 날 영수증, 실비가 보는 칸은 따로</text>
<rect x="40" y="96" width="420" height="380" rx="14" fill="#f1f3f4" stroke="#dadce0"/>
<text x="68" y="146" font-size="24" font-weight="700" fill="#5f6368">검진 항목</text>
<text x="68" y="196" font-size="20" fill="#202124">예방 목적 건강검진 비용</text>
<text x="68" y="236" font-size="20" fill="#202124">검진표에 원래 있던 검사</text>
<rect x="68" y="300" width="364" height="60" rx="10" fill="#ffffff" stroke="#dadce0"/>
<text x="250" y="339" font-size="22" font-weight="700" fill="#5f6368" text-anchor="middle">실손 보상 안 함</text>
<rect x="500" y="96" width="420" height="380" rx="14" fill="#e8f0fe" stroke="#1a73e8"/>
<text x="528" y="146" font-size="24" font-weight="700" fill="#1a73e8">검사 중 생긴 치료</text>
<text x="528" y="196" font-size="20" fill="#202124">발견한 용종을 떼어낸 시술비</text>
<text x="528" y="236" font-size="20" fill="#202124">이상 소견으로 더 한 검사</text>
<rect x="528" y="300" width="364" height="60" rx="10" fill="#ffffff" stroke="#1a73e8"/>
<text x="710" y="339" font-size="22" font-weight="700" fill="#1a73e8" text-anchor="middle">실손 청구 대상</text>
<text x="40" y="520" font-size="18" fill="#5f6368">금융감독원 실손보험 보장 안내(2024년 1·4월 보도) 기준 · 자기부담금은 세대별로 뺌</text>
</svg>
