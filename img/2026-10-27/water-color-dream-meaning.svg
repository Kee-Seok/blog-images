<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="sans-serif">
<rect width="900" height="360" fill="#ffffff"/>
<text x="450" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">물빛으로 갈리는 물에 빠지는 꿈 풀이</text>
<g font-size="20" fill="#202124">
<rect x="40" y="80" width="400" height="230" rx="16" fill="#e3f2fd" stroke="#4285f4" stroke-width="2"/>
<text x="240" y="125" text-anchor="middle" font-weight="700" font-size="24">맑고 잔잔한 물</text>
<text x="240" y="175" text-anchor="middle">아이가 한 가지 일에</text>
<text x="240" y="205" text-anchor="middle">푹 빠져 몰두하는 모습</text>
<text x="240" y="265" text-anchor="middle" fill="#5f6368" font-size="18">공부·재능이 깊어지는 쪽</text>
<rect x="460" y="80" width="400" height="230" rx="16" fill="#f3ece4" stroke="#8d6e63" stroke-width="2"/>
<text x="660" y="125" text-anchor="middle" font-weight="700" font-size="24">흙탕물·거센 물살</text>
<text x="660" y="175" text-anchor="middle">주변 사람이나 상황에</text>
<text x="660" y="205" text-anchor="middle">휩쓸려 마음고생하는 모습</text>
<text x="660" y="265" text-anchor="middle" fill="#5f6368" font-size="18">요즘 친구·학교 이야기 들어 보기</text>
</g>
<text x="450" y="345" text-anchor="middle" font-size="15" fill="#80868b">흔히 보는 해몽을 정리한 것 · 오늘의 꿈 해몽</text>
</svg>
