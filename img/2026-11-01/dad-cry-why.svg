<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="sans-serif">
<rect width="900" height="400" fill="#ffffff"/>
<text x="450" y="44" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">아버지는 왜 우셨나요</text>
<g font-size="19" fill="#202124" text-anchor="middle">
<rect x="30" y="76" width="260" height="260" rx="14" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
<text x="160" y="118" font-weight="700" font-size="22">반가워서 우심</text>
<text x="160" y="160">나를 안고 눈물</text>
<text x="160" y="200">그리움이 풀리는 쪽</text>
<text x="160" y="300" fill="#5f6368" font-size="17">가장 편하게 읽는 장면</text>
<rect x="320" y="76" width="260" height="260" rx="14" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/>
<text x="450" y="118" font-weight="700" font-size="22">걱정하며 우심</text>
<text x="450" y="160">나를 보고 한숨·눈물</text>
<text x="450" y="200">살펴볼 일이 있다는 신호</text>
<text x="450" y="300" fill="#5f6368" font-size="17">요즘 무리한 일부터 점검</text>
<rect x="610" y="76" width="260" height="260" rx="14" fill="#e3f2fd" stroke="#4285f4" stroke-width="2"/>
<text x="740" y="118" font-weight="700" font-size="22">아파서 우심</text>
<text x="740" y="160">누워서 괴로워하심</text>
<text x="740" y="200">내 마음의 짐이 비친 꿈</text>
<text x="740" y="300" fill="#5f6368" font-size="17">성묘·기일 챙기는 때로도</text>
</g>
<text x="450" y="380" text-anchor="middle" font-size="15" fill="#5f6368">전통 해몽에서 흔히 보는 풀이 · 오늘의 꿈 해몽</text>
</svg>
