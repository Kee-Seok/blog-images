<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <rect width="800" height="420" fill="#ffffff"/>
  <style>
    text { font-family: sans-serif; }
    .title { font-size: 18px; font-weight: bold; fill: #1a1a1a; }
    .subtitle { font-size: 13px; fill: #666; }
    .label { font-size: 12px; fill: #333; }
    .value { font-size: 13px; font-weight: bold; fill: #222; }
    .axis { stroke: #ccc; stroke-width: 1; }
    .grid { stroke: #eee; stroke-width: 1; }
    .bar-fixed { fill: #3b6cb5; }
    .bar-var { fill: #d4783a; }
    .bar-marker { stroke: #c0392b; stroke-width: 2; stroke-dasharray: 4,3; }
    .pct { font-size: 11px; fill: #555; }
  </style>

  <!-- 제목 -->
  <text x="30" y="30" class="title">2026년 8월 주요 은행 주택담보대출 금리 범위</text>
  <text x="30" y="50" class="subtitle">은행연합회 소비자포털 공시 기준 · 고정금리(1~5년) · 변동금리(COFIX 연동)</text>

  <!-- Y축(금리 %) -->
  <line x1="100" y1="80" x2="100" y2="370" class="axis"/>
  <line x1="100" y1="370" x2="750" y2="370" class="axis"/>

  <!-- Y축 눈금 및 그리드 (3.5% ~ 5.5%) -->
  <line x1="100" y1="370" x2="750" y2="370" class="grid"/>
  <text x="90" y="374" text-anchor="end" class="pct">3.5%</text>
  <line x1="100" y1="340" x2="750" y2="340" class="grid"/>
  <text x="90" y="344" text-anchor="end" class="pct">3.7%</text>
  <line x1="100" y1="310" x2="750" y2="310" class="grid"/>
  <text x="90" y="314" text-anchor="end" class="pct">3.9%</text>
  <line x1="100" y1="280" x2="750" y2="280" class="grid"/>
  <text x="90" y="284" text-anchor="end" class="pct">4.1%</text>
  <line x1="100" y1="250" x2="750" y2="250" class="grid"/>
  <text x="90" y="254" text-anchor="end" class="pct">4.3%</text>
  <line x1="100" y1="220" x2="750" y2="220" class="grid"/>
  <text x="90" y="224" text-anchor="end" class="pct">4.5%</text>
  <line x1="100" y1="190" x2="750" y2="190" class="grid"/>
  <text x="90" y="194" text-anchor="end" class="pct">4.7%</text>
  <line x1="100" y1="160" x2="750" y2="160" class="grid"/>
  <text x="90" y="164" text-anchor="end" class="pct">4.9%</text>
  <line x1="100" y1="130" x2="750" y2="130" class="grid"/>
  <text x="90" y="134" text-anchor="end" class="pct">5.1%</text>
  <line x1="100" y1="100" x2="750" y2="100" class="grid"/>
  <text x="90" y="104" text-anchor="end" class="pct">5.3%</text>

  <!-- 기준금리 마커: 2.75%는 차트 범위 밖이므로 우측 하단에 별도 표시 -->

  <!-- 국민은행 -->
  <text x="130" y="395" class="label">KB국민은행</text>
  <!-- 고정 3.95~5.20%: y=370-(3.95-3.5)/(5.5-3.5)*270=370-54=316 ~ y=370-(5.20-3.5)/2*270=370-218.25=151.75 -->
  <rect x="130" y="152" width="50" height="164" class="bar-fixed"/>
  <text x="155" y="148" text-anchor="middle" class="value">3.95~5.20%</text>
  <!-- 변동 3.70~5.05%: y=370-(3.70-3.5)/2*270=370-27=343 ~ y=370-(5.05-3.5)/2*270=370-207.75=162.25 -->
  <rect x="190" y="162" width="50" height="181" class="bar-var"/>
  <text x="215" y="158" text-anchor="middle" class="value">3.70~5.05%</text>

  <!-- 신한은행 -->
  <text x="280" y="395" class="label">신한은행</text>
  <!-- 고정 3.80~4.80% -->
  <rect x="280" y="202" width="50" height="168" class="bar-fixed"/>
  <text x="305" y="198" text-anchor="middle" class="value">3.80~4.80%</text>
  <!-- 변동 3.75~5.10% -->
  <rect x="340" y="157" width="50" height="213" class="bar-var"/>
  <text x="365" y="153" text-anchor="middle" class="value">3.75~5.10%</text>

  <!-- 하나은행 -->
  <text x="430" y="395" class="label">하나은행</text>
  <!-- 고정 3.90~4.70% -->
  <rect x="430" y="224" width="50" height="146" class="bar-fixed"/>
  <text x="455" y="220" text-anchor="middle" class="value">3.90~4.70%</text>
  <!-- 변동 3.70~5.00% -->
  <rect x="490" y="162" width="50" height="208" class="bar-var"/>
  <text x="515" y="158" text-anchor="middle" class="value">3.70~5.00%</text>

  <!-- 우리은행 -->
  <text x="580" y="395" class="label">우리은행</text>
  <!-- 고정 3.90~4.90% -->
  <rect x="580" y="194" width="50" height="176" class="bar-fixed"/>
  <text x="605" y="190" text-anchor="middle" class="value">3.90~4.90%</text>
  <!-- 변동 3.80~5.15% -->
  <rect x="640" y="150" width="50" height="220" class="bar-var"/>
  <text x="665" y="146" text-anchor="middle" class="value">3.80~5.15%</text>

  <!-- NH농협 -->
  <text x="730" y="395" class="label">NH농협</text>
  <!-- 고정 3.95~4.80% -->
  <rect x="710" y="202" width="40" height="168" class="bar-fixed"/>
  <text x="730" y="198" text-anchor="middle" class="value">3.95~4.80%</text>
  <!-- 변동 3.70~5.00% -->
  <rect x="760" y="162" width="40" height="208" class="bar-var"/>
  <text x="780" y="158" text-anchor="middle" class="value">3.70~5.00%</text>

  <!-- 범례 -->
  <rect x="100" y="405" width="14" height="10" class="bar-fixed"/>
  <text x="118" y="413" class="label">고정금리(1~5년)</text>
  <rect x="260" y="405" width="14" height="10" class="bar-var"/>
  <text x="278" y="413" class="label">변동금리(COFIX 연동)</text>

  <!-- 기준금리 주석 -->
  <text x="600" y="35" class="subtitle" text-anchor="end">한국은행 기준금리: 2026년 8월 2.75% (2025년 7월 3.00%에서 0.25%p 인하)</text>
</svg>
