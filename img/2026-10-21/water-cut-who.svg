<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
<rect width="800" height="470" fill="#ffffff"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#202124">서울 수도요금 감면, 누가 무엇을 깎나</text>
<text x="40" y="82" font-size="16" fill="#5f6368">서울아리수본부 요금감면제도 안내 기준 (2026-10-21 확인)</text>
<g font-size="18" fill="#202124">
<rect x="40" y="105" width="720" height="78" rx="12" fill="#e8f0fe"/>
<text x="64" y="138" font-weight="700">기초생활수급자 · 중증장애인</text>
<text x="64" y="166">상수도 요금 — 세대당 한 달 최대 10톤(㎥)까지</text>
<rect x="40" y="197" width="720" height="78" rx="12" fill="#e6f4ea"/>
<text x="64" y="230" font-weight="700">만 18세 이하 자녀 2명 이상 가구</text>
<text x="64" y="258">하수도 사용료 30% (가정용) — 2026년 3월 납기분부터</text>
<rect x="40" y="289" width="720" height="78" rx="12" fill="#fef7e0"/>
<text x="64" y="322" font-weight="700">한부모가족 복지급여 대상</text>
<text x="64" y="350">하수도 사용료 — 세대당 한 달 최대 10톤(㎥)까지</text>
<rect x="40" y="381" width="720" height="62" rx="12" fill="#f1f3f4"/>
<text x="64" y="420">독립유공자는 신청 없이 시청이 명단을 넘겨 줍니다 · 같은 감면끼리는 겹쳐 받지 않음</text>
</g>
</svg>
