<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="sans-serif">
<rect width="900" height="470" fill="#ffffff"/>
<text x="450" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">큰 바퀴벌레 꿈, 내가 한 일로 갈린다</text>
<g font-size="20" fill="#202124">
<rect x="30" y="95" width="265" height="320" rx="16" fill="#fce8e6" stroke="#d93025" stroke-width="3"/>
<text x="162" y="145" text-anchor="middle" font-weight="700" font-size="24">보기만 했다</text>
<text x="162" y="200" text-anchor="middle">신경 쓰이는 일이</text>
<text x="162" y="230" text-anchor="middle">곁에 와 있다는</text>
<text x="162" y="260" text-anchor="middle">꿈으로 풀이</text>
<text x="162" y="340" text-anchor="middle" font-size="18" fill="#a50e0e">미뤄 둔 일 점검</text>
<rect x="317" y="95" width="265" height="320" rx="16" fill="#e6f4ea" stroke="#34a853" stroke-width="3"/>
<text x="450" y="145" text-anchor="middle" font-weight="700" font-size="24">잡았다·죽였다</text>
<text x="450" y="200" text-anchor="middle">오래 끌던 걱정을</text>
<text x="450" y="230" text-anchor="middle">털어내는 꿈으로</text>
<text x="450" y="260" text-anchor="middle">좋게 읽는 쪽</text>
<text x="450" y="340" text-anchor="middle" font-size="18" fill="#137333">클수록 큰 짐</text>
<rect x="604" y="95" width="265" height="320" rx="16" fill="#fef7e0" stroke="#f9ab00" stroke-width="3"/>
<text x="737" y="145" text-anchor="middle" font-weight="700" font-size="24">떼로 나왔다</text>
<text x="737" y="200" text-anchor="middle">불어나는 것으로 봐</text>
<text x="737" y="230" text-anchor="middle">재물이 늘어나는</text>
<text x="737" y="260" text-anchor="middle">꿈으로도 풀이</text>
<text x="737" y="340" text-anchor="middle" font-size="18" fill="#b06000">놀람이 컸다면 걱정 쪽</text>
</g>
</svg>
