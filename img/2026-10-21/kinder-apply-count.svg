<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="sans-serif">
<rect width="1000" height="520" fill="#ffffff"/>
<text x="40" y="58" font-size="30" font-weight="700" fill="#202124">접수 전에 몇 곳까지 쓸 수 있나</text>
<text x="40" y="96" font-size="20" fill="#5f6368">세종·서울중부교육청 안내 (2026년 10월)</text>
<rect x="40" y="130" width="440" height="200" rx="14" fill="#e8f0fe"/>
<text x="260" y="185" font-size="24" font-weight="700" text-anchor="middle" fill="#202124">처음 유치원에 가는 아이</text>
<text x="260" y="255" font-size="60" font-weight="700" text-anchor="middle" fill="#1a73e8">최대 3곳</text>
<text x="260" y="305" font-size="19" text-anchor="middle" fill="#3c4043">공립·사립 상관없이 희망 순서대로</text>
<rect x="520" y="130" width="440" height="200" rx="14" fill="#fce8e6"/>
<text x="740" y="185" font-size="24" font-weight="700" text-anchor="middle" fill="#202124">지금 다니는 곳에 계속 다닐 아이</text>
<text x="740" y="255" font-size="60" font-weight="700" text-anchor="middle" fill="#d93025">최대 2곳</text>
<text x="740" y="305" font-size="19" text-anchor="middle" fill="#3c4043">세종시교육청 안내 기준</text>
<rect x="40" y="360" width="920" height="120" rx="14" fill="#f1f3f4"/>
<text x="500" y="405" font-size="22" font-weight="700" text-anchor="middle" fill="#202124">먼저 낸다고 유리하지 않아요</text>
<text x="500" y="445" font-size="19" text-anchor="middle" fill="#3c4043">접수가 끝난 뒤 시스템이 무작위로 추첨 · 대상은 2021~2023년생</text>
</svg>
