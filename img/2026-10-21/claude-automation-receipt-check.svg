<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="800" height="380" fill="#ffffff"/>
<text x="400" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#202124">클로드 자동화 확인, 세 칸으로 나눈 이유</text>
<g font-size="17" fill="#202124">
<rect x="30" y="70" width="230" height="170" rx="14" fill="#eaf2ff" stroke="#1a73e8" stroke-width="2"/>
<text x="145" y="104" text-anchor="middle" font-weight="700" fill="#1a73e8">① 예약 작업</text>
<text x="145" y="138" text-anchor="middle">글을 쓰고 올림</text>
<text x="145" y="166" text-anchor="middle">올린 주소를 열어</text>
<text x="145" y="192" text-anchor="middle">확인한 뒤에만</text>
<text x="145" y="218" text-anchor="middle">기록 한 줄</text>
<rect x="285" y="70" width="230" height="170" rx="14" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/>
<text x="400" y="104" text-anchor="middle" font-weight="700" fill="#b06000">② 영수증 파일</text>
<text x="400" y="138" text-anchor="middle">topic_log.txt</text>
<text x="400" y="166" text-anchor="middle">날짜 | 제목 | 블로그</text>
<text x="400" y="192" text-anchor="middle">줄이 없으면</text>
<text x="400" y="218" text-anchor="middle">안 올라간 것</text>
<rect x="540" y="70" width="230" height="170" rx="14" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
<text x="655" y="104" text-anchor="middle" font-weight="700" fill="#188038">③ 감시자</text>
<text x="655" y="138" text-anchor="middle">매일 낮 12시</text>
<text x="655" y="166" text-anchor="middle">AI 없이 파일만 읽음</text>
<text x="655" y="192" text-anchor="middle">문제 있을 때만</text>
<text x="655" y="218" text-anchor="middle">텔레그램 알림</text>
<text x="272" y="162" text-anchor="middle" font-size="26" fill="#5f6368">→</text>
<text x="527" y="162" text-anchor="middle" font-size="26" fill="#5f6368">←</text>
</g>
<text x="400" y="290" text-anchor="middle" font-size="17" fill="#202124">"다 했어요"라는 대답 대신, 남은 기록과 실제 주소를 본다</text>
<text x="400" y="322" text-anchor="middle" font-size="17" fill="#202124">감시자는 AI를 안 쓰므로 사용 한도·비용 한도에 같이 막히지 않는다</text>
</svg>
