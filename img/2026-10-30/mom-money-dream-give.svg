<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="sans-serif">
<rect width="900" height="400" fill="#ffffff"/>
<text x="450" y="44" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">돈이 어느 쪽으로 갔나요</text>
<g font-size="19" fill="#202124" text-anchor="middle">
<rect x="30" y="76" width="260" height="260" rx="14" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
<text x="160" y="118" font-weight="700" font-size="22">엄마 → 나</text>
<text x="160" y="160">받아서 품에 넣음</text>
<text x="160" y="200">도움·재물이 오는 쪽</text>
<text x="160" y="300" fill="#5f6368" font-size="17">가장 좋게 읽는 장면</text>
<rect x="320" y="76" width="260" height="260" rx="14" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/>
<text x="450" y="118" font-weight="700" font-size="22">받지 않고 거절</text>
<text x="450" y="160">손을 내젓거나 돌려줌</text>
<text x="450" y="200">들어온 기회를 미루는 때</text>
<text x="450" y="300" fill="#5f6368" font-size="17">요즘 망설이는 제안 점검</text>
<rect x="610" y="76" width="260" height="260" rx="14" fill="#e3f2fd" stroke="#4285f4" stroke-width="2"/>
<text x="740" y="118" font-weight="700" font-size="22">나 → 엄마</text>
<text x="740" y="160">돈 달라·빌려 달라 함</text>
<text x="740" y="200">나갈 돈·챙길 일 신호</text>
<text x="740" y="300" fill="#5f6368" font-size="17">겁낼 꿈으로 보진 않음</text>
</g>
<text x="450" y="380" text-anchor="middle" font-size="15" fill="#5f6368">전통 해몽에서 흔히 보는 풀이 · 오늘의 꿈 해몽</text>
</svg>
