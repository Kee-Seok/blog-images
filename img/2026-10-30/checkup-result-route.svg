<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="sans-serif">
<rect width="1200" height="700" fill="#ffffff"/>
<text x="60" y="80" font-size="38" font-weight="700" fill="#202124">건강검진 결과가 오는 두 길</text>
<text x="60" y="125" font-size="24" fill="#5f6368">보건복지부 '건강검진 실시기준' 제10조 · 국민건강보험공단 홈페이지 메뉴</text>
<rect x="60" y="170" width="510" height="440" rx="18" fill="#f1f6fe" stroke="#1a73e8" stroke-width="3"/>
<text x="90" y="225" font-size="30" font-weight="700" fill="#1a73e8">① 검진기관이 보내는 통보서</text>
<text x="90" y="290" font-size="26" fill="#202124">검진 끝난 뒤 15일 안에</text>
<text x="90" y="335" font-size="26" fill="#202124">우편 · 이메일 · 모바일로</text>
<text x="90" y="400" font-size="24" fill="#5f6368">확진검사 갈 때 이 통보서와</text>
<text x="90" y="440" font-size="24" fill="#5f6368">신분증을 들고 가요</text>
<rect x="630" y="170" width="510" height="440" rx="18" fill="#fef4ec" stroke="#E8551F" stroke-width="3"/>
<text x="660" y="225" font-size="30" font-weight="700" fill="#E8551F">② 공단 홈페이지 조회</text>
<text x="660" y="290" font-size="26" fill="#202124">기관이 공단 전산에</text>
<text x="660" y="335" font-size="26" fill="#202124">결과를 올려야 보여요</text>
<text x="660" y="400" font-size="24" fill="#5f6368">건강모아 → 건강검진 결과조회</text>
<text x="660" y="440" font-size="24" fill="#5f6368">회사용 · 운전면허용 출력 메뉴</text>
<text x="660" y="480" font-size="24" fill="#5f6368">도 같은 곳에 있어요</text>
<text x="60" y="660" font-size="24" fill="#5f6368">조회가 안 되면 ①을 기다리거나 검진받은 기관에 등록 여부를 물어보세요</text>
</svg>
