<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="900" height="340" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#202124">9월에 고지서가 안 왔다면</text>
  <text x="450" y="74" text-anchor="middle" font-size="15" fill="#5f6368">낼 게 없어서일 수도 있습니다</text>

  <rect x="290" y="100" width="320" height="62" rx="10" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="2"/>
  <text x="450" y="139" text-anchor="middle" font-size="18" font-weight="700" fill="#202124">주택 재산세 연세액은?</text>

  <path d="M370 165 L250 200" stroke="#5f6368" stroke-width="2" marker-end="url(#b)"/>
  <path d="M530 165 L650 200" stroke="#5f6368" stroke-width="2" marker-end="url(#b)"/>
  <defs><marker id="b" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#5f6368"/></marker></defs>

  <rect x="70" y="205" width="340" height="105" rx="10" fill="#E6F4EA" stroke="#188038" stroke-width="2"/>
  <text x="240" y="238" text-anchor="middle" font-size="18" font-weight="700" fill="#137333">20만원 이하</text>
  <text x="240" y="268" text-anchor="middle" font-size="15" fill="#202124">7월에 한 번에 부과</text>
  <text x="240" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#137333">9월 고지 없음</text>

  <rect x="490" y="205" width="340" height="105" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2"/>
  <text x="660" y="238" text-anchor="middle" font-size="18" font-weight="700" fill="#1a73e8">20만원 초과</text>
  <text x="660" y="268" text-anchor="middle" font-size="15" fill="#202124">7월과 9월에 절반씩</text>
  <text x="660" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#1a73e8">9월에 나머지 절반</text>
</svg>
