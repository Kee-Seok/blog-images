<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">7월과 9월은 매기는 대상이 다릅니다</text>
  <text x="450" y="76" text-anchor="middle" font-size="15" fill="#5f6368">이중부과가 아니라 같은 세금을 나눠 걷거나, 아예 다른 것을 걷는 것입니다</text>

  <rect x="55" y="108" width="380" height="250" rx="12" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2"/>
  <text x="245" y="146" text-anchor="middle" font-size="21" font-weight="700" fill="#1a73e8">7월 16일 ~ 7월 31일</text>
  <line x1="85" y1="164" x2="405" y2="164" stroke="#1A73E8" stroke-width="1" opacity="0.4"/>
  <rect x="85" y="184" width="320" height="58" rx="8" fill="#ffffff" stroke="#1A73E8"/>
  <text x="245" y="220" text-anchor="middle" font-size="18" font-weight="700" fill="#202124">주택 1기분</text>
  <rect x="85" y="254" width="320" height="58" rx="8" fill="#ffffff" stroke="#1A73E8"/>
  <text x="245" y="290" text-anchor="middle" font-size="18" font-weight="700" fill="#202124">건축물</text>
  <text x="245" y="338" text-anchor="middle" font-size="14" fill="#5f6368">주택분 한 해 세금의 절반</text>

  <rect x="465" y="108" width="380" height="250" rx="12" fill="#FEF7E0" stroke="#F9AB00" stroke-width="2"/>
  <text x="655" y="146" text-anchor="middle" font-size="21" font-weight="700" fill="#b06000">9월 16일 ~ 9월 30일</text>
  <line x1="495" y1="164" x2="815" y2="164" stroke="#F9AB00" stroke-width="1" opacity="0.5"/>
  <rect x="495" y="184" width="320" height="58" rx="8" fill="#ffffff" stroke="#F9AB00"/>
  <text x="655" y="220" text-anchor="middle" font-size="18" font-weight="700" fill="#202124">주택 2기분</text>
  <rect x="495" y="254" width="320" height="58" rx="8" fill="#ffffff" stroke="#F9AB00"/>
  <text x="655" y="290" text-anchor="middle" font-size="18" font-weight="700" fill="#202124">토지</text>
  <text x="655" y="338" text-anchor="middle" font-size="14" fill="#5f6368">나머지 절반 + 토지는 9월에 몰아서</text>
</svg>
