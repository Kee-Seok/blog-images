<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#202124">선물세트와 상품권도 세금이 붙습니다</text>
  <text x="450" y="74" text-anchor="middle" font-size="15" fill="#5f6368">소득세법에 열거되지 않은 것은 명칭과 관계없이 과세 대상 근로소득입니다</text>

  <rect x="55" y="105" width="380" height="215" rx="12" fill="#FCE8E6" stroke="#D93025" stroke-width="2"/>
  <text x="245" y="142" text-anchor="middle" font-size="19" font-weight="700" fill="#c5221f">과세 — 세금이 붙습니다</text>
  <line x1="85" y1="160" x2="405" y2="160" stroke="#D93025" stroke-width="1" opacity="0.4"/>
  <text x="95" y="196" font-size="16" fill="#202124">· 회사가 사서 나눠준 상품권</text>
  <text x="95" y="232" font-size="16" fill="#202124">· 추석 선물세트 등 현물</text>
  <text x="95" y="268" font-size="16" fill="#202124">· 명칭이 무엇이든 지급된 금품</text>
  <text x="245" y="303" text-anchor="middle" font-size="14" fill="#c5221f">받은 만큼 근로소득이 늘어납니다</text>

  <rect x="465" y="105" width="380" height="215" rx="12" fill="#E6F4EA" stroke="#188038" stroke-width="2"/>
  <text x="655" y="142" text-anchor="middle" font-size="19" font-weight="700" fill="#137333">비과세 — 근로소득으로 안 봅니다</text>
  <line x1="495" y1="160" x2="815" y2="160" stroke="#188038" stroke-width="1" opacity="0.4"/>
  <text x="505" y="196" font-size="16" fill="#202124">· 사내근로복지기금에서 나온 금품</text>
  <text x="505" y="232" font-size="15" fill="#5f6368">단, 용도사업 정관을</text>
  <text x="505" y="258" font-size="15" fill="#5f6368">고용노동부장관에게 인가받아</text>
  <text x="505" y="284" font-size="15" fill="#5f6368">시행하는 경우여야 합니다</text>
  <text x="655" y="310" text-anchor="middle" font-size="14" fill="#137333">총무팀이 그냥 사준 건 해당 없음</text>
</svg>
