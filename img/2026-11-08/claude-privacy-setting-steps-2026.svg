<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
<rect width="800" height="420" fill="#ffffff"/>
<text x="400" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">AI 모델 개선 지원 끄는 순서 (컴퓨터)</text>
<g font-size="21" fill="#202124">
<rect x="40" y="90" width="160" height="110" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="120" y="140" text-anchor="middle" font-weight="700">① 내 이름</text><text x="120" y="172" text-anchor="middle" font-size="17">왼쪽 아래</text>
<rect x="230" y="90" width="160" height="110" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="310" y="140" text-anchor="middle" font-weight="700">② 설정</text><text x="310" y="172" text-anchor="middle" font-size="17">드롭다운 메뉴</text>
<rect x="420" y="90" width="160" height="110" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="500" y="140" text-anchor="middle" font-weight="700">③ 개인정보 보호</text><text x="500" y="172" text-anchor="middle" font-size="17">왼쪽 탭</text>
<rect x="610" y="90" width="160" height="110" rx="14" fill="#fff8e1" stroke="#fbc400" stroke-width="2"/><text x="690" y="140" text-anchor="middle" font-weight="700">④ 끄기</text><text x="690" y="172" text-anchor="middle" font-size="17">AI 모델 개선 지원</text>
<path d="M203 145 h22 M393 145 h22 M583 145 h22" stroke="#5f6368" stroke-width="3"/>
</g>
<g font-size="19" fill="#202124">
<text x="40" y="262" font-weight="700">켜 두면</text><text x="160" y="262">새 채팅·코딩 세션을 학습에 쓰고, 최대 5년 보관</text>
<text x="40" y="304" font-weight="700">끄면</text><text x="160" y="304">앞으로의 학습에 안 씀 (이미 끝난 학습은 그대로)</text>
<text x="40" y="346" font-weight="700">삭제하면</text><text x="160" y="346">기록에서 바로 사라지고 30일 안에 서버에서 삭제</text>
</g>
<text x="400" y="400" text-anchor="middle" font-size="15" fill="#5f6368">출처: Anthropic 개인정보 센터 (2026-11-08 확인) · 소비자 요금제(Free·Pro·Max) 기준</text>
