<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Pretendard,Apple SD Gothic Neo,sans-serif"><rect width="1200" height="560" rx="28" fill="#ffffff"/><text x="600" y="72" font-size="38" font-weight="700" fill="#202124" text-anchor="middle">국민연금 조기수령나이 (출생연도별)</text><rect x="60" y="110" width="1080" height="80" rx="14" fill="#0B1B3A"/><text x="260" y="162" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">태어난 해</text><text x="640" y="162" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">원래 받는 나이</text><text x="960" y="162" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">가장 빨리 받는 나이</text><rect x="60" y="200" width="1080" height="90" rx="14" fill="#f8f9fa"/><text x="260" y="257" font-size="32" fill="#202124" text-anchor="middle">1961~1964년생</text><text x="640" y="257" font-size="34" font-weight="700" fill="#202124" text-anchor="middle">63세</text><text x="960" y="257" font-size="34" font-weight="700" fill="#c5221f" text-anchor="middle">58세</text><rect x="60" y="300" width="1080" height="90" rx="14" fill="#eef2fb"/><text x="260" y="357" font-size="32" fill="#202124" text-anchor="middle">1965~1968년생</text><text x="640" y="357" font-size="34" font-weight="700" fill="#202124" text-anchor="middle">64세</text><text x="960" y="357" font-size="34" font-weight="700" fill="#c5221f" text-anchor="middle">59세</text><rect x="60" y="400" width="1080" height="90" rx="14" fill="#f8f9fa"/><text x="260" y="457" font-size="32" fill="#202124" text-anchor="middle">1969년생 이후</text><text x="640" y="457" font-size="34" font-weight="700" fill="#202124" text-anchor="middle">65세</text><text x="960" y="457" font-size="34" font-weight="700" fill="#c5221f" text-anchor="middle">60세</text><text x="600" y="528" font-size="22" fill="#5f6368" text-anchor="middle">가입기간 10년 이상 · 소득이 있는 업무를 안 할 때만 · 국민연금법 기준</text></svg>