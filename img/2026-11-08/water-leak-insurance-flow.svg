<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="800" height="460" fill="#ffffff"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">누수탐지 비용, 어느 보험에서 나오나</text>
<rect x="290" y="70" width="220" height="60" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="400" y="108" text-anchor="middle" font-size="21" font-weight="700" fill="#202124">우리 집에서 물이 샘</text>
<line x1="400" y1="130" x2="400" y2="160" stroke="#5f6368" stroke-width="2"/>
<rect x="250" y="160" width="300" height="60" rx="12" fill="#fff8e1" stroke="#fbc400" stroke-width="2"/>
<text x="400" y="198" text-anchor="middle" font-size="20" font-weight="700" fill="#202124">아랫집·옆집에 피해가 있나?</text>
<line x1="320" y1="220" x2="200" y2="270" stroke="#5f6368" stroke-width="2"/>
<line x1="480" y1="220" x2="600" y2="270" stroke="#5f6368" stroke-width="2"/>
<text x="235" y="252" font-size="18" fill="#1a73e8" font-weight="700">있다</text>
<text x="540" y="252" font-size="18" fill="#d93025" font-weight="700">없다</text>
<rect x="40" y="270" width="330" height="160" rx="12" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
<text x="205" y="305" text-anchor="middle" font-size="20" font-weight="700" fill="#202124">일상생활배상책임 특약</text>
<text x="205" y="340" text-anchor="middle" font-size="17" fill="#202124">아랫집 수리비 보상</text>
<text x="205" y="370" text-anchor="middle" font-size="17" fill="#202124">원인 찾는 탐지비·철거·방수공사도</text>
<text x="205" y="398" text-anchor="middle" font-size="17" fill="#202124">손해방지비용으로 보상 가능</text>
<rect x="430" y="270" width="330" height="160" rx="12" fill="#fce8e6" stroke="#d93025" stroke-width="2"/>
<text x="595" y="305" text-anchor="middle" font-size="20" font-weight="700" fill="#202124">일상생활배상책임 특약 ✕</text>
<text x="595" y="340" text-anchor="middle" font-size="17" fill="#202124">내 집 피해만 있으면 보상 안 됨</text>
<text x="595" y="370" text-anchor="middle" font-size="17" fill="#202124">내 집 수리는</text>
<text x="595" y="398" text-anchor="middle" font-size="17" fill="#202124">급배수시설 누출손해 특약 쪽</text>
<text x="400" y="452" text-anchor="middle" font-size="14" fill="#5f6368">출처: 금융감독원 소비자 유의사항(2024.8.7) · 크라우드의 Money</text>
</svg>
