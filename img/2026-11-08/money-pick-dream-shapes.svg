<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Pretendard,Apple SD Gothic Neo,sans-serif"><rect width="1200" height="760" rx="28" fill="#ffffff"/><text x="600" y="72" font-size="40" font-weight="700" fill="#202124" text-anchor="middle">주운 돈의 모양별, 흔히 보는 풀이</text><text x="80" y="140" font-size="26" font-weight="700" fill="#5f6368">주운 것</text><text x="500" y="140" font-size="26" font-weight="700" fill="#5f6368">전통 해몽 풀이</text>
<rect x="50" y="165" width="1100" height="92" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="165" width="14" height="92" rx="7" fill="#1e8e3e"/><text x="80" y="223" font-size="30" font-weight="700" fill="#202124">빳빳한 지폐</text><text x="500" y="223" font-size="28" fill="#202124">반가운 재물·좋은 소식</text>
<rect x="50" y="275" width="1100" height="92" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="275" width="14" height="92" rx="7" fill="#f29900"/><text x="80" y="333" font-size="30" font-weight="700" fill="#202124">동전 몇 개</text><text x="500" y="333" font-size="28" fill="#202124">작은 이익, 또는 잔걱정</text>
<rect x="50" y="385" width="1100" height="92" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="385" width="14" height="92" rx="7" fill="#1a73e8"/><text x="80" y="443" font-size="30" font-weight="700" fill="#202124">돈다발</text><text x="500" y="443" font-size="28" fill="#202124">큰 기회, 맡을 일도 커짐</text>
<rect x="50" y="495" width="1100" height="92" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="495" width="14" height="92" rx="7" fill="#5f6368"/><text x="80" y="553" font-size="30" font-weight="700" fill="#202124">찢어지거나 젖은 돈</text><text x="500" y="553" font-size="28" fill="#202124">기회는 오지만 흠이 있음</text>
<rect x="50" y="605" width="1100" height="92" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="605" width="14" height="92" rx="7" fill="#d93025"/><text x="80" y="663" font-size="30" font-weight="700" fill="#202124">줍자마자 잃어버림</text><text x="500" y="663" font-size="28" fill="#202124">놓칠까 걱정되는 마음</text>
</svg>
