<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
<rect width="800" height="440" fill="#ffffff"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">자동화에 넘기는 것과 안 넘기는 것</text>
<rect x="40" y="76" width="350" height="320" rx="14" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2"/>
<rect x="410" y="76" width="350" height="320" rx="14" fill="#fce8e6" stroke="#d93025" stroke-width="2"/>
<text x="215" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#137333">넘긴다</text>
<text x="585" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#a50e0e">안 넘긴다</text>
<g font-size="18" fill="#202124">
<text x="64" y="166">· 이미 로그인된 브라우저 창</text>
<text x="64" y="210">· 간편로그인 버튼 누르기</text>
<text x="64" y="254">· 키를 파일에서 읽는 스크립트</text>
<text x="64" y="298">  (키 값은 화면에 안 찍음)</text>
<text x="64" y="342">· 막히면 텔레그램 알림</text>
<text x="434" y="166">· 비밀번호 입력</text>
<text x="434" y="210">· 채팅창에 키·토큰 붙여넣기</text>
<text x="434" y="254">· 메모 파일에 비밀번호 적기</text>
<text x="434" y="298">· 고객 이름·연락처 원본</text>
<text x="434" y="342">· 결제·카드 번호</text>
</g>
<text x="400" y="424" text-anchor="middle" font-size="15" fill="#5f6368">크라우드의 코드리뷰 계정이 실제로 쓰는 선 (예약 작업 43개 기준)</text>
</svg>
