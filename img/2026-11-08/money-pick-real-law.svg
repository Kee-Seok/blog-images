<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" font-family="Pretendard,Apple SD Gothic Neo,sans-serif"><rect width="1200" height="650" rx="28" fill="#ffffff"/><text x="600" y="72" font-size="40" font-weight="700" fill="#202124" text-anchor="middle">꿈 말고 진짜로 돈을 주웠다면</text>
<rect x="50" y="120" width="1100" height="92" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="120" width="14" height="92" rx="7" fill="#1a73e8"/><text x="80" y="178" font-size="30" font-weight="700" fill="#202124">1. 7일 안에</text><text x="500" y="178" font-size="28" fill="#202124">주인에게 돌려주거나 경찰서에 냄</text>
<rect x="50" y="230" width="1100" height="92" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="230" width="14" height="92" rx="7" fill="#1e8e3e"/><text x="80" y="288" font-size="30" font-weight="700" fill="#202124">2. 주인이 찾아가면</text><text x="500" y="288" font-size="28" fill="#202124">물건값의 5~20% 보상금 청구</text>
<rect x="50" y="340" width="1100" height="92" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="340" width="14" height="92" rx="7" fill="#f29900"/><text x="80" y="398" font-size="30" font-weight="700" fill="#202124">3. 보상금 청구 기한</text><text x="500" y="398" font-size="28" fill="#202124">돌려준 뒤 1개월 안에</text>
<rect x="50" y="450" width="1100" height="92" rx="16" fill="#f8f9fa" stroke="#e1e6ee"/><rect x="50" y="450" width="14" height="92" rx="7" fill="#d93025"/><text x="80" y="508" font-size="30" font-weight="700" fill="#202124">4. 그냥 가지면</text><text x="500" y="508" font-size="28" fill="#202124">1년 이하 징역·300만원 이하 벌금</text>
<text x="600" y="610" font-size="24" fill="#5f6368" text-anchor="middle">유실물법 제1·4·6·9조, 형법 제360조 (국가법령정보센터 2026-11-08 확인)</text></svg>
