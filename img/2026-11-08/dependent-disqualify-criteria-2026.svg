<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
<rect width="800" height="520" fill="#ffffff"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">피부양자 탈락 기준, 세 칸 중 하나만 걸려도 빠져요</text>
<g font-size="19" fill="#202124">
<rect x="40" y="80" width="720" height="110" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="64" y="118" font-weight="700" fill="#1a73e8">① 소득</text>
<text x="64" y="150">사업·금융·연금·근로·기타 소득을 모두 합해 연 2천만원 넘으면 탈락</text>
<text x="64" y="176" font-size="16" fill="#5f6368">결혼했다면 부부 둘 다 이 기준을 지켜야 해요</text>
<rect x="40" y="206" width="720" height="110" rx="14" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/>
<text x="64" y="244" font-weight="700" fill="#b06000">② 사업소득</text>
<text x="64" y="276">사업자등록이 있으면 사업소득이 1원만 있어도 탈락</text>
<text x="64" y="302" font-size="16" fill="#5f6368">등록이 없으면 연 500만원까지는 괜찮아요(주택임대소득은 예외 없음)</text>
<rect x="40" y="332" width="720" height="150" rx="14" fill="#fce8e6" stroke="#d93025" stroke-width="2"/>
<text x="64" y="370" font-weight="700" fill="#d93025">③ 재산(재산세 과세표준 합계)</text>
<text x="64" y="404">5.4억원 이하 → 통과</text>
<text x="64" y="434">5.4억 초과 9억원 이하 → 연 소득 1천만원 이하일 때만 통과</text>
<text x="64" y="464">9억원 초과 → 소득과 상관없이 탈락</text>
</g>
<text x="400" y="508" text-anchor="middle" font-size="14" fill="#5f6368">출처: 국민건강보험공단 피부양자 인정기준(국민건강보험법 시행규칙 별표1의2)</text>
</svg>
