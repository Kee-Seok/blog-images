<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
<rect width="800" height="400" fill="#ffffff"/>
<text x="400" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#202124">이번 11월 피부양자 탈락은 이 자료로 갈려요</text>
<line x1="80" y1="190" x2="720" y2="190" stroke="#9aa0a6" stroke-width="4"/>
<g font-size="17" fill="#202124" text-anchor="middle">
<circle cx="120" cy="190" r="14" fill="#1a73e8"/><text x="120" y="150" font-weight="700">2025년 1년</text><text x="120" y="236">이때 번 소득</text><text x="120" y="260" font-size="15" fill="#5f6368">(국세청 자료)</text>
<circle cx="320" cy="190" r="14" fill="#1a73e8"/><text x="320" y="150" font-weight="700">2026년 6월 1일</text><text x="320" y="236">재산세 과세표준</text>
<circle cx="520" cy="190" r="14" fill="#d93025"/><text x="520" y="150" font-weight="700" fill="#d93025">2026년 11월</text><text x="520" y="236">두 자료 반영</text><text x="520" y="260" font-size="15" fill="#5f6368">기준 넘으면 지역가입자로</text>
<circle cx="700" cy="190" r="14" fill="#1a73e8"/><text x="700" y="150" font-weight="700">2027년 10월</text><text x="700" y="236">같은 자료로 유지</text>
</g>
<rect x="80" y="300" width="640" height="64" rx="12" fill="#f3f8ff" stroke="#1a73e8"/>
<text x="400" y="340" text-anchor="middle" font-size="18" fill="#202124">2026년에 소득이 줄었어도 이번 판정은 2025년 소득으로 해요</text>
<text x="400" y="390" text-anchor="middle" font-size="14" fill="#5f6368">출처: 국민건강보험법 시행령 제41조, 공단 정관 제43조의4</text>
</svg>
