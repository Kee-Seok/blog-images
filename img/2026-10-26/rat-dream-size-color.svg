<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="sans-serif">
<rect width="900" height="420" fill="#ffffff"/>
<text x="450" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">쥐 크기·색깔별로 달라지는 꿈 풀이</text>
<g font-size="20" fill="#202124">
<rect x="40" y="85" width="820" height="70" rx="12" fill="#f1f3f4"/>
<text x="70" y="128" font-weight="700">새끼쥐</text>
<text x="230" y="128">자잘한 지출·작은 걱정 여러 개, 죽어 있으면 하나씩 정리됨</text>
<rect x="40" y="170" width="820" height="70" rx="12" fill="#f1f3f4"/>
<text x="70" y="213" font-weight="700">큰 쥐</text>
<text x="230" y="213">덩치 큰 근심이나 내 몫을 노리는 사람, 죽으면 그 문제가 꺾임</text>
<rect x="40" y="255" width="820" height="70" rx="12" fill="#f1f3f4"/>
<text x="70" y="298" font-weight="700">흰 쥐</text>
<text x="230" y="298">재물·좋은 소식 쪽으로 읽는 길몽, 태몽으로 보기도 함</text>
<rect x="40" y="340" width="820" height="50" rx="12" fill="#fff4e5"/>
<text x="450" y="372" text-anchor="middle" font-size="18" fill="#5f6368">쥐 떼가 한꺼번에 죽어 있었다면 여러 걱정이 한 번에 걷히는 쪽으로 풀이</text>
</g>
<text x="450" y="412" text-anchor="middle" font-size="15" fill="#80868b">전통 해몽 풀이 정리 · 오늘의 꿈 해몽</text>
</svg>
