<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="sans-serif">
<rect width="900" height="400" fill="#ffffff"/>
<text x="450" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">죽은 쥐 꿈, 쥐가 어떻게 죽어 있었나</text>
<g font-size="20" fill="#202124">
<rect x="30" y="90" width="260" height="270" rx="16" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
<text x="160" y="135" text-anchor="middle" font-weight="700" font-size="23">이미 죽어 있음</text>
<text x="160" y="185" text-anchor="middle">속 썩이던 일이</text>
<text x="160" y="215" text-anchor="middle">저절로 풀리는 쪽</text>
<text x="160" y="275" text-anchor="middle" fill="#5f6368" font-size="18">보기만 하고 깼다면</text>
<text x="160" y="303" text-anchor="middle" fill="#5f6368" font-size="18">걱정이 줄어드는 때</text>
<rect x="320" y="90" width="260" height="270" rx="16" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="450" y="135" text-anchor="middle" font-weight="700" font-size="23">내가 잡아 죽임</text>
<text x="450" y="185" text-anchor="middle">골칫거리를 내 손으로</text>
<text x="450" y="215" text-anchor="middle">정리한다는 길몽</text>
<text x="450" y="275" text-anchor="middle" fill="#5f6368" font-size="18">새는 돈을 막는다는</text>
<text x="450" y="303" text-anchor="middle" fill="#5f6368" font-size="18">풀이도 함께 붙어요</text>
<rect x="610" y="90" width="260" height="270" rx="16" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
<text x="740" y="135" text-anchor="middle" font-weight="700" font-size="23">썩어서 냄새남</text>
<text x="740" y="185" text-anchor="middle">미뤄 둔 일이</text>
<text x="740" y="215" text-anchor="middle">쌓여 있다는 신호</text>
<text x="740" y="275" text-anchor="middle" fill="#5f6368" font-size="18">치우고 깼다면</text>
<text x="740" y="303" text-anchor="middle" fill="#5f6368" font-size="18">정리할 때가 왔다는 뜻</text>
</g>
<text x="450" y="390" text-anchor="middle" font-size="15" fill="#80868b">전통 해몽에서 흔히 쓰는 풀이를 정리한 그림 · 오늘의 꿈 해몽</text>
</svg>
