<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="sans-serif">
<rect width="1000" height="540" fill="#ffffff"/>
<text x="500" y="50" text-anchor="middle" font-size="30" font-weight="700" fill="#202124">안심상속 원스톱 조회 결과, 화면에 따라 다음 걸음</text>
<g font-size="22" fill="#202124" text-anchor="middle">
<rect x="40" y="90" width="290" height="360" rx="16" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="185" y="140" font-weight="700" fill="#1a73e8" font-size="25">예금만 떴다</text>
<text x="185" y="200">예금액이 표시됨</text>
<text x="185" y="250">잔액·거래내역은</text>
<text x="185" y="280">그 은행 창구에서</text>
<text x="185" y="360" font-weight="700">은행에 서류 묻고 방문</text>
<rect x="355" y="90" width="290" height="360" rx="16" fill="#fef7e0" stroke="#e8710a" stroke-width="2"/>
<text x="500" y="140" font-weight="700" fill="#b06000" font-size="25">보험 '가입'만</text>
<text x="500" y="200">금액은 안 나옴</text>
<text x="500" y="250">보험사에 사망 사실</text>
<text x="500" y="280">알리고 청구</text>
<text x="500" y="360" font-weight="700">병원비는 진료일부터 3년</text>
<rect x="670" y="90" width="290" height="360" rx="16" fill="#fce8e6" stroke="#d93025" stroke-width="2"/>
<text x="815" y="140" font-weight="700" fill="#c5221f" font-size="25">빚이 더 크다</text>
<text x="815" y="200">채무금액이 표시됨</text>
<text x="815" y="250">돈 찾기 전에 멈춤</text>
<text x="815" y="280">법률구조공단 132</text>
<text x="815" y="360" font-weight="700">포기·한정승인 3개월 안</text>
</g>
<text x="500" y="500" text-anchor="middle" font-size="18" fill="#80868b">금융감독원 상속인 금융거래 조회 안내 · 민법 제1019조 정리 (2026년 10월)</text>
</svg>
