<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
<rect width="800" height="330" fill="#ffffff"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">2026년 중간예납, 분납하면 이렇게 흘러가요</text>
<line x1="80" y1="150" x2="720" y2="150" stroke="#dadce0" stroke-width="4"/>
<g font-size="17" fill="#202124" text-anchor="middle">
<circle cx="110" cy="150" r="14" fill="#5f6368"/><text x="110" y="110" font-weight="700">11월 1~15일</text><text x="110" y="196">고지서 발급</text>
<circle cx="260" cy="150" r="14" fill="#1a73e8"/><text x="260" y="110" font-weight="700">11월 30일(월)</text><text x="260" y="196">분납분 뺀 금액</text><text x="260" y="220">납부기한</text>
<circle cx="420" cy="150" r="14" fill="#5f6368"/><text x="420" y="110" font-weight="700">2027년 1월 1~15일</text><text x="420" y="196">남은 금액</text><text x="420" y="220">새 고지서</text>
<circle cx="560" cy="150" r="14" fill="#fbbc04"/><text x="560" y="110" font-weight="700">2월 1일(월)</text><text x="560" y="196">분납분</text><text x="560" y="220">납부기한</text>
<circle cx="690" cy="150" r="14" fill="#34a853"/><text x="690" y="110" font-weight="700">2027년 5월</text><text x="690" y="196">확정신고 때</text><text x="690" y="220">낸 돈 빼고 계산</text>
</g>
<text x="400" y="290" text-anchor="middle" font-size="15" fill="#5f6368">출처: 소득세법 제65조, 국세청 중간예납 안내(2026-10-26 확인)</text>
</svg>
