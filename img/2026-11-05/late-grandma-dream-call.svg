<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="sans-serif">
<rect width="900" height="330" fill="#ffffff"/>
<text x="450" y="44" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">할머니가 나를 부르신 꿈, 그다음 장면</text>
<g font-size="20" fill="#202124" text-anchor="middle">
<rect x="40" y="80" width="250" height="210" rx="14" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="2"/>
<text x="165" y="130" font-weight="700" font-size="23">나를 부르심</text>
<text x="165" y="180">어디로 갔는지가</text>
<text x="165" y="214">풀이를 가름</text>
<path d="M300 150 L350 110" stroke="#5f6368" stroke-width="3"/>
<path d="M300 220 L350 260" stroke="#5f6368" stroke-width="3"/>
<rect x="360" y="70" width="500" height="100" rx="14" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
<text x="610" y="112" font-weight="700" font-size="22">따라가지 않고 깸</text>
<text x="610" y="148">걱정이 비켜 가는 쪽으로 풀이</text>
<rect x="360" y="200" width="500" height="100" rx="14" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/>
<text x="610" y="242" font-weight="700" font-size="22">함께 따라감</text>
<text x="610" y="278">몸 상태와 일정을 한 번 살피라는 뜻</text>
</g>
</svg>
