<text x="90" y="351">· 저녁 발행은 노출 시간이 짧아 10월 21일부터 아침으로 당겼어요</text>
</g>
<text x="400" y="440" text-anchor="middle" font-size="14" fill="#5f6368">이 계정 예약 작업 기준 (2026-11-05)</text>
