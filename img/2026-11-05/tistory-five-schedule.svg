<g font-size="17" fill="#202124" text-anchor="middle">
<circle cx="90" cy="95" r="9" fill="#8ab4f8"/><text x="90" y="72" font-weight="700">06시</text>
<circle cx="220" cy="95" r="9" fill="#8ab4f8"/><text x="220" y="72" font-weight="700">07시</text>
<circle cx="350" cy="95" r="9" fill="#8ab4f8"/><text x="350" y="72" font-weight="700">08시</text>
<circle cx="480" cy="95" r="9" fill="#f9ab00"/><text x="480" y="72" font-weight="700">09시</text>
