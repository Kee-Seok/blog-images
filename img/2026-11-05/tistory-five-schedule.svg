<rect x="60" y="210" width="680" height="180" rx="14" fill="#f8f9fa" stroke="#dadce0"/>
<g font-size="17" fill="#202124">
<text x="90" y="250" font-weight="700">왜 이렇게 나눴나</text>
<text x="90" y="285">· 블로그마다 맡는 검색어가 달라서 서로 순위를 뺏지 않아요</text>
