<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
<rect width="720" height="470" rx="18" fill="#ffffff"/>
<text x="36" y="50" font-size="26" font-weight="700" fill="#202124">교통사고 8주룰 진단서, 이 3가지가 적혀야 해요</text>
<g font-size="18" fill="#202124">
<rect x="36" y="76" width="648" height="56" rx="10" fill="#f3f8ff" stroke="#1a73e8"/>
<text x="56" y="111"><tspan font-weight="700" fill="#1a73e8">①</tspan> 치료 끝나는 예정일이 사고일 + 8주를 넘는 날짜</text>
<rect x="36" y="144" width="648" height="56" rx="10" fill="#f3f8ff" stroke="#1a73e8"/>
<text x="56" y="179"><tspan font-weight="700" fill="#1a73e8">②</tspan> 다친 곳(상병)마다 치료가 더 필요한 기간</text>
<rect x="36" y="212" width="648" height="56" rx="10" fill="#f3f8ff" stroke="#1a73e8"/>
<text x="56" y="247"><tspan font-weight="700" fill="#1a73e8">③</tspan> 더 치료해야 하는 이유 (검사 소견·치료 변화)</text>
</g>
<text x="36" y="312" font-size="20" font-weight="700" fill="#202124">그다음 흐름</text>
<g font-size="16" fill="#202124" text-anchor="middle">
<rect x="36" y="330" width="146" height="80" rx="10" fill="#fff8e1"/><text x="109" y="364">7주 안에</text><text x="109" y="388">보험사에 서류</text>
<rect x="204" y="330" width="146" height="80" rx="10" fill="#fff8e1"/><text x="277" y="364">보험사가</text><text x="277" y="388">자배원에 넘김</text>
<rect x="372" y="330" width="146" height="80" rx="10" fill="#fff8e1"/><text x="445" y="364">7일 안에</text><text x="445" y="388">결과 통보</text>
<rect x="540" y="330" width="144" height="80" rx="10" fill="#fff8e1"/><text x="612" y="364">불만이면</text><text x="612" y="388">7일 안 이의</text>
</g>
<g fill="#5f6368"><path d="M184 370 l16 0 l-6 -6 M200 370 l-6 6" stroke="#5f6368" stroke-width="2"/><path d="M352 370 l16 0 l-6 -6 M368 370 l-6 6" stroke="#5f6368" stroke-width="2"/><path d="M520 370 l16 0 l-6 -6 M536 370 l-6 6" stroke="#5f6368" stroke-width="2"/></g>
<text x="36" y="446" font-size="15" fill="#5f6368">출처: 국토교통부 의료기관 안내(2026.11.3 보도), 자동차손해배상진흥원 청구안내</text>
</svg>
