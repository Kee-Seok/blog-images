<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="1200" height="675" fill="#ffffff"/>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4ecec;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- 치과 아이콘 -->
  <g transform="translate(600, 180)">
    <circle cx="0" cy="0" r="90" fill="#4a90d9" opacity="0.15"/>
    <rect x="-40" y="-60" width="80" height="80" rx="8" fill="none" stroke="#2c5aa0" stroke-width="3"/>
    <rect x="-25" y="-50" width="50" height="20" rx="3" fill="#5ba3e6"/>
    <rect x="-25" y="10" width="50" height="20" rx="3" fill="#5ba3e6"/>
    <rect x="-25" y="-35" width="20" height="30" rx="3" fill="#b8d4f0"/>
    <rect x="5" y="-35" width="20" height="30" rx="3" fill="#b8d4f0"/>
    <rect x="-25" y="25" width="20" height="20" rx="3" fill="#b8d4f0"/>
    <rect x="5" y="25" width="20" height="20" rx="3" fill="#b8d4f0"/>
  </g>
  
  <!-- 제목 텍스트 -->
  <text x="600" y="330" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="700" fill="#1a365d">
    2026 치과보험
  </text>
  <text x="600" y="385" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="700" fill="#1a365d">
    보장내역 완벽 비교
  </text>
  
  <!-- 부제목 -->
  <text x="600" y="440" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#5a6c7d">
    임플란트·스케일링·틀니 보장 한도부터 가입 전 체크리스트까지
  </text>
  
  <!-- 하단 강조 박스 -->
  <rect x="200" y="500" width="800" height="100" rx="12" fill="#f0f7ff" stroke="#4a90d9" stroke-width="2"/>
  <text x="600" y="540" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="600" fill="#2c5aa0">
    보험사별 보장 비교 + 가입 전 실수 막는 팁
  </text>
  <text x="600" y="575" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5a6c7d">
    2026년 8월 기준 · 공식 출처 확인 내용 정리
  </text>
</svg>
