<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="40" y="58" font-size="30" font-weight="800" fill="#202124">ISA 만기 3,000만원(수익 300만원) 옮길 때 일정과 돈</text>
<text x="40" y="92" font-size="18" fill="#5f6368">일반형 · 총급여 5,500만원 이하 직장인 기준 · 2026년 10월 현행 세법</text>
<line x1="90" y1="190" x2="880" y2="190" stroke="#dadce0" stroke-width="6" stroke-linecap="round"/>
<g font-size="19" fill="#202124">
<circle cx="110" cy="190" r="18" fill="#fbbc04"/><text x="110" y="150" text-anchor="middle" font-weight="800">만기 전</text>
<text x="110" y="245" text-anchor="middle">펀드·ETF 팔아</text><text x="110" y="270" text-anchor="middle">현금으로</text>
<circle cx="330" cy="190" r="18" fill="#1a73e8"/><text x="330" y="150" text-anchor="middle" font-weight="800">만기일</text>
<text x="330" y="245" text-anchor="middle">ISA 세금 정산</text><text x="330" y="270" text-anchor="middle">(300-200)×9.9%</text><text x="330" y="295" text-anchor="middle" font-weight="800">= 9만9천원</text>
<circle cx="560" cy="190" r="18" fill="#e8710a"/><text x="560" y="150" text-anchor="middle" font-weight="800">60일 안</text>
<text x="560" y="245" text-anchor="middle">연금저축·IRP로</text><text x="560" y="270" text-anchor="middle">3,290만1천원 이체</text>
<circle cx="790" cy="190" r="18" fill="#188038"/><text x="790" y="150" text-anchor="middle" font-weight="800">다음 해 1~2월</text>
<text x="790" y="245" text-anchor="middle">연말정산 추가 공제</text><text x="790" y="270" text-anchor="middle">300만원×16.5%</text><text x="790" y="295" text-anchor="middle" font-weight="800">= 49만5천원</text>
</g>
<rect x="40" y="350" width="880" height="130" rx="14" fill="#f7f9fc" stroke="#e1e6ee"/>
<text x="64" y="392" font-size="20" font-weight="800" fill="#202124">55세 넘어 연금으로 받을 때</text>
<text x="64" y="428" font-size="18" fill="#202124">공제 안 받은 2,990만1천원 → 세금 없음</text>
<text x="64" y="458" font-size="18" fill="#202124">공제받은 300만원 + 그 뒤 불어난 수익 → 연금소득세 5.5%(70세 미만)·4.4%·3.3%</text>
</svg>
