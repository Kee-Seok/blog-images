<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="sans-serif">
<rect width="900" height="460" fill="#ffffff"/>
<text x="450" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">물고기 잡는 꿈 태몽으로 보는 경우</text>
<rect x="60" y="95" width="780" height="80" rx="16" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/>
<text x="450" y="145" text-anchor="middle" font-size="22" fill="#202124">아이를 기다리는 본인·배우자·가까운 가족이 꿈</text>
<rect x="60" y="195" width="780" height="80" rx="16" fill="#e6f4ea" stroke="#34a853" stroke-width="3"/>
<text x="450" y="245" text-anchor="middle" font-size="22" fill="#202124">잡은 물고기를 품에 안거나 집으로 가져옴</text>
<rect x="60" y="295" width="780" height="80" rx="16" fill="#fef7e0" stroke="#fbbc04" stroke-width="3"/>
<text x="450" y="345" text-anchor="middle" font-size="22" fill="#202124">비늘이 빛나고 살아서 힘차게 움직임</text>
<text x="450" y="420" text-anchor="middle" font-size="17" fill="#5f6368">아이 계획이 없다면 재물·일 쪽 풀이로 읽음</text>
</svg>
