<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="800" height="470" fill="#ffffff"/>
<text x="40" y="50" font-size="25" font-weight="700" fill="#202124">대상포진 통원 8만원, 4세대 실손이면 4만원</text>
<text x="40" y="80" font-size="15" fill="#5f6368">예시 금액(가정) · 같은 날 의원+약국 · 4세대 공제 기준(금융위원회 2021.6.29)</text>
<g font-size="17" fill="#202124">
<rect x="40" y="105" width="350" height="150" rx="12" fill="#e8f0fe"/>
<text x="60" y="140" font-weight="700">급여 3만원 (진찰 8천 + 약 2만2천)</text>
<text x="60" y="175">20%는 6천원 &lt; 최소 1만원</text>
<text x="60" y="205">→ 1만원 빼고</text>
<text x="60" y="238" font-weight="700" fill="#1a73e8">2만원 돌려받음</text>
<rect x="410" y="105" width="350" height="150" rx="12" fill="#fef7e0"/>
<text x="430" y="140" font-weight="700">비급여 5만원 (통증 주사)</text>
<text x="430" y="175">30%는 1만5천원 &lt; 최소 3만원</text>
<text x="430" y="205">→ 3만원 빼고</text>
<text x="430" y="238" font-weight="700" fill="#b06000">2만원 돌려받음</text>
</g>
<rect x="40" y="280" width="720" height="70" rx="12" fill="#f1f3f4"/>
<text x="400" y="324" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">낸 돈 8만원 → 실손 4만원 (50%)</text>
<text x="40" y="390" font-size="16" fill="#202124">• 급여·비급여는 따로 공제합니다 (급여 1만원 · 비급여 3만원 중 큰 금액)</text>
<text x="40" y="420" font-size="16" fill="#202124">• 상급·종합병원이면 급여 최소 공제가 2만원</text>
<text x="40" y="450" font-size="16" fill="#202124">• 예방접종비는 이 계산에 아예 들어가지 않습니다</text>
</svg>
