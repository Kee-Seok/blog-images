<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="sans-serif">
<rect width="900" height="400" fill="#ffffff"/>
<text x="450" y="44" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">물고기가 어디에 많았나요</text>
<g font-size="19" fill="#202124" text-anchor="middle">
<rect x="30" y="76" width="260" height="260" rx="14" fill="#e3f2fd" stroke="#4285f4" stroke-width="2"/>
<text x="160" y="118" font-weight="700" font-size="22">어항 속</text>
<text x="160" y="160">내 손안에 모인 것</text>
<text x="160" y="200">집안 살림이 불어나는 쪽</text>
<text x="160" y="300" fill="#5f6368" font-size="17">물이 맑았는지 함께 보기</text>
<rect x="320" y="76" width="260" height="260" rx="14" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
<text x="450" y="118" font-weight="700" font-size="22">강·바다</text>
<text x="450" y="160">아직 내 것이 아닌 기회</text>
<text x="450" y="200">잡으러 나서야 하는 꿈</text>
<text x="450" y="300" fill="#5f6368" font-size="17">구경만 했다면 기회 신호</text>
<rect x="610" y="76" width="260" height="260" rx="14" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/>
<text x="740" y="118" font-weight="700" font-size="22">집 안으로</text>
<text x="740" y="160">밖에서 들어오는 복</text>
<text x="740" y="200">재물·손님·좋은 소식</text>
<text x="740" y="300" fill="#5f6368" font-size="17">문으로 들어왔다면 더 좋게</text>
</g>
</svg>
