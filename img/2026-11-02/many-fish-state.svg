<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="sans-serif">
<rect width="900" height="380" fill="#ffffff"/>
<text x="450" y="44" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">물 색과 물고기 상태로 갈리는 풀이</text>
<g font-size="20" fill="#202124">
<rect x="40" y="80" width="400" height="120" rx="12" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
<text x="60" y="122" font-weight="700">맑은 물 + 힘차게 헤엄</text>
<text x="60" y="164">일이 순하게 풀리는 길몽 쪽</text>
<rect x="460" y="80" width="400" height="120" rx="12" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/>
<text x="480" y="122" font-weight="700">흙탕물 + 많기만 함</text>
<text x="480" y="164">기회는 있는데 머리가 복잡</text>
<rect x="40" y="220" width="400" height="120" rx="12" fill="#e3f2fd" stroke="#4285f4" stroke-width="2"/>
<text x="60" y="262" font-weight="700">색이 곱고 큰 물고기</text>
<text x="60" y="304">태몽으로 보는 해몽도 있음</text>
<rect x="460" y="220" width="400" height="120" rx="12" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
<text x="480" y="262" font-weight="700">떼로 죽어 떠 있음</text>
<text x="480" y="304">새는 돈·놓친 일 살피라는 뜻</text>
</g>
</svg>
