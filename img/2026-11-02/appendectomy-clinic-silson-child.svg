<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="sans-serif">
<rect width="1000" height="520" fill="#ffffff"/>
<text x="500" y="50" text-anchor="middle" font-size="30" font-weight="700" fill="#202124">의원 3일 입원 본인부담 370,770원, 끝내 남는 돈</text>
<text x="500" y="88" text-anchor="middle" font-size="19" fill="#5f6368">복강경 맹장수술 · 포괄수가 본인부담은 급여 칸</text>
<g font-size="22" fill="#202124">
<text x="70" y="165" font-weight="700">어른, 4세대 실손 (급여 20% 빼고)</text>
<rect x="70" y="185" width="688" height="60" fill="#188038"/><rect x="758" y="185" width="172" height="60" fill="#dadce0"/>
<text x="414" y="224" text-anchor="middle" fill="#ffffff" font-weight="700">실손에서 296,616원</text><text x="844" y="224" text-anchor="middle" font-weight="700">74,154원</text>
<text x="70" y="320" font-weight="700">15세 이하 아이 (본인부담 5%)</text>
<rect x="70" y="340" width="215" height="60" fill="#e8710a"/>
<text x="300" y="379" font-weight="700">병원에 내는 돈 92,690원</text>
</g>
<text x="500" y="470" text-anchor="middle" font-size="19" fill="#5f6368">실손 자기부담률: 금융위원회 4세대 실손 보도자료(2021년 6월)</text>
</svg>
