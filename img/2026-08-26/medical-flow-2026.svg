<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Noto Sans KR, sans-serif">
  <rect width="1200" height="600" fill="#fff8f0"/>
  <!-- 제목 -->
  <text x="60" y="70" font-size="34" font-weight="700" fill="#202124">의료비 세액공제, 돈이 움직이는 순서</text>
  <text x="60" y="108" font-size="20" fill="#5f6368">총급여 3%를 넘긴 병원비부터 15%를 돌려받습니다</text>

  <!-- 흐름 1 -->
  <rect x="60" y="170" width="260" height="120" rx="12" fill="#ffffff" stroke="#ffd9b3" stroke-width="2"/>
  <text x="80" y="200" font-size="20" fill="#202124">① 총급여 확인</text>
  <text x="80" y="235" font-size="16" fill="#5f6368">연봉(총급여)을 먼저</text>
  <text x="80" y="260" font-size="16" fill="#5f6368">알아야 3% 문턱이</text>
  <text x="80" y="285" font-size="16" fill="#5f6368">얼마인지 계산됩니다</text>

  <!-- 화살표 -->
  <path d="M 340 230 L 430 230" stroke="#ff7a18" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 흐름 2 -->
  <rect x="435" y="170" width="260" height="120" rx="12" fill="#ffffff" stroke="#ffd9b3" stroke-width="2"/>
  <text x="455" y="200" font-size="20" fill="#202124">② 3% 문턱 계산</text>
  <text x="455" y="235" font-size="16" fill="#5f6368">총급여 × 3%</text>
  <text x="455" y="260" font-size="16" fill="#5f6368">이게 병원비가</text>
  <text x="455" y="285" font-size="16" fill="#5f6368">넘어야 하는 기준선</text>

  <!-- 화살표 -->
  <path d="M 720 230 L 800 230" stroke="#ff7a18" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#ff7a18"/>
    </marker>
  </defs>

  <!-- 흐름 3 -->
  <rect x="805" y="170" width="330" height="120" rx="12" fill="#ffffff" stroke="#ffd9b3" stroke-width="2"/>
  <text x="825" y="200" font-size="20" fill="#202124">③ 실손보험금 차감</text>
  <text x="825" y="235" font-size="16" fill="#5f6368">보험사에서 돌려받은</text>
  <text x="825" y="260" font-size="16" fill="#5f6368">금액은 반드시 뺍니다</text>
  <text x="825" y="285" font-size="16" fill="#5f6368">내 주머니에서 나간</text>
  <text x="825" y="310" font-size="16" fill="#5f6368">돈만 공제 대상</text>

  <!-- 화살표 -->
  <path d="M 60 320 L 60 380" stroke="#ff7a18" stroke-width="3" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="3" refY="8" orient="auto">
      <path d="M 0 0 L 3 8 L 6 0 Z" fill="#ff7a18"/>
    </marker>
  </defs>

  <!-- 흐름 4 -->
  <rect x="60" y="380" width="1070" height="120" rx="12" fill="#ffffff" stroke="#1A73E8" stroke-width="2"/>
  <text x="80" y="410" font-size="20" fill="#202124">④ 공제 대상 금액 × 공제율 = 환급액</text>
  <text x="80" y="450" font-size="18" fill="#5f6368">일반 의료비 15% · 난임 시술비 30% · 미숙아·선천성 이상아 20% · 산후조리원 15%</text>
  <text x="80" y="485" font-size="14" fill="#5f6368">본인·65세 이상·장애인·6세 이하는 한도 없음, 부양가족 의료비는 연 700만원 한도</text>

  <!-- 하단 요약 박스 -->
  <rect x="60" y="530" width="1070" height="50" rx="8" fill="#f6f7f8"/>
  <text x="80" y="562" font-size="16" fill="#5f6368">2026년 8월 기준 · 2025년 귀속 연말정산 적용 · 출처: 소득세법 제59조의4, 홈택스 연말정산 간소화 안내</text>
</svg>
