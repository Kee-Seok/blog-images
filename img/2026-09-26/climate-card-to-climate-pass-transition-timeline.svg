<circle cx="450" cy="330" r="22" fill="#5f6368"/><text x="450" y="270" font-size="30" font-weight="700" text-anchor="middle" fill="#5f6368">9월 29일</text>
<text x="450" y="400" font-size="24" text-anchor="middle" fill="#202124">선불 30일권</text><text x="450" y="435" font-size="24" text-anchor="middle" fill="#202124">사용 마지막 날</text>
<circle cx="740" cy="330" r="22" fill="#e8710a"/><text x="740" y="270" font-size="30" font-weight="700" text-anchor="middle" fill="#e8710a">9월 30일</text>
