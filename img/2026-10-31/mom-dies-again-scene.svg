<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="sans-serif">
<rect width="900" height="420" fill="#ffffff"/>
<text x="450" y="44" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">엄마가 꿈에서 어떻게 떠나셨나요</text>
<g font-size="19" fill="#202124" text-anchor="middle">
<rect x="30" y="76" width="260" height="280" rx="14" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
<text x="160" y="118" font-weight="700" font-size="22">편안히 눈 감으심</text>
<text x="160" y="162">임종을 지켜봄</text>
<text x="160" y="202">못다 한 마음이 풀림</text>
<text x="160" y="320" fill="#5f6368" font-size="17">걱정이 걷히는 쪽</text>
<rect x="320" y="76" width="260" height="280" rx="14" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/>
<text x="450" y="118" font-weight="700" font-size="22">장례를 다시 치름</text>
<text x="450" y="162">조문객·상복이 보임</text>
<text x="450" y="202">일 하나가 마무리됨</text>
<text x="450" y="320" fill="#5f6368" font-size="17">새로 시작할 때</text>
<rect x="610" y="76" width="260" height="280" rx="14" fill="#e3f2fd" stroke="#4285f4" stroke-width="2"/>
<text x="740" y="118" font-weight="700" font-size="22">소식만 전해 들음</text>
<text x="740" y="162">전화·말로 알게 됨</text>
<text x="740" y="202">미뤄 둔 연락·도리</text>
<text x="740" y="320" fill="#5f6368" font-size="17">가족 안부 챙길 때</text>
</g>
</svg>
