<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="sans-serif">
<rect width="1200" height="800" fill="#ffffff"/>
<text x="60" y="78" font-size="38" font-weight="700" fill="#202124">건강검진 문진표 인터넷 작성, 누르는 순서</text>
<g font-size="27" fill="#202124">
<rect x="60" y="120" width="1080" height="96" rx="16" fill="#E8F0FE" stroke="#1A73E8" stroke-width="3"/>
<text x="90" y="178"><tspan font-weight="700" fill="#1A73E8">1</tspan>  국민건강보험공단 홈페이지 또는 The건강보험 앱 → 본인인증</text>
<rect x="60" y="236" width="1080" height="96" rx="16" fill="#E8F0FE" stroke="#1A73E8" stroke-width="3"/>
<text x="90" y="294"><tspan font-weight="700" fill="#1A73E8">2</tspan>  건강모아 → 나의 건강 → 검진신청 → 문진표/평가도구 작성</text>
<rect x="60" y="352" width="1080" height="96" rx="16" fill="#E8F0FE" stroke="#1A73E8" stroke-width="3"/>
<text x="90" y="410"><tspan font-weight="700" fill="#1A73E8">3</tspan>  웹 문진표 작성 (공동인증서 또는 간편인증)</text>
<rect x="60" y="468" width="1080" height="96" rx="16" fill="#FEF7E0" stroke="#E37400" stroke-width="3"/>
<text x="90" y="526"><tspan font-weight="700" fill="#E37400">4</tspan>  등록번호 신청 → 휴대폰으로 4자리 번호 받기</text>
<rect x="60" y="584" width="1080" height="96" rx="16" fill="#E6F4EA" stroke="#188038" stroke-width="3"/>
<text x="90" y="642"><tspan font-weight="700" fill="#188038">5</tspan>  검진기관 접수대에서 번호 알려 주고 신분증 내기</text>
</g>
<text x="60" y="740" font-size="22" fill="#80868b">출처: 국민건강보험공단 건강검진 안내사항·건강모아 메뉴 (2026-10-31 확인) · 문의 1577-1000</text>
</svg>
