<text x="90" y="600" font-size="26">71곳 중 드라이브스루(DT) 28곳 · 전남까지 합친 '전남광주' 지역은 109곳</text>
</g>
<text x="60" y="690" font-size="22" fill="#80868b">출처: 스타벅스코리아 매장 찾기 지역 검색 (2026-10-31 확인)</text>
