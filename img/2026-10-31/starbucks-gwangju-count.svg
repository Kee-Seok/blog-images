<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="sans-serif">
<rect width="1200" height="720" fill="#ffffff"/>
<text x="60" y="78" font-size="38" font-weight="700" fill="#202124">광주 스타벅스 개수, 구별로 보면 (모두 71곳)</text>
<g font-size="28" fill="#202124">
<text x="60" y="170">서구</text><rect x="220" y="140" width="760" height="40" rx="8" fill="#00704A"/><text x="1000" y="170" font-weight="700">19곳</text>
<text x="60" y="250">광산구</text><rect x="220" y="220" width="720" height="40" rx="8" fill="#00704A"/><text x="960" y="250" font-weight="700">18곳</text>
<text x="60" y="330">북구</text><rect x="220" y="300" width="600" height="40" rx="8" fill="#00704A"/><text x="840" y="330" font-weight="700">15곳</text>
<text x="60" y="410">남구</text><rect x="220" y="380" width="400" height="40" rx="8" fill="#00704A"/><text x="640" y="410" font-weight="700">10곳</text>
