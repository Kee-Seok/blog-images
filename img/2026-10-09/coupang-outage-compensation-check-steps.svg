<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="1000" height="560" fill="#ffffff"/>
<text x="40" y="60" font-family="sans-serif" font-size="30" font-weight="700" fill="#202124">쿠팡 장애 보상, 내가 받았는지 확인하는 순서</text>
<circle cx="85" cy="145" r="36" fill="#1546c8"/><text x="85" y="157" font-family="sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<text x="145" y="138" font-family="sans-serif" font-size="27" font-weight="700" fill="#202124">주문목록에서 0~2시대 취소 주문 찾기</text><text x="145" y="172" font-family="sans-serif" font-size="21" fill="#5f6368">취소된 주문이 있으면 보상 대상</text>
<circle cx="85" cy="253" r="36" fill="#1546c8"/><text x="85" y="265" font-family="sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="145" y="246" font-family="sans-serif" font-size="27" font-weight="700" fill="#202124">쿠팡캐시 내역·이츠 쿠폰함 보기</text><text x="145" y="280" font-family="sans-serif" font-size="21" fill="#5f6368">순차 지급이라 바로 안 보일 수 있음</text>
<circle cx="85" cy="361" r="36" fill="#1546c8"/><text x="85" y="373" font-family="sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<text x="145" y="354" font-family="sans-serif" font-size="27" font-weight="700" fill="#202124">며칠 지나도 없으면 고객센터</text><text x="145" y="388" font-family="sans-serif" font-size="21" fill="#5f6368">앱 안 고객센터 채팅·전화로</text>
<circle cx="85" cy="469" r="36" fill="#c5221f"/><text x="85" y="481" font-family="sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#ffffff">!</text>
<text x="145" y="462" font-family="sans-serif" font-size="27" font-weight="700" fill="#202124">문자 속 '보상 신청' 링크는 누르지 않기</text><text x="145" y="496" font-family="sans-serif" font-size="21" fill="#5f6368">공식 안내는 앱 안에서</text>
<text x="40" y="545" font-family="sans-serif" font-size="17" fill="#80868b">자료: 뉴스핌·서울경제 2026년 10월 9일 보도 정리 · 크라우드의 Money</text></svg>