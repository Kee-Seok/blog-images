<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="1000" height="560" fill="#ffffff"/>
<text x="40" y="60" font-family="sans-serif" font-size="32" font-weight="700" fill="#202124">본인부담상한제 환급금 조회, 네 단계</text>
<circle cx="85" cy="145" r="38" fill="#0b7a75"/><text x="85" y="157" font-family="sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<text x="145" y="138" font-family="sans-serif" font-size="28" font-weight="700" fill="#202124">공단 환급금 조회 주소 열기</text><text x="145" y="174" font-family="sans-serif" font-size="22" fill="#5f6368">로그인 화면이 먼저 떠요</text>
<circle cx="85" cy="255" r="38" fill="#0b7a75"/><text x="85" y="267" font-family="sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="145" y="248" font-family="sans-serif" font-size="28" font-weight="700" fill="#202124">간편인증·공동인증서로 로그인</text><text x="145" y="284" font-family="sans-serif" font-size="22" fill="#5f6368">부모님 것이면 부모님 명의 인증</text>
<circle cx="85" cy="365" r="38" fill="#0b7a75"/><text x="85" y="377" font-family="sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<text x="145" y="358" font-family="sans-serif" font-size="28" font-weight="700" fill="#202124">환급금 목록에서 종류 확인</text><text x="145" y="394" font-family="sans-serif" font-size="22" fill="#5f6368">'본인부담상한액 초과금'인지 보기</text>
<circle cx="85" cy="475" r="38" fill="#0b7a75"/><text x="85" y="487" font-family="sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<text x="145" y="468" font-family="sans-serif" font-size="28" font-weight="700" fill="#202124">본인 명의 계좌 넣고 신청</text><text x="145" y="504" font-family="sans-serif" font-size="22" fill="#5f6368">전화 1577-1000·지사 방문도 가능</text>
<text x="40" y="545" font-family="sans-serif" font-size="18" fill="#80868b">자료: 보건복지부·국민건강보험공단 발표(2026.8.30.) 신청 방법 안내 · 크라우드의 Money 정리</text></svg>