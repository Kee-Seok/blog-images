<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="sans-serif">
<rect width="900" height="500" fill="#ffffff"/>
<text x="450" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">돌아가신 아버지 꿈해몽 — 표정부터 보기</text>
<rect x="40" y="100" width="260" height="300" rx="18" fill="#e6f4ea" stroke="#34a853" stroke-width="3"/>
<text x="170" y="160" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">웃고 계심</text>
<text x="170" y="215" text-anchor="middle" font-size="20" fill="#202124">걱정하던 일이</text>
<text x="170" y="245" text-anchor="middle" font-size="20" fill="#202124">풀리는 쪽</text>
<text x="170" y="330" text-anchor="middle" font-size="17" fill="#5f6368">가장 반가운 풀이</text>
<rect x="320" y="100" width="260" height="300" rx="18" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/>
<text x="450" y="160" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">말없이 바라봄</text>
<text x="450" y="215" text-anchor="middle" font-size="20" fill="#202124">지켜보고 있다는</text>
<text x="450" y="245" text-anchor="middle" font-size="20" fill="#202124">안부 같은 꿈</text>
<text x="450" y="330" text-anchor="middle" font-size="17" fill="#5f6368">그리움이 큰 시기에 흔함</text>
<rect x="600" y="100" width="260" height="300" rx="18" fill="#fef7e0" stroke="#fbbc04" stroke-width="3"/>
<text x="730" y="160" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">울고 계심</text>
<text x="730" y="215" text-anchor="middle" font-size="20" fill="#202124">조심하라는</text>
<text x="730" y="245" text-anchor="middle" font-size="20" fill="#202124">당부로 읽음</text>
<text x="730" y="330" text-anchor="middle" font-size="17" fill="#5f6368">나쁜 일 예고는 아님</text>
<text x="450" y="455" text-anchor="middle" font-size="17" fill="#5f6368">전통 해몽에서 흔히 전해지는 풀이 · 예언이 아님</text>
</svg>
