<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="40" y="56" font-size="30" font-weight="700" fill="#202124">보상금 받는 길 세 갈래</text>
<g font-size="21" fill="#202124">
<rect x="40" y="90" width="880" height="110" rx="12" fill="#e6f4ea"/>
<text x="60" y="130" font-weight="700" fill="#188038">① 은행에 피해 신고</text>
<text x="60" y="170">돈 피해가 있을 때 · 사고와 이어진 게 확인되면 피해액 보상 · 비용 없음</text>
<rect x="40" y="220" width="880" height="110" rx="12" fill="#e8f0fe"/>
<text x="60" y="260" font-weight="700" fill="#1a73e8">② 개인정보 분쟁조정 신청</text>
<text x="60" y="300">비용 없음 · 60일 안에 조정안 · 15일 안에 수락 여부 · 회사가 거절하면 강제력 없음</text>
<rect x="40" y="350" width="880" height="110" rx="12" fill="#fef7e0"/>
<text x="60" y="390" font-weight="700" fill="#b06000">③ 소송 (집단소송 포함)</text>
<text x="60" y="430">법정손해배상 300만원 이하 청구 가능 · 과거 판결은 대부분 10만~20만원 · 시효 3년</text>
</g>
<text x="40" y="500" font-size="16" fill="#5f6368">출처: 개인정보 보호법 제39조의2·제44조, 개인정보분쟁조정위원회 제도 안내 (2026-10-15 확인)</text>
</svg>
