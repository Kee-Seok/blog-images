<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="sans-serif">
<rect width="1200" height="600" fill="#ffffff"/>
<text x="600" y="70" text-anchor="middle" font-size="40" font-weight="700" fill="#202124">병원을 옮겨도 횟수는 이어서 세요</text>
<text x="600" y="112" text-anchor="middle" font-size="24" fill="#5f6368">의료기관은 도수치료관리시스템·심평원 포털로 시행 횟수를 확인</text>
<rect x="70" y="170" width="300" height="200" rx="20" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/>
<text x="220" y="230" text-anchor="middle" font-size="30" font-weight="700" fill="#1a73e8">ㄱ 의원</text>
<text x="220" y="300" text-anchor="middle" font-size="44" font-weight="700" fill="#202124">8회</text>
<text x="420" y="295" text-anchor="middle" font-size="50" font-weight="700" fill="#5f6368">+</text>
<rect x="470" y="170" width="300" height="200" rx="20" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/>
<text x="620" y="230" text-anchor="middle" font-size="30" font-weight="700" fill="#1a73e8">ㄴ 정형외과</text>
<text x="620" y="300" text-anchor="middle" font-size="44" font-weight="700" fill="#202124">7회</text>
<text x="820" y="295" text-anchor="middle" font-size="50" font-weight="700" fill="#5f6368">=</text>
<rect x="870" y="170" width="270" height="200" rx="20" fill="#fce8e6" stroke="#c5221f" stroke-width="3"/>
<text x="1005" y="230" text-anchor="middle" font-size="30" font-weight="700" fill="#c5221f">올해 합계</text>
<text x="1005" y="300" text-anchor="middle" font-size="44" font-weight="700" fill="#202124">15회</text>
<text x="1005" y="345" text-anchor="middle" font-size="22" fill="#202124">기본 한도 끝</text>
<rect x="70" y="420" width="1070" height="100" rx="20" fill="#f1f3f4"/>
<text x="605" y="465" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">세 번째 병원에 가도 16회째는 관리급여로 받을 수 없어요</text>
<text x="605" y="500" text-anchor="middle" font-size="22" fill="#5f6368">수술·골절로 관절이 굳은 경우만 의사 판단으로 24회까지</text>
<text x="600" y="570" text-anchor="middle" font-size="22" fill="#80868b">예시 도식 · 기준: 보건복지부 2026년 7월 1일 보도자료</text>
</svg>
