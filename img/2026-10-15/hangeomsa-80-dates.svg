<g font-size="19" fill="#202124">
<circle cx="110" cy="100" r="13" fill="#3a5ba0"/><text x="140" y="94" font-weight="700">10월 17일(토) 10:00~11:50</text><text x="140" y="120" fill="#5f6368" font-size="17">시험 (심화만) · 10:00까지 건물 입장, 10:20까지 착석</text>
