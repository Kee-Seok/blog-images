<circle cx="110" cy="440" r="15" fill="#d93025"/><text x="140" y="434" font-weight="700" fill="#d93025">10월 30일(금) 10:00</text><text x="140" y="460" fill="#5f6368" font-size="17">결과 발표 · 나의 시험 정보 → 나의 응시 결과</text>
