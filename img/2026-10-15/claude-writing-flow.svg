<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="sans-serif">
<rect width="1000" height="420" fill="#ffffff"/>
<text x="500" y="54" text-anchor="middle" font-size="30" font-weight="700" fill="#202124">클로드 글쓰기 순서 — 쓰기 전과 쓴 뒤에 한 번씩</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs>
<g font-size="22" text-anchor="middle" fill="#202124">
<rect x="30" y="120" width="210" height="150" rx="14" fill="#E8F0FE"/><text x="135" y="180" font-weight="700">뼈대 고르기</text><text x="135" y="216" font-size="18" fill="#5f6368">최근 3편에 없는 것</text><text x="135" y="242" font-size="18" fill="#5f6368">원고 맨 위 주석에</text>
<rect x="275" y="120" width="210" height="150" rx="14" fill="#FEF3E2"/><text x="380" y="180" font-weight="700">초고 쓰기</text><text x="380" y="216" font-size="18" fill="#5f6368">첫 문장 꼴도</text><text x="380" y="242" font-size="18" fill="#5f6368">최근과 다르게</text>
<rect x="520" y="120" width="210" height="150" rx="14" fill="#E6F4EA"/><text x="625" y="180" font-weight="700">최근 5편과 비교</text><text x="625" y="216" font-size="18" fill="#5f6368">variety_check</text><text x="625" y="242" font-size="18" fill="#5f6368">[반복] 경고 세기</text>
<rect x="765" y="120" width="210" height="150" rx="14" fill="#FCE8E6"/><text x="870" y="180" font-weight="700">0개면 발행</text><text x="870" y="216" font-size="18" fill="#5f6368">남으면 그 문장만</text><text x="870" y="242" font-size="18" fill="#5f6368">고쳐서 다시</text>
</g>
<g stroke="#5f6368" stroke-width="3" marker-end="url(#a)"><line x1="242" y1="195" x2="270" y2="195"/><line x1="487" y1="195" x2="515" y2="195"/><line x1="732" y1="195" x2="760" y2="195"/></g>
<text x="500" y="340" text-anchor="middle" font-size="20" fill="#5f6368">이 계정 티스토리·블로그스팟 원고가 발행 전에 매번 거치는 길 (2026년 10월 15일 확인)</text>
</svg>
