<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<rect width="800" height="470" fill="#ffffff"/>
<text x="400" y="46" font-size="27" font-weight="700" fill="#202124" text-anchor="middle">같은 개수를 틀려도 등급이 갈리는 이유</text>
<text x="400" y="80" font-size="17" fill="#5f6368" text-anchor="middle">제79회 심화 배점: 1점 10문항 · 2점 30문항 · 3점 10문항 = 100점</text>
<g font-size="19" fill="#202124">
<rect x="40" y="105" width="720" height="92" rx="12" fill="#e8f0fe"/>
<text x="64" y="142" font-weight="700">1점짜리 10개 + 2점짜리 5개 틀림 (15개)</text>
<text x="64" y="176">100 − 10 − 10 = <tspan font-weight="700" fill="#1a73e8">80점 → 심화 1급</tspan></text>
<rect x="40" y="215" width="720" height="92" rx="12" fill="#fdecea"/>
<text x="64" y="252" font-weight="700">3점짜리만 7개 틀림 (7개)</text>
<text x="64" y="286">100 − 21 = <tspan font-weight="700" fill="#d93025">79점 → 심화 2급</tspan></text>
<rect x="40" y="325" width="720" height="70" rx="12" fill="#fff4cc"/>
<text x="400" y="368" text-anchor="middle">1급 80점 이상 · 2급 70~79점 · 3급 60~69점</text>
</g>
<text x="400" y="440" font-size="15" fill="#5f6368" text-anchor="middle">출처: 한국사능력검정시험 누리집 정답 보기(제79회 심화)·시험 요강 (2026년 10월 15일 확인)</text>
</svg>
