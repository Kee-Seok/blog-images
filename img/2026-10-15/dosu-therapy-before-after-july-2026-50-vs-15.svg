<text x="690" y="580" font-size="28" fill="#202124">내가 내는 몫</text><text x="1110" y="580" text-anchor="end" font-size="34" font-weight="700" fill="#202124">95%</text>
<text x="600" y="695" text-anchor="middle" font-size="22" fill="#80868b">표: 보건복지부(2026.7.1)·금융위원회 실손 특약 기준을 현명한 부자가 되는 길이 정리</text>
