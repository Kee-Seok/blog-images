<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
<rect width="800" height="500" fill="#ffffff"/>
<text x="400" y="44" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">꿈속에서 누구와 다시 결혼했나요</text>
<rect x="30" y="72" width="360" height="190" rx="16" fill="#e8f5e9"/>
<text x="210" y="116" text-anchor="middle" font-size="23" font-weight="700" fill="#1e7e34">지금 배우자와 또</text>
<text x="210" y="164" text-anchor="middle" font-size="19" fill="#202124">사이가 새로워지고</text>
<text x="210" y="194" text-anchor="middle" font-size="19" fill="#202124">약속을 다시 다지는 쪽</text>
<rect x="410" y="72" width="360" height="190" rx="16" fill="#e8f0fe"/>
<text x="590" y="116" text-anchor="middle" font-size="23" font-weight="700" fill="#1a56db">모르는 사람과</text>
<text x="590" y="164" text-anchor="middle" font-size="19" fill="#202124">일·자리·환경이</text>
<text x="590" y="194" text-anchor="middle" font-size="19" fill="#202124">바뀌는 변화의 쪽</text>
<rect x="30" y="282" width="360" height="190" rx="16" fill="#fff8e1"/>
<text x="210" y="326" text-anchor="middle" font-size="23" font-weight="700" fill="#b06000">전 배우자·옛 연인과</text>
<text x="210" y="374" text-anchor="middle" font-size="19" fill="#202124">지난 일을 정리하거나</text>
<text x="210" y="404" text-anchor="middle" font-size="19" fill="#202124">미뤄 둔 일이 다시 오는 쪽</text>
<rect x="410" y="282" width="360" height="190" rx="16" fill="#fce8e6"/>
<text x="590" y="326" text-anchor="middle" font-size="23" font-weight="700" fill="#c5221f">아는 사람과</text>
<text x="590" y="374" text-anchor="middle" font-size="19" fill="#202124">그 사람과 함께할 일·</text>
<text x="590" y="404" text-anchor="middle" font-size="19" fill="#202124">손잡을 일이 생기는 쪽</text>
</svg>
