<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="800" height="430" fill="#ffffff"/>
<text x="400" y="44" font-size="26" font-weight="700" text-anchor="middle" fill="#202124">보험 처리할까, 내 돈으로 고칠까</text>
<g font-size="19" fill="#202124">
<rect x="60" y="80" width="680" height="70" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="400" y="112" text-anchor="middle" font-weight="700">① 견적서의 수리비</text><text x="400" y="138" text-anchor="middle" font-size="17">공업사 견적 금액 그대로</text>
<rect x="60" y="170" width="680" height="70" rx="12" fill="#fff4e5" stroke="#f29900" stroke-width="2"/>
<text x="400" y="202" text-anchor="middle" font-weight="700">② 보험 처리하면 더 내는 보험료</text><text x="400" y="228" text-anchor="middle" font-size="17">계산기 '사고 없이 할인받았을 때와 차이' 칸</text>
<rect x="60" y="260" width="330" height="90" rx="12" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
<text x="225" y="298" text-anchor="middle" font-weight="700">①이 더 작다</text><text x="225" y="326" text-anchor="middle" font-size="17">내 돈 처리 쪽이 유리</text>
<rect x="410" y="260" width="330" height="90" rx="12" fill="#f1f3f4" stroke="#5f6368" stroke-width="2"/>
<text x="575" y="298" text-anchor="middle" font-weight="700">②가 더 작다</text><text x="575" y="326" text-anchor="middle" font-size="17">보험 처리 쪽이 유리</text>
</g>
<text x="400" y="400" font-size="15" text-anchor="middle" fill="#5f6368">사람이 다친 사고는 이 비교 전에 보험사에 먼저 접수하세요</text>
</svg>
