<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="sans-serif"><rect width="100%" height="100%" fill="#fff"/>
<text x="40" y="58" font-size="32" font-weight="700" fill="#202124">전세대출 금리, 위에서부터 차례로 물어보세요</text>
<rect x="40" y="95" width="1120" height="104" rx="14" fill="#fff" stroke="#1a73e8" stroke-width="4"/>
<text x="70" y="137" font-size="26" font-weight="700" fill="#202124">1. 2년 안에 아이를 낳았나요? (입양 포함)</text><text x="70" y="177" font-size="23" fill="#202124">예 → 신생아 특례 버팀목 (연 1.3~4.3%, 소득 1.3억·맞벌이 2억 이하)</text>
<text x="1110" y="217" font-size="20" fill="#5f6368" text-anchor="end">아니오 ↓</text>
<rect x="40" y="223" width="1120" height="104" rx="14" fill="#fff" stroke="#34a853" stroke-width="4"/>
<text x="70" y="265" font-size="26" font-weight="700" fill="#202124">2. 혼인 7년 안이거나 3개월 안 결혼 예정?</text><text x="70" y="305" font-size="23" fill="#202124">예 → 신혼부부 전용 (연 1.9~3.3%, 부부 7,500만원 이하)</text>
<text x="1110" y="345" font-size="20" fill="#5f6368" text-anchor="end">아니오 ↓</text>
<rect x="40" y="351" width="1120" height="104" rx="14" fill="#fff" stroke="#fbbc04" stroke-width="4"/>
<text x="70" y="393" font-size="26" font-weight="700" fill="#202124">3. 만 19~34세 세대주?</text><text x="70" y="433" font-size="23" fill="#202124">예 → 청년 버팀목 (연 2.2~3.3%, 보증금 3억 이하)</text>
<text x="1110" y="473" font-size="20" fill="#5f6368" text-anchor="end">아니오 ↓</text>
<rect x="40" y="479" width="1120" height="104" rx="14" fill="#fff" stroke="#ea4335" stroke-width="4"/>
<text x="70" y="521" font-size="26" font-weight="700" fill="#202124">4. 부부합산 5천만원 이하(2자녀 6천)?</text><text x="70" y="561" font-size="23" fill="#202124">예 → 일반 버팀목 (연 2.5~3.5%)</text>
<text x="1110" y="601" font-size="20" fill="#5f6368" text-anchor="end">아니오 ↓</text>
<rect x="40" y="607" width="1120" height="104" rx="14" fill="#fff" stroke="#5f6368" stroke-width="4"/>
<text x="70" y="649" font-size="26" font-weight="700" fill="#202124">5. 모두 아니오</text><text x="70" y="689" font-size="23" fill="#202124">은행 전세대출 — 은행연합회 소비자포털에서 금리 비교</text>
<text x="40" y="745" font-size="18" fill="#5f6368">조건 요약: 주택도시기금 상품별 대출안내, 2026-11-17 확인 · 무주택·순자산 3.45억원 이하는 공통</text></svg>