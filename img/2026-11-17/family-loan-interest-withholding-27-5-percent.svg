<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif">
<rect width="800" height="400" fill="#ffffff"/>
<text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#202124">3억원을 연 2%로 빌렸을 때 매달 이자 50만원</text>
<rect x="60" y="90" width="210" height="120" rx="14" fill="#e8f0fe" stroke="#1a73e8"/>
<text x="165" y="135" text-anchor="middle" font-size="20" fill="#202124">자녀가 낼 이자</text><text x="165" y="175" text-anchor="middle" font-size="26" font-weight="700" fill="#1a73e8">50만원</text>
<path d="M275 150 L330 150" stroke="#5f6368" stroke-width="3"/><path d="M330 150 l-12 -8 v16z" fill="#5f6368"/>
<rect x="340" y="70" width="400" height="70" rx="12" fill="#fce8e6" stroke="#d93025"/>
<text x="540" y="100" text-anchor="middle" font-size="18" fill="#202124">세무서·지자체에 먼저 떼어 냄 (27.5%)</text><text x="540" y="127" text-anchor="middle" font-size="22" font-weight="700" fill="#d93025">13만7,500원</text>
<rect x="340" y="160" width="400" height="70" rx="12" fill="#e6f4ea" stroke="#188038"/>
<text x="540" y="190" text-anchor="middle" font-size="18" fill="#202124">부모님 통장에 들어가는 돈</text><text x="540" y="217" text-anchor="middle" font-size="22" font-weight="700" fill="#188038">36만2,500원</text>
<text x="400" y="290" text-anchor="middle" font-size="18" fill="#202124">소득세 25% = 12만5,000원 · 지방소득세 2.5% = 1만2,500원</text>
<text x="400" y="322" text-anchor="middle" font-size="18" fill="#202124">이자 준 달의 다음 달 10일까지 자녀가 신고·납부</text>
<text x="400" y="375" text-anchor="middle" font-size="15" fill="#5f6368">소득세법 제128조·제129조, 2026년 11월 확인</text>
</svg>
