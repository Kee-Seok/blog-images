<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="sans-serif">
<rect width="800" height="420" fill="#ffffff"/>
<text x="400" y="44" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">결혼식 분위기는 어땠나요</text>
<rect x="40" y="80" width="720" height="90" rx="14" fill="#e8f5e9"/>
<text x="70" y="122" font-size="22" font-weight="700" fill="#1e7e34">밝고 축하받는 식</text>
<text x="70" y="152" font-size="19" fill="#202124">새로 시작하는 일이 순하게 풀리는 쪽</text>
<rect x="40" y="186" width="720" height="90" rx="14" fill="#fff8e1"/>
<text x="70" y="228" font-size="22" font-weight="700" fill="#b06000">하객이 없거나 썰렁한 식</text>
<text x="70" y="258" font-size="19" fill="#202124">혼자 떠안은 일이 많다는 마음이 비친 쪽</text>
<rect x="40" y="292" width="720" height="90" rx="14" fill="#fce8e6"/>
<text x="70" y="334" font-size="22" font-weight="700" fill="#c5221f">울면서 하거나 식장에 못 감</text>
<text x="70" y="364" font-size="19" fill="#202124">바뀌는 일에 대한 걱정·망설임을 살피는 쪽</text>
</svg>
