<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<rect width="800" height="430" fill="#ffffff"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">공인중개사 합격 후 개업까지 순서</text>
<g font-size="17" fill="#202124" text-anchor="middle">
<rect x="30" y="90" width="170" height="170" rx="14" fill="#f3f0fb" stroke="#6B47C2"/><text x="115" y="140" font-weight="700" fill="#4C2A9E">자격증 받기</text><text x="115" y="176" font-size="15">거주 시·도에서</text><text x="115" y="200" font-size="15">발표 후 1개월 안</text>
<rect x="220" y="90" width="170" height="170" rx="14" fill="#f3f0fb" stroke="#6B47C2"/><text x="305" y="140" font-weight="700" fill="#4C2A9E">실무교육</text><text x="305" y="176" font-size="15">45시간</text><text x="305" y="200" font-size="15">개설등록 전 필수</text>
<rect x="410" y="90" width="170" height="170" rx="14" fill="#f3f0fb" stroke="#6B47C2"/><text x="495" y="140" font-weight="700" fill="#4C2A9E">사무소 확보</text><text x="495" y="176" font-size="15">건축물대장에</text><text x="495" y="200" font-size="15">올라간 건물</text>
<rect x="600" y="90" width="170" height="170" rx="14" fill="#fff8e1" stroke="#fbc400"/><text x="685" y="140" font-weight="700">등록 + 보증</text><text x="685" y="176" font-size="15">시·군·구 개설등록</text><text x="685" y="200" font-size="15">개인 2억원 이상</text>
<text x="210" y="182" font-size="22" fill="#6B47C2">›</text><text x="400" y="182" font-size="22" fill="#6B47C2">›</text><text x="590" y="182" font-size="22" fill="#6B47C2">›</text>
</g>
<g font-size="16" fill="#202124"><text x="40" y="312">· 개업하지 않고 중개사무소에 소속공인중개사로 일해도 실무교육은 받아야 해요</text>
<text x="40" y="344">· 실무교육 뒤 2년마다 연수교육 12~16시간</text></g>
<text x="400" y="400" text-anchor="middle" font-size="14" fill="#5f6368">근거: 공인중개사법 시행령 제13조·제24조·제28조 (2026년 11월 17일 확인)</text>
</svg>
