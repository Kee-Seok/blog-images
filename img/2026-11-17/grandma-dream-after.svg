<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="sans-serif">
<rect width="900" height="400" fill="#ffffff"/>
<text x="450" y="44" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">할머니 꿈 꾼 날, 이렇게 써 보세요</text>
<g font-size="20" fill="#202124">
<rect x="60" y="78" width="780" height="62" rx="12" fill="#e8f5e9"/>
<text x="84" y="117" font-weight="700">밥·돈·선물을 주셨다</text><text x="420" y="117">→ 미뤄 둔 계약·신청을 오늘 마무리</text>
<rect x="60" y="152" width="780" height="62" rx="12" fill="#e8f0fe"/>
<text x="84" y="191" font-weight="700">웃거나 안아 주셨다</text><text x="420" y="191">→ 나에게 쉬는 시간 30분 주기</text>
<rect x="60" y="226" width="780" height="62" rx="12" fill="#fff8e1"/>
<text x="84" y="265" font-weight="700">무표정·아프셨다</text><text x="420" y="265">→ 건강검진·집안 점검 날짜 적기</text>
<rect x="60" y="300" width="780" height="62" rx="12" fill="#fce8e6"/>
<text x="84" y="339" font-weight="700">부르거나 데려가셨다</text><text x="420" y="339">→ 무리한 일정 하나 덜어 내기</text>
</g>
<text x="450" y="392" text-anchor="middle" font-size="14" fill="#5f6368">전통 해몽 풀이를 하루 할 일로 바꾼 정리</text>
</svg>
