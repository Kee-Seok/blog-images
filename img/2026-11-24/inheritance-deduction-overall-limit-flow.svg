<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420"><rect width="800" height="420" fill="#fff"/>
<text x="400" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#202124">공제를 다 더해도 여기까지만 — 상속공제 종합한도</text>
<g font-family="sans-serif" font-size="19" fill="#202124">
<rect x="60" y="75" width="680" height="58" rx="8" fill="#e8f0fe"/><text x="400" y="111" text-anchor="middle" font-weight="700">상속세 과세가액</text>
<text x="400" y="165" text-anchor="middle" font-size="24">−</text>
<rect x="60" y="180" width="680" height="50" rx="8" fill="#fce8e6"/><text x="400" y="212" text-anchor="middle">상속인이 아닌 사람에게 유언으로 준 재산</text>
<rect x="60" y="240" width="680" height="50" rx="8" fill="#fce8e6"/><text x="400" y="272" text-anchor="middle">상속포기로 다음 순위(예: 손주)가 받은 재산</text>
<rect x="60" y="300" width="680" height="50" rx="8" fill="#fce8e6"/><text x="400" y="332" text-anchor="middle">10년 안 사전증여 재산의 과세표준 (과세가액 5억 초과 때)</text>
<text x="400" y="395" text-anchor="middle" font-weight="700" fill="#188038">= 받을 수 있는 공제의 최대치</text>
</g></svg>
