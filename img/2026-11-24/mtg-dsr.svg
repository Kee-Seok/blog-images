<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><rect width="1200" height="380" fill="#ffffff"/><text x="600" y="50" font-size="30" fill="#202124" font-weight="700" text-anchor="middle">연봉 6천만원, DSR 40%로 빌릴 수 있는 돈</text><rect x="40" y="85" width="265" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="172" cy="132" r="26" fill="#1a73e8"/><text x="172" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">1</text><text x="172" y="205" font-size="23" fill="#202124" font-weight="700" text-anchor="middle">연 2,400만원</text><text x="172" y="248" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">6천만원 × 40%</text><text x="172" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">1년에 갚을 수 있는 돈</text><rect x="325" y="85" width="265" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="457" cy="132" r="26" fill="#1a73e8"/><text x="457" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">2</text><text x="457" y="205" font-size="23" fill="#202124" font-weight="700" text-anchor="middle">월 200만원</text><text x="457" y="248" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">2,400만원 ÷ 12</text><text x="457" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">다른 대출 0원일 때</text><rect x="610" y="85" width="265" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="742" cy="132" r="26" fill="#1a73e8"/><text x="742" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">3</text><text x="742" y="205" font-size="23" fill="#202124" font-weight="700" text-anchor="middle">4억1,892만원</text><text x="742" y="248" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">금리 4%·30년</text><text x="742" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">스트레스 금리 없을 때</text><rect x="895" y="85" width="265" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="1027" cy="132" r="26" fill="#1a73e8"/><text x="1027" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">4</text><text x="1027" y="205" font-size="23" fill="#202124" font-weight="700" text-anchor="middle">3억61만원</text><text x="1027" y="248" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">4%+3% = 7%로 심사</text><text x="1027" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">수도권·규제지역 변동금리</text><text x="600" y="355" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">원리금균등 30년 기준 · 스트레스 금리 하한 3%는 2025-10-16 시행(금융위원회)</text></svg>