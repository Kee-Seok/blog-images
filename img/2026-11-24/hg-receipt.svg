<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><rect width="1200" height="410" fill="#ffffff"/><text x="600" y="50" font-size="30" fill="#202124" font-weight="700" text-anchor="middle">원천징수영수증에서 환급금 읽는 법</text><rect x="60" y="100" width="300" height="170" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="210" y="160" font-size="24" fill="#202124" font-weight="700" text-anchor="middle">결정세액</text><text x="210" y="210" font-size="18" fill="#3c4043" font-weight="400" text-anchor="middle">1년 동안 실제로</text><text x="210" y="238" font-size="18" fill="#3c4043" font-weight="400" text-anchor="middle">내야 했던 세금</text><text x="400" y="200" font-size="48" fill="#202124" font-weight="700" text-anchor="middle">−</text><rect x="440" y="100" width="300" height="170" rx="14" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/><text x="590" y="160" font-size="24" fill="#202124" font-weight="700" text-anchor="middle">기납부세액</text><text x="590" y="210" font-size="18" fill="#3c4043" font-weight="400" text-anchor="middle">매달 월급에서</text><text x="590" y="238" font-size="18" fill="#3c4043" font-weight="400" text-anchor="middle">미리 뗀 세금</text><text x="780" y="200" font-size="48" fill="#202124" font-weight="700" text-anchor="middle">=</text><rect x="820" y="100" width="320" height="170" rx="14" fill="#e6f4ea" stroke="#188038" stroke-width="2"/><text x="980" y="160" font-size="24" fill="#202124" font-weight="700" text-anchor="middle">차감징수세액</text><text x="980" y="210" font-size="18" fill="#188038" font-weight="700" text-anchor="middle">마이너스(−)면 환급</text><text x="980" y="238" font-size="18" fill="#d93025" font-weight="700" text-anchor="middle">플러스면 더 냄</text><text x="600" y="330" font-size="20" fill="#202124" font-weight="700" text-anchor="middle">예시) 결정세액 85만원 − 기납부세액 120만원 = −35만원 → 소득세 35만원 환급</text><text x="600" y="368" font-size="18" fill="#5f6368" font-weight="400" text-anchor="middle">지방소득세(소득세의 10%) 3만5천원도 함께 돌아와 모두 38만5천원 · 숫자는 설명용 예시</text></svg>