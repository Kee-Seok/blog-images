<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" width="1200" height="510" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><rect width="1200" height="510" fill="#ffffff"/><text x="600" y="50" font-size="30" fill="#202124" font-weight="700" text-anchor="middle">장기요양등급 기준, 인정점수로 갈려요</text><text x="200" y="121" font-size="23" fill="#202124" font-weight="700" text-anchor="end">1등급</text><rect x="230" y="90" width="665" height="44" rx="8" fill="#1a73e8"/><text x="911" y="121" font-size="21" fill="#202124" font-weight="700" text-anchor="start">95점 이상</text><text x="200" y="183" font-size="23" fill="#202124" font-weight="700" text-anchor="end">2등급</text><rect x="230" y="152" width="525" height="44" rx="8" fill="#1a73e8"/><text x="771" y="183" font-size="21" fill="#202124" font-weight="700" text-anchor="start">75~95점</text><text x="200" y="245" font-size="23" fill="#202124" font-weight="700" text-anchor="end">3등급</text><rect x="230" y="214" width="420" height="44" rx="8" fill="#8ab4f8"/><text x="666" y="245" font-size="21" fill="#202124" font-weight="700" text-anchor="start">60~75점</text><text x="200" y="307" font-size="23" fill="#202124" font-weight="700" text-anchor="end">4등급</text><rect x="230" y="276" width="357" height="44" rx="8" fill="#8ab4f8"/><text x="603" y="307" font-size="21" fill="#202124" font-weight="700" text-anchor="start">51~60점</text><text x="200" y="369" font-size="23" fill="#202124" font-weight="700" text-anchor="end">5등급</text><rect x="230" y="338" width="315" height="44" rx="8" fill="#8ab4f8"/><text x="561" y="369" font-size="21" fill="#202124" font-weight="700" text-anchor="start">치매+45~51점</text><text x="200" y="431" font-size="23" fill="#202124" font-weight="700" text-anchor="end">인지지원</text><rect x="230" y="400" width="210" height="44" rx="8" fill="#8ab4f8"/><text x="456" y="431" font-size="21" fill="#202124" font-weight="700" text-anchor="start">치매+45점 미만</text><text x="600" y="488" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">노인장기요양보험법 시행령 기준 · 5등급·인지지원등급은 치매 환자만</text></svg>