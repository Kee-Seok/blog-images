<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440"><rect width="800" height="440" fill="#fff"/>
<text x="400" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#202124">재산 20억원 · 배우자와 자녀 2명 · 신고세액공제 뒤</text>
<g font-family="sans-serif" fill="#202124">
