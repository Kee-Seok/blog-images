<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><rect width="1200" height="420" fill="#ffffff"/><text x="600" y="48" font-size="30" fill="#202124" font-weight="700" text-anchor="middle">연말정산 환급금, 언제 어디서 보나</text><rect x="24" y="90" width="214" height="250" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="131" y="140" font-size="26" fill="#1a73e8" font-weight="800" text-anchor="middle">11~12월</text><text x="131" y="195" font-size="24" fill="#202124" font-weight="700" text-anchor="middle">미리보기</text><text x="131" y="250" font-size="18" fill="#3c4043" font-weight="400" text-anchor="middle">예상 환급금</text><path d="M240 215 l16 0" stroke="#9aa0a6" stroke-width="3"/><rect x="258" y="90" width="214" height="250" rx="14" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/><text x="365" y="140" font-size="26" fill="#f9ab00" font-weight="800" text-anchor="middle">1~2월</text><text x="365" y="195" font-size="24" fill="#202124" font-weight="700" text-anchor="middle">회사에 서류</text><text x="365" y="250" font-size="18" fill="#3c4043" font-weight="400" text-anchor="middle">간소화 자료 제출</text><path d="M474 215 l16 0" stroke="#9aa0a6" stroke-width="3"/><rect x="492" y="90" width="214" height="250" rx="14" fill="#e6f4ea" stroke="#188038" stroke-width="2"/><text x="599" y="140" font-size="26" fill="#188038" font-weight="800" text-anchor="middle">2월 급여</text><text x="599" y="195" font-size="24" fill="#202124" font-weight="700" text-anchor="middle">환급금 입금</text><text x="599" y="250" font-size="18" fill="#3c4043" font-weight="400" text-anchor="middle">급여명세서 확인</text><path d="M708 215 l16 0" stroke="#9aa0a6" stroke-width="3"/><rect x="726" y="90" width="214" height="250" rx="14" fill="#f3e8fd" stroke="#8430ce" stroke-width="2"/><text x="833" y="140" font-size="26" fill="#8430ce" font-weight="800" text-anchor="middle">3월 이후</text><text x="833" y="195" font-size="24" fill="#202124"