<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><rect width="1200" height="400" fill="#ffffff"/><text x="600" y="50" font-size="30" fill="#202124" font-weight="700" text-anchor="middle">연말정산 환급, 놓쳤을 때 두 번의 기회</text><rect x="40" y="90" width="350" height="220" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="215" y="145" font-size="26" fill="#1a73e8" font-weight="800" text-anchor="middle">2월</text><text x="215" y="200" font-size="24" fill="#202124" font-weight="700" text-anchor="middle">회사 연말정산</text><text x="215" y="250" font-size="18" fill="#3c4043" font-weight="400" text-anchor="middle">빠뜨린 공제 발견</text><path d="M392 200 l30 0" stroke="#9aa0a6" stroke-width="3"/><rect x="426" y="90" width="350" height="220" rx="14" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/><text x="601" y="145" font-size="26" fill="#f9ab00" font-weight="800" text-anchor="middle">5월 1~31일</text><text x="601" y="200" font-size="24" fill="#202124" font-weight="700" text-anchor="middle">종합소득세 신고</text><text x="601" y="250" font-size="18" fill="#3c4043" font-weight="400" text-anchor="middle">홈택스에서 직접 추가</text><path d="M778 200 l30 0" stroke="#9aa0a6" stroke-width="3"/><rect x="812" y="90" width="350" height="220" rx="14" fill="#fce8e6" stroke="#d93025" stroke-width="2"/><text x="987" y="145" font-size="26" fill="#d93025" font-weight="800" text-anchor="middle">그 뒤 5년 안</text><text x="987" y="200" font-size="24" fill="#202124" font-weight="700" text-anchor="middle">경정청구</text><text x="987" y="250" font-size="18" fill="#3c4043" font-weight="400" text-anchor="middle">결과는 2개월 안 통지</text><text x="600" y="360" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">근거: 소득세법 제70조(5월 확정신고) · 국세기본법 제45조의2(경정청구 5년·2개월 안 통지)</text></svg>