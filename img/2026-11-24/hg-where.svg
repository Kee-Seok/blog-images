<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><rect width="1200" height="410" fill="#ffffff"/><text x="600" y="50" font-size="30" fill="#202124" font-weight="700" text-anchor="middle">홈택스 '환급금 조회'에 안 뜨는 이유</text><rect x="60" y="90" width="500" height="250" rx="14" fill="#e6f4ea" stroke="#188038" stroke-width="2"/><text x="310" y="140" font-size="24" fill="#202124" font-weight="700" text-anchor="middle">연말정산 환급</text><text x="310" y="190" font-size="19" fill="#3c4043" font-weight="400" text-anchor="middle">돌려주는 곳: 회사</text><text x="310" y="225" font-size="19" fill="#3c4043" font-weight="400" text-anchor="middle">들어오는 곳: 2월 급여</text><text x="310" y="260" font-size="19" fill="#3c4043" font-weight="400" text-anchor="middle">보는 곳: 급여명세서·</text><text x="310" y="290" font-size="19" fill="#3c4043" font-weight="400" text-anchor="middle">원천징수영수증</text><rect x="640" y="90" width="500" height="250" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="890" y="140" font-size="24" fill="#202124" font-weight="700" text-anchor="middle">국세 환급금</text><text x="890" y="190" font-size="19" fill="#3c4043" font-weight="400" text-anchor="middle">돌려주는 곳: 세무서</text><text x="890" y="225" font-size="19" fill="#3c4043" font-weight="400" text-anchor="middle">들어오는 곳: 내 통장</text><text x="890" y="260" font-size="19" fill="#3c4043" font-weight="400" text-anchor="middle">예: 5월 종합소득세 신고분</text><text x="890" y="290" font-size="19" fill="#3c4043" font-weight="400" text-anchor="middle">보는 곳: 홈택스 환급금 조회</text><text x="600" y="385" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">연말정산 환급은 회사가 월급과 함께 돌려주므로 국세청 환급금 목록에는 나오지 않아요</text></svg>