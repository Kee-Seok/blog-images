<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520"><rect width="800" height="520" fill="#fff"/>
<text x="400" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#202124">가족 모양별 상속세 면제한도 (금융재산공제 빼고)</text>
<g font-family="sans-serif" font-size="20" fill="#202124">
<rect x="40" y="80" width="720" height="70" rx="10" fill="#e8f0fe"/><text x="60" y="123">배우자 + 자녀</text><text x="740" y="123" text-anchor="end" font-weight="700" font-size="26">10억원</text><text x="390" y="123" fill="#5f6368" font-size="17">일괄 5억 + 배우자 최소 5억</text>
<rect x="40" y="165" width="720" height="70" rx="10" fill="#fef7e0"/><text x="60" y="208">자녀만 남음</text><text x="740" y="208" text-anchor="end" font-weight="700" font-size="26">5억원</text><text x="390" y="208" fill="#5f6368" font-size="17">일괄공제 5억</text>
<rect x="40" y="250" width="720" height="70" rx="10" fill="#e6f4ea"/><text x="60" y="293">자녀만 + 10년 동거</text><text x="740" y="293" text-anchor="end" font-weight="700" font-size="26">최대 11억원</text><text x="390" y="293" fill="#5f6368" font-size="17">일괄 5억 + 동거주택 최대 6억</text>
<rect x="40" y="335" width="720" height="70" rx="10" fill="#fce8e6"/><text x="60" y="378">배우자 혼자 상속</text><text x="740" y="378" text-anchor="end" font-weight="700" font-size="26">7억원</text><text x="390" y="378" fill="#5f6368" font-size="17">기초 2억 + 배우자 5억</text>
<rect x="40" y="420" width="720" height="70" rx="10" fill="#f1f3f4"/><text x="60" y="463">어린 자녀 3명(5·8·10세)</text><text x="740" y="463" text-anchor="end" font-weight="700" font-size="26">6억9천만원</text><text x="390" y="463" fill="#5f6368" font-size="17">기초 2억 + 자녀·미성년 4억9천</text>
</g></svg>
