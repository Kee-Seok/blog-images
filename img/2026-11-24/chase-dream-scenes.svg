<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="sans-serif">
<rect width="800" height="560" fill="#ffffff"/>
<text x="400" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">쫓기는 꿈 네 갈래</text>
<rect x="40" y="85" width="350" height="190" rx="16" fill="#e8f5e9"/>
<text x="215" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1e7e34">끝까지 도망침</text>
<text x="215" y="180" text-anchor="middle" font-size="19" fill="#202124">잡히지 않고 벗어남</text>
<text x="215" y="210" text-anchor="middle" font-size="19" fill="#202124">걱정을 이겨 내는 쪽</text>
<rect x="410" y="85" width="350" height="190" rx="16" fill="#e8f0fe"/>
<text x="585" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1a56db">잡혔다</text>
<text x="585" y="180" text-anchor="middle" font-size="19" fill="#202124">붙잡히거나 막힘</text>
<text x="585" y="210" text-anchor="middle" font-size="19" fill="#202124">미룬 일을 마주할 때</text>
<rect x="40" y="295" width="350" height="190" rx="16" fill="#fff8e1"/>
<text x="215" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#b06000">숨었다</text>
<text x="215" y="390" text-anchor="middle" font-size="19" fill="#202124">몸을 숨기고 버팀</text>
<text x="215" y="420" text-anchor="middle" font-size="19" fill="#202124">잠시 쉬어 갈 때</text>
<rect x="410" y="295" width="350" height="190" rx="16" fill="#fce8e6"/>
<text x="585" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#c5221f">맞서 싸웠다</text>
<text x="585" y="390" text-anchor="middle" font-size="19" fill="#202124">돌아서서 이김</text>
<text x="585" y="420" text-anchor="middle" font-size="19" fill="#202124">막힌 일이 풀리는 쪽</text>
<text x="400" y="520" text-anchor="middle" font-size="16" fill="#5f6368">전통 해몽 풀이 · 오늘의 꿈 해몽</text></svg>