<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="sans-serif">
<rect width="800" height="560" fill="#ffffff"/>
<text x="400" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">이빨 빠지는 꿈 네 묶음</text>
<rect x="40" y="85" width="350" height="190" rx="16" fill="#e8f5e9"/>
<text x="215" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1e7e34">아프지 않게 쏙</text>
<text x="215" y="180" text-anchor="middle" font-size="19" fill="#202124">피 없이 빠짐</text>
<text x="215" y="210" text-anchor="middle" font-size="19" fill="#202124">묵은 걱정이 빠지는 쪽</text>
<rect x="410" y="85" width="350" height="190" rx="16" fill="#e8f0fe"/>
<text x="585" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1a56db">피가 났다</text>
<text x="585" y="180" text-anchor="middle" font-size="19" fill="#202124">아프고 피가 남</text>
<text x="585" y="210" text-anchor="middle" font-size="19" fill="#202124">식구 일을 살피라는 쪽</text>
<rect x="40" y="295" width="350" height="190" rx="16" fill="#fff8e1"/>
<text x="215" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#b06000">몽땅·여러 개</text>
<text x="215" y="390" text-anchor="middle" font-size="19" fill="#202124">한꺼번에 빠짐</text>
<text x="215" y="420" text-anchor="middle" font-size="19" fill="#202124">일이 몰리는 시기 쪽</text>
<rect x="410" y="295" width="350" height="190" rx="16" fill="#fce8e6"/>
<text x="585" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#c5221f">다시 끼웠다</text>
<text x="585" y="390" text-anchor="middle" font-size="19" fill="#202124">손에 쥐거나 꽂음</text>
<text x="585" y="420" text-anchor="middle" font-size="19" fill="#202124">잃을 뻔한 걸 지키는 쪽</text>
<text x="400" y="520" text-anchor="middle" font-size="16" fill="#5f6368">전통 해몽 풀이 · 오늘의 꿈 해몽</text></svg>