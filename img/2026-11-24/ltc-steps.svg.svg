<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><rect width="1200" height="360" fill="#ffffff"/><text x="600" y="48" font-size="30" fill="#202124" font-weight="700" text-anchor="middle">장기요양등급 신청부터 결과까지 5단계</text><rect x="40" y="85" width="208" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="144" cy="132" r="26" fill="#1a73e8"/><text x="144" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">1</text><text x="144" y="205" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">신청서 내기</text><text x="144" y="248" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">지사·전화·인터넷</text><text x="144" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">가족이 대신 가능</text><rect x="268" y="85" width="208" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="372" cy="132" r="26" fill="#1a73e8"/><text x="372" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">2</text><text x="372" y="205" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">방문조사</text><text x="372" y="248" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">공단 직원이 집으로</text><text x="372" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">90개 항목 확인</text><rect x="496" y="85" width="208" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="600" cy="132" r="26" fill="#1a73e8"/><text x="600" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">3</text><text x="600" y="205" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">의사소견서</text><text x="600" y="248" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">병원에서 발급</text><text x="600" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">65세 이상은 나중에</text><rect x="724" y="85" width="208" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="828" cy="132" r="26" fill="#1a73e8"/><text x="828" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">4</text><text x="828" y="205" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">등급판정</text><text x="828" y="248" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">신청일부터 30일</text><text x="828" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">필요하면 30일 연장</text><rect x="952" y="85" width="208" height="235" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="1056" cy="132" r="26" fill="#1a73e8"/><text x="1056" y="141" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">5</text><text x="1056" y="205" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">결과 통보</text><text x="1056" y="248" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">장기요양인정서</text><text x="1056" y="278" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">이용계획서 함께</text></svg>