<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif">
<rect width="800" height="400" fill="#ffffff"/>
<text x="400" y="48" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">깬 뒤 마음이 어땠나요</text>
<rect x="40" y="85" width="340" height="230" rx="16" fill="#e8f0fe"/>
<text x="210" y="135" text-anchor="middle" font-size="24" font-weight="700" fill="#1a56db">개운했다</text>
<text x="210" y="185" text-anchor="middle" font-size="20" fill="#202124">미뤄 둔 정리가 끝나고</text>
<text x="210" y="215" text-anchor="middle" font-size="20" fill="#202124">새 출발을 하는 쪽</text>
<rect x="420" y="85" width="340" height="230" rx="16" fill="#fce8e6"/>
<text x="590" y="135" text-anchor="middle" font-size="24" font-weight="700" fill="#c5221f">먹먹했다</text>
<text x="590" y="185" text-anchor="middle" font-size="20" fill="#202124">못다 한 그리움이</text>
<text x="590" y="215" text-anchor="middle" font-size="20" fill="#202124">꿈에 비친 쪽</text>
<text x="400" y="360" text-anchor="middle" font-size="17" fill="#5f6368">어느 쪽도 나쁜 일을 예고하는 꿈으로 보지 않아요</text>
</svg>
