<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="sans-serif">
<rect width="800" height="520" fill="#ffffff"/>
<text x="400" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">할머니 장례식 꿈, 내 장면은 어디?</text>
<g font-size="21">
<rect x="40" y="85" width="720" height="62" rx="12" fill="#e8f5e9"/><text x="64" y="124" fill="#202124">소리 내 펑펑 울었다</text><text x="736" y="124" text-anchor="end" fill="#1e7e34" font-weight="700">쌓인 근심이 풀리는 쪽</text>
<rect x="40" y="157" width="720" height="62" rx="12" fill="#e8f5e9"/><text x="64" y="196" fill="#202124">내가 상복을 입었다</text><text x="736" y="196" text-anchor="end" fill="#1e7e34" font-weight="700">복과 도움이 드는 쪽</text>
<rect x="40" y="229" width="720" height="62" rx="12" fill="#e8f5e9"/><text x="64" y="268" fill="#202124">조문객이 많았다</text><text x="736" y="268" text-anchor="end" fill="#1e7e34" font-weight="700">도와줄 사람이 생기는 쪽</text>
<rect x="40" y="301" width="720" height="62" rx="12" fill="#fff8e1"/><text x="64" y="340" fill="#202124">관 속 할머니가 웃으셨다</text><text x="736" y="340" text-anchor="end" fill="#b06000" font-weight="700">편히 가셨다는 안심의 꿈</text>
<rect x="40" y="373" width="720" height="62" rx="12" fill="#fff8e1"/><text x="64" y="412" fill="#202124">장례식에 늦거나 못 갔다</text><text x="736" y="412" text-anchor="end" fill="#b06000" font-weight="700">미뤄 둔 일을 챙기라는 쪽</text>
</g>
<text x="400" y="480" text-anchor="middle" font-size="17" fill="#5f6368">전통 해몽에서 흔히 보는 풀이 · 오늘의 꿈 해몽</text>
</svg>
