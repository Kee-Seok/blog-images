<rect x="240" y="76" width="56" height="40" rx="6" fill="#1a73e8"/><text x="310" y="104" font-size="21" font-weight="700" fill="#202124">2,000만원</text>
<text x="40" y="170" font-size="21" fill="#202124">성인 자녀</text>
<rect x="240" y="146" width="140" height="40" rx="6" fill="#1a73e8"/><text x="394" y="174" font-size="21" font-weight="700" fill="#202124">5,000만원</text>
<text x="40" y="240" font-size="21" fill="#202124">성인 자녀 +</text><text x="40" y="266" font-size="21" fill="#202124">혼인·출산 공제</text>
