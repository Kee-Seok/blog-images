<rect x="40" y="310" width="720" height="130" rx="12" fill="#fff8d6"/>
<text x="60" y="348" font-size="19" fill="#202124">· 혼인: 혼인신고일 전후 2년 안 / 출산: 출생일부터 2년 안</text>
<text x="60" y="384" font-size="19" fill="#202124">· 혼인·출산 공제는 둘을 합쳐 1억원까지</text>
