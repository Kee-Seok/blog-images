<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
<rect width="800" height="420" fill="#ffffff"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">수능 가채점, 언제 무엇을 하나요</text>
<g font-size="19" fill="#202124">
<rect x="30" y="80" width="170" height="250" rx="14" fill="#e8f0fe" stroke="#1a73e8"/>
<text x="115" y="118" text-anchor="middle" font-weight="700" fill="#1a73e8">11월 19일</text>
<text x="115" y="150" text-anchor="middle">시험 시간 중</text>
<text x="115" y="185" text-anchor="middle">답안지 먼저</text>
<text x="115" y="212" text-anchor="middle">마킹하고</text>
<text x="115" y="247" text-anchor="middle">수험표 뒷면</text>
<text x="115" y="274" text-anchor="middle">가채점표에 기록</text>
<rect x="220" y="80" width="170" height="250" rx="14" fill="#fff8e1" stroke="#f29900"/>
<text x="305" y="118" text-anchor="middle" font-weight="700" fill="#b06000">종료령</text>
<text x="305" y="150" text-anchor="middle">울리면 바로</text>
<text x="305" y="185" text-anchor="middle">펜을 놓기</text>
<text x="305" y="232" text-anchor="middle" fill="#c5221f" font-weight="700">이후 기록은</text>
<text x="305" y="259" text-anchor="middle" fill="#c5221f" font-weight="700">부정행위</text>
<rect x="410" y="80" width="170" height="250" rx="14" fill="#e6f4ea" stroke="#188038"/>
<text x="495" y="118" text-anchor="middle" font-weight="700" fill="#188038">시험 끝난 뒤</text>
<text x="495" y="150" text-anchor="middle">평가원 누리집</text>
<text x="495" y="177" text-anchor="middle">정답과 대조</text>
<text x="495" y="222" text-anchor="middle">입시업체</text>
<text x="495" y="249" text-anchor="middle">예상 등급컷은</text>
<text x="495" y="276" text-anchor="middle">참고만</text>
<rect x="600" y="80" width="170" height="250" rx="14" fill="#f3e8fd" stroke="#8430ce"/>
<text x="685" y="118" text-anchor="middle" font-weight="700" fill="#8430ce">12월 11일</text>
<text x="685" y="150" text-anchor="middle">성적통지표</text>
<text x="685" y="177" text-anchor="middle">배부</text>
<text x="685" y="222" text-anchor="middle">표준점수·</text>
<text x="685" y="249" text-anchor="middle">백분위·등급</text>
<text x="685" y="276" text-anchor="middle">(원점수 없음)</text>
</g>
<text x="400" y="380" text-anchor="middle" font-size="16" fill="#5f6368">출처: 교육부 2027학년도 수능 수험생 유의 사항, 평가원 시행 계획</text>
</svg>
