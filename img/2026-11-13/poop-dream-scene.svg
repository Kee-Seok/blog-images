<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
<rect width="800" height="420" fill="#ffffff"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">어디에 쌌는지로 먼저 나누기</text>
<g font-size="19" fill="#202124">
<rect x="24" y="80" width="180" height="300" rx="16" fill="#e6f4ea"/><text x="114" y="130" text-anchor="middle" font-weight="700" font-size="21">변기에 시원하게</text><text x="114" y="210" text-anchor="middle">묵은 걱정이</text><text x="114" y="242" text-anchor="middle">풀리는 쪽</text>
<rect x="216" y="80" width="180" height="300" rx="16" fill="#fff8e1"/><text x="306" y="130" text-anchor="middle" font-weight="700" font-size="21">양이 아주 많다</text><text x="306" y="210" text-anchor="middle">재물이 크게</text><text x="306" y="242" text-anchor="middle">드는 쪽</text>
<rect x="408" y="80" width="180" height="300" rx="16" fill="#e8f0fe"/><text x="498" y="130" text-anchor="middle" font-weight="700" font-size="21">옷·이불에 묻음</text><text x="498" y="210" text-anchor="middle">뜻밖의 돈이</text><text x="498" y="242" text-anchor="middle">붙는 쪽</text>
<rect x="600" y="80" width="180" height="300" rx="16" fill="#fce8e6"/><text x="690" y="130" text-anchor="middle" font-weight="700" font-size="21">못 싸고 참음</text><text x="690" y="210" text-anchor="middle">일이 막혀</text><text x="690" y="242" text-anchor="middle">답답한 쪽</text>
</g></svg>
