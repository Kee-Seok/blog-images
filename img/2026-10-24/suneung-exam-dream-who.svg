<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="sans-serif">
<rect width="900" height="330" fill="#ffffff"/>
<text x="450" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">수능 시험보는 꿈, 누가 꿨나</text>
<g font-size="21" fill="#202124">
<rect x="60" y="85" width="780" height="70" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="90" y="128" font-weight="700">수험생 본인</text><text x="330" y="128">긴장이 그대로 꿈에 나온 것으로 봄</text>
<rect x="60" y="170" width="780" height="70" rx="14" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
<text x="90" y="213" font-weight="700">수험생 부모</text><text x="330" y="213">아이 걱정, 대신 짐을 지는 마음</text>
<rect x="60" y="255" width="780" height="70" rx="14" fill="#f3e8fd" stroke="#9334e6" stroke-width="2"/>
<text x="90" y="298" font-weight="700">졸업한 어른</text><text x="330" y="298">회사·집안에서 평가받는 일이 있음</text>
</g>
</svg>
