<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="sans-serif">
<rect width="900" height="400" fill="#ffffff"/>
<text x="450" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">시험보는 꿈, 어느 순간에서 깼나</text>
<g font-size="20" fill="#202124">
<rect x="30" y="90" width="260" height="270" rx="16" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
<text x="160" y="135" text-anchor="middle" font-weight="700" font-size="23">① 가는 길</text>
<text x="160" y="185" text-anchor="middle">시험에 늦음</text>
<text x="160" y="225" text-anchor="middle">수험표를 잃어버림</text>
<text x="160" y="295" text-anchor="middle" fill="#b06000">놓칠까 조바심</text>
<text x="160" y="325" text-anchor="middle" fill="#b06000">→ 준비를 서두름</text>
<rect x="320" y="90" width="260" height="270" rx="16" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="450" y="135" text-anchor="middle" font-weight="700" font-size="23">② 시험지 앞</text>
<text x="450" y="185" text-anchor="middle">못 풂·백지</text>
<text x="450" y="225" text-anchor="middle">술술 풂·커닝</text>
<text x="450" y="295" text-anchor="middle" fill="#1a56c4">지금 평가받는 일</text>
<text x="450" y="325" text-anchor="middle" fill="#1a56c4">→ 결과는 반대로도 봄</text>
<rect x="610" y="90" width="260" height="270" rx="16" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
<text x="740" y="135" text-anchor="middle" font-weight="700" font-size="23">③ 결과</text>
<text x="740" y="185" text-anchor="middle">합격 소식</text>
<text x="740" y="225" text-anchor="middle">시험 떨어짐</text>
<text x="740" y="295" text-anchor="middle" fill="#137333">바라던 일의 결말</text>
<text x="740" y="325" text-anchor="middle" fill="#137333">→ 떨어져도 길몽 풀이</text>
</g>
</svg>
