<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
<rect width="1000" height="560" fill="#ffffff"/>
<text x="500" y="60" text-anchor="middle" font-size="34" font-weight="800" fill="#202124">4세대 실손 비급여 보험료, 1년 받은 금액에 따라</text>
<g font-size="26" fill="#202124">
<rect x="60" y="100" width="880" height="72" rx="12" fill="#e8f5e9"/><text x="90" y="146" font-weight="700">1단계 · 비급여 보험금 0원</text><text x="910" y="146" text-anchor="end" font-weight="800" fill="#1e8e4e">할인 (약 5%)</text>
<rect x="60" y="182" width="880" height="72" rx="12" fill="#f1f3f4"/><text x="90" y="228" font-weight="700">2단계 · 100만원 미만</text><text x="910" y="228" text-anchor="end" font-weight="800">그대로</text>
<rect x="60" y="264" width="880" height="72" rx="12" fill="#fff4e5"/><text x="90" y="310" font-weight="700">3단계 · 100만~150만원 미만</text><text x="910" y="310" text-anchor="end" font-weight="800" fill="#b06000">+100%</text>
<rect x="60" y="346" width="880" height="72" rx="12" fill="#ffe9d6"/><text x="90" y="392" font-weight="700">4단계 · 150만~300만원 미만</text><text x="910" y="392" text-anchor="end" font-weight="800" fill="#c5501a">+200%</text>
<rect x="60" y="428" width="880" height="72" rx="12" fill="#fde0dc"/><text x="90" y="474" font-weight="700">5단계 · 300만원 이상</text><text x="910" y="474" text-anchor="end" font-weight="800" fill="#c5221f">+300%</text>
</g>
<text x="500" y="538" text-anchor="middle" font-size="21" fill="#5f6368">비급여 특약 보험료에만 · 암 등 산정특례·장기요양 1~2등급은 빠짐 (금융위원회 2020.12.9)</text>
</svg>
