<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="sans-serif">
<rect width="800" height="460" fill="#ffffff"/>
<text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#202124">혼자 전신주에 부딪혀 척추 염좌(12급), 10일 입원·치료비 150만원</text>
<text x="400" y="72" text-anchor="middle" font-size="17" fill="#5f6368">두 담보 모두 부상 가입금액 3천만원일 때 받는 돈</text>
<text x="40" y="150" font-size="20" font-weight="700" fill="#202124">자동차상해</text>
<rect x="200" y="122" width="300" height="44" fill="#1a73e8"/><text x="350" y="151" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">치료비 150만원</text>
<rect x="500" y="122" width="110" height="44" fill="#34a853"/><text x="555" y="151" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">휴업 55</text>
<rect x="610" y="122" width="30" height="44" fill="#fbbc04"/>
<text x="650" y="151" font-size="20" font-weight="700" fill="#202124">220만원</text>
<text x="640" y="190" text-anchor="end" font-size="14" fill="#5f6368">노란 칸 = 위자료 15만원</text>
<text x="40" y="270" font-size="20" font-weight="700" fill="#202124">자기신체사고</text>
<rect x="200" y="242" width="240" height="44" fill="#9aa0a6"/><text x="320" y="271" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">12급 한도 120만원</text>
<rect x="440" y="242" width="60" height="44" fill="none" stroke="#d93025" stroke-width="2" stroke-dasharray="6 4"/>
<text x="650" y="271" font-size="20" font-weight="700" fill="#202124">120만원</text>
<text x="470" y="310" text-anchor="middle" font-size="14" fill="#d93025">못 받는 치료비 30만원</text>
<line x1="40" y1="350" x2="760" y2="350" stroke="#dadce0"/>
<text x="400" y="392" text-anchor="middle" font-size="19" font-weight="700" fill="#202124">차이 100만원 = 위자료·휴업손해 70만원 + 한도 넘은 치료비 30만원</text>
<text x="400" y="430" text-anchor="middle" font-size="14" fill="#80868b">출처: 롯데손해보험 개인용 자동차보험 약관 '알기 쉬운 자동차보험 이야기' 예시 (2025년 5월 1일판)</text>
</svg>
