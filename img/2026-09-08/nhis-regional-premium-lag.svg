<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<rect width="900" height="430" fill="#ffffff"/>
<text x="40" y="50" font-size="26" font-weight="700" fill="#202124">안 버는데 보험료가 나오는 이유</text>
<text x="40" y="80" font-size="15" fill="#5f6368">지역가입자 보험료는 지금 소득이 아니라 국세청이 확정한 지난 소득으로 매겨집니다</text>

<rect x="40" y="108" width="250" height="92" rx="12" fill="#f1f3f4" stroke="#dadce0" stroke-width="2"/>
<text x="64" y="140" font-size="15" fill="#5f6368">작년 소득</text>
<text x="64" y="172" font-size="21" font-weight="700" fill="#3c4043">국세청이 확정</text>

<text x="306" y="162" font-size="24" fill="#9aa0a6">&#8594;</text>

<rect x="340" y="108" width="250" height="92" rx="12" fill="#f1f3f4" stroke="#dadce0" stroke-width="2"/>
<text x="364" y="140" font-size="15" fill="#5f6368">7월 이후 자료 확정</text>
<text x="364" y="172" font-size="21" font-weight="700" fill="#3c4043">공단이 넘겨받음</text>

<text x="606" y="162" font-size="24" fill="#9aa0a6">&#8594;</text>

<rect x="640" y="108" width="220" height="92" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2.5"/>
<text x="664" y="140" font-size="15" fill="#1a73e8">올해 고지서</text>
<text x="664" y="172" font-size="21" font-weight="700" fill="#1a73e8">그 소득으로 부과</text>

<rect x="40" y="228" width="820" height="76" rx="12" fill="#fdeeee" stroke="#e0a3a3" stroke-width="2"/>
<text x="64" y="258" font-size="17" font-weight="700" fill="#c5221f">그사이에 폐업했든 퇴직했든 고지서는 그걸 모릅니다</text>
<text x="64" y="286" font-size="15" fill="#3c4043">지금 소득에 맞춰 다시 계산해 달라고 요청하는 것이 보험료 조정신청입니다.</text>

<rect x="40" y="326" width="820" height="76" rx="12" fill="#fef7e0" stroke="#e8c89a" stroke-width="2"/>
<text x="64" y="356" font-size="17" font-weight="700" fill="#b06000">다만 보험료가 0원이 되지는 않습니다</text>
<text x="64" y="384" font-size="15" fill="#3c4043">조정이 바꾸는 건 소득 부분 하나이고, 재산과 자동차에 매겨진 점수는 그대로 남습니다.</text>
</svg>
