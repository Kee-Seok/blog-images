<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<rect width="880" height="470" fill="#ffffff"/>
<text x="40" y="52" font-size="27" font-weight="700" fill="#202124">퇴사하면 건강보험은 세 갈래로 갈립니다</text>
<text x="40" y="82" font-size="15" fill="#5f6368">위에서부터 순서대로 되는지 확인하세요. 아래로 갈수록 부담이 큽니다</text>

<rect x="40" y="108" width="800" height="98" rx="14" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="3"/>
<text x="66" y="144" font-size="21" font-weight="700" fill="#137333">피부양자로 들어가기</text>
<text x="66" y="176" font-size="15" fill="#3c4043">가족이 직장가입자여야 하고 소득·재산 조건을 넘지 않아야 합니다</text>
<text x="812" y="164" font-size="34" font-weight="700" fill="#137333" text-anchor="end">0원</text>

<rect x="40" y="222" width="800" height="98" rx="14" fill="#fef3e6" stroke="#e8710a" stroke-width="3"/>
<text x="66" y="258" font-size="21" font-weight="700" fill="#b06000">임의계속가입</text>
<text x="66" y="290" font-size="15" fill="#3c4043">다니던 회사에서 내던 수준으로 유지. 신청 기한이 아주 짧습니다</text>
<text x="812" y="278" font-size="26" font-weight="700" fill="#b06000" text-anchor="end">최대 36개월</text>

<rect x="40" y="336" width="800" height="98" rx="14" fill="#f8f9fa" stroke="#9aa0a6" stroke-width="3"/>
<text x="66" y="372" font-size="21" font-weight="700" fill="#3c4043">그냥 지역가입자</text>
<text x="66" y="404" font-size="15" fill="#3c4043">소득이 없어도 재산과 자동차에 점수가 매겨져 보험료가 나옵니다</text>
<text x="812" y="392" font-size="22" font-weight="700" fill="#5f6368" text-anchor="end">가장 부담 큼</text>
</svg>
