<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<rect width="880" height="400" fill="#ffffff"/>
<text x="40" y="50" font-size="27" font-weight="700" fill="#202124">내 실수령액을 정확히 아는 방법</text>
<text x="40" y="80" font-size="15" fill="#5f6368">검색으로 나오는 '연봉 1억 실수령액'은 내 숫자가 아닙니다</text>

<rect x="40" y="108" width="800" height="62" rx="12" fill="#f8f9fa" stroke="#dadce0"/>
<circle cx="76" cy="139" r="18" fill="#1a73e8"/><text x="76" y="146" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="108" y="146" font-size="17" fill="#3c4043">급여명세서를 편다 — 항목별 금액이 다 적혀 있습니다</text>

<rect x="40" y="182" width="800" height="62" rx="12" fill="#f8f9fa" stroke="#dadce0"/>
<circle cx="76" cy="213" r="18" fill="#1a73e8"/><text x="76" y="220" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="108" y="220" font-size="17" fill="#3c4043">홈택스 간이세액표에 월급과 공제대상 가족 수를 넣어본다</text>

<rect x="40" y="256" width="800" height="62" rx="12" fill="#f8f9fa" stroke="#dadce0"/>
<circle cx="76" cy="287" r="18" fill="#1a73e8"/><text x="76" y="294" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="108" y="294" font-size="17" fill="#3c4043">명세서의 소득세와 조회 금액이 맞는지 대조한다</text>

<rect x="40" y="330" width="800" height="62" rx="12" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2.5"/>
<circle cx="76" cy="361" r="18" fill="#1e8e3e"/><text x="76" y="368" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="108" y="368" font-size="17" font-weight="700" fill="#137333">차이가 크면 회사에 원천징수 비율(80·100·120%)을 확인한다</text>
</svg>
