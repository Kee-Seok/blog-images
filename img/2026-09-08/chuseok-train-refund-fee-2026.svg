<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<rect width="900" height="470" fill="#ffffff"/>
<text x="40" y="48" font-size="26" font-weight="700" fill="#202124">언제 취소하느냐로 위약금이 이만큼 갈립니다</text>
<text x="40" y="78" font-size="15" fill="#5f6368">추석 연휴 열차는 전부 공휴일 요율 · 서울~부산 KTX 일반실 59,800원 기준</text>

<g>
<rect x="40" y="104" width="112" height="56" rx="8" fill="#e6f4ea"/>
<text x="96" y="130" font-size="14" fill="#137333" text-anchor="middle">2일 전까지</text>
<text x="96" y="152" font-size="17" font-weight="700" fill="#137333" text-anchor="middle">400원</text>
</g>
<g>
<rect x="164" y="104" width="112" height="56" rx="8" fill="#e6f4ea"/>
