<text x="354" y="152" font-size="17" font-weight="700" fill="#b06000" text-anchor="middle">5,980원</text>
</g>
<g>
<rect x="432" y="104" width="132" height="56" rx="8" fill="#fef3e6"/>
<text x="498" y="130" font-size="14" fill="#b06000" text-anchor="middle">출발 직전 · 20%</text>
<text x="498" y="152" font-size="17" font-weight="700" fill="#b06000" text-anchor="middle">11,960원</text>
</g>
<g>
<rect x="576" y="104" width="132" height="56" rx="8" fill="#fdeeee"/>
<text x="642" y="130" font-size="14" fill="#c5221f" text-anchor="middle">출발 후 20분 · 30%</text>
<text x="642" y="152" font-size="17" font-weight="700" fill="#c5221f" text-anchor="middle">17,940원</text>
