<text x="470" y="258" font-size="19" font-weight="700" fill="#1e8e3e">5% · 2,990원</text>
<text x="66" y="292" font-size="15" fill="#5f6368">연휴(금~일·공휴일) 출발 열차 · 출발 직전 취소</text>
<text x="470" y="292" font-size="19" font-weight="700" fill="#c5221f">20% · 11,960원</text>
<text x="700" y="292" font-size="17" font-weight="700" fill="#c5221f">네 배</text>

<rect x="40" y="340" width="820" height="106" rx="12" fill="#fff8f1" stroke="#f5d5ae" stroke-width="2"/>
<text x="66" y="372" font-size="17" font-weight="700" fill="#b06000">어른 넷이 서울~부산을 왕복하면 (운임 478,400원)</text>
