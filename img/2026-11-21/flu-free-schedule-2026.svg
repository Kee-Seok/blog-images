<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="40" y="60" font-size="32" font-weight="700" fill="#202124" text-anchor="start">2026-2027절기 독감 무료접종, 언제부터 언제까지</text><text x="40" y="98" font-size="22" font-weight="400" fill="#5f6368" text-anchor="start">질병관리청 예방접종도우미 기준 · 끝나는 날은 모두 2027년 4월 30일</text><line x1="120" y1="150" x2="120" y2="590" stroke="#dadce0" stroke-width="6"/><circle cx="120" cy="170" r="16" fill="#1a73e8"/><text x="160" y="180" font-size="28" font-weight="700" fill="#1a73e8" text-anchor="start">9월 21일</text><text x="460" y="180" font-size="26" font-weight="400" fill="#202124" text-anchor="start">생후 6개월~14세 · 임신부</text><circle cx="120" cy="265" r="16" fill="#1a73e8"/><text x="160" y="275" font-size="28" font-weight="700" fill="#1a73e8" text-anchor="start">10월 6일</text><text x="460" y="275" font-size="26" font-weight="400" fill="#202124" text-anchor="start">75세 이상 (1951년 이전 출생)</text><circle cx="120" cy="360" r="16" fill="#1a73e8"/><text x="160" y="370" font-size="28" font-weight="700" fill="#1a73e8" text-anchor="start">10월 12일</text><text x="460" y="370" font-size="26" font-weight="400" fill="#202124" text-anchor="start">70~74세 (1952~1956년생)</text><circle cx="120" cy="455" r="16" fill="#1a73e8"/><text x="160" y="465" font-size="28" font-weight="700" fill="#1a73e8" text-anchor="start">10월 15일</text><text x="460" y="465" font-size="26" font-weight="400" fill="#202124" text-anchor="start">65~69세 (1957~1961년생)</text><circle cx="120" cy="550" r="16" fill="#d93025"/><text x="160" y="560" font-size="28" font-weight="700" fill="#d93025" text-anchor="start">2027년 4월 30일</text><text x="460" y="560" font-size="26" font-weight="400" fill="#202124" text-anchor="start">모든 무료 대상 마감</text></svg>