<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="sans-serif">
<rect width="800" height="560" fill="#ffffff"/>
<text x="400" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">누구의 똥이었나</text>
<rect x="40" y="85" width="350" height="190" rx="16" fill="#e8f5e9"/>
<text x="215" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1e7e34">내 똥</text>
<text x="215" y="180" text-anchor="middle" font-size="19" fill="#202124">내가 쌌다</text>
<text x="215" y="210" text-anchor="middle" font-size="19" fill="#202124">내 노력으로 드는 재물</text>
<rect x="410" y="85" width="350" height="190" rx="16" fill="#e8f0fe"/>
<text x="585" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1a56db">아기 똥</text>
<text x="585" y="180" text-anchor="middle" font-size="19" fill="#202124">기저귀·아기 몸</text>
<text x="585" y="210" text-anchor="middle" font-size="19" fill="#202124">작지만 반가운 복</text>
<rect x="40" y="295" width="350" height="190" rx="16" fill="#fff8e1"/>
<text x="215" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#b06000">강아지·고양이 똥</text>
<text x="215" y="390" text-anchor="middle" font-size="19" fill="#202124">집 안 동물</text>
<text x="215" y="420" text-anchor="middle" font-size="19" fill="#202124">가까운 데서 드는 이득</text>
<rect x="410" y="295" width="350" height="190" rx="16" fill="#fce8e6"/>
<text x="585" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#c5221f">소·돼지 똥</text>
<text x="585" y="390" text-anchor="middle" font-size="19" fill="#202124">큰 동물 똥</text>
<text x="585" y="420" text-anchor="middle" font-size="19" fill="#202124">큰 재물로 풀기도 함</text>
<text x="400" y="520" text-anchor="middle" font-size="16" fill="#5f6368">전통 해몽 풀이 · 오늘의 꿈 해몽</text></svg>