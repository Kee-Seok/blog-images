<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><rect width="1200" height="400" fill="#ffffff"/><text x="600" y="48" font-size="30" fill="#202124" font-weight="700" text-anchor="middle">회사 연말정산, 근로자가 할 일 4단계</text><rect x="40" y="90" width="255" height="230" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="167" cy="138" r="26" fill="#1a73e8"/><text x="167" y="147" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">1</text><text x="167" y="210" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">홈택스 간소화</text><text x="167" y="252" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">1월 15일부터 조회·</text><text x="167" y="280" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">PDF 내려받기</text><rect x="325" y="90" width="255" height="230" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="452" cy="138" r="26" fill="#1a73e8"/><text x="452" y="147" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">2</text><text x="452" y="210" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">빠진 서류 챙기기</text><text x="452" y="252" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">월세·기부금·안경 등</text><text x="452" y="280" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">직접 발급</text><rect x="610" y="90" width="255" height="230" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="737" cy="138" r="26" fill="#1a73e8"/><text x="737" y="147" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">3</text><text x="737" y="210" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">회사 시스템에 제출</text><text x="737" y="252" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">공제신고서+PDF</text><text x="737" y="280" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">마감은 회사 공지</text><rect x="895" y="90" width="255" height="230" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/><circle cx="1022" cy="138" r="26" fill="#1a73e8"/><text x="1022" y="147" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">4</text><text x="1022" y="210" font-size="22" fill="#202124" font-weight="700" text-anchor="middle">원천징수영수증 확인</text><text x="1022" y="252" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">2~3월 급여명세서의</text><text x="1022" y="280" font-size="17" fill="#3c4043" font-weight="400" text-anchor="middle">환급·추가납부</text><text x="600" y="370" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">공제 요건은 근로자 본인이 확인해야 해요(국세청 2026.1.14 안내)</text></svg>