<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="sans-serif">
<rect width="800" height="560" fill="#ffffff"/>
<text x="400" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">똥꿈 장면 네 묶음</text>
<rect x="40" y="85" width="350" height="190" rx="16" fill="#e8f5e9"/>
<text x="215" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1e7e34">몸에 닿았다</text>
<text x="215" y="180" text-anchor="middle" font-size="19" fill="#202124">밟음·묻음·손에 쥠</text>
<text x="215" y="210" text-anchor="middle" font-size="19" fill="#202124">재물이 붙는 쪽</text>
<rect x="410" y="85" width="350" height="190" rx="16" fill="#e8f0fe"/>
<text x="585" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1a56db">내가 쌌다</text>
<text x="585" y="180" text-anchor="middle" font-size="19" fill="#202124">시원하게 봤다면</text>
<text x="585" y="210" text-anchor="middle" font-size="19" fill="#202124">근심이 빠지고 돈이 드는 쪽</text>
<rect x="40" y="295" width="350" height="190" rx="16" fill="#fff8e1"/>
<text x="215" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#b06000">치웠다·닦았다</text>
<text x="215" y="390" text-anchor="middle" font-size="19" fill="#202124">바로 없앴다면</text>
<text x="215" y="420" text-anchor="middle" font-size="19" fill="#202124">들어올 복이 새는 쪽</text>
<rect x="410" y="295" width="350" height="190" rx="16" fill="#fce8e6"/>
<text x="585" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#c5221f">참았다·못 쌌다</text>
<text x="585" y="390" text-anchor="middle" font-size="19" fill="#202124">화장실을 못 찾음</text>
<text x="585" y="420" text-anchor="middle" font-size="19" fill="#202124">답답한 일이 남은 쪽</text>
<text x="400" y="520" text-anchor="middle" font-size="16" fill="#5f6368">전통 해몽 풀이 · 오늘의 꿈 해몽</text></svg>