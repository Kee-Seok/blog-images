<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="40" y="60" font-size="32" font-weight="700" fill="#202124" text-anchor="start">독감 주사 맞은 뒤, 시간 순서로 챙길 것</text><text x="40" y="98" font-size="22" font-weight="400" fill="#5f6368" text-anchor="start">질병관리청 예방접종 후 주의사항 기준</text><rect x="40" y="170" width="210" height="380" rx="16" fill="#f8f9fa" stroke="#1a73e8" stroke-width="3"/><text x="145" y="240" font-size="28" font-weight="800" fill="#1a73e8" text-anchor="middle">접종 직후</text><text x="145" y="320" font-size="22" font-weight="400" fill="#202124" text-anchor="middle">20~30분</text><text x="145" y="356" font-size="22" font-weight="400" fill="#202124" text-anchor="middle">접종기관에</text><text x="145" y="392" font-size="22" font-weight="400" fill="#202124" text-anchor="middle">머물기</text><rect x="268" y="170" width="210" height="380" rx="16" fill="#f8f9fa" stroke="#1a73e8" stroke-width="3"/><text x="373" y="240" font-size="28" font-weight="800" fill="#1a73e8" text-anchor="middle">당일</text><text x="373" y="320" font-size="22" font-weight="400" fill="#202124" text-anchor="middle">무리한 활동</text><text x="373" y="356" font-size="22" font-weight="400" fill="#202124" text-anchor="middle">피하고 접종</text><text x="373" y="392" font-size="22" font-weight="400" fill="#202124" text-anchor="middle">부위 깨끗이</text><rect x="496" y="170" width="210" height="380" rx="16" fill="#f8f9fa" stroke="#f29900" stroke-width="3"/><text x="601" y="240" font-size="28" font-weight="800" fill="#f29900" text-anchor="middle">3일 동안</text><text x="601" y="320" font-size="22" font-weight="400" fill="#202124" text-anchor="middle">고열·두드러기</text><text x="601" y="356" font-size="22" font-weight="400" fill="#202124" text-anchor="middle">생기면 진료</text><rect x="724" y="170" width="210" height="380" rx="16" fill="#f8f9fa" stroke="#137333" stroke-width="3"/><text x="829" y="240" font-size="28" font-weight="800" fill="#137333" text-anchor="middle">2주 뒤</text><text x="829" y="320" font-size="22" font-weight="400" fill="#202124" text-anchor="middle">방어 항체가</text><text x="829" y="356" font-size="22" font-weight="400" fill="#202124" text-anchor="middle">생기는 시점</text><rect x="952" y="170" width="210" height="380" rx="16" fill="#f8f9fa" stroke="#137333" stroke-width="3"/><text x="1057" y="240" font-size="28" font-weight="800" fill="#137333" text-anchor="middle">약 6개월</text><text x="1057" y="320" font-size="22" font-weight="400" fill="#202124" text-anchor="middle">효과 유지 ·</text><text x="1057" y="356" font-size="22" font-weight="400" fill="#202124" text-anchor="middle">내년엔 새로</text><text x="1057" y="392" font-size="22" font-weight="400" fill="#202124" text-anchor="middle">맞기</text></svg>