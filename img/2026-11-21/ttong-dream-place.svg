<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="sans-serif">
<rect width="800" height="560" fill="#ffffff"/>
<text x="400" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">똥이 어디에 있었나</text>
<rect x="40" y="85" width="350" height="190" rx="16" fill="#e8f5e9"/>
<text x="215" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1e7e34">변기·화장실</text>
<text x="215" y="180" text-anchor="middle" font-size="19" fill="#202124">제자리에 쌓임</text>
<text x="215" y="210" text-anchor="middle" font-size="19" fill="#202124">모으는 돈이 느는 쪽</text>
<rect x="410" y="85" width="350" height="190" rx="16" fill="#e8f0fe"/>
<text x="585" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#1a56db">길바닥</text>
<text x="585" y="180" text-anchor="middle" font-size="19" fill="#202124">밟고 지나감</text>
<text x="585" y="210" text-anchor="middle" font-size="19" fill="#202124">뜻밖의 돈이 붙는 쪽</text>
<rect x="40" y="295" width="350" height="190" rx="16" fill="#fff8e1"/>
<text x="215" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#b06000">방·이불</text>
<text x="215" y="390" text-anchor="middle" font-size="19" fill="#202124">집 안에 가득</text>
<text x="215" y="420" text-anchor="middle" font-size="19" fill="#202124">집안 살림이 넉넉해지는 쪽</text>
<rect x="410" y="295" width="350" height="190" rx="16" fill="#fce8e6"/>
<text x="585" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#c5221f">남의 몸·옷</text>
<text x="585" y="390" text-anchor="middle" font-size="19" fill="#202124">남에게 묻음</text>
<text x="585" y="420" text-anchor="middle" font-size="19" fill="#202124">도움이 남에게 가는 쪽</text>
<text x="400" y="520" text-anchor="middle" font-size="16" fill="#5f6368">전통 해몽 풀이 · 오늘의 꿈 해몽</text></svg>