<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><rect width="1200" height="470" fill="#ffffff"/><text x="600" y="48" font-size="30" fill="#202124" font-weight="700" text-anchor="middle">연말정산 기간 퇴사자, 언제 정산되나</text><rect x="40" y="90" width="300" height="90" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="190" y="145" font-size="22" fill="#1a73e8" font-weight="800" text-anchor="middle">올해 중간에 퇴사</text><rect x="370" y="90" width="790" height="90" rx="14" fill="#ffffff" stroke="#dadce0" stroke-width="2"/><text x="400" y="130" font-size="21" fill="#202124" font-weight="700" text-anchor="start">퇴사하는 달 급여에서 회사가 정산</text><text x="400" y="162" font-size="17" fill="#5f6368" font-weight="400" text-anchor="start">기본공제 위주 → 카드·의료비 빠짐</text><rect x="40" y="200" width="300" height="90" rx="14" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/><text x="190" y="255" font-size="22" fill="#f9ab00" font-weight="800" text-anchor="middle">빠진 공제가 있다면</text><rect x="370" y="200" width="790" height="90" rx="14" fill="#ffffff" stroke="#dadce0" stroke-width="2"/><text x="400" y="240" font-size="21" fill="#202124" font-weight="700" text-anchor="start">다음 해 5월 종합소득세 신고</text><text x="400" y="272" font-size="17" fill="#5f6368" font-weight="400" text-anchor="start">홈택스에서 직접 추가</text><rect x="40" y="310" width="300" height="90" rx="14" fill="#e6f4ea" stroke="#188038" stroke-width="2"/><text x="190" y="365" font-size="22" fill="#188038" font-weight="800" text-anchor="middle">다른 회사로 재취업</text><rect x="370" y="310" width="790" height="90" rx="14" fill="#ffffff" stroke="#dadce0" stroke-width="2"/><text x="400" y="350" font-size="21" fill="#202124" font-weight="700" text-anchor="start">새 회사에 전 직장 원천징수영수증 제출</text><text x="400" y="382" font-size="17" fill="#5f6368" font-weight="400" text-anchor="start">두 회사 소득을 합쳐 정산</text><text x="600" y="440" font-size="17" fill="#5f6368" font-weight="400" text-anchor="middle">근거: 소득세법 제137조(중도 퇴직 시 정산)·제70조(5월 확정신고)</text></svg>