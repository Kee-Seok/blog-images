<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="sans-serif">
<rect width="1200" height="700" fill="#ffffff"/>
<text x="60" y="80" font-size="40" font-weight="700" fill="#202124">건강검진 뒤 녹내장 검사, 실비가 갈리는 곳</text>
<rect x="60" y="140" width="1080" height="110" rx="14" fill="#f1f3f4"/>
<text x="100" y="208" font-size="32" font-weight="700" fill="#202124">건강검진 비용 자체</text>
<text x="820" y="208" font-size="32" font-weight="700" fill="#c5221f">실손 보상 안 함</text>
<path d="M600 262 L600 312" stroke="#5f6368" stroke-width="4"/><path d="M588 302 L600 322 L612 302 Z" fill="#5f6368"/>
<rect x="60" y="330" width="510" height="300" rx="14" fill="#e6f4ea"/>
<text x="90" y="390" font-size="30" font-weight="700" fill="#202124">의사 이상 소견 있음</text>
<text x="90" y="440" font-size="24" fill="#202124">예: 녹내장 의심(H40.0)</text>
<text x="90" y="480" font-size="24" fill="#202124">→ 안과에서 받은 추가 검사</text>
<text x="90" y="580" font-size="32" font-weight="700" fill="#137333">실손 청구 가능</text>
<rect x="630" y="330" width="510" height="300" rx="14" fill="#fce8e6"/>
<text x="660" y="390" font-size="30" font-weight="700" fill="#202124">소견 없이 내가 추가</text>
<text x="660" y="440" font-size="24" fill="#202124">예: 검진 센터에서</text>
<text x="660" y="480" font-size="24" fill="#202124">정밀 안과검사 옵션 선택</text>
<text x="660" y="580" font-size="32" font-weight="700" fill="#c5221f">검진 비용으로 볼 수 있음</text>
<text x="60" y="675" font-size="20" fill="#80868b">자료: 금융감독원 실손보험 소비자 안내(2017년 6월 21일), 건강보험심사평가원 심사사례(2024년 3월 29일)</text>
</svg>
