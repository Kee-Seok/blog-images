<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="sans-serif">
<rect width="960" height="560" fill="#ffffff"/>
<text x="40" y="54" font-size="30" font-weight="700" fill="#202124">고관절 수술비용, 언제 얼마가 나가고 돌아오나</text>
<text x="40" y="88" font-size="18" fill="#5f6368">건강보험 진료비 평균 962만8천원 · 입원 17.5일 기준 예시(식대·비급여 제외)</text>
<line x1="90" y1="150" x2="90" y2="500" stroke="#1a73e8" stroke-width="4"/>
<g font-size="20" fill="#202124">
<circle cx="90" cy="160" r="12" fill="#1a73e8"/>
<text x="125" y="155" font-weight="700">넘어진 날 · 응급실</text>
<text x="125" y="183" fill="#5f6368" font-size="17">고관절 골절이면 입원해 수술 날짜부터 잡아요</text>
<circle cx="90" cy="250" r="12" fill="#1a73e8"/>
<text x="125" y="245" font-weight="700">입원 평균 17.5일</text>
<text x="125" y="273" fill="#5f6368" font-size="17">2023년 고관절치환술 기준 · 식대 50%·1인실 값은 따로</text>
<circle cx="90" cy="340" r="12" fill="#e8710a"/>
<text x="125" y="335" font-weight="700">퇴원 수납 · 급여 본인부담 20% ≈ 192만6천원</text>
<text x="125" y="363" fill="#5f6368" font-size="17">962만8천원 × 20%</text>
<circle cx="90" cy="430" r="12" fill="#1a73e8"/>
<text x="125" y="425" font-weight="700">실손 청구 · 3년 안에</text>
<text x="125" y="453" fill="#5f6368" font-size="17">넘어져 부러졌다면 상해 입원으로</text>
<circle cx="90" cy="500" r="12" fill="#188038"/>
<text x="125" y="495" font-weight="700">이듬해 8월 말쯤 · 본인부담상한제 환급</text>
<text x="125" y="523" fill="#5f6368" font-size="17">1년 본인부담이 소득별 상한액을 넘은 만큼</text>
</g>
<text x="40" y="550" font-size="14" fill="#80868b">표: 국민건강보험공단 2023년 주요수술 통계연보(2024.12.16) 정리 · 금액은 평균값 예시</text>
</svg>
