<text x="90" y="260" font-size="24" fill="#202124">낸 돈 합계</text>
<text x="90" y="300" font-size="24" fill="#202124">급여·비급여 칸</text>
<rect x="430" y="130" width="340" height="400" rx="16" fill="#e8f0fe"/>
<text x="460" y="200" font-size="30" font-weight="700" fill="#202124">② 세부산정내역서</text>
