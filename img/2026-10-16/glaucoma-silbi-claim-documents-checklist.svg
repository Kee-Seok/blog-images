<text x="60" y="590" font-size="28" font-weight="700" fill="#202124">실손24 연계 병원이면 병원이 바로 전송 · 청구는 진료일부터 3년 안</text>
<text x="60" y="650" font-size="20" fill="#80868b">자료: 금융위원회·보건복지부(2026년 9월 30일), 건강보험심사평가원 심사사례(2024년 3월 29일)</text>
