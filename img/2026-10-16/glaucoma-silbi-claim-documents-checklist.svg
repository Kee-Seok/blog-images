<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="sans-serif">
<rect width="1200" height="680" fill="#ffffff"/>
<text x="60" y="80" font-size="40" font-weight="700" fill="#202124">녹내장 실비 청구 서류, 안과 창구에서 받을 것</text>
<rect x="60" y="130" width="340" height="400" rx="16" fill="#e8f0fe"/>
