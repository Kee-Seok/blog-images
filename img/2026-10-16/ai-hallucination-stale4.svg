<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="800" height="380" fill="#ffffff"/>
<text x="400" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#202124">옛 글 다시 점검에서 걸린 숫자 4건</text>
<rect x="30" y="62" width="740" height="40" fill="#f1f3f4"/>
<text x="150" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#202124">글 주제</text>
<text x="400" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#c5221f">글에 적혀 있던 것</text>
<text x="650" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#188038">공식 확인 값</text>
<g font-size="17" fill="#202124">
<text x="150" y="140" text-anchor="middle">국민연금 실버론 금리</text><text x="400" y="140" text-anchor="middle" fill="#c5221f">2.57%</text><text x="650" y="140" text-anchor="middle" fill="#188038">2.92% (2026년 3분기)</text>
<line x1="30" y1="160" x2="770" y2="160" stroke="#dadce0"/>
<text x="150" y="196" text-anchor="middle">귀농 융자 금리</text><text x="400" y="196" text-anchor="middle" fill="#c5221f">1.5%</text><text x="650" y="196" text-anchor="middle" fill="#188038">2.0% 고정 (2026 공고)</text>
<line x1="30" y1="216" x2="770" y2="216" stroke="#dadce0"/>
<text x="150" y="252" text-anchor="middle">기준금리 방향</text><text x="400" y="252" text-anchor="middle" fill="#c5221f">"인하"</text><text x="650" y="252" text-anchor="middle" fill="#188038">인상 (8월 27일 3.00%)</text>
<line x1="30" y1="272" x2="770" y2="272" stroke="#dadce0"/>
<text x="150" y="308" text-anchor="middle">ISA 만기 세금</text><text x="400" y="308" text-anchor="middle" fill="#c5221f">15.4%</text><text x="650" y="308" text-anchor="middle" fill="#188038">한도 넘는 부분 9.9%</text>
</g>
<text x="400" y="356" text-anchor="middle" font-size="15" fill="#5f6368">넷 다 허공에서 만든 숫자가 아니라 옛 기준이나 다른 규칙의 숫자였다</text>
</svg>
