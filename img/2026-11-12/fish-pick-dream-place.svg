<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
<rect width="800" height="440" fill="#ffffff"/>
<text x="400" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">물고기를 주운 곳별 전통 해몽 풀이</text>
<g font-size="21" fill="#202124">
<rect x="40" y="80" width="340" height="150" rx="16" fill="#e6f4ea"/><text x="210" y="125" text-anchor="middle" font-weight="700">물가·바닷가 모래</text><text x="210" y="165" text-anchor="middle">뜻밖의 작은 수입</text><text x="210" y="198" text-anchor="middle">기회를 줍는 꿈</text>
<rect x="420" y="80" width="340" height="150" rx="16" fill="#e8f0fe"/><text x="590" y="125" text-anchor="middle" font-weight="700">집 마당·방바닥</text><text x="590" y="165" text-anchor="middle">재물이 집 안으로</text><text x="590" y="198" text-anchor="middle">들어오는 쪽</text>
<rect x="40" y="260" width="340" height="150" rx="16" fill="#fff8e1"/><text x="210" y="305" text-anchor="middle" font-weight="700">길바닥·도로</text><text x="210" y="345" text-anchor="middle">남이 놓친 몫을</text><text x="210" y="378" text-anchor="middle">얻게 되는 풀이</text>
<rect x="420" y="260" width="340" height="150" rx="16" fill="#fce8e6"/><text x="590" y="305" text-anchor="middle" font-weight="700">하늘에서 떨어짐</text><text x="590" y="345" text-anchor="middle">윗사람 도움·</text><text x="590" y="378" text-anchor="middle">횡재수로 보는 쪽</text>
</g></svg>
