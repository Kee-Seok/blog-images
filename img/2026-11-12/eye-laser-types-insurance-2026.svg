<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="800" height="430" fill="#ffffff"/>
<text x="400" y="44" font-size="26" font-weight="700" fill="#202124" text-anchor="middle">눈 레이저, 무엇을 고쳤나로 보험이 갈려요</text>
<rect x="30" y="74" width="360" height="330" rx="16" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="210" y="114" font-size="22" font-weight="700" fill="#1a73e8" text-anchor="middle">병을 치료한 레이저</text>
<text x="210" y="152" font-size="18" fill="#202124" text-anchor="middle">망막 광응고술 · 녹내장 레이저</text>
<text x="210" y="178" font-size="18" fill="#202124" text-anchor="middle">후발 백내장 레이저</text>
<text x="210" y="236" font-size="20" font-weight="700" fill="#202124" text-anchor="middle">실비: 청구 가능</text>
<text x="210" y="266" font-size="17" fill="#5f6368" text-anchor="middle">4세대는 내 몫 20%(최소 1만원)</text>
<text x="210" y="316" font-size="20" font-weight="700" fill="#202124" text-anchor="middle">수술비 특약: 약관 따라</text>
<text x="210" y="346" font-size="17" fill="#5f6368" text-anchor="middle">가입일·수술 뜻풀이 확인</text>
<rect x="410" y="74" width="360" height="330" rx="16" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
<text x="590" y="114" font-size="22" font-weight="700" fill="#b06000" text-anchor="middle">시력을 고친 레이저</text>
<text x="590" y="152" font-size="18" fill="#202124" text-anchor="middle">라식 · 라섹 · 스마일라식</text>
<text x="590" y="178" font-size="18" fill="#202124" text-anchor="middle">(안경 대신 하는 수술)</text>
<text x="590" y="236" font-size="20" font-weight="700" fill="#202124" text-anchor="middle">실비: 0원</text>
<text x="590" y="266" font-size="17" fill="#5f6368" text-anchor="middle">표준약관이 보상 제외</text>
<text x="590" y="316" font-size="20" font-weight="700" fill="#202124" text-anchor="middle">연말정산: 의료비 공제</text>
<text x="590" y="346" font-size="17" fill="#5f6368" text-anchor="middle">총급여 3% 넘는 부분의 15%</text>
</svg>
