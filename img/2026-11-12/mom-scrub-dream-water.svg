<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
<rect width="800" height="400" fill="#ffffff"/>
<text x="400" y="48" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">때와 물이 어땠는지 두 번째로 보기</text>
<g font-size="20" fill="#202124">
<rect x="30" y="90" width="235" height="270" rx="16" fill="#e6f4ea"/><text x="147" y="140" text-anchor="middle" font-weight="700" font-size="22">때가 술술 나왔다</text><text x="147" y="210" text-anchor="middle">묵은 걱정이</text><text x="147" y="245" text-anchor="middle">빠져나가는 쪽</text>
<rect x="283" y="90" width="235" height="270" rx="16" fill="#fff8e1"/><text x="400" y="140" text-anchor="middle" font-weight="700" font-size="22">밀어도 안 나왔다</text><text x="400" y="210" text-anchor="middle">아직 붙들고 있는</text><text x="400" y="245" text-anchor="middle">일이 남은 쪽</text>
<rect x="536" y="90" width="235" height="270" rx="16" fill="#e8f0fe"/><text x="653" y="140" text-anchor="middle" font-weight="700" font-size="22">물이 맑고 따뜻했다</text><text x="653" y="210" text-anchor="middle">마음이 풀리고</text><text x="653" y="245" text-anchor="middle">기운이 도는 쪽</text>
</g></svg>
