<text x="455" y="135" text-anchor="middle" font-weight="700">③ 지사 심사</text><text x="455" y="165" text-anchor="middle" font-size="16">공단 지사가</text><text x="455" y="188" text-anchor="middle" font-size="16">내역 확인</text>
<rect x="555" y="90" width="140" height="120" rx="14" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2"/>
<text x="625" y="135" text-anchor="middle" font-weight="700">④ 입금</text><text x="625" y="165" text-anchor="middle" font-size="16">심사 끝난 다음 날</text><text x="625" y="188" text-anchor="middle" font-size="16">늦어도 7일 안</text>
