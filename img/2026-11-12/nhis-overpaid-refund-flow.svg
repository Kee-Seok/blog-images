<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
<rect width="720" height="420" fill="#ffffff"/>
<text x="360" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#202124">본인부담금 환급금, 신청부터 입금까지</text>
<g font-size="19" fill="#202124">
<rect x="30" y="90" width="150" height="120" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="105" y="135" text-anchor="middle" font-weight="700">① 조회</text><text x="105" y="165" text-anchor="middle" font-size="16">누리집·앱</text><text x="105" y="188" text-anchor="middle" font-size="16">안내문 없어도 돼요</text>
<rect x="205" y="90" width="150" height="120" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="280" y="135" text-anchor="middle" font-weight="700">② 신청</text><text x="280" y="165" text-anchor="middle" font-size="16">계좌 넣고 접수</text><text x="280" y="188" text-anchor="middle" font-size="16">우편·지사·1577-1000</text>
