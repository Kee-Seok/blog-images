<g fill="#5f6368"><polygon points="184,150 200,142 200,158"/><polygon points="359,150 375,142 375,158"/><polygon points="534,150 550,142 550,158"/></g>
<rect x="30" y="250" width="665" height="130" rx="14" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/>
<text x="362" y="292" text-anchor="middle" font-size="21" font-weight="700" fill="#202124">기한: 처음 안내문을 보낸 날부터 3년</text>
<text x="362" y="326" text-anchor="middle" font-size="17" fill="#202124">3년 안에 신청하지 않으면 받을 권리가 사라져요(소멸시효)</text>
<text x="362" y="356" text-anchor="middle" font-size="16" fill="#5f6368">출처: 국민건강보험공단 안내, 2026-11-11 보도</text>
