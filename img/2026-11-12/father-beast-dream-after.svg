<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
<rect width="800" height="400" fill="#ffffff"/>
<text x="400" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">잡은 다음 장면이 풀이를 바꿔요</text>
<g font-size="21" fill="#202124">
<rect x="60" y="80" width="680" height="80" rx="14" fill="#e6f4ea"/><text x="90" y="128" font-weight="700">잡아서 나에게 건네주심</text><text x="710" y="128" text-anchor="end">재물·도움이 들어오는 쪽</text>
<rect x="60" y="180" width="680" height="80" rx="14" fill="#fff8e1"/><text x="90" y="228" font-weight="700">말없이 끌고 집 밖으로</text><text x="710" y="228" text-anchor="end">지출·빈자리를 챙기라는 쪽</text>
<rect x="60" y="280" width="680" height="80" rx="14" fill="#e8f0fe"/><text x="90" y="328" font-weight="700">잡으려다 놓치심</text><text x="710" y="328" text-anchor="end">일이 조금 늦어지는 쪽</text>
</g></svg>
