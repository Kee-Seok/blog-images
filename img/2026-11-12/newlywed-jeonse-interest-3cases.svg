<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="1000" height="520" fill="#fffdf6"/>
<text x="40" y="60" font-size="29" font-weight="700" fill="#202124">세 집의 한 달 이자, 따라 계산하기</text>
<text x="40" y="94" font-size="18" fill="#5f6368">월 이자 = 대출금 × 연 금리 ÷ 12 (만기 일시상환, 대략값)</text>
<g font-size="22" fill="#202124">
<rect x="40" y="118" width="920" height="100" rx="12" fill="#e8f0fe"/>
<text x="64" y="158" font-weight="700">서울 보증금 2.5억 · 연소득 6천만원</text><text x="64" y="196">2억 × 2.9% ÷ 12</text><text x="934" y="196" text-anchor="end" font-weight="700">483,333원</text>
<rect x="40" y="232" width="920" height="100" rx="12" fill="#e6f4ea"/>
<text x="64" y="272" font-weight="700">같은 집 + 아이 1명 (0.3%p 인하)</text><text x="64" y="310">2억 × 2.6% ÷ 12</text><text x="934" y="310" text-anchor="end" font-weight="700" fill="#137333">433,333원</text>
<rect x="40" y="346" width="920" height="100" rx="12" fill="#f8f9fa"/>
<text x="64" y="386" font-weight="700">지방 보증금 1.2억 · 연소득 4천만원</text><text x="64" y="424">9,600만원 × 2.2% ÷ 12</text><text x="934" y="424" text-anchor="end" font-weight="700">176,000원</text>
</g>
<text x="40" y="490" font-size="18" fill="#202124">대출금은 보증금의 80%, 수도권 2.5억·지방 1.6억 한도 안에서 계산했습니다.</text>
</svg>
