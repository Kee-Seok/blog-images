<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
<rect width="800" height="360" fill="#ffffff"/>
<text x="400" y="44" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">어디에 누워 계셨는지에 따라</text>
<g font-size="20" fill="#202124">
<rect x="40" y="75" width="720" height="70" rx="14" fill="#e6f4ea"/><text x="70" y="118" font-weight="700">생전에 쓰시던 방</text><text x="330" y="118">집과 가족 일을 돌아보라는 풀이</text>
<rect x="40" y="160" width="720" height="70" rx="14" fill="#fff8e1"/><text x="70" y="203" font-weight="700">병원 침대</text><text x="330" y="203">내 몸·가족 건강을 한 번 챙기는 쪽</text>
<rect x="40" y="245" width="720" height="70" rx="14" fill="#e8f0fe"/><text x="70" y="288" font-weight="700">관 속·이불 덮고</text><text x="330" y="288">한 가지 일이 매듭지어지는 쪽</text>
</g>
<text x="400" y="345" text-anchor="middle" font-size="15" fill="#5f6368">전통 해몽에서 흔히 보는 풀이 · 오늘의 꿈 해몽</text>
</svg>
