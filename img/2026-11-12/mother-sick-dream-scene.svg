<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="800" height="460" fill="#ffffff"/>
<text x="400" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">엄마가 어떻게 아프셨나요?</text>
<g font-size="21" fill="#202124">
<rect x="40" y="80" width="340" height="160" rx="14" fill="#e8f5e9" stroke="#81c784"/>
<text x="210" y="125" text-anchor="middle" font-weight="700">아프시다 나으셨다</text>
<text x="210" y="165" text-anchor="middle">걱정하던 일이</text>
<text x="210" y="195" text-anchor="middle">풀리는 반가운 쪽</text>
<rect x="420" y="80" width="340" height="160" rx="14" fill="#e3f2fd" stroke="#64b5f6"/>
<text x="590" y="125" text-anchor="middle" font-weight="700">내가 간호해 드렸다</text>
<text x="590" y="165" text-anchor="middle">못다 한 효도가</text>
<text x="590" y="195" text-anchor="middle">정리되는 꿈</text>
<rect x="40" y="270" width="340" height="160" rx="14" fill="#fff8e1" stroke="#ffd54f"/>
<text x="210" y="315" text-anchor="middle" font-weight="700">누워만 계셨다</text>
<text x="210" y="355" text-anchor="middle">내 몸과 집안을</text>
<text x="210" y="385" text-anchor="middle">한번 살펴볼 때</text>
<rect x="420" y="270" width="340" height="160" rx="14" fill="#fce4ec" stroke="#f48fb1"/>
<text x="590" y="315" text-anchor="middle" font-weight="700">아프다고 말씀하셨다</text>
<text x="590" y="355" text-anchor="middle">미뤄 둔 집안 일을</text>
<text x="590" y="385" text-anchor="middle">챙기라는 쪽으로 풀이</text>
</g></svg>
