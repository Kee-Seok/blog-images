<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="800" height="400" fill="#ffffff"/>
<text x="400" y="42" font-size="25" font-weight="700" fill="#202124" text-anchor="middle">라식비 200만원(예시), 연말정산으로 돌아오는 돈</text>
<text x="400" y="74" font-size="16" fill="#5f6368" text-anchor="middle">다른 의료비 없이 이 수술비만 있다고 본 계산 · 지방소득세 10% 포함</text>
<g font-size="19" fill="#202124">
<text x="60" y="140">총급여 3,000만원</text><rect x="260" y="118" width="363" height="30" rx="6" fill="#1a73e8"/><text x="635" y="141" font-weight="700">18만1,500원</text>
<text x="60" y="220">총급여 4,000만원</text><rect x="260" y="198" width="264" height="30" rx="6" fill="#1a73e8"/><text x="536" y="221" font-weight="700">13만2,000원</text>
<text x="60" y="300">총급여 6,000만원</text><rect x="260" y="278" width="66" height="30" rx="6" fill="#1a73e8"/><text x="338" y="301" font-weight="700">3만3,000원</text>
</g>
<text x="400" y="364" font-size="17" fill="#5f6368" text-anchor="middle">계산: (200만원 − 총급여×3%) × 15% × 1.1</text>
</svg>
