<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
<rect width="800" height="400" fill="#ffffff"/>
<text x="400" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="#202124">누워 계신 할아버지, 얼굴로 먼저 가르기</text>
<g font-size="20" fill="#202124">
<rect x="30" y="85" width="235" height="280" rx="16" fill="#e6f4ea"/><text x="147" y="135" text-anchor="middle" font-weight="700" font-size="23">편안한 얼굴</text><text x="147" y="190" text-anchor="middle">주무시듯 쉬심</text><text x="147" y="250" text-anchor="middle">집안이 안정되고</text><text x="147" y="282" text-anchor="middle">걱정이 가라앉는 쪽</text>
<rect x="283" y="85" width="235" height="280" rx="16" fill="#fff8e1"/><text x="400" y="135" text-anchor="middle" font-weight="700" font-size="23">아파 보이는 얼굴</text><text x="400" y="190" text-anchor="middle">끙끙 앓으심</text><text x="400" y="250" text-anchor="middle">미뤄 둔 집안일·</text><text x="400" y="282" text-anchor="middle">건강을 챙기라는 쪽</text>
<rect x="536" y="85" width="235" height="280" rx="16" fill="#e8f0fe"/><text x="653" y="135" text-anchor="middle" font-weight="700" font-size="23">일어나 앉으심</text><text x="653" y="190" text-anchor="middle">누웠다가 움직이심</text><text x="653" y="250" text-anchor="middle">막혀 있던 일이</text><text x="653" y="282" text-anchor="middle">다시 풀리는 쪽</text>
</g>
<text x="400" y="392" text-anchor="middle" font-size="15" fill="#5f6368">전통 해몽에서 흔히 보는 풀이 · 오늘의 꿈 해몽</text>
</svg>
